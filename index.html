  <script>window.__ARTICLE_DATA__ = {"articles": [{"id": "06637065d8132c0bc6ac68c8", "title": "Colorbound Explores Aymara Culture Through Color, Music, and a Heartfelt Story", "summary": "A look into the use of color and concepts of loss and closure in Aymara culture contributing to Colorbound.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/10/12/colorbound-explores-aymara-culture/", "publishedAt": "2026-10-12T18:00:00+00:00", "author": "john sherwood, 3rd Party Product Specialist", "markdown": "### Summary\n\n- Puzzle-platformer using color for progression.\n- The developers used color and music to celebrate the culture of Chile.\n- Out now on XBOX Series X|S.\n\n*[Colorbound](https://www.xbox.com/en-US/games/store/colorbound/9mv6sz71ggjt)* is a puzzle-platformer in which you play as Anku, a boy who lives in the mountains of Chile with his grandmother. His grandfather, Eloy, has passed away, and Anku and his grandmother remember the color Eloy brought to their lives through his music. Panpipe Studio turns this idea into reality, using color and music to amplify its story of love, loss, and family.\n\nThe game began as a concept created for the Latin American Games Showcase Game Jam in 2025, inspired by the theme, “What the eyes don’t see, the heart doesn’t feel.” Players see this idea echoed almost immediately in the hints offered throughout the game: “If you can’t see it, it can’t affect you.” What started as an exploration of light and shadow developed into a pastel-hued platforming adventure. But color extends beyond *Colorbound*’s mechanics—it becomes a representation of Andean culture, the culture that the game’s developer, Isaías Arrué, wanted to celebrate.\n\n![Colorbound screenshot](media/b57175190e125b9af757fc64696be1468944122d37cd89d36f5533c2193a0642.jpg)\n\nWhile the name of the game is *Colorbound*, music forms a vital part of its identity as well. The panpipe (*la zampoña*, as it’s called in the game) is the item Anku collects to begin his journey, and it’s also the object that sparks the reunion at the heart of the story. It’s a well-known instrument in Andean folk music, making *la zampoña* the perfect connection between the game’s use of color and its music. Together, the two create much of the magic of *Colorbound*.\n\n![Colorbound screenshot](media/1a2843a17ff4edb63a955df1228b327501a84445b6e2769b8d3ab21270bca404.jpg)\n\nAnku’s story is ultimately one of joy, even as it explores themes of loss, and the developer evokes that sense of joy through color and music alike. The pastel palette, inspired by watercolor, is meant to create a cozy sense of nostalgia, while the music immerses players in the lives of Anku and his grandfather and evokes the atmosphere of the Andean region. Music was an inspiration for *Colorbound*, and it’s our hope that the game will inspire players to learn more about the Aymara culture featured in it.\n\n*[Colorbound](https://www.xbox.com/en-US/games/store/colorbound/9mv6sz71ggjt)* is a colorful tribute to the culture of the Andes, but at its core, its themes appeal to all players: a story of family that reminds us that even after someone is gone, the color they brought into our lives can remain.", "excerpt": "Summary\n\n- Puzzle-platformer using color for progression.\n- The developers used color and music to celebrate the culture of Chile.\n- Out now on XBOX Series X|S.\n\n    is a puzzle-platformer in whic", "readingMinutes": 3, "images": [{"src": "media/b57175190e125b9af757fc64696be1468944122d37cd89d36f5533c2193a0642.jpg", "alt": "Colorbound screenshot"}, {"src": "media/1a2843a17ff4edb63a955df1228b327501a84445b6e2769b8d3ab21270bca404.jpg", "alt": "Colorbound screenshot"}], "cover": "media/b57175190e125b9af757fc64696be1468944122d37cd89d36f5533c2193a0642.jpg"}, {"id": "dbbde4e5fc742c2eeaed712b", "title": "Character Development and Storytelling in Kernel Hearts, Out Now on XBOX", "summary": "How the creators teamed up to bring their vision of a RPG/JRPG and its unique setting.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/09/17/character-development-and-storytelling-in-kernel-hearts/", "publishedAt": "2026-09-17T18:00:00+00:00", "author": "john sherwood, 3rd Party Product Specialist", "markdown": "![Character Development and Storytelling in Kernel Hearts, Out Now on XBOX](media/c19f1563053e9da2af1b8427db1a40660679656e7ec6cd5edcb76391af5eb48e.jpg)\n\n### Summary\n\n- Action RPG that combines two cultures in a post-apocalyptic world.\n- The creative process behind bringing a unique world to life.\n- Character personalities and how they relate to gameplay.\n\n*[Kernel Hearts](https://www.xbox.com/en-MY/games/store/kernel-hearts/9nxsnqr7cm1q)* is an action RPG about magical girls fighting angels to save the world, but it’s so much more than a punchy soundbite can explain. The game and its characters are a love letter to two cultures that have shaped the lives of the developers. Japanese culture inspired the art, the story, even the language of the game itself; but the culture of Argentina, the home of Ephemera Games, permeates through everything, down to Fernet drinking yerba mate during one of her idles.\n\nhttps://youtu.be/7oJnw5DfuEg\n\nThe game itself takes place in a sort of post-apocalyptic Patagonia, painting the story of a world that had collapsed and is now trying to rebuild. It’s a theme that is familiar in many video games, but not necessarily a setting. The Argentine team at Ephemera Games is uniquely poised to tell this familiar story in a new way. And they do this by combining elements of their favorite games into something new entirely.\n\n![Kernel Hearts screenshot](media/ba02ac76845400f8036045a43be15e8396cd22d96840258f0f485e29935f7792.jpg)\n\n*Kernel Hearts* was born in a game jam in 2020, a rough idea of a world that would eventually become Babel, but the game’s style was developed over years. Akira, the Game Director of *Kernel Hearts*, says that long action RPGs and JRPGs have always held a special place in his heart; but like many of us, his ability to get absolutely engrossed in those games in the way that we love has changed. Not because of the games themselves, but because the time we have to play as we grow older changes.\n\nSo, the team thought: What if we could combine the epic stories we love with the more bite-sized run times of a roguelike? It was this combination of elements that captured our attention at Whitethorn Games: a story-driven game that could be enjoyed in small chunks, incorporating a style of gameplay that we had yet to see in our catalog? We were so on board.\n\n![Kernel Hearts screenshot](media/abddf0cd8abe5bdb35146bc3ade3928e089a54de4b9d6038ca62213a4fb43f99.jpg)\n\nThe characters also make up a vital part of both the story and the gameplay. In any game with an ensemble cast of characters, it’s important to balance abilities and personalities to make a cohesive group for character interactions in and out of combat. The four girls of the M.A.H.O.U unit do just that, and it’s easy to see even in the trailer.\n\nAkira defined one of the guiding ideas that lead to the design of the four main characters by stating: “A character shouldn’t just have a different weapon. You should be able to watch a few seconds of gameplay and immediately understand something about their personality. Their animations, silhouettes, magic, movement, and even the rhythm of their attacks all have to tell you who that person is.”\n\n![Kernel Hearts screenshot](media/eaf42bb989401fd008c61c81cf83df8141316e8bb5b8bfee36c4889c2a5e8378.jpg)\n> > What if we could combine the epic stories we love with the more bite-sized run times of a roguelike?\n\nThat’s how you end up with the differing characters in *Kernel Hearts.* Fernet fights with swords and spirits which allows her to be the most versatile member of the team. Spika fights up-close with her katana with very clean and disciplined attacks that reflect her disciplined personality. Laika is the most physically impressive of the team, and her massive sword and heavy attacks follow suit. Finally, Dolce fights in a way that you might not expect in a post-apocalyptic setting: incorporating performance and dance into her fighting style, a callback to some of the more familiar magical girls in pop culture.\n\nAssembling your team in the game is just as vital as assembling it in real life. *Kernel Hearts* is a game that can be completed solo; but the developers made a story about a squad teaming up to take down the insurmountable together, and they think that’s something that’s integral to the experience of the game. It makes sense to play the game in co-op because that’s the nature of the story itself. Just like with the gameplay, though, the developers are aware that trying to get your friends gaming at the same time is a mission all of its own. That’s why *Kernel Hearts* is a game that can be experienced fully in both single player and multiplayer, though we encourage you to try multiplayer if you can.\n\n![Kernel Hearts screenshot](media/f7090f6b45acdd1ea429287ca092a847b58b93b1d96697748cfdbd025d9af9ff.jpg)\n\n*[Kernel Hearts](https://www.xbox.com/en-MY/games/store/kernel-hearts/9nxsnqr7cm1q)* is filled with action-packed fights, beautiful scenery, fields of enemies to slash your way through, and so much heart.This game is a project nearly six years in the making, and the teams at Ephemera Games and Whitethorn Games are so proud to bring it to you now.  \n  \nOnly you can save the world from drowning in ashes, so we hope we’ll see you there.", "excerpt": "Summary\n\n- Action RPG that combines two cultures in a post-apocalyptic world.\n- The creative process behind bringing a unique world to life.\n- Character personalities and how they relate to gam", "readingMinutes": 6, "images": [{"src": "media/c19f1563053e9da2af1b8427db1a40660679656e7ec6cd5edcb76391af5eb48e.jpg", "alt": "Character Development and Storytelling in Kernel Hearts, Out Now on XBOX"}, {"src": "media/ba02ac76845400f8036045a43be15e8396cd22d96840258f0f485e29935f7792.jpg", "alt": "Kernel Hearts screenshot"}, {"src": "media/abddf0cd8abe5bdb35146bc3ade3928e089a54de4b9d6038ca62213a4fb43f99.jpg", "alt": "Kernel Hearts screenshot"}, {"src": "media/eaf42bb989401fd008c61c81cf83df8141316e8bb5b8bfee36c4889c2a5e8378.jpg", "alt": "Kernel Hearts screenshot"}, {"src": "media/f7090f6b45acdd1ea429287ca092a847b58b93b1d96697748cfdbd025d9af9ff.jpg", "alt": "Kernel Hearts screenshot"}], "cover": "media/c19f1563053e9da2af1b8427db1a40660679656e7ec6cd5edcb76391af5eb48e.jpg"}, {"id": "bdd04810c1ab7c2782752c69", "title": "Celebrating 25 Years of Play: Introducing XBOX Gear, New Community Designs, FanFest Tour Dates, and More", "summary": "Today, we’re sharing more XBOX 25th anniversary details: community-created designs, curated Game Pass collections, the full FanFest Tour schedule, and more. ", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/08/24/xbox-anniversary-x25-fanfest-gear-community-designs/", "publishedAt": "2026-08-24T17:00:00+00:00", "author": "Joe Skrebels, XBOX Wire Editor-in-Chief", "markdown": "![Celebrating 25 Years of Play: Introducing XBOX Gear, New Community Designs, FanFest Tour Dates, and More](media/79c7383c7a4fe0898f4d02bc5b22c41fa03e9710d6f5151c2008cd727bd246a1.jpg)\n\n25 years ago, XBOX set out to bring players together through the games and worlds they love, and today, that mission is still what drives everything we do.\n\nToday, we’re sharing a few more ways we’re celebrating 25 years of play including, the latest XBOX updates, community-created designs for gamerpics, backgrounds, and themes, curated Game Pass collections, the full FanFest Tour schedule and sweepstakes details, and more.\n\n### **Community-Created XBOX Designs**\n\n![Klobrille's X25 Wallpaper Image](media/573f741ad681894ec7f85bbe50624d6254a3a20015272b8d4e74d53446d1082e.jpg)\n![Ben Kenobi's X25 Gamer Profile Image](media/3e29c347c3e0b64e4645907ec5abbfef075e100ff1629549ae9065138505739e.jpg)\n\n*From left: Wallpaper by Klobrille and Gamer Profile by Ben Kenobi.*\n\nOver the years, many of you have shared your XBOX-inspired designs with us. We continue to be humbled by the response and impressed by your creativity and talent. To help mark 25 years of XBOX, we’re partnering with a pair of creators from the XBOX community, Klobrille and Ben Kenobi, to publish a collection of gamerpics, backgrounds, and a dynamic theme for XBOX consoles: by the community, for the community, and available today.\n\nThese designs reflect what XBOX has always been about, the connection between players, creators, and the games that bring us together. To learn more about what inspired the designs, follow [Klobrille](https://x.com/klobrille) and [Ben Kenobi](https://x.com/benkenobi2020).\n\n**Here’s how to make these designs your own:**\n\n- **Console — Gamerpic & Theme:**Settings › Profile › Customize profile, then choose your favorite.\n\n- **Console — Dynamic background:**Settings › General › Personalization › My background › Dynamic background.\n\n- **XBOX app on PC — Gamerpic:**Open View Profile and select the pencil icon over your current Gamerpic.\n\n- **XBOX app on PC — Theme:**Open View Profile › Customize profile and choose your Theme.\n\nIf one of these designs sparks something for you, we’d love to see it. Share your own creations and tag **@XBOX** using **#XBOX25**.\n\n### **XBOX 25****th****Anniversary Badge**\n\n![X25 Badge Image](media/e8122ee2e3ea48f40f523d9726e79bde43ff9b37c01efda4e0cbdbb99eec3786.png)\n\nBeginning today, players who sign in to their XBOX account on console, PC, or the XBOX mobile app will receive the XBOX 25th Anniversary profile badge, ahead of XBOX’s 25th anniversary on November 15.\n\nThe badge will be available through the end of 2026, and can be displayed on your profile.\n\n### **XBOX Game Pass Collections**\n\n![X25 Game Pass Collection Image](media/d0a9cc4dbbe983600c0a5a028b17cabf1bfdbba7dce732b944f4225462e23f30.jpg)\n\nTo mark 25 years of unforgettable games, we’re bringing a specially curated celebration of XBOX history to XBOX Game Pass. These curated Game Pass collections will bring together memorable games from legendary franchises that defined each generation of XBOX, playable on console and/or PC.\n\nRelive, or experience for the first time, the classics from the original XBOX, and keep the fun going as you journey through other favorites across XBOX 360, XBOX One, and XBOX Series X|S. Enjoy beloved titles like Fable Anniversary, Halo: The Master Chief Collection, Fallout 4, Psychonauts 2, and much more in this special tribute to the games that shape XBOX’s 25 year legacy.\n\n### **XBOX FanFest Tour Dates**\n\n![XBOX FanFest lineup image](media/d2e54424c4037779e3380876c0f6f6a8d9fa957ff152898141ab2d566290141d.jpg)\n\nThe XBOX FanFest Tour is a global, multi-city run of fan-first events built around connection, local community, and the games we love. We kicked things off in Los Angeles at the XBOX Games Showcase, told you we were [headed to gamescom next](https://news.xbox.com/en-us/2026/07/29/xbox-gamescom-2026/), and today we’re sharing the rest of the stops.\n\n**Here’s where the tour is headed:**\n\n- **Cologne, Germany —** August 26, at gamescom\n- **Tokyo, Japan —** September 17, during Tokyo Game Show\n- **London, U.K. —** September 26\n- **Mexico City, Mexico —** October 17\n- **Sydney, Australia —** October 17\n- **Toronto, Canada —** November 6\n- **Seattle, U.S. —** More info coming soon!\n\n### **Ready to join the XBOX FanFest Tour?**\n\nTickets for every stop will be awarded through city-specific sweepstakes, giving fans around the world a chance to be part of the experience.\n\nVisit the [XBOX.com FanFest page](https://www.xbox.com/en-US/community/fanfest) to enter, explore upcoming stops, and stay up to date on all things FanFest. Wherever you join us, FanFest is about one thing: bringing players together to celebrate the joy of play.\n\n### **Introducing XBOX Gear**\n\n![XBOX Gear Shop Asset](media/17625e0c727e6789f62abeb7fbd213ebfc58b18924c632dd317eef8bd6599a03.jpg)\n\nTo help mark 25 years of XBOX, we’re excited to introduce XBOX Gear, the new home for official XBOX-branded merchandise.\n\nAvailable now at [gear.xbox.com](http://gear.xbox.com/), XBOX Gear features original collections inspired by the history, creativity, and community that have helped shape XBOX over the past 25 years.\n\nAt launch, fans can explore three new collections: Gloss, Est.01, and Blood Gulch, ranging from brand essentials and XBOX history to design-forward apparel that explores new creative territory.\n\nWith additional drops already planned, XBOX Gear will continue to offer new ways for fans to celebrate the moments, memories, and community that have shaped XBOX over the past 25 years.\n\nVisit [gear.xbox.com](http://gear.xbox.com/) to explore the collection.\n\n### **Explore the 25th Anniversary Hub**\n\n![Image of the X25 Anniversary Hub website](media/cbff1b336f84491613fb5cbb393296d777206ae994ad1c13e6e1372d7e840d75.jpg)\n\nWe will continue to have more ways for fans to celebrate, connect, and play together. Visit the [XBOX.com 25th Anniversary hub](https://www.xbox.com/en-US/xbox-25th-anniversary) to stay up-to-date on the latest anniversary updates, exclusive experiences, products, news, and more as we celebrate 25 years of play.", "excerpt": "25 years ago, XBOX set out to bring players together through the games and worlds they love, and today, that mission is still what drives everything we do.\n\nToday, we’re sharing a few more ways we’", "readingMinutes": 7, "images": [{"src": "media/79c7383c7a4fe0898f4d02bc5b22c41fa03e9710d6f5151c2008cd727bd246a1.jpg", "alt": "Celebrating 25 Years of Play: Introducing XBOX Gear, New Community Designs, FanFest Tour Dates, and More"}, {"src": "media/573f741ad681894ec7f85bbe50624d6254a3a20015272b8d4e74d53446d1082e.jpg", "alt": "Klobrille's X25 Wallpaper Image"}, {"src": "media/3e29c347c3e0b64e4645907ec5abbfef075e100ff1629549ae9065138505739e.jpg", "alt": "Ben Kenobi's X25 Gamer Profile Image"}, {"src": "media/e8122ee2e3ea48f40f523d9726e79bde43ff9b37c01efda4e0cbdbb99eec3786.png", "alt": "X25 Badge Image"}, {"src": "media/d0a9cc4dbbe983600c0a5a028b17cabf1bfdbba7dce732b944f4225462e23f30.jpg", "alt": "X25 Game Pass Collection Image"}, {"src": "media/d2e54424c4037779e3380876c0f6f6a8d9fa957ff152898141ab2d566290141d.jpg", "alt": "XBOX FanFest lineup image"}, {"src": "media/17625e0c727e6789f62abeb7fbd213ebfc58b18924c632dd317eef8bd6599a03.jpg", "alt": "XBOX Gear Shop Asset"}, {"src": "media/cbff1b336f84491613fb5cbb393296d777206ae994ad1c13e6e1372d7e840d75.jpg", "alt": "Image of the X25 Anniversary Hub website"}], "cover": "media/79c7383c7a4fe0898f4d02bc5b22c41fa03e9710d6f5151c2008cd727bd246a1.jpg"}, {"id": "643464e6c36d4bfa7f6d21ba", "title": "Ghost Recon Wildlands: Last Rites – A Major Free Update Powered by Community Feedback and Player Insights", "summary": "Ghost Recon Wildlands: Last Rites is a major free update out now for XBOX Series X|S. Learn about how it was developed with the player community.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/08/06/ghost-recon-wildlands-last-rites-community-feedback/", "publishedAt": "2026-08-06T16:00:00+00:00", "author": "Will Fulton, XBOX Wire Editor", "markdown": "![Ghost Recon Wildlands: Last Rites – A Major Free Update Powered by Community Feedback and Player Insights](media/e591185720cf4374d4d4f4e60714035ef9a023f87feab727daed429e9ab6d147.jpg)\n\n### Summary\n\n- ***[Ghost Recon Wildlands](https://www.xbox.com/en-US/games/store/tom-clancys-ghost-recon-wildlands/C2N9CS4FS1QR/0001): Last Rites* is out now**.\n- **The free update includes a new mission, several community-requested features, and the return of the Predator mission**.\n- **Game Director Benjamin Rousseau Lemaire and Live Strategy & Analytics Director Yossef Benzeghadi share their insights on the new gameplay features and how community feedback helped the Last Rites update**.\n\n*Ghost Recon Wildlands: Last Rites* is out now for XBOX Series X|S. As a major free update, *Last Rites* refreshes the gameplay experience of *Ghost Recon Wildlands*, delivering a new story-driven mission in which the Ghosts must face off against a new antagonist, La Llorona, and Los Penitentes, her fanatic cult following. They have nothing to lose, and they’re wreaking havoc in Bolivia as La Llorona enacts revenge on those who have wronged her. It also marks the return of the challenging hunt for the iconic Predator. Finally, *Last Rites* brings a host of new community-driven gameplay updates designed to give players more in-game freedom than ever before.\n\nWe spoke with Ubisoft Bordeaux’s Game Director Benjamin Rousseau Lemaire and Live Strategy & Analytics Director Yossef Benzeghadi to learn more about the new gameplay features and how community feedback and player insights were considered throughout development.\n\n## ***Ghost Recon Wildlands: Last Rites* brings a diverse array of customization options for players. Can you walk us through those?**\n\n**Benjamin Rousseau Lemaire**: The original game allowed for a lot of UI tweaks. Players were already able to hide a lot of stuff. We added two more here. Players will now be able to hide impact & trajectory previews of throwable items such as grenades, as well as the shader on interactable objects like ammo crates, or even objectives. By popular demand, we also made sure that when you hide UI elements, the associated sound feedback, if any, is deactivated too.\n\nIn addition, there’s what we call the “Ghost Parameters”, inspired by features that were already present in the Ghost Mode and can now be used in other PvE modes. First, we have the tactical reloading, making you lose any remaining ammunition in your magazine when you reload. Then, the number of primary weapons you can carry, either one or two. And lastly, the number of allowed revives before a Game Over, from none to limitless.\n\n![Ghost Recon: Wildlands - Last Rights screenshot](media/9511ef0821038c6ef584d951ea85add55bb213a08e5d486b4a1082d13cb6a430.jpg)\n\nWe also have the World and Session settings that are located in the lobby page. You could already change the time of day, but now you can make it fixed. So, if you want to play at night and only at night for your entire session, you can. You can also play with the weather, which was not possible in the past, and you can make it fixed as well. If you want it raining all the time, you can do that. And if you want to play at night in the rain all the time, you can. Systems like enemy patrol rates, alarms or SAM launchers can be tweaked as well, by completely deactivating them or making their destruction permanent in a session. It’s all up to you!\n\nTeam Composition has also been improved. Previously, you could toggle your AI Teammates on or off, but it was all or nothing. Now, you can choose if you want to play with one, two, or three teammates.\n\nThe final part is about difficulty. We had four difficulty levels originally; now, you can precisely deep dive in the difficulty settings and play with specific parameters yourself to build a customized difficulty level. For example, you can tweak the damage that vehicles can take before being destroyed, play with the perception of enemies, or adjust the amount of time to wait before triggering HP regeneration.\n\n**Yossef Benzeghadi**: We also have a new soundtrack theme for La Llorona, our new antagonist. I think it’s super cool and hope players will love it. We also created new audio and characters with *Last Rites*, and I’m happy to confirm the original GRW actors for Nomad and the other main characters are reprising their role for the English voice over.\n\nOne other cool thing we fought hard to bring back – which is my personal favorite as well as a major fan favorite – is the return of the Predator mission. This showdown with the iconic hunter was loved as one of the most challenging boss fights in the game, and rest assured we preserved all of that intact exactly as it used to be!\n\n![Ghost Recon: Wildlands - Predator](media/608cff9464dffb1a475df4112a5fc4d05fb7652600b96dd81dd20c875ba5e515.jpg)\n\n## **How do these features expand the freedom players will have when playing *Ghost Recon Wildlands*?**\n\n**YB**: Everything we decided to do on *Last Rites* was very well informed by a lot of insightful sources, and many are elements the team wanted to explore based on player feedback. We had quite a luxury to have almost a decade worth of information and insights about how players have been playing *Wildlands* over the years. When the game first launched, we noticed some players really taking their time completing missions or seemingly doing “nothing” and were mostly free roaming in the open world: we tentatively called them “Sandbox Players”. Over time, this group got bigger and bigger and we made a point to clearly understand what it was all about. By speaking with them, thanks to community discussions and playtests interviews notably, we realized they were all roleplaying. They were taking a lot of time on purpose, not necessarily for the sake of pure exploration, because they were setting up their own challenges, like doing a mission at night, with just one gun, without using a drone, or without being detected. To this day, there’s a strong roleplaying community in *Wildlands*, and as shared by Benjamin, we’re adding several customization features in Last Rites to further support this kind of playstyle. At the same time, these options are giving even more freedom of choice to fine tune your gameplay experience, role play or not, so there’s something here for everyone regardless of how you play.\n\nCo-op is not forgotten either. I recall players told us they were roleplaying with friends, where one player in the group was acting as the sniper, so only that player could use a sniper rifle, while another was the engineer of the group and was the only one allowed to use a drone, and so on. That’s also why we’re introducing the World and Setting options that Benjamin mentioned earlier, which can be established by the host of your co-op session. And if you want to enable friendly fire in your co-op group to have more realistic behavior, or even allow PvP situations within the campaign, it is now possible.\n\nAt the same time, *Last Rites* introduces an all-new mission, fully story-driven, and that’s there for all players who love and enjoy narrative content without necessarily focusing on roleplay. The mission also features a darker creative vision and artistic direction, with a slightly different tone than the main game campaign, to give the community a fresh experience.\n\n![Ghost Recon: Wildlands - Last Rights screenshot](media/f69cbf901f0bd5bbdd8d102f6f68a084f1bea233b3b18bab354f80f19e8a277f.jpg)\n\n## **Tell us more about how the community was directly involved in shaping the content of the *Last Rites* update.**\n\n**BRL**: We started by making a wish list of things we might want to include, but we added way more items to it than we could possibly cover. Then we turned to the players. We worked with our community developers, who are super active with the community for the game, and they gathered a short list of the top 10 things players would want to see in *Ghost Recon Wildlands*. On top of that, we organized a workshop with super active players from the community, asking them what they thought the most frustrating thing in the game was; what we could alleviate, remove, or work on; what the best thing in the game was that we could add onto; what was missing from the game; et cetera. They obviously gave us thousands of things so we picked a few we wanted to cover and knew we could deliver on, like the UI elements and their sounds we talked about before, or even the destruction persistency of the SAM launchers which came from those discussions. In addition to working with that player committee, we read comments on different internet forums, and we watched videos of people roleplaying in the game to see what they were doing and how we could add to their experiences.\n\n**YB**: We also leveraged the reports from our community developers to assess the highest priorities that the community was expecting. Number one was, of course, a better framerate with the expectation of a 4K and 60 FPS update for XBOX Series X|S we are delivering today for free with *Last Rites*. Then there were some of the customizable options Benjamin just mentioned and also some small requests we were able to translate into quick wins; for example, some items were no longer obtainable in the game because they were tied to challenges that have expired. It was easy for us to find those items and unlock them for free for everyone to enjoy, alongside quite a lot of weapons and equipment now unlocked by default.\n\nAnother thing we discussed with players is the darker mood of our *Last Rites* update. We showed them an early concept art for La Llorona – who is the new antagonist introduced in *Last Rites* – as well as some of the thematic elements we developed around her. The positive reaction we got from players helped us confirm we were heading in the right direction. I think players will be pleased with the end result when they get a chance to play the new mission.\n\n![Ghost Recon: Wildlands - Last Rights screenshot](media/f9713286fe026b20c781a8cada374db4cde87b347a0212abe6c534aecb74b9bb.jpg)\n\n## **What are you hoping the community takes away from *Last Rites*?**\n\n**YB**: For me, I hope they enjoy all of the customization options we’re adding. The story with La Llorona is super cool, and I think players will love it. But having worked on *Wildlands* when it first launched, we couldn’t fully support the roleplaying playstyles as well as we wanted to, besides maybe our Matchmaking Mood System and Ghost Mode back in the day. We did it more elegantly later on in *Ghost Recon Breakpoint* with what we called the Ghost Experience, which in turn was kind of an inspiration for what we’re doing now in *Wildlands* within *Last Rites*. I’m convinced mil-sim and roleplay are some of the key elements that kept so many players active in the game even today and we cannot wait to see how they will enhance their experience and push the military simulation they know and love in Wildlands beyond what they could do until now.\n\nAnd icing on the cake, of course, the Predator mission! I think no one expected it to be back; we worked hard to make sure our players can face the most lethal hunter once again and we are sure the community will be pleasantly surprised by this comeback. It’s true we could have stopped at just a simple 60 FPS update, but *Ghost Recon Wildlands* and its fantastic community deserved much more, and we really went all-in as much as we could with *Last Rites* to go above and beyond expectations to celebrate the 25th Anniversary of *Ghost Recon*! A special thanks to the talented team at Ubisoft Bordeaux who made all of this possible!\n\n**BRL**: I can’t be more original because it’s the same thing for me. I’m excited to see how the community, especially the roleplaying community, will use the tools we’re giving them to do crazy stuff. From watching videos on the internet, as I mentioned earlier, we know what they can do, and I hope that what we’re giving them in Last Rites will encourage them to come back to the game and enjoy Bolivia in a different way by playing with the weather, time of day, friendly fire, all of it! Roleplay was a pillar of the update that we really wanted to do, and when you factor in the new story mission, Last Rites is the full package.\n\n![Ghost Recon: Wildlands - Last Rights screenshot](media/73370187bf64539a52195d13a8cd8acd7e4b263a4aa059d58c7e56a521874843.jpg)\n\n## **Coincidentally, XBOX’s Free Play Days starts today, so players can download and play *Ghost Recon Wildlands* for free through August 9. What would you say to a new player who’s thinking about trying the game for the first time?**\n\n**YB**: There has never been a better time to jump in, because everything will be updated to be incredibly smooth, especially on XBOX Series X|S. *Last Rites* can be played right away from the main menu; you don’t have to finish *Wildlands* to play the new mission. At the same time, should you start with it, *Last Rites* doesn’t spoil any of the main campaign, so even if you play it first, it won’t impact your experience and enjoyment of the main game afterwards. And by the way, if you choose to play the main campaign first, we made sure you can fast travel at a rally point in the Caimanes province near the Predator mission if you want, even though I don’t suggest you go there unprepared! The Predator Bio-Mask and other rewards you get from completing the Predator mission can afterwards be used in *Last Rites*, and similarly, the two new Operator Skins rewards you get from finishing *Last Rites* can then be used in the main campaign too.\n\n**BRL**: If you start the game for the first time and play the main campaign, you can control the difficulty levels with more granularity. The difficulty levels are there as presets, but if at some point you’d like tougher combat, or to remain undetected, you can now play with those parameters to customize your experience. You’re playing the best version of the game with as many options as possible to build your own experience, so it’s a very good moment to join and discover the game for the first time.\n\n**YB**: One last reminder: if you play during the XBOX Free Play Days and choose to get the game afterwards, you can continue your progression from where you left. Have fun Ghosts, and see you in *Wildlands*!\n\n*Play [Ghost Recon Wildlands](https://www.xbox.com/en-US/games/store/tom-clancys-ghost-recon-wildlands/C2N9CS4FS1QR/0001): Last Rites on XBOX Series X|S. The game is also available with an XBOX Game Pass Premium or Ultimate membership, as well as a Ubisoft+ Premium for XBOX subscription.*", "excerpt": "Summary\n\n-     : Last Rites  is out now  .\n-   The free update includes a new mission, several community-requested features, and the return of the Predator mission  .\n-   Game Director Benjamin", "readingMinutes": 16, "images": [{"src": "media/e591185720cf4374d4d4f4e60714035ef9a023f87feab727daed429e9ab6d147.jpg", "alt": "Ghost Recon Wildlands: Last Rites – A Major Free Update Powered by Community Feedback and Player Insights"}, {"src": "media/9511ef0821038c6ef584d951ea85add55bb213a08e5d486b4a1082d13cb6a430.jpg", "alt": "Ghost Recon: Wildlands - Last Rights screenshot"}, {"src": "media/608cff9464dffb1a475df4112a5fc4d05fb7652600b96dd81dd20c875ba5e515.jpg", "alt": "Ghost Recon: Wildlands - Predator"}, {"src": "media/f69cbf901f0bd5bbdd8d102f6f68a084f1bea233b3b18bab354f80f19e8a277f.jpg", "alt": "Ghost Recon: Wildlands - Last Rights screenshot"}, {"src": "media/f9713286fe026b20c781a8cada374db4cde87b347a0212abe6c534aecb74b9bb.jpg", "alt": "Ghost Recon: Wildlands - Last Rights screenshot"}, {"src": "media/73370187bf64539a52195d13a8cd8acd7e4b263a4aa059d58c7e56a521874843.jpg", "alt": "Ghost Recon: Wildlands - Last Rights screenshot"}], "cover": "media/e591185720cf4374d4d4f4e60714035ef9a023f87feab727daed429e9ab6d147.jpg"}, {"id": "7c4c29dae2b57807982f7f09", "title": "A Microsoft Flight Simulator Cinderella Story: Building the A220 Airliner", "summary": "Earlier this week, Synaptic Simulations, a small team of young developers only a few years out of high school, launched their first product on the Microsoft Flight Simulator Marketplace: the A220 Airliner.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/07/30/microsoft-flight-simulator-cinderella-story-building-a220-airliner/", "publishedAt": "2026-07-30T19:00:00+00:00", "author": "Mike Nelson, XBOX Wire Editor", "markdown": "![A Microsoft Flight Simulator Cinderella Story: Building the A220 Airliner](media/ff9ddab6a7d222976c2091ca18e6ad1ee8dcbd89f598eaf3bdeb10200fbd9f19.jpg)\n\nEarlier this week, Synaptic Simulations, a small team of young developers only a few years out of high school, launched their first product on the ***[Microsoft Flight Simulator](https://www.xbox.com/en-US/games/microsoft-flight-simulator)*** Marketplace: the A220 Airliner. This is one of the newest and most modern jet airliners operating in the world today, and its release in *Microsoft Flight Simulator* has been hotly anticipated by aviation enthusiasts.\n\nSynaptic Simulations is a wonderful story of a group of young enthusiasts with a ton of talent and passion following their dreams*.* It’s a Cinderella story of a team emerging from the freeware scene and making an astonishingly complex airliner as their very first professional release. Warmest congratulations to Synaptic Simulations and iniBuilds on their launch, and we wish them great success with the A220.\n\nWe recently caught up with the Synaptic team to learn more about the people behind this exciting new add-on product and the process of turning it from an idea to reality.\n\n---\n\n![Microsoft Flight Simulator 2024 Screenshot - A220 Airliner Team](media/b12b56395953ba993f1e7889df07362b81701bc6232544b3f078f400e06168b8.jpg)\n\n### What are your names, and what are each of your roles on the A220 project?\n\n**Harsh Duba**: Synaptic’s team consists of eight developers working across systems and avionics programming, 3D art, and creative production. The project is led by me, as Synaptic’s CEO and art manager; Shaye, lead systems programmer; and Mike, lead avionics programmer. Together, we oversee the broader team and ensure every aspect of the A220 comes together as one cohesive aircraft.\n\n### How long have you known each other? How did you meet?\n\n**Michael Romashov**: Most of us have known each other since around 2020 or 2021, when we independently joined what was then a community-led freeware A220 initiative. The project initially attracted contributors from across the flight-simulation community through Discord and Reddit. Over time, a smaller core group naturally formed as we identified the people with the commitment and complementary expertise needed to take the aircraft further. That core group ultimately became the Synaptic team working on the A220 today.\n\n### Before you became add-on developers, what were your career plans?\n\n**Shaye Garg**: Before the A220, none of our career plans were completely set in stone. Most of the team were only 16 or 17 and fresh out of high school when the project began. Like many people in the flight simulation community, we grew up with *Microsoft Flight Simulator*, which sparked our interest in aviation, technology and creating things of our own. That passion ultimately inspired us to start building add-ons. Since then, we’ve pursued degrees in engineering and computer science and gone on to work across the software industry. In many ways, developing the A220 helped shape those paths, with the technical, creative and collaborative skills we gained through the project carrying directly into our education and professional careers.\n\n![Microsoft Flight Simulator 2024 Screenshot - A220 Airliner](media/15b299ab86ec586c1924be2a291db3c7ca443c414d5380900f51dc70cf1a98b6.jpg)\n\n### Creating a modern airliner as a first development project seems like an incredibly daunting task. What inspired you to bring the A220 to *Microsoft Flight Simulator* rather than starting with a less complex aircraft?\n\n**Harsh Duba**: We saw a clear gap in the flight simulation world. Many of today’s most popular airliners were already well represented, but the A220 was still a very new and modern aircraft at the time and had no serious high-fidelity simulation in development.\n\nWe also wanted to create something that felt genuinely unique and gave flight simmers a different experience from the familiar aircraft already available. Starting with such a sophisticated airliner was undeniably ambitious, but our passion for the A220 made us willing to learn as we went. What began as an attempt to fill that gap gradually became a long-term commitment to recreating the aircraft with the depth and accuracy it deserves.\n\n### When and how did you partner with one of the largest creators in flight simulation — iniBuilds? What are iniBuilds contributing to the project?\n\n**Harsh Duba**: The partnership came about through a colleague, who had been working with iniBuilds in a freelance capacity. Having seen first-hand how iniBuilds operate, he felt it was the right home for the A220.\n\nWe had long admired iniBuilds’ work and reputation for delivering high-quality aircraft, so it quickly became clear they were the ideal partner to help bring the A220 from a passionate community project to a formalized product.\n\niniBuilds has provided the structure, production environment and resources needed to take the project to the next level. Beyond publishing support, the team has been responsible for the majority of the texturing artwork, full passenger cabin, liveries, animations and numerous refinements throughout the flight deck. They produced the custom sound package and developed a bespoke Electronic Flight Bag (EFB), helping deliver a more polished and accessible experience for simmers.\n\n![Microsoft Flight Simulator 2024 Screenshot - A220 Airliner](media/d4535c23f19f99368e6918a127a2151326b4e0f0555f38bcd22573f6844153f2.jpg)\n\n### Are there any unique features of the A220 that you’re particularly excited about?\n\n**Michael Romashov**: There are many unique aspects of the A220 that we’re excited to share. From its distinctive exterior and cockpit design, accurately recreated by our 3D team, to the quirks throughout its systems and avionics, the aircraft is full of details that set it apart.\n\nOne highlight is the 3D terrain map, supported by a custom compression algorithm and designed to faithfully represent the system found in the real A220. The Synaptic A220 also features a sophisticated graphical flight-planning system that allows pilots to modify their route directly through the navigation display – including creating holds, defining crossing constraints, rerouting, and much more.\n\nWe’ve also modelled a good amount of interactive circuit breakers, both physically within the cockpit and digitally through the aircraft’s displays. These are integrated directly into the A220’s deep electrical-system simulation, meaning that interacting with them produces the appropriate effects across the aircraft.\n\nEven the soundscape is distinctive, particularly the A220 engine’s recognizable “whale howl,” which we’re excited to reproduce in the simulator. Combined with the accurately modelled autoflight behavior and other core systems, there will be plenty for users to discover both inside and outside the cockpit.\n\n![Microsoft Flight Simulator 2024 Screenshot - A220 Airliner](media/0402f6abe1ebcee211cb219623f27e900c1def3b6eaa09cb55866cdaaa73ebd6.jpg)\n\n### What were some of the most interesting challenges you had to overcome during development of the A220?\n\n**Shaye Garg**: Because the A220 was our first aircraft-development project, one of our greatest challenges was the steep learning curve involved in reproducing such a complex modern airliner. As our knowledge, experience, and standards grew, we often reached a point where improving the existing work was no longer enough – we needed to start again and rebuild it properly.\n\nThis has affected nearly every part of the aircraft. We rebuilt the 3D model from the ground up to achieve the accuracy and level of detail we wanted while taking full advantage of Microsoft Flight Simulator’s capabilities. The aircraft’s systems and avionics have similarly undergone several substantial rewrites as our understanding of both the real A220 and software architecture evolved.\n\nAlthough those rebuilds significantly expanded the project’s scope, each one produced a more accurate, robust, and maintainable result. Learning when to refine existing work and when to rebuild it entirely has been one of the project’s most difficult and most valuable lessons.\n\n![Microsoft Flight Simulator 2024 Screenshot - A220 Airliner Team](media/3ffe6cf69c4c6dcf2f81e89d47cc2cdadc7a90836c6840e3ef55ca2cff94ec58.jpg)\n\n### What excites you most about the A220?\n\n**Harsh Duba**: What excites us most is how different the A220 feels to fly and operate compared with more conventional Boeing and Airbus aircraft. Its distinctive systems, avionics, and operating flows give pilots something genuinely new to learn, making it an interesting and rewarding aircraft to fly.\n\nBeyond the aircraft itself, we’re excited to see how the community receives it. After years of development, the prospect of finally placing such a unique and modern airliner into the hands of thousands of flight simmers is incredibly rewarding. We’re also looking forward to supporting and expanding the A220 well into the future, guided by feedback from the community and the continued evolution of the simulator.\n\n---\n\n*The Synaptic Simulations / iniBuilds A220 Airliner is available now from the Microsoft Flight Simulator in-sim Marketplace for USD 64.99.*\n\n*Microsoft Flight Simulator 2024 is available for XBOX Series X|S and XBOX on PC with Xbox Game Pass, PC Game Pass, Windows, and Steam, PlayStation 5, and on supported mobile phones, tablets, and lower-spec PCs via Xbox Cloud Gaming. For the latest information on*[*Microsoft Flight Simulator*](https://www.xbox.com/en-US/games/microsoft-flight-simulator)*, stay tuned to*[*@MSFSOfficial*](https://nam06.safelinks.protection.outlook.com/?data=04%7C01%7Csdamron%40microsoft.com%7Cf8bc9c21123c4a96cdad08d9638933b8%7C72f988bf86f141af91ab2d7cd011db47%7C1%7C0%7C637650263260978930%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C1000&reserved=0&sdata=JGnMisKNWgsAXVJ1sXZrD7xHUpe9RSqILuA7B2ochk0%3D&url=https%3A%2F%2Ftwitter.com%2Fmsfsofficial)*on X (formerly known as Twitter) or visit our website at: www.flightsimulator.com.*", "excerpt": "Earlier this week, Synaptic Simulations, a small team of young developers only a few years out of high school, launched their first product on the         Marketplace: the A220 Airliner. This is on", "readingMinutes": 11, "images": [{"src": "media/ff9ddab6a7d222976c2091ca18e6ad1ee8dcbd89f598eaf3bdeb10200fbd9f19.jpg", "alt": "A Microsoft Flight Simulator Cinderella Story: Building the A220 Airliner"}, {"src": "media/b12b56395953ba993f1e7889df07362b81701bc6232544b3f078f400e06168b8.jpg", "alt": "Microsoft Flight Simulator 2024 Screenshot - A220 Airliner Team"}, {"src": "media/15b299ab86ec586c1924be2a291db3c7ca443c414d5380900f51dc70cf1a98b6.jpg", "alt": "Microsoft Flight Simulator 2024 Screenshot - A220 Airliner"}, {"src": "media/d4535c23f19f99368e6918a127a2151326b4e0f0555f38bcd22573f6844153f2.jpg", "alt": "Microsoft Flight Simulator 2024 Screenshot - A220 Airliner"}, {"src": "media/0402f6abe1ebcee211cb219623f27e900c1def3b6eaa09cb55866cdaaa73ebd6.jpg", "alt": "Microsoft Flight Simulator 2024 Screenshot - A220 Airliner"}, {"src": "media/3ffe6cf69c4c6dcf2f81e89d47cc2cdadc7a90836c6840e3ef55ca2cff94ec58.jpg", "alt": "Microsoft Flight Simulator 2024 Screenshot - A220 Airliner Team"}], "cover": "media/ff9ddab6a7d222976c2091ca18e6ad1ee8dcbd89f598eaf3bdeb10200fbd9f19.jpg"}, {"id": "740c5e71e89177d681461eb1", "title": "MONOPOLY: Star Wars Heroes vs. Villains – Character Abilities Breakdown", "summary": "MONOPOLY: Star Wars Heroes vs. Villains is available tomorrow. Here's a breakdown of the special abilities for all 28 iconic Star Wars characters in the game, plus developer tips on how best to use them:", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/06/29/monopoly-star-wars-heroes-vs-villains-character-ability-breakdown/", "publishedAt": "2026-06-29T17:00:00+00:00", "author": "Will Fulton, XBOX Wire Editor", "markdown": "![MONOPOLY: Star Wars Heroes vs. Villains – Character Abilities Breakdown](media/093a4fcf743e7187770fa3230a183689c7b7a2144a45d884ee13c1da37f29ce2.jpg)\n\n### Summary\n\n- *[MONOPOLY: Star Wars Heroes vs. Villains](https://www.xbox.com/en-us/games/store/monopoly-star-wars-heroes-vs-villains/9mtg0j8xtg78)* is out June 30.\n- We’re offering a full breakdown of the unique abilities wielded by recruitable Star Wars characters.\n- A developer shares insights into some of the best ability combinations as you build your team.\n\n*MONOPOLY: Star Wars Heroes vs. Villains* is out tomorrow for XBOX Series X|S. A bold new twist on the beloved board game, you can experience cinematic moments as you move through iconic locations from the Star Wars galaxy. You can play online or through couch co-op in 2v2 or 3v3 competitive game modes. Dynamic GO Events can unleash game-changing effects across the board and shift the momentum of the game.\n\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/ad6eb1dfe1e9e3bea0675b40057fafd11b396b1853be7d5bb133e2fdfdf33c02.jpg)\n\n### **Character Ability Breakdown**\n\nThere are also 28 iconic Star Wars characters, 14 heroes and 14 villains, each wielding a special, game-changing ability. Each hero shares their ability with a villain.\n\n“It’s important these Abilities are distributed equally between both teams to balance the game better,” said Lola Guilldou, Senior Line Designer. “This gives each player equal footing when planning their team of Heroes and Villains and strategizing a counterplay against their opponent.”\n\nHere’s the breakdown:\n\n- **Chewbacca**’s Wookie Rampage, **Reva**’s Thirst for Revenge: *Advance to next opponent and fight*\n- **Leia Organa**’s Rebellion Aid, **Cad Bane**’s Slight of Hand: *When you pass an opponent, steal 100 credits*\n- **Yoda**’s Master and Mentor, **Emperor Palpatine**’s War and Corruption: *Upgrade locations twice a turn*\n- **Bo-Katan Kryze**’s Justice Served, **Count Dooku**’s Sith Control: *Spend 300 credits to send a random opponent to jail*\n- **Finn Deserter**’s Rebel on Duty, **Boba Fett**’s 2-6 Boost: *Move 2 tiles forwards or backwards*\n- **Jyn Erso**’s Generous Contribution, **Fennec Shand**’s Crime Family: *When you land on an ally location, earn double the resupply (rent) value*\n- **Luke Skywalker**’s Echoes of Hope, **Darth Vader**’s Imperial Judgement: *Call in Wedge Antilles/a Storm Trooper to affect a location within 3 tiles*\n\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/254609fb45694d932ec01b0c92914a7c37349f68aa8c8b560eb2e16033a8012a.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/ececdc32bdc2920d036b324e179cf14fb222200fac0ae0e7272e6af6715ec1c4.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/8a712e644d394e15863c396d2e0d6de889e486abb02cb654f3c3b3887f4c52f4.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/388c94cef2fbfc4c3a8eb1a2666cd803d40053be165b35ffa867670da237587c.jpg)\n\n- **Mace Windu**’s For the Republic, **Asajj Ventress**’ Pride and Fear: *In combat, allies throw one extra die*\n- **Obi-Wan Kenobi**’s Wise General, **Kylo Ren**’s Power of Darkness: *During a GO event, reroll your dice if you failed the roll*\n- **Padmé Amidala**’s Diplomatic Endeavor, **Dedra Meero**’s Spy Network: *Claiming locations costs 50% fewer credits for allies*\n- **Rey**’s Never Give Up, **General Grievous**’ I Wield Great Power: *Enter combat with random opponent. Winner gains credits.*\n- **Rose Tico**’s Tech Support, **Captain Phasma**’s First Order Influence: *Purchase up to 3 movement dice and roll them immediately*\n- **Han Solo**’s Charismatic Scoundrel, **Aurra Sing**’s Bounty Intel: *Access the Cantina from your current position*\n- **Ahsoka Tano**’s Fulcrum, **Darth Maul**’s Victory or Death: *In combat, purchase up to 3 extra dice for your roll*\n\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/92c89b583b0635964865671af0475be44b8a634314eae034a2b3979977bc0e4a.jpg)\n\n### **Dev-Recommended Ability Combos**\n\nWhile each of these abilities can have a significant impact on the game, building a team of iconic Star Wars characters whose abilities play off one another is a great way to control the board. Depending on what aspect of gameplay you want to focus on, here’s what Guilldou recommends:\n\n**If you want to focus on location acquisition:**\n\n- Make Padmé Amidala/Dedra Meero your cornerstone character, which reduces location cost by 50% for allies.\n- Add Luke Skywalker/Darth Vader to call in an NPC to affect a location within 3 tiles and Master Yoda/Emperor Palpatine to upgrade a location twice in one turn.\n\n**To focus on winning Battles:**\n\n- Make Mace Windu/Asajj Ventress your cornerstone character, enabling one extra die throw for allies.\n- Add Chewbacca/Reva or Rey/General Grievous to trigger extra Battle opportunities.\n\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/f222ca6607349502bb9db5fa6175d58bcc0a266c3bad6ad939a8373604da5684.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/d2da35d91d22cdd77f16521bcc66ec12b53fb9cfd3b4b08a3260d80444d85ebe.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/af9bf86d029609cd4cd1983cb5cf55bc7401f713802ef5e16d9b5769b7938e90.jpg)\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/bf3ea5499299e34c5ff811e5042c80a3421fc25276c136660c551e282a0fb2a6.jpg)\n\n**To focus on board movement (and triggering Go Events):**\n\n- Make Rose Tico/Captain Phasma your cornerstone character to immediately purchase and roll up to 3 movements dice.\n- Add Finn/Boba Fett to move 2 tiles in either direction, or add Chewbacca/Reva to advance to next opponent (this will trigger a Battle).\n\n**To frustrate your opponent’s plans with jail:**\n\n- Make Bo-Katan Kryse/Count Dooku your cornerstone character, allowing you to send a random opponent to jail for 300 credits.\n- Add Han Solo/Aurra Sing to your team, allowing you to access the Cantina from your current position. From the Cantina, you can purchase an option to send a player to jail.\n\n**To focus on acquiring credits:**\n\n- Make Leia Organa/Cade Bane your cornerstone character, allowing you to steal 100 credits whenever you pass an opponent.\n- Add Jyn Erso/Fennec Shand to earn double the resupply value when landing on an ally location; Padmé Amidala/Dedra Meero to reduce location cost by 50%; or Rey/General Grievous to enter Battle and win credits.\n\n![Monopoly: Star Wars Heroes vs. Villains screenshot](media/8b7d81eb6730b05fdf9b30d8f3f86e8b2d2b68916e0385612366773deb95207a.jpg)\n\nThere are so many character ability combinations to try, and we can’t wait to see what you come up with. Play *[MONOPOLY: Star Wars Heroes vs. Villains](https://www.xbox.com/en-us/games/store/monopoly-star-wars-heroes-vs-villains/9mtg0j8xtg78)* on XBOX Series X|S starting tomorrow!\n\nSTAR WARS © & TM 2026 Lucasfilm Ltd. All Rights Reserved.\n\nMONOPOLY ™, ® & © 2026 Hasbro. All Rights Reserved.", "excerpt": "Summary\n\n-     is out June 30.\n- We’re offering a full breakdown of the unique abilities wielded by recruitable Star Wars characters.\n- A developer shares insights into some of the best ability", "readingMinutes": 8, "images": [{"src": "media/093a4fcf743e7187770fa3230a183689c7b7a2144a45d884ee13c1da37f29ce2.jpg", "alt": "MONOPOLY: Star Wars Heroes vs. Villains – Character Abilities Breakdown"}, {"src": "media/ad6eb1dfe1e9e3bea0675b40057fafd11b396b1853be7d5bb133e2fdfdf33c02.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/254609fb45694d932ec01b0c92914a7c37349f68aa8c8b560eb2e16033a8012a.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/ececdc32bdc2920d036b324e179cf14fb222200fac0ae0e7272e6af6715ec1c4.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/8a712e644d394e15863c396d2e0d6de889e486abb02cb654f3c3b3887f4c52f4.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/388c94cef2fbfc4c3a8eb1a2666cd803d40053be165b35ffa867670da237587c.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/92c89b583b0635964865671af0475be44b8a634314eae034a2b3979977bc0e4a.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/f222ca6607349502bb9db5fa6175d58bcc0a266c3bad6ad939a8373604da5684.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/d2da35d91d22cdd77f16521bcc66ec12b53fb9cfd3b4b08a3260d80444d85ebe.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/af9bf86d029609cd4cd1983cb5cf55bc7401f713802ef5e16d9b5769b7938e90.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/bf3ea5499299e34c5ff811e5042c80a3421fc25276c136660c551e282a0fb2a6.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}, {"src": "media/8b7d81eb6730b05fdf9b30d8f3f86e8b2d2b68916e0385612366773deb95207a.jpg", "alt": "Monopoly: Star Wars Heroes vs. Villains screenshot"}], "cover": "media/093a4fcf743e7187770fa3230a183689c7b7a2144a45d884ee13c1da37f29ce2.jpg"}, {"id": "c00843dba22afc1d78ce4577", "title": "XBOX Celebrates Global Accessibility Awareness Day with Improved Adaptive Thumbstick Toppers and More", "summary": "Today, in recognition of Global Accessibility Awareness Day, we're sharing an update to the Adaptive Thumbstick Toppers available today through XBOX Design Lab.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/21/xbox-global-accessibility-awareness-day-2026/", "publishedAt": "2026-05-21T20:30:00+00:00", "author": "Joe Skrebels, XBOX Wire Editor-in-Chief", "markdown": "![XBOX Celebrates Global Accessibility Awareness Day with Improved Adaptive Thumbstick Toppers and More](media/2bff2c31d4ef1abd1f704fa7c9631955154ae32218db4befb100e9159151e675.jpg)\n\nToday, in recognition of Global Accessibility Awareness Day, we’re sharing an update to the Adaptive Thumbstick Toppers available today through XBOX Design Lab.\n\n## **Improved XBOX Adaptive Thumbstick Toppers, Including a New Design Option**\n\n![The new XBOX Adaptive Thumbstick Topper Goal Post shape attached to the XBOX Adaptive Joystick](media/2a39ee04c5cac4379e833b6c68ecfb6ad51e745ddf6e0fdadde5c90107fb833d.jpg)\n\nAs we shared during Microsoft’s Ability Summit, we’re continuing our commitment to customizable control solutions. Based on player feedback, we’ve improved the attachment design so the toppers better endure higher force use and stay securely in place during gameplay. We’re also expanding the lineup with a new, highly requested option: the Goal Post shape (image above), giving players even more ways to tailor their setup.\n\nPlayers can access both options starting today. To explore the updated topper program, head to **[XBOX Design Lab](https://xboxdesignlab.xbox.com/en-us/accessories/adaptive-thumbstick-toppers-for-xbox-controllers)**, choose the controller you’d like to design a topper for, and select from seven available shapes, including the new Goal Post shape. From there, you can customize the width and height that work best for you and download a 3D printable file, at no charge, that you can use to print the topper for your compatible controllers. No need to buy a controller to download the file, you just need access to a 3-D printer or printing service.\n\n## **Improved Accessible Gaming Page on XBOX.com**\n\nWe’re launching a refresh of the [Accessible Gaming page on XBOX.com](https://www.xbox.com/en-US/community/for-everyone/accessibility?xr=shellnav) today to make it easier for players to learn about the accessibility features and tools available across XBOX. The updated page introduces clearer content, improved navigation, and a more approachable layout, helping players more quickly find what they need and understand how XBOX supports different ways to play.\n\nTo learn more, visit the [Accessible Gaming page on XBOX.com](https://www.xbox.com/en-US/community/for-everyone/accessibility?xr=shellnav) and explore the tools and features available to help you game your way.\n\n## **Celebrating Our Accessibility Journey Across XBOX**\n\n**Making Accessibility Visible and Discoverable with Accessibility Tags**\n\nToday, more players than ever rely on inclusive experiences to help connect them with games they enjoy, and to make accessibility features truly beneficial, players need to understand which features each game supports and how to discover titles that fit their needs. Accessibility tags, such as [the Accessible Games Initiative tags](https://news.xbox.com/en-us/2025/07/09/accessible-games-initiative-tags-xbox-interview/), are available now within XBOX storefronts and can help players filter and find experiences that match their preferences.\n\n***Forza Horizon 6***\n\n![Forza Horizon 6 key art featuring a red sports car drifting on a winding road with water spray, a blue SUV driving behind it, and a stylized Japanese-inspired backdrop with Mount Fuji, cherry blossoms, castles, and a modern city skyline. The Forza and Forza Horizon 6 logos appear in the upper right.](media/8c93354b863e116860882d333dd11a456a4c206f2acd72b6b63af6cf15b4ec6c.jpg)\n\n*Forza Horizon 6* launched this week, continuing Playground Games and Turn 10 Studios’ commitment to accessibility with returning features and thoughtful new additions meant to give more players the freedom to explore, race, and play their way through Japan on their terms. Many of these updates were shaped through close collaboration with the gaming and disability community, advocates, and accessibility experts. You can read more about these key features, including AutoDrive via ANNA (D-pad), Proximity Radar, High Contrast Mode, and a post-launch update to enable American Sign Language (ASL) and British Sign Language (BSL) for cinematics, **[here](https://forza.net/news/forza-horizon-6-radio)**.\n\n***Kiln***\n\n![Kiln key art showing animated ceramic pots and vases with expressive faces dancing and running through a whimsical nighttime village scene. A glowing kiln furnace burns in the background beneath a starry sky, while the vibrant Kiln logo appears at the top center.](media/c082cccf86de730d119488389b8d5848cf169f167cc0d3368428b654213d040d.jpg)\n\nDouble Fine’s *Kiln* delivers a creative spin on multiplayer, blending fast-paced team battles with a unique pottery-driven twist where players sculpt their own ceramic fighters – turning creativity into a key part of the strategy.\n\nAlongside its charming premise, the game includes a [variety of accessibility features](https://www.doublefine.com/games/support/kiln/accessibility?platform=all) such as flexible text settings, visual accessibility options, remappable controls, and more to help players tailor their experience. Learn more about Kiln’s accessibility features [here](https://www.doublefine.com/games/support/kiln/accessibility?platform=all).\n\n***Sea of Thieves***\n\n![Sea of Thieves key art showing multiple pirate ships with colorful faction sails sailing together across the ocean near a tropical island under a bright blue sky.](media/705d29b9028e2493eb005beecaf19af997005b65d63f96e9f51c44ab0016d55c.jpg)\n\nSince *Sea of Thieves*’ launch eight years ago, more than 50% of the game’s 100+ updates have included accessibility improvements, from control remapping to features like Audio Aim Assist, helping players with low or no sight take on enemies independently.\n\nToday, the studio’s focus is on ensuring new content launches with accessibility features built in from day one, including the recent [Bilge Rats Weekender event](https://www.seaofthieves.com/bilge-rats-weekender), which brought the customizable Custom Text Overlay feature to the Challenge Parchment, building on earlier work with Riddle Maps.\n\n***Call of Duty: Black Ops 7***\n\nGaming is better when more players can take part, compete, connect, and belong. Recently, Activision introduced new accessibility options in *Call of Duty: Black Ops 7*, all part of its mission to embed inclusive design throughout the game development cycle. These include:\n\n- [**Support for Cephable**](https://www.callofduty.com/blog/2026/04/call-of-duty-black-ops-7-expanding-accessibility-new-control-options)**,** supporting players with limited mobility and allowing them to control the game using voice, facial expressions, head movements, and customizable inputs via a mobile or desktop app.\n- **Advanced Motion Control settings**, designed to help reduce motion-related discomfort without changing gameplay itself, helping players who are sensitive to fast camera movement or visually busy screens.\n\n![Screenshot of the Call of Duty: Black Ops 7 ‘Account & Network’ settings menu with ‘Cephable Account’ highlighted. The right panel explains connecting an Activision account with Cephable to use adaptive inputs, with a status message reading ‘Ready To Use.’](media/b5c725718f6b9635a587ed52d69dc302acdaf674d023e52bd80d4d7469648690.jpg)\n\n**New Research** **from Activision** **Highlights the Power of Play**\n\nActivision is also excited to share findings from a new, commissioned study by the Royal National Institute of Blind People, presented at the CSUN Assistive Technology Conference, highlighting gaming’s impact on players who are blind or partially sighted. The study found that 84% reported improved social interaction and 87% cited stress relief, underscoring gaming’s role in connection and well-being.\n\nYou can explore a summary of the research on the [Activision Research site](https://research.activision.com/publications/2026/Video_games_positive_impact_blind_and_partially_sighted), along with [a podcast](https://www.rnib.org.uk/connect-radio/rnib-connect-radio-shows/tech-talk/episodes/tech-talk-614-activision-nvda-coach-rnib-shop-8895036/) featuring insights from researchers and developers.\n\n---\n\nJoin teams across XBOX in celebrating Global Accessibility Awareness Day as we continue to advance inclusive design and create more accessible experiences for all players.", "excerpt": "Today, in recognition of Global Accessibility Awareness Day, we’re sharing an update to the Adaptive Thumbstick Toppers available today through XBOX Design Lab.\n\n     Improved XBOX Adaptive Thumbst", "readingMinutes": 9, "images": [{"src": "media/2bff2c31d4ef1abd1f704fa7c9631955154ae32218db4befb100e9159151e675.jpg", "alt": "XBOX Celebrates Global Accessibility Awareness Day with Improved Adaptive Thumbstick Toppers and More"}, {"src": "media/2a39ee04c5cac4379e833b6c68ecfb6ad51e745ddf6e0fdadde5c90107fb833d.jpg", "alt": "The new XBOX Adaptive Thumbstick Topper Goal Post shape attached to the XBOX Adaptive Joystick"}, {"src": "media/8c93354b863e116860882d333dd11a456a4c206f2acd72b6b63af6cf15b4ec6c.jpg", "alt": "Forza Horizon 6 key art featuring a red sports car drifting on a winding road with water spray, a blue SUV driving behind it, and a stylized Japanese-inspired backdrop with Mount Fuji, cherry blossoms, castles, and a modern city skyline. The Forza and Forza Horizon 6 logos appear in the upper right."}, {"src": "media/c082cccf86de730d119488389b8d5848cf169f167cc0d3368428b654213d040d.jpg", "alt": "Kiln key art showing animated ceramic pots and vases with expressive faces dancing and running through a whimsical nighttime village scene. A glowing kiln furnace burns in the background beneath a starry sky, while the vibrant Kiln logo appears at the top center."}, {"src": "media/705d29b9028e2493eb005beecaf19af997005b65d63f96e9f51c44ab0016d55c.jpg", "alt": "Sea of Thieves key art showing multiple pirate ships with colorful faction sails sailing together across the ocean near a tropical island under a bright blue sky."}, {"src": "media/b5c725718f6b9635a587ed52d69dc302acdaf674d023e52bd80d4d7469648690.jpg", "alt": "Screenshot of the Call of Duty: Black Ops 7 ‘Account & Network’ settings menu with ‘Cephable Account’ highlighted. The right panel explains connecting an Activision account with Cephable to use adaptive inputs, with a status message reading ‘Ready To Use.’"}], "cover": "media/2bff2c31d4ef1abd1f704fa7c9631955154ae32218db4befb100e9159151e675.jpg"}, {"id": "340a88ba6ea473e0f311b7d4", "title": "Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet", "summary": "Build and curate Two Point’s very first art museum with Two Point Museum's Arty-Facts DLC, available now for Xbox Series X|S.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/08/two-point-museum-arty-facts-dlc-launch/", "publishedAt": "2026-05-08T15:00:00+00:00", "author": "Danielle Partis, XBOX Wire Editor", "markdown": "![Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet](media/849dea1804e35abf3fbb4b7867c20e909a6a9916d65addc454b2418bd64b1b48.jpg)\n\n### Summary\n\n- Two Point Museum: Arty-Facts is available now for Xbox Series X|S, with a limited 10% discount at launch.  \n  • Build and curate Two Point’s very first art museum, and take on Expeditions to uncover Famous Works of art to display.  \n  • Using the new Commissions feature, have your Art Experts create unique art in-house, inspired by their own emotions and traits.\n\nIn the world of ***[Two Point Museum](https://www.xbox.com/en-us/games/store/two-point-museum/9nfhrf1m4w3z)**,* moving from dusting fossils to commissioning works of art might seem like a pretty big change in scenery – but that’s exactly what the next adventure has in store for our curators. As one of the most eagerly awaited DLCs, finally bringing an art museum to Arty-Facts felt like the perfect next step for Two Point.\n\n![Two Point Museum screenshot](media/9fb881536be7422553c67b922026b12d271ab7fd885ed8e239348bdbbf834adf.jpg)\n\nOne of the highlights of our DLCs is the challenge – and the creativity involved – in adapting a new location and curating the best experience for your museum guests. In Undee Docks, a brand-new museum location set in an industrial port, you’ll build and curate the very first Art Museum in Two Point County, helping to turn a rundown port town into a genuine cultural hub.\n\nThrough the Expedition feature, you’ll send your staff off on adventure, dispatching a team of (partially) trained experts to discover Famous Works of art. We’ve given the concept a little twist this time around, as players will be following in the footsteps of a Two Point legend, revisiting cherished areas from the Two Point universe while exploring Zara Fitzpocket’s sketchbook. Instead of a traditional map, you’ll uncover pages from the book, each filled with delightful illustrations and doodles.\n\n![Two Point Museum Screenshot](media/4c64a4832ed69d5219451c5cfed01e01d00a7a121ff4c55aeb32e29cb9efc327.jpg)\n\nNow, Expeditions are a well-loved feature by this stage, so while you’ll discover Famous Works through these adventures, the real fun begins in the Studio Room with commissions. This is the true highlight of the expansion, as for the first time, players aren’t just uncovering pre-determined exhibits, they’re commissioning original art. By setting up your Art Experts in this new space, you’ll select the medium and Emotion for them to use in creating a brand-new artwork. Whether it’s 2D art like paintings and portraits, or 3D pieces such as sculptures and statues, the possibilities for your art collection are virtually endless.\n\n**A Blank Canvas**\n\nYou’ll curate your talent on inspiring expeditions, as staff return with fresh emotions to spark in your original art in the Studio Room. Through these feelings, your newly created artwork will shape your guests’ experiences; they may suddenly develop a love of clowns, and donate generously in their presence, or be so overwhelmed with *Rage* that they ignore price tags, embarking on a spontaneous spending spree in your Gift Shop while disregarding the ridiculous prices.\n\n![](media/44d1265829614f58688df266e5cd52f8feca2e6ed0c2edce847c3bae10dc7c66.jpg)\n\nBy harnessing Emotions, you unlock a new level of the guest experience, as these powerful effects can be curated to create specialised areas, whether your aim is to max-out guest excitement with Buzz, or rake in the cash by manipulating guest emotions to have them flood you with donations.\n\n**A Work of Art**\n\nCommissioning a new piece uses a clever system to craft original art, it selects bespoke, created layers, alongside a colour palette, all influenced with which Expert it is taking on the commission. This all happens under the hood; leaving you in suspense for the result. The team put a lot of effort into creating these layers, so you’ll see a variety of pieces, ranging from abstract blobs and splats (that invite your own interpretation) to more grounded art containing still-lives – all in the Two Point-y art style, of course. Things get really interesting when your Art Experts traits come into play; as, for example, one member of staff may specialize in drawing nothing but stick people.\n\n![](media/010160fc76a6a2a8b7a9f4ce604a35732a3eda40988474dd62a23774f3797549.jpg)\n\nManaging your museum isn’t all business – there’s plenty of room for creativity! And it’s not just the Studio Room where this creativity shines. Arty-Facts introduces a huge array of new options for players, from industrial décor to fit the port’s vibe, to bright, colourful elements reminiscent of childhood dreams, like giant crayons and splashes of paint.\n\nA lot of love and effort went into creating new customisation options, with over ten new wallpapers and ten new flooring options, which are always community favourites. The cozy creatives out there can now pair their art pieces with the perfect colourful backgrounds, as the new coverings range from traditional patterns to trippy designs.\n\n![](media/d583e6ded5b1555739092c17ebe16cf8c60ce7e0c3fc385db1e35d8abb58232c.jpg)\n\n**What Players Can Expect**\n\nArty-Facts takes everything we know our fans love – engaging yet easy-to-understand mechanics, charming humour – and brings it to a fresh set of curation challenges and creative opportunities. Whether you’re discovering Famous Works, inspired by real-life art, or experimenting with commissions in the Studio, you’ll be shaping an art-gallery-stroke-museum (a gallery-um, if you like), that’s genuinely yours. So, are you ready to splash some paint and build a world-class art museum?\n\n[Two Point Museum: Arty Facts](https://www.xbox.com/en-us/games/store/two-point-museum/9nfhrf1m4w3z) is available on Xbox Series X|S now. Aspiring creative curators can try the DLC before they buy, playing the first act for free as part of the base game, or you can pick it up separately – with a 10% discount running for the first seven days.", "excerpt": "Summary\n\n- Two Point Museum: Arty-Facts is available now for Xbox Series X|S, with a limited 10% discount at launch.  \n  • Build and curate Two Point’s very first art museum, and take on Expedi", "readingMinutes": 7, "images": [{"src": "media/849dea1804e35abf3fbb4b7867c20e909a6a9916d65addc454b2418bd64b1b48.jpg", "alt": "Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet"}, {"src": "media/9fb881536be7422553c67b922026b12d271ab7fd885ed8e239348bdbbf834adf.jpg", "alt": "Two Point Museum screenshot"}, {"src": "media/4c64a4832ed69d5219451c5cfed01e01d00a7a121ff4c55aeb32e29cb9efc327.jpg", "alt": "Two Point Museum Screenshot"}, {"src": "media/44d1265829614f58688df266e5cd52f8feca2e6ed0c2edce847c3bae10dc7c66.jpg", "alt": "Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet"}, {"src": "media/010160fc76a6a2a8b7a9f4ce604a35732a3eda40988474dd62a23774f3797549.jpg", "alt": "Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet"}, {"src": "media/d583e6ded5b1555739092c17ebe16cf8c60ce7e0c3fc385db1e35d8abb58232c.jpg", "alt": "Arty-Facts: Why Two Point Museum’s New DLC is the Most Creative One Yet"}], "cover": "media/849dea1804e35abf3fbb4b7867c20e909a6a9916d65addc454b2418bd64b1b48.jpg"}, {"id": "e1ef19eec36378e899cfea23", "title": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass", "summary": "Mixtape is a joyful, magical celebration of music and a dreamlike, melancholy snapshot of what it means to grow up, that needs to be seen to be truly appreciated.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/07/mixtape-90s-narrative-music-adventure-launch/", "publishedAt": "2026-05-07T13:00:00+00:00", "author": "Danielle Partis, XBOX Wire Editor", "markdown": "![Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass](media/a8b2ca96fe22bd7469fc9a378273f1af47789fd45502a0e66b19b1d33bcbb5c6.jpg)\n\nAs author Nick Hornby once wrote in his seminal novel ‘High Fidelity’: “Making a tape is like writing a letter – there’s a lot of erasing and rethinking and starting again…” and I think that same logic can be applied to the making of a video game too. There are a hell of a lot of rules, according to Hornby.\n\nIt’s this ‘building a mixtape’ ideology that ***[Mixtape](https://www.xbox.com/en-us/games/store/mixtape/9nh0msg29x6l)***, as it suggests, adheres to most. This new narrative adventure from Beethoven & Dinosaur has crafted a compilation of experiences, some extravagantly theatrical, some grounded. Some are calm and some are complex. They’re tasters of a greater whole; delicious vol-au-vents of emotion, love, loss, rebellion – and much like a traditional mixtape, the game plays out like a collection of lived memory that a loved one has painstakingly crafted for you to experience the way they did.\n\nThat, and it’s honestly f\\*\\*kin’ rad, man.\n\n![](media/fe114738d8e483badc66d5e00709fe112b64cc4c708842ba54b8d39043ee42c3.jpg)\n\n*Mixtape* wastes no energy on preamble, instead presenting an magical, interactive introduction that shows our three main characters careening down a sunset-soaked highway to ‘That’s Good’, by Devo.\n\nTo set the scene – it’s the trio of friends’ last night together before Stacey Rockford, *Mixtape*’s lead protagonist, jets off to New York to pursue her dreams of an illustrious career in the music business. The plan for the evening is laid out like a great heist, culminating in attending a teenage beach party, but the stakes are just as high as any bank robbery through the hazy lens of three teenagers celebrating their last night of life as they know it.\n\nEach sequence in *Mixtape* plays out to a carefully selected track – some you’ve heard before, some you definitely haven’t – but it’s the introduction to each musical entry braised by Stacey Rockford’s dorky, fourth-wall explanations that makes them truly special.\n\n![](media/a50d51ae3c0f6067518c5922e2905c27312325ba0cb87e0f1cf90b3a4f6a3b86.jpg)\n\nRockford is brooding, malevolent and snarky. She’s youth incarnate – ambitious and full of hope for her future, and equally brimming with dismay for
