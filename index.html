ly—they think of the old idea that those sorts of packs have an alpha,” explains Elan “Qulani” Stimmel, narrative editor. “We didn’t want to focus on the idea of an alpha. We really wanted to focus on the symbiotic nature of the pack.”\n\nThis is where Naafiri starts to differ from the other Darkin in Runeterra. At first, she resented the idea of her spirit being stuck amongst a bunch of dogs. But she quickly learned that the relationship they share is what enables them to survive and thrive in the harshest of climates. She knew there was something that the Darkin could learn from her new pack.\n\n“It’s almost like evil enlightenment or letting go of your idea of self. But Naafiri is doing it for bad reasons,” laughs JohnODyin. “She wants the Darkin to become the dominant lifeform in Runeterra again. Abolishing the ego for evil is a means of getting there.”\n\n## One Mind, Spread Among Many Vessels\n\nAs Naafiri’s footprints (err, pawprints?) multiplied in game, Riot Twin Enso and game design manager, Stephen “Riot Raptorr” Auker, needed to make sure she still lived up to her simple, easy-to-learn assassin gameplay hook. [Naafiri’s kit](https://leagueoflegends.com/en-us/news/game-updates/naafiri-abilities-rundown/) had to be powerful, but approachable. And she should rely heavily on her packmates to help her secure kills. So, her other doggos needed some smart new AI.\n\n“Making sure the other hounds behave like you would expect a pack of dogs to behave was critical,” says Riot Raptorr. “We didn’t want them to feel like mindless minions like Yorick’s ghouls or Bel’Veth’s summons. We wanted them to feel like your packmates who are helping you out, and like they matter throughout the entire game.”\n\n[![06222023_Champion_Insights_NaafiriArticle_Early_Ability_Concepts.png](media/5cee6a51933d8a22d1e3a61fd6a3a7f1170e7a2598c06bbacd38a7ba111fd738.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f96fa0a3d0014ac94190bcc7179974dce625fef6-1600x826.png)\n\n\nConcepts for Naafiri’s R, The Call of the Pack, and the rest of her kit which is empowered by each additional packmate.\n\nNaafiri is designed to be simple to play, but sometimes making something seem easy is actually really hard. So Riot Raptorr wrote up an initial design doc for Naafiri’s gameplay needs and looked to the software engineering team for help. Naafiri needed technical solutions to tackle a unique set of challenges—all within the existing game code and minimum-spec requirements that make League an accessible game to an incredibly diverse playerbase.\n\n“From Stephen’s document, we looked for similar features in other games and read some white papers on how herd-movement behavior is done in other genres,” explains software engineer Matteo “Riot Chibattabun” Mannino. “We knew the packmates needed to path correctly, respond to attack commands quickly, stay at the appropriate range, attack the correct target, and of course, stay out of the way of an assassin’s gameplay patterns.”\n\nSo essentially, he and the engineering team created brand new tech for Naafiri and her pack that is robust, but also malleable enough for any gameplay changes that might be necessary down the road.\n\n“The main design difficulty was to bring the feeling of having an RTS-like swarm at your disposal into League, while also having this be a simple champion to play,” Riot Chibattabun adds. “With the new tech, we landed on something between Age of Empires-like formations to easily control Naafiri’s positions in the pack, and the quick-to-action movement mechanics in Starcraft II.”\n\n## Art of the Animal\n\nWhile the idea of a pack of dogs posed an interesting challenge from a design and engineering standpoint, art director Gem “Lonewingy” Lim was excited by the opportunity to work on another creature champion after creating so many pretty humans—Qiyana, Zeri, Sett, Kayle’s rework, and Evelynn’s rework, just to name a few.\n\n“We picked a canine because that’s a very clear creature fantasy,” Lonewingy says. “A lot of people own dogs, gamers and non-gamers alike. But we had to explore different canine archetypes and different breeds.”\n\nDuring that exploration, Lonewingy and the team found that there were actually many different types of dog characters in pop culture and gaming they could reference, from Okami dog warriors to the sword-wielding Great Grey Wolf, Sif.\n\n[![06222023_Champion_Insights_NaafiriArticle_Early_Thematic_Concepts.jpeg](media/bcf631bbec7cae8c7912b8bd16451ff73ab3b6f9933a5d4cf1bd63b8debc01b9.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/867c1e2a2810716f44d78b41e72d7b6bcb17efd4-1600x1362.jpg)\n\n\nDifferent doggo explorations for Naafiri.\n\nEarly on, the team wasn’t quite sure what part of Runeterra this canine creature would call home. They played with ideas of a blade-wielding Drakehound from Noxus, a Cerberus-inspired Watcher pup from the Freljord, and a Targonian Retriever with sun and moon forms.\n\nBut ultimately, they grew attached to another one of Lonewingy’s ideas—a demon-like dog that was accompanied by its not-so-cute puppy offspring.\n\n[![06222023_Champion_Insights_NaafiriArticle_Early_Darkin_Hound_Concept.png](media/40c1274d8d3071bc33588ca16af7050cc9587fd541577504ca639810b017ad0f.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dbbd2502687a80c81d14f1489ecf4e61fb00f335-1600x899.png)\n\n\nEarly Naafiri concepts were a little too much creature. Needs more bark.\n\n“That’s when it clicked and the team asked me to lean into this idea, but to go more dog-like and less demon-creature. So I started exploring some ideas for a Darkin pack from Shurima since Darkin were originally part of the Ascended,” Lonewingy reveals.\n\n[![06222023_Champion_Insights_NaafiriArticle_More_Dog-like_Darkin_Concept.jpeg](media/f818b17a2cdb428561c43e1bc8862831202997c29c75fb733b66a9c213d14e8c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/98a6f8cb3989ed092c7212ff00d656c1ec9acdd1-1600x953.jpg)\n\n\nNaafiri starting to take the shape of a hound.\n\nAs Lonewingy went through further iterations, Naafiri and her pack began to look more like a Darkin had made its way into the body of a real-world dog… only with some sharp allusions to her dagger form. She even created a base form for what a Shuriman dune hound looks like without the Darkin spirit inside.\n\n“I actually took a lot of inspiration from African wild dogs,” Lonewingy explains. “They sort of embodied what I imagine dune hounds to look like. And I also thought it was interesting how they use ear signals to communicate with each other and stay on-track with the pack.”\n\n[![06222023_Champion_Insights_NaafiriArticle_Dune_Hounds_Resized.jpg](media/79db13292fc4212535499b7e9ff4f3b8f2abed981e3766a592f0414446a16a92.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/82fb8f53a48f19f0783c625d7e37e94e2ffe0273-3657x2698.jpg)\n\n[![06222023_Champion_Insights_NaafiriArticle_AdobeStock_AfricanWildDogs.jpg](media/f1b3b3323a904cc471b5c89d89665cbbe7bc557f5ef6fcf6a88d7e785fa8a221.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/89472b4836826cf25bbafebb4d3d7e23b2601b9f-2941x1961.jpg)\n\n\nShuriman dune hounds and their inspiration, African wild dogs.\n\nBut Lonewingy knew that all Darkin have history. Naafiri had a former life, a former form. So Lonewingy added a small nod to that former life by giving Naafiri an earring. This earring used to be an ornament attached to the hilt of her dagger by its former owner, and it’s the last remaining reminder of Naafiri’s former body.\n\n[![06222023_Champion_Insights_NaafiriArticle_B_W_Naafiri_Concept.jpeg](media/3c03a0abc2fa5be1d37fc0db6fe4679464facc77e7db8754ff879041623f2c31.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/14464c0e4fc53fa99d781eccf2fa0354c9acb58d-1600x919.jpg)\n\n\nEarly art with Naafiri wearing the earring made from the ornament found on the dagger.\n\n## The Baying of the Hounds\n\nNow our Darkin doggo had a backstory, a gameplay hook, new pack technology, and a killer look, but the question still remained: What does a pack of demonic dogs sound like?\n\n“Oh boy. Naafiri was a complex champ to figure out,” laughs voiceover producer Nick “ProfRincewind” Lanza. “From the outset, being multiple dogs pretty much required multiple voices. From a VO perspective, that’s a really unique approach. We knew we wanted to create a raw and animalistic sound without relying too heavily on digital effects or processing. This meant creating the effect the old school way—by having the actor record multiple layers of the same line with different vocal tones and performances live in the studio. Big shout out to our VO designer, Austin “Riot Puma Pet” Mullen, for coming up with this idea in the first place.”\n\nWhen exploring the aural aesthetic of a champ’s voice, Riot Puma Pet looked at two main design elements: the physical and the emotional. Not only did he and the VO team have to capture Naafiri’s many dog voices (the physical), but there was also the inner Darkin spirit that helped give the pack its shared consciousness (the emotional). Naafiri contains multitudes.\n\n“I truly believe Naafiri wouldn’t be who she is without her actor, Morla Gorrondona,” Riot Puma Pet says. “She spent extensive time with us just trying out different voices and performance ideas. The sessions with her were really wonderful playgrounds of monster sounds and explorations.”\n\nAnd if you’ve got a keen ear, you’ll hear much more than just monster sounds within Naafiri’s VO. Each voice line was carefully constructed with a more human reading that carries Naafiri’s sense of leadership among the pack.\n\nThis more human-like recording was then processed and paired with a second recording in which Morla went all out with the creature fantasy.\n\nAdded together, they create the primal, ethereal, Darkin demi-dog.\n\n[![06222023_Champion_Insights_NaafiriArticle_Naafiri_Progress_Gif.gif](media/b6213738cf8e9a2b23a7fc99c3c4cd49d324711622518543fa907a4fc9799f18.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/72710d5c662b564c2da82be04ae50d3c1bf31991-1044x600.gif)\n\n“What chance will the world have when the Darkin hunt as one?”", "excerpt": "We’ve all been there. You just got out of a solo queue stomp when you decide to go outside for a walk to get some fresh air and reset your mental. It was a hot day and your house has gotten stuffy.", "readingMinutes": 18, "images": [{"src": "media/767922421aa0e904866a6ce9b46c2132065636a33465ca522abb30719185a09a.webp", "alt": "Champion Insights: Naafiri"}, {"src": "media/aaeb2e3ebadd143899f0d148244a5439429a34e3a5ddbe98febb879c6ce295f3.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_Naafiri_Teaser_Eyes.jpg"}, {"src": "media/37608d9e5c5c3e553532ac4766871a65dcc4e1b5fe6d864ef3553cae32ddac84.png", "alt": "06222023_Champion_Insights_NaafiriArticle_Early_Pack_Concept.png"}, {"src": "media/4893f8c5e339200258262b6f4bb788d3fe32b029665e6a09bed63b30684744cd.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_Naafiri_dagger.jpg"}, {"src": "media/5cee6a51933d8a22d1e3a61fd6a3a7f1170e7a2598c06bbacd38a7ba111fd738.png", "alt": "06222023_Champion_Insights_NaafiriArticle_Early_Ability_Concepts.png"}, {"src": "media/bcf631bbec7cae8c7912b8bd16451ff73ab3b6f9933a5d4cf1bd63b8debc01b9.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_Early_Thematic_Concepts.jpeg"}, {"src": "media/40c1274d8d3071bc33588ca16af7050cc9587fd541577504ca639810b017ad0f.png", "alt": "06222023_Champion_Insights_NaafiriArticle_Early_Darkin_Hound_Concept.png"}, {"src": "media/f818b17a2cdb428561c43e1bc8862831202997c29c75fb733b66a9c213d14e8c.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_More_Dog-like_Darkin_Concept.jpeg"}, {"src": "media/79db13292fc4212535499b7e9ff4f3b8f2abed981e3766a592f0414446a16a92.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_Dune_Hounds_Resized.jpg"}, {"src": "media/f1b3b3323a904cc471b5c89d89665cbbe7bc557f5ef6fcf6a88d7e785fa8a221.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_AdobeStock_AfricanWildDogs.jpg"}, {"src": "media/3c03a0abc2fa5be1d37fc0db6fe4679464facc77e7db8754ff879041623f2c31.jpg", "alt": "06222023_Champion_Insights_NaafiriArticle_B_W_Naafiri_Concept.jpeg"}, {"src": "media/b6213738cf8e9a2b23a7fc99c3c4cd49d324711622518543fa907a4fc9799f18.gif", "alt": "06222023_Champion_Insights_NaafiriArticle_Naafiri_Progress_Gif.gif"}], "cover": "media/767922421aa0e904866a6ce9b46c2132065636a33465ca522abb30719185a09a.webp"}, {"id": "98445cf81cbb0caecc590292", "title": "ORIGINS: Pyke", "summary": "The support designed to sink ‘em all.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/origins-pyke/", "publishedAt": "2023-03-13T16:00:00.000Z", "author": "Karnifexlol", "markdown": "![ORIGINS: Pyke](media/df39c51057b8ca5f632c0cefd2ac9a50d1b30b33a0bca37a9100c7ff30453520.webp)\n\n*“Thalassophobia: The persistent and intense fear of deep bodies of water.”*\n\nIf you don’t have a healthy fear of the ocean, well, you probably should. But don’t fear the possibility of drowning or the weight of the pounding waves. Fear what lurks below the depths. Fear Pyke.\n\nWhen Pyke began hunting his prey in bot lane back in 2018, his core gameplay design was a shock to many. League had never seen an aggressive, high-skill-cap assassin who was designed to be played… as a support?\n\nNow, nearly 5 years since his release, it’s time for a deep dive (yea, pun intended) into the development of the support that changed bot lane forever—Pyke, the Bloodharbor Ripper.\n\n## The ‘Why’ Behind the Assassin\n\n“People thought I was crazy when I first pitched the opportunity space to the DNA (Design, Narrative, Art) room,” recalls lead producer Ryan “Reav3” Mireles. “Everyone thought an assassin support was impossible. It was kind of a spit-out-the-coffee type moment.”\n\nIn a role that ideally exists to help the ADC secure kills and stay alive, a bloodthirsty, undead, shark of a man doesn’t seem to make much sense. But from a strategic standpoint, an assassin support champ made all the sense in the world.\n\nFirst, a little context. Before Pyke was released, League was going through a queue crisis. Support was the least popular role in the game and it was seriously affecting matchmaking all across the board.\n\n“It was actually a huge problem,” says game designer Jonathan “EndlessPillows” Fuller. “Autofill protection actually became a thing around this time because we were forcing so many people into support who didn’t want to play it.”\n\nTeams from all across League were looking at how they could help. The Systems team started work on support quest items, but the Champions team hadn’t yet been tasked to solve the problem.\n\n“At the time, the Champions team wasn’t sure what they could do to help,” Reav3 explains. “But I looked at the problem and thought, ‘hmm, people are really attached to champions in League. Sometimes players will even switch roles if they’re excited enough about a specific champion.’ And I wondered if we could increase the queue for support just through a champion release.”\n\nBut what could make a champ appealing enough to entice players away from other roles and get them to start queuing as support? To help answer that question, the team took a hard look at the existing champion roster and paid special attention to support.\n\n“When we looked at the themes of the existing support champions in the game, we saw that there weren’t a lot of dark or evil thematics,” Reav3 says. “Most support champs were on the bright, colorful, happy side of things. Even if they were a little more evil like Zyra, they were still typically bright and colorful… except for Thresh.”\n\n[![03132023_ORIGINSPykeArticle_graph.png](media/ff6301c8fca217ff17e8329710da5e34fe8b7bafeef060e51286802ae2e9ff25.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f7796e8f31d846d2e38d31d86ec4f3040d7a8143-1143x644.png)\n\nA Play Rate analysis graph from 2017-2018 shows Thresh and Blitzcrank as major outliers in the support role.\n\nNot all support champions exist solely to heal or aid the living. Some exist to trap souls in a lantern so they can torment them for eternity. Thresh was the dark, edgy, evil character that the team used as philosophical inspiration for their new support.\n\n“We looked at Thresh and saw that he actually did increase queue for support when he came out,” Reav3 shares. “He was a support that appealed to fighter players specifically. While he is tanky, he had a lot of mechanics that made him a natural fit for players who like to main fighters.”\n\nBut when the Champions team sets out to create something new, their mission is to push gameplay fantasy into a fresh direction. This new support couldn’t just be another bruisery tank support like Thresh. It needed to have a twist. And it needed to be popular enough to increase support play.\n\nAnd one thing is for sure, nothing is more popular in League of Legends than an assassin.\n\n## More Than a Drowned Man\n\nWhile the gameplay hook might make sense, an assassin doesn’t really fit the typical look and feel for support champs. Why is he using his hunting prowess to help his team? Who exactly is Pyke?\n\n[![03132023_ORIGINSPykeArticle_early_concept_1.jpeg](media/c27b27bd2b77f2534efc2c4316c4909adcfd9528996e2fd6191e032c58902296.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ff6970714fa3104e519173d913e45e51317df711-1600x512.jpg)\n\nEarly pose explorations for Pyke. What a mysterious looking fellow.\n\nIf you’ve read his lore, you’ll know that Pyke was once a fisherman. But he wasn’t just your average rod-and-reel-sippin’-beer kind of angler. He was a bit of a maniac. Pyke specialized in fishing for monster fish. And to catch these monsters, he would launch himself off a boat onto the fish and sink harpoons and tow hooks into its flesh. You know, chill shit.\n\n“He was basically a jaull fisher, a blue-collar guy, dockworker-type who would go out on these boats,” Reav3 says. “Like somebody on Deadliest Catch with an extremely dangerous job, except way deadlier because it’s Bilgewater. He also got paid a lot. But not as much as the captains running these fishing companies.”\n\nWorkplace safety and good working conditions weren’t exactly priorities when Pyke was fishing. The only thing that mattered to these captains was hauling in a fish and bringing back a paycheck. And Pyke was more than happy to oblige. Until one day when Pyke and his crew were out hunting jaull-fish.\n\nIn case you’re not well-versed on the deep-sea ecosystems of Runeterra, jaull-fish are massive creatures known for the valuable sapphilite sacs that grow in their mouths. Sapphilite is a glowing blue substance that’s used to create different kinds of magical distillations.\n\n[![03132023_ORIGINSPykeArticle_jaull_fish.png](media/07fd959fbc3ccb3fee5d47c6fcd857a3cb19d9bd3690a68b0ba07aa5972d55a3.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f365aca175dc95036f2ba84dcc726be4096d7112-1000x557.png)\n\nA jaull-fish in the deep. Pyke included for scale…or food.\n\nPyke was one of the few fishermen brazen enough to try and harvest that sapphilite from a live jaull-fish. But this particular jaull-fish would be no ordinary hunt for Pyke. This one would swallow him whole. And his crew would cut his safety line and leave him in the belly of the beast rather than attempt a rescue and risk their own lives.\n\nIt’s unclear exactly how Pyke survived being swallowed by a jaull-fish, or moreover, *if* he survived. Because when he emerged, Pyke was no longer a man. He was an apex predator—a phantom who stalked his prey from stealth. A ghost with a grudge. And a list.\n\nAt the top of his list? The captain and crew of the ship who left him to die. And after that? Well, let’s just say Pyke’s list always has fresh ink.\n\n[![03132023_ORIGINSPykeArticle_ezgifcom-optimize.gif](media/139a272b51a5dfbe4617e8e73025e7b66cf411ae1589032df84917b71044aef2.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/52392901ebbec89ef82272f923e90ff1de821e86-1250x703.gif)\n\nIterations on Pyke’s splash art (hitlist included) by artist, Victor Maury.\n\n“Pyke’s original writer, Matthew Dunn, was really interested in the idea of Pyke going on this revenge rampage that causes him to lose more and more of his humanity,” says Conor “fizzNchips” Sheehy, narrative writer for Pyke’s expanded lore in Legends of Runeterra. “The reasoning for people appearing on his list became more and more tenuous. The list became a reflection of who he’d become rather than the wrongs that had been done against him. It became a reflection of his murderous nature.”\n\nBut what should a murderous, may-or-may-not-be-dead-himself, monster fisher look like?\n\n“If we stuck too closely to his drowned man identity, it would be hard to not make him appear as some kind of zombie with green skin,” explains art director Larry “TheBravoRay” Ray. “Plus, dead typically represents a lack of agility and speed. So we had to figure out what we were trying to say visually without context. I think there were a lot of challenges with that.”\n\n[![03132023_ORIGINSPykeArticle_header_in-line.jpeg](media/cdbe0f3e6e6ea7f5957e810003e1d4f00e6d2a48f046c5d09c0fe81b02755fbf.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/99bb62728ce3373a738ae766bd67c491b599d45e-1600x1030.jpg)\n\nIt wasn’t until character artist Victor Maury took a pass at creating the detailed paintover illustration (above) that the team began to have confidence in the visual direction Pyke was headed. But there were still a few final details that needed ironing out.\n\n“Another big topic of discussion was Pyke’s hair,” TheBravoRay adds. “We had him bald, we had him with cornrows, with dreadlocks, stuff like that. So we partnered with one of our engineers, Joshua Parker, and Riot Noir (Author’s Note: Riot Noir is a Riot Identity Group that brings Black Rioters together across the company) to explore some of these ideas. We knew that just because we had a target identity for Pyke, that didn’t mean we had to embrace stereotypical hairstyles.”\n\n[![03132023_ORIGINSPykeArticle_hair_styles.jpeg](media/c013d58fa8e78d705abccb137ac4745527e7ef6ec697ffd8178131019d74910a.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1d02e65c2041876336497bc60016d1b54591408d-1600x618.jpg)\n\nAn exploration of different hairstyles for Pyke as the team got closer to a final look.\n\nAs Pyke began to resemble the all-around badassery that is his character fantasy, the team knew he needed abilities lethal enough to match his murderous nature. So they got to work on giving Pyke a kit that would empower him to transform enemy champions into chum.\n\n## Death by Design\n\n“Early on, we tossed around a lot of gameplay fantasies to help make support more appealing,” EndlessPillows says. “There were quite a few ideas that we loved, but we ended up getting really excited and passionate about a concept that we originally called thief support. And one of the first things we knew he needed was stealth.”\n\n[![03132023_ORIGINSPykeArticle_assassin_ideation.jpeg](media/002606329b8ce484ad3b64be451a795a2f2591450138d3a431eb84abd5792be3.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/bc4d27a56e43d4feac68c182a11ee785ea324a84-1600x1215.jpg)\n\nVery early concepts for Pyke show the different styles and themes the team explored before landing on “thief support” later.\n\nStealth was a mechanic that hadn’t seen much play in bot lane at the time. So the team took that idea and ran with it for Pyke’s W, Ghostwater Dive, which they used to help him create openings for other—*deadlier*—abilities.\n\n“It basically came down to the fact that players just need a moment to feel like an assassin,” EndlessPillows adds. “If there is some point in the kit where they get to nearly guarantee a kill on somebody, it would meet that goal. And that’s kind of how we thought about Pyke’s ultimate. It helped satisfy the bloodlust of players who didn’t want to play support.”\n\nPyke’s ult, Death From Below, quickly became a focal point in his kit and helped round out his assassin gameplay fantasy. At first, the ult didn’t have a reset on kill, but the team knew a true assassin should be able to secure more than one kill in a teamfight.\n\nSo the rest of his kit was centered around the fact that Pyke would treat the enemy team like giant fish at sea—springing himself from target to target and fileting executing them one by one. And he’d use some fitting tools to help.\n\n“Pyke’s original concept artist, Chris Campbell, had the idea to give Pyke this crazy fish hook thing. And at the time, he didn’t have a hook mechanic in his kit. We thought it looked awesome, but we also thought it would make players assume that Pyke would just hook people towards him. So we iterated away from that and eventually landed on his harpoon. And then we ended up using the harpoon for a kind of hook mechanic anyway,” EndlessPillows chuckles.\n\n[![03132023_ORIGINSPykeArticle_weapon_ideation.jpeg](media/cb4a179dc82ce68107668ca8cc273500a0f61c57a4b66383c38cde0bebfdafcd.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3ce79cae5b6b8cf119a28e81c470a08c52844ee8-1600x1512.jpg)\n\nEarly ideations for Pyke’s main weapon. Sheesh. How edgy.\n\nEarlier versions of Pyke’s Q not only pulled units to him, but it also rooted them in place afterwards. In early playtests the team realized if Pyke was going to have stealth, a dash with an AOE stun, and an ult that could chain kills together, giving Pyke an instant grab, Blitzcrank-style (fish)hook would make him much too strong.\n\n[![03132023_ORIGINSPykeArticle_Q_ability_ideation.jpeg](media/978545be303a28167511fceb704f66ec4404dcf24d0aa548101c9bbb6f2c61a1.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f62e4829b2a8d03d0aebf428fdbad95f3064fd43-1600x699.jpg)\n\nOriginal concepts for Pyke’s stealth and hook abilities before Bone Skewer.\n\nSo the design team needed to come up with a way to help Pyke live up to his murderous fisherman fantasy without making his opponents in lane too salty. Pyke’s Q needed to be less of an instant win button and more of a source for skill expression.\n\n“We found this great mechanic where Pyke could charge up his harpoon like a Vi Q and it’s always a fixed distance instead of pulling directly to himself,” EndlessPillow explains. “Having it go a fixed distance made it less of a death sentence compared to a Blitz hook, but it also let you do cool things in melee range like flip people behind you or even over a wall if you were up against it.”\n\n[![03132023_ORIGINSPykeArticle_Q_ideation_2.jpeg](media/71a8efecac0d84131cb7aee374b1ad429dac782cc698b6863599e705359b5c1a.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2531ee1f3275a56cea03e18197e40981733548f7-1600x816.jpg)\n\nPyke’s Harpoon replaces the giant hook in later concepts for his Q.\n\nSo if Pyke can basically set up his own kills and also execute them, there was still a big question to be answered: Uhh, how is this a support champ again?\n\n“We were really nervous about adding a support character that could easily kill players. This was before things like Brand support and the carry support meta,” EndlessPillows recalls. “We were also worried about the social aspect of it. What is your ADC going to think when you’re literally in there trying to steal kills?”\n\nBesides just having a sweet K/D/A to brag about, getting kills also means players are able to make more of the shiny stuff. Gold. So if Pyke was meant to go on murderous rampages, the team knew they’d have to find a way for the ADC to get paid.\n\n“That’s where Pyke’s gold-sharing stuff came from as a social release valve of sorts,” EndlessPillows explains. “Whatever resources you would have got from that kill, you’ll get anyway. Pyke got a triple kill, but Vayne feels fine because she has 600g in her bag as well.”\n\n## The Sound of Submersion\n\nIf you’ve played against Pyke, you know there’s no scarier moment than when he disappears in front of you and you hear the blood-curdling sound alert that signals you’re within his ult’s execute range. Uh oh…\n\nThat “uh oh” moment is something the sound team took very seriously when creating Pyke’s audio suite. And for many players, Pyke’s sound effects are among the most iconic in all of League.\n\n“In the early stages of a project, we typically partner with design, narrative, and art to discuss how we can make the experience really shine,” explains manager of sound design, Brandon “Riot Sound Bear” Reader. “It’s an intimate exploration and something that’s really unique to what we do.”\n\nOnce the team has a clear heading, they begin collecting and capturing a whole catalog of sounds that they think will fit the character. In the case of Pyke, they spent hours capturing sounds in a pool and manipulating the sound of an instrument aptly named, [the waterphone](https://www.youtube.com/watch?v=foSJstDFDfg).\n\n*Bryan Higa and the sound team showing how they captured some of Pyke’s audio.*\n\n“Once we have all the sounds we want, we create our own narrative experience through audio,” Riot Sound Bear adds. “Pyke’s sound designer, Bryan Higa, built this sonic story of a person who was getting drunk at a tavern. He was walking out of this tavern onto a pier, onto the docks. And as he’s walking, he sees something in the water. Then all of a sudden a person leaps from the water, attacks the drunk guy, and pulls him back into the depths, submerging him.”\n\nThat feeling of being quickly pulled under is what the team focused on for Pyke. They aimed to build tension and fear for everyone near Pyke’s end of the pool.\n\n“You know when he’s getting close to you. It’s supposed to feel scary,” Riot Sound Bear smirks. “It’s a horrific feeling that somebody is going to come out and get you. It’s the feeling of being submerged in surround sound.”\n\n[![03132023_ORIGINSPykeArticle_final_image.jpeg](media/cb607ebce251478ca03d9cb670413ad4b063018eabb54afdb85ca0156f537a54.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a60d4bac146c48027ba63edb44feaef0d0d4b719-1600x900.jpg)", "excerpt": "“Thalassophobia: The persistent and intense fear of deep bodies of water.” \n\nIf you don’t have a healthy fear of the ocean, well, you probably should. But don’t fear the possibility of drowning or", "readingMinutes": 19, "images": [{"src": "media/df39c51057b8ca5f632c0cefd2ac9a50d1b30b33a0bca37a9100c7ff30453520.webp", "alt": "ORIGINS: Pyke"}, {"src": "media/ff6301c8fca217ff17e8329710da5e34fe8b7bafeef060e51286802ae2e9ff25.png", "alt": "03132023_ORIGINSPykeArticle_graph.png"}, {"src": "media/c27b27bd2b77f2534efc2c4316c4909adcfd9528996e2fd6191e032c58902296.jpg", "alt": "03132023_ORIGINSPykeArticle_early_concept_1.jpeg"}, {"src": "media/07fd959fbc3ccb3fee5d47c6fcd857a3cb19d9bd3690a68b0ba07aa5972d55a3.png", "alt": "03132023_ORIGINSPykeArticle_jaull_fish.png"}, {"src": "media/139a272b51a5dfbe4617e8e73025e7b66cf411ae1589032df84917b71044aef2.gif", "alt": "03132023_ORIGINSPykeArticle_ezgifcom-optimize.gif"}, {"src": "media/cdbe0f3e6e6ea7f5957e810003e1d4f00e6d2a48f046c5d09c0fe81b02755fbf.jpg", "alt": "03132023_ORIGINSPykeArticle_header_in-line.jpeg"}, {"src": "media/c013d58fa8e78d705abccb137ac4745527e7ef6ec697ffd8178131019d74910a.jpg", "alt": "03132023_ORIGINSPykeArticle_hair_styles.jpeg"}, {"src": "media/002606329b8ce484ad3b64be451a795a2f2591450138d3a431eb84abd5792be3.jpg", "alt": "03132023_ORIGINSPykeArticle_assassin_ideation.jpeg"}, {"src": "media/cb4a179dc82ce68107668ca8cc273500a0f61c57a4b66383c38cde0bebfdafcd.jpg", "alt": "03132023_ORIGINSPykeArticle_weapon_ideation.jpeg"}, {"src": "media/978545be303a28167511fceb704f66ec4404dcf24d0aa548101c9bbb6f2c61a1.jpg", "alt": "03132023_ORIGINSPykeArticle_Q_ability_ideation.jpeg"}, {"src": "media/71a8efecac0d84131cb7aee374b1ad429dac782cc698b6863599e705359b5c1a.jpg", "alt": "03132023_ORIGINSPykeArticle_Q_ideation_2.jpeg"}, {"src": "media/cb607ebce251478ca03d9cb670413ad4b063018eabb54afdb85ca0156f537a54.jpg", "alt": "03132023_ORIGINSPykeArticle_final_image.jpeg"}], "cover": "media/df39c51057b8ca5f632c0cefd2ac9a50d1b30b33a0bca37a9100c7ff30453520.webp"}, {"id": "0fb9d735f559b1e1e47bc7f0", "title": "Champion Insights: Milio", "summary": "“Awww, so cute!” - You, until the late-game teamfight", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-milio/", "publishedAt": "2023-03-06T16:00:00.000Z", "author": "SMALL BABY PANDA", "markdown": "![Champion Insights: Milio](media/a1dcb848cc9b3e2bba3fd945ee7f5e98fc7049f1ff4fe257a8b0e2e46c653db0.webp)\n\nFor most preteens, an adventure can be as simple as zooming around the neighborhood on your bike with the mandate to be home for dinner, being moody and broody at the local mall, or just checking to see if your duo is home for a little post-school grind. The stakes aren’t all that high.\n\nBut for Milio the stakes couldn’t be higher.\n\nAccompanied by his adorable fire buddies (fuemigos), enormous backpack (furnasita), and natural magical gifts, Milio is setting off on the adventure of a lifetime to restore his family’s honor. And his journey might just change the course of Ixtal’s future.\n\n## Master of the Fire Axiom\n\nAt just 12 years old, Milio has impressive control over the fire axiom, possessing rare abilities for any citizen of [Ixtal](https://universe.leagueoflegends.com/en_US/region/ixtal/), much less someone his age. Where most Ixtali study for a lifetime to understand the Axiomata—an intricate, rigid, near-mathematical system of elemental magic—Milio has an inherent understanding of his powers, and that he must use them for good.\n\nFire as a power source typically calls to mind offensive spells that burn and scorch. But the soft glow of Milio’s healing flame is a far cry from the aggressive fireballs of champions like Brand or Annie.\n\nMilio’s kit is all about using fire to heal and empower his allies, with help from the giant, bulbous fuemigo that’s cozied up in his backpack.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_01Fire_Buddies.jpg](media/d083b5fc9489f489c626f1fc443f23cd890526e0c19f406df24673491e318004.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e37473ae1a99c71d7015f0d167c8690a904cecdd-1020x792.jpg)\n\nMilio can pull smaller fuemigos out of the big one he carries in his backpack.\n\n“The goal was to make an enchanter that felt like they fit in with the rest of the enchanter roster and didn't stick out like a sore thumb. But still someone who brought something new to the role so enchanter players would have a new and interesting gameplay experience,” explains game designer Myles “Riot Emizery” Salholm.\n\nAt first glance Milio is a classic enchanter. He’s smol, cute, and sweet. But he’s a HE. While players have plenty of enchanters to choose from in the game, they’re all ethereal ladies, or girlbosses, or universally beloved cats. Over the years we’ve tried to diversify our [portfolio](https://www.leagueoflegends.com/en-us/news/dev/champion-insights-k-sante/) [of](https://www.leagueoflegends.com/en-us/news/dev/champion-insights-renata-glasc/) [champs](https://www.leagueoflegends.com/en-us/news/game-updates/champion-insights-zeri/) to appeal to everyone. Plus we’ve long heard your requests for a new male enchanter. Even though Taric wields the supreme power of Targon with sparkle and finesse, it’s high time for another lad on the roster.\n\nAnd there’s an obvious difference between our existing enchanters and Milio: he’s 12 years old. The game design team wanted to make sure Milio’s playful, youthful energy was clear in his kit. Beyond locking in spell names like Cozy Campfire and Ultra Mega Fire Kick, there’s a sense of fast-paced exuberance in his playstyle.\n\n“One: he’s high energy. I wanted to try to make it feel like there's a lot of movement and a lot of excitement in his actions. But two is making him feel kind of annoying like a bratty younger brother to some degree. The way that he ends up interacting with you in lane is that he's not going to outright kill you, but he'll keep annoying you until you get so fed up that you try and kill him,” says Riot Emizery.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_02ThrowBuddy.gif](media/61a260e1e1e3b03b96365168baa041236e68027d820977e599018cac06ef461e.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d98f1b8a719981561f327c8111c47a0e49fc13be-1168x716.gif)\n\nAn early exploration for Milio’s Q animation (which is now a kick.) No fuemigos were harmed during the making of this champion.\n\nLike the classic enchanter he is, Milio is always looking for ways to help his teammates secure kills or get out of sticky situations. He increases ally damage with his passive, kicks fuemigos (don’t worry, they love it) at his enemies, and heals allies and extends their attack range with a campfire zone.\n\nHe also has a two-charge shield that both shields and increases move speed for allies or himself. And his ultimate is a wash of purifying flames, cleansing crowd control effects and healing all nearby allies. Amumu’s tears are falling a little bit harder these days.\n\n“It's basically Cleanse the Summoner spell on steroids,” laughs Riot Emizery.\n\nBut interestingly enough, Milio didn’t always have a heal in his kit outside of his ultimate.\n\n“Milio’s W originally gave attack speed and made him this hyper-aggressive enchanter, so your ally basically needed to go in every time that you pressed W. But based off of the storyline that we were giving him, his personality, and also what enchanter players prefer, I felt like there was a heal that was missing outside of his ultimate,” explains Riot Emizery.\n\n“Because his ultimate is so powerful, it's also a long cooldown. So if you're only healing with your ultimate, you're rarely ever healing throughout the game. So we ended up putting heal into his campfire move, but I wrestled for a long time on whether to keep the heal, get rid of the attack speed, keep both, or do something else entirely. Ultimately we made a shot call that because he is using healing fire and protective flames, it makes sense for him to have a heal over time.”\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_03AbilitiesExploration.jpg](media/f5fb06b25fe61b8067fbb756bb5702d01da10ad55b2f2ef40fb926e97aaa3389.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/09e85c878665372e06639baecb361bf6132ad83a-1800x1189.jpg)\n\nAnd for any ADC mains out there reading this, fear not; There *are* ways to counter this formidable tween.\n\nMilio’s range extension buffs, for instance, can seem a little scary, but countering an aggressive lane like Milio and Cait or Kog’Maw with a hook champ like Thresh or Pyke can be really effective. And just like a pesky Soraka, if Milio is hanging out in the back of a teamfight and the enemy team just won’t die, target him in the back and get rid of the enemy’s sustain.\n\nJust don’t let this kid venture too far into the late game. “He scales really powerfully, kind of like Sona,” says Riot Emizery. “In the late game he's gonna do a lot of healing that will make his team really strong, so don't let him get to that point.”\n\n## Beyond the Walls of Ixaocan\n\nWhere most of Ixtal sees magic as intricate and precise, Milio’s innate gifts come from his unique view of the world. He’s earnest, heroic, and capital-g Good. Having grown up in a remote village far from the capital city of Ixaocan, his entire world is very different from that of someone like Qiyana, who sits at the top of Ixtal’s social hierarchy.\n\nWhen creating Milio’s character and story, narrative writer Elyse “Riot apothecarie” Lemoine wanted to ensure that his warmth and ease with magic were pillars of his personality.\n\n“He's very playful, very fun, and very intuitive, which is the opposite of the way Ixtal does magic. To them, elemental magic is science and it's approached in a very rigid and formulaic way. Milio has a little bit more flexibility because he tends to just figure things out on his own rather than sticking to a rigid formula. He just has no patience for learning,” Riot apothecarie laughs.\n\n“Milio is like an unwitting genius. He's really smart. He's discovered a new axiom—a whole new magic ability that no one else has. He just has no idea that he's smart because he intuits stuff and then is like, ‘Oh that's easy.’”\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_04IxtalSupport.jpg](media/843ed150a950cd5ca74c4134ea559110825f35691e7dc1954403cfe17ab8ed74.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f067b04c5af09f19c9d28c699a043a1f05f31808-1800x756.jpg)\n\nMilio’s grandmother, Lupé, sees her grandson’s effortless brilliance as a gateway for him to become Yun Tal, masters of elemental magic and Ixtal’s ruling caste. Once Yun Tal herself but now exiled, Milio’s grandmother desperately hopes he will restore his family’s former honor and station. And Milio will do everything he can for his *omele*, because she knows best…right?\n\n“Having Milio be this optimistic, fun-loving 12-year-old who sees the good in everything really positions him as someone who can break that cycle of generational trauma and help heal his family,” says Riot apothecarie.\n\nTo become Yun Tal, students of elemental magic must undergo a test before the Vidalion, a massive, magical loom that weaves robes for Ixtal’s highest caste. Brought in believing their magical abilities will be tested, those who face the Vidalion are [shown a bitter truth](https://universe.leagueoflegends.com/en_US/story/axiomata/) that’s been hidden from the Ixtali people: Ixtal is not the only civilization that survived the Rune Wars and Runeterra beyond Ixtal’s borders is no unpopulated wasteland. How you react to this truth is the ultimate test.\n\nIf you pass, the Vidalion will weave a unique set of magic-infused robes that mark you as an elemental master.\n\nFor Milio, family is everything—he’d go to the ends of Runeterra to make his family proud.\n\nSo he’s now preparing to face the Vidalion. And if he succeeds, he’d unseat Qiyana as the youngest person ever to join the Yun Tal.\n\nUntil then, Milio spends his time writing letters home about his (*slightly* exaggerated) experiences and talking with his fuemigos, even though they can’t actually talk back. Although he is far from his small village, his heart is never far from his family.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_08MilioSplash.jpg](media/2fa63bcb4e198d3102dc97e8f9d92f48936897cb0db47eac531dc6dabe64df03.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1275b7e5c419b3bcccc236568286cb2cbe1c6042-1400x788.jpg)\n\nMilio’s youth and heroism are pillars of his champion theme, as are his Ixtali origins, inspired by Latin American cultures. Though Ixtal draws inspiration from countries in Latin America, it was important to composer J.D. “Riot Zibarr0” Spears that the theme sounded unique to Runeterra.\n\n“I knew I wanted to bring in some really unique and less common instruments from those regions. Anytime I'm doing something like that, I feel like I need to lean on people who are experts in those areas,” says Riot Zibarr0.\n\nAnd experts he found. When it came time to record, the music team brought in legendary musicians to add their own flair and cultural twist to the track, including percussionist Alex Acuña and flautist Pedro Eustache (yes, you heard right, [Flute Guy](https://youtu.be/rHAUcP4PZjo?t=59) from the Game Awards).\n\n“We knocked out all of the written material pretty quickly at the sessions. But ultimately, the musicians brought so much of their own performance… they brought so much character to the piece that did not exist before,” says Riot Zibarr0. “These are world-class musicians, and they became a part of Milio’s theme in a way that I could not have planned for. Aside from the core melodic material, a lot of what you hear on the track are things that they did in the moment.”\n\nThough Milio’s musical theme begins with a soft, meandering melody, by the end it has built into a bold chorus of instruments bursting with power and fearlessness. Just like our sweet boy.\n\n## The Gentle Flame\n\nThe art team spent a lot of time figuring out how to differentiate Milio from League’s other fire-based champions. Since Milio is a healer and a helper, they wanted to make sure his spells looked warm and cozy instead of harsh and aggressive.\n\n“We said ‘How do we convey a character that's not aggressive and has this kind of healing, soft flame?’” recalls concept artist Nancy “Sojyoo” Kim. “We decided to use a lot of round shapes and made sure that there weren’t any spikes or things like that coming out of him.”\n\nMilio’s fuemigos are round and bouncy, with a soft glow. And his visual effects feel more like gentle, warming flames than angry, fiery bursts of energy.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_11FireBuddies.jpg](media/f5fdc4db3ecb8dbdec0ff7141014332bcdc6ca4fb429e2ca15dbb4e5f7d5c422.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b2889b744dd2574fcfe236cf939335e00ed1e9b6-1107x792.jpg)\n\nSince Milio is one of League’s few child champions, his art development came with some interesting challenges. While we all might think we know what a 12 year old looks like, there’s a lot of hidden precision that goes into drawing age accurately.\n\n“​​Honing in on Milio’s age proved to be a process in itself. Even if you change the slightest features, a character can look a lot older,” explains Sojyoo. “So trying to find the exact age we were going for was a little difficult. We could show somebody a portrait and they'd be like, ‘Oh, I think they're 13’ and another person might say they look 11 or 14. It’s dependent on their own experiences with children.”\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_12Portrait.jpg](media/af75de91c2f3407c53ebe78d97d7f9c1eb2c209b7f19aa82b2cdb30f73a5c59f.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/bc6a6b88ce896bd5e6162573f6cf655e3424905d-1800x1245.jpg)\n\nThe team debated over subtle changes in Milio’s hair.\n\nOn top of creating a literal child, the Champions team wanted to bring another dimension of representation into Milio’s character.\n\nFrom the beginning of development, a major goal was to create a male enchanter that brought Latino representation to League. In champion development and worldbuilding, there’s a delicate balance to strike between relatable, authentic representation for players and creating something unique and fantastical for Runeterra.\n\nFor Milio, Riot Unidos (our Employee Resource Group for Latin-American Rioters) was brought in early to participate in playtests and give feedback on everything from his name to dance selection, to voiceover lines. On the art side of things, Sojyoo worked closely with Riot Unidos to gather feedback on each new version of Milio’s concept art. When she had a new piece ready, she’d share it to gather feedback and personal experiences to guide everything from his nose shape to the color of his clothing to how curly his hair texture should be.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_13MilioClothing.jpg](media/85088eb50348718188250ad891ab955f99b97fe7053313d55416d212e3ead489.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/af2b153e08185e59863e843267ee7b67c3b3ea97-1800x1354.jpg)\n\nFor QA engineer Riot Pehrek, getting involved with Milio’s feedback process through Riot Unidos was a bit of a side project—until he made his way onto the champions team.\n\n“They were asking for people from Riot Unidos to give feedback for a new champion who had no name at the time. So I decided to help out and I got very passionate and involved in the character,” Riot Pehrek says. “Eventually I applied to the Champions team and when I was interviewing, I told them ‘I would love to work on Milio. I'm already involved on the project and I would love to actually see him through.’”\n\nNow, as Milio’s QA engineer, he’s been in charge of protecting the player experience for Milio throughout the development process, finding bugs and issues and finding the right people to work on them. And of course he and the rest of the team make sure Riot Unidos is involved in every step of the dev process.\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_14SoccerJoke.gif](media/3df1ee571d30076ad4be2350537128e434b3d897a349e72e64c2eae28caacdb3.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/628d103cd28eb032fe6a17653def0a79ed7679c0-400x319.gif)\n\nRiot Pehrek suggested making Milio’s joke soccer-related. Football is life.\n\n“I really hope that there’s a good balance between players that enjoy playing a support character and players who enjoy playing a character for their representation,” says Riot Pehrek.\n\n“I want there to be those players that when they play Milio they think ‘he sounds just like me when I'm talking to my grandma.’ Or when I'm going through this troublesome part of my life, his dialogue reflects how I'm trying to be brave in front of the strange new things that I'm gonna have to challenge and face.”\n\n[![03062023_MILI23ChampionInsightsArticleLIVE_15JiggleBuddy.gif](media/5783c4a0f0ba67bd069425f5dbfda04aa641fb5faecef8f40eedcb768492432c.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/753cc881a3f695e80c50f00ad42f9162f7ac91e9-746x694.gif)", "excerpt": "For most preteens, an adventure can be as simple as zooming around the neighborhood on your bike with the mandate to be home for dinner, being moody and broody at the local mall, or just checking t", "readingMinutes": 19, "images": [{"src": "media/a1dcb848cc9b3e2bba3fd945ee7f5e98fc7049f1ff4fe257a8b0e2e46c653db0.webp", "alt": "Champion Insights: Milio"}, {"src": "media/d083b5fc9489f489c626f1fc443f23cd890526e0c19f406df24673491e318004.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_01Fire_Buddies.jpg"}, {"src": "media/61a260e1e1e3b03b96365168baa041236e68027d820977e599018cac06ef461e.gif", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_02ThrowBuddy.gif"}, {"src": "media/f5fb06b25fe61b8067fbb756bb5702d01da10ad55b2f2ef40fb926e97aaa3389.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_03AbilitiesExploration.jpg"}, {"src": "media/843ed150a950cd5ca74c4134ea559110825f35691e7dc1954403cfe17ab8ed74.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_04IxtalSupport.jpg"}, {"src": "media/2fa63bcb4e198d3102dc97e8f9d92f48936897cb0db47eac531dc6dabe64df03.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_08MilioSplash.jpg"}, {"src": "media/f5fdc4db3ecb8dbdec0ff7141014332bcdc6ca4fb429e2ca15dbb4e5f7d5c422.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_11FireBuddies.jpg"}, {"src": "media/af75de91c2f3407c53ebe78d97d7f9c1eb2c209b7f19aa82b2cdb30f73a5c59f.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_12Portrait.jpg"}, {"src": "media/85088eb50348718188250ad891ab955f99b97fe7053313d55416d212e3ead489.jpg", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_13MilioClothing.jpg"}, {"src": "media/3df1ee571d30076ad4be2350537128e434b3d897a349e72e64c2eae28caacdb3.gif", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_14SoccerJoke.gif"}, {"src": "media/5783c4a0f0ba67bd069425f5dbfda04aa641fb5faecef8f40eedcb768492432c.gif", "alt": "03062023_MILI23ChampionInsightsArticleLIVE_15JiggleBuddy.gif"}], "cover": "media/a1dcb848cc9b3e2bba3fd945ee7f5e98fc7049f1ff4fe257a8b0e2e46c653db0.webp"}, {"id": "14b5e4c716e6596f79eadb55", "title": "TL;DW: Champions, Lore, Modes & More Dev Diary", "summary": "A short rundown of updates from Riot Brightmoon and Meddler.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/tl-dw-champions-lore-modes-more-dev-diary/", "publishedAt": "2023-02-16T17:00:00.000Z", "author": "Riot Brightmoon, Meddler", "markdown": "![TL;DW: Champions, Lore, Modes & More Dev Diary](media/0b18b0b20f9b8e904b047650dcc45095ad9b1040238f8a6743fbc9714c8f2593.webp)\n\nHey folks, Riot Brightmoon and Meddler here to follow-up on our [video from January](https://twitter.com/LeagueOfLegends/status/1614028829823209472). Unlike most /dev blogs we won’t be hitting you with meticulously edited paragraphs and snappy section headers, instead here’s a TL;DW of [today’s follow-up video](https://www.youtube.com/watch?v=ghr26eNTiz0) in case text is more your speed:\n\n- We’re doing more lower production videos featuring different League devs to have timely conversations.\n- We’re ramping up on updates to older champions and game modes which may slow new champion releases.\n- We’re trying to do Art & Sustainability Updates (ASUs) faster and are working on Lee Sin and Teemo.\n\n[![BaseLeeSinASU_Renders_WEB.jpg](media/8a99fff78988c901f9f2506ef6dc07f50aaa084eebd877308b21770c0ba97e5c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cca69e72258068c25c2e8ea282f1f73f8e78721f-1291x800.jpg)\n\nEarly concept of Lee Sin’s ASU. This is not yet final.\n\n[![TeemoASU_Renders_WEB.jpg](media/283282bd913ecadca3b1fc39e6f64e1d87a93f4f2b5e305e5e704886bab9e8c6.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/37a0d821a1a0f1e3e2a377916ff8ec89b05f9bc9-1291x800.jpg)\n\nEarly concept of Teemo’s ASU. This is not yet final.\n\n- We’re updating our [champion pricing model](https://leagueoflegends.com/en-us/news/game-updates/champion-pricing-update/), you can read more in today’s /dev blog.\n- We’re figuring out how to make our lore and storytelling consistent across Runeterra. More on this later.\n- We released a /dev blog on the [State of Modes](https://leagueoflegends.com/en-us/news/dev/dev-state-of-modes-2023/).\n\n[![modepicweb.png](media/68c2a4e11e5ea169c507d2e13a5cb252d3d5b6f71d8a5773b2b56224cbf64b16.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ab6a9788295612b236788d356d6a6aef81cb63d4-1318x540.png)\n\nPreview of our new 2v2v2v2 mode.\n\n- We’re bringing over some skins debuted in Wild Rift, including Star Guardian Seraphine, Redeemed Star Guardian Xayah, and Redeemed Star Guardian Rakan. No timelines yet, but we’ll let you know.\n- We’re updating some older splash art, starting with Rugged Garen.\n\n[![Rugged_Garen_WIP.jpg](media/41bdba2b54ee4219c0537c30f2549001408941119bbda30820efb6d198dfcb74.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e76b32a76abb9276b5d1650a9d4b067586fea71a-1422x800.jpg)\n\nNon-final version of Rugged Garen’s updated splash art.\n\n- Clash is delayed because of the security breach, but should be returning in March.\n- March will be our first Clash in Southeast Asia—more info for you all soon!\n- ARAM Clash will be making a return.\n- We’re using cloud servers to help reduce the frequency you see login queues.\n- Over the next few months players in Southeast Asia should see lower ping as we add more servers.\n- We’re upgrading our server hardware in EUNE and Korea to improve overall performance sometime in the middle of the year.\n\nThat’s it for us for now, please let us know if having a written TL;DW is useful and we’ll try to include them in the future! GLHF and we’ll see you on the Rift.", "excerpt": "Hey folks, Riot Brightmoon and Meddler here to follow-up on our  . Unlike most /dev blogs we won’t be hitting you with meticulously edited paragraphs and snappy section headers, instead here’s a TL", "readingMinutes": 4, "images": [{"src": "media/0b18b0b20f9b8e904b047650dcc45095ad9b1040238f8a6743fbc9714c8f2593.webp", "alt": "TL;DW: Champions, Lore, Modes & More Dev Diary"}, {"src": "media/8a99fff78988c901f9f2506ef6dc07f50aaa084eebd877308b21770c0ba97e5c.jpg", "alt": "BaseLeeSinASU_Renders_WEB.jpg"}, {"src": "media/283282bd913ecadca3b1fc39e6f64e1d87a93f4f2b5e305e5e704886bab9e8c6.jpg", "alt": "TeemoASU_Renders_WEB.jpg"}, {"src": "media/68c2a4e11e5ea169c507d2e13a5cb252d3d5b6f71d8a5773b2b56224cbf64b16.png", "alt": "modepicweb.png"}, {"src": "media/41bdba2b54ee4219c0537c30f2549001408941119bbda30820efb6d198dfcb74.jpg", "alt": "Rugged_Garen_WIP.jpg"}], "cover": "media/0b18b0b20f9b8e904b047650dcc45095ad9b1040238f8a6743fbc9714c8f2593.webp"}, {"id": "e47c7a00f04d5aa99f176960", "title": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök", "summary": "Lead Character Concept Artist Dela Longfish discusses the designs of Freya, Thor, and Angrboda. ", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2023/01/26/from-concept-art-to-cosplay-creating-iconic-characters-for-god-of-war-ragnarok/", "publishedAt": "2023-01-26T10:00:33-08:00", "author": "", "markdown": "![From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök](media/0f4fa80f99a524f23bba248a0f36d1a9f2b310634c000350bf322207045ecb53.jpg)\n\nWith the release of God of War (2018), we were absolutely amazed by how many people wanted to cosplay characters from the game – even those we didn’t have the chance to make guides for.\n\nWith the God of War Ragnarök cosplay guides, we wanted to make as many as we could to help provide resources for all our fans who want to take on creating our characters.\n\nWe’re happy to share that we’ve added ten additional characters from Lúnda’s workshops notes to the God of War Ragnarök cosplay page: Freya, Thor, Angrboda, Brok & Sindri, Týr, Thrúd, Heimdall, Odin, and Gná.\n\nEach guide contains character renders, close-ups of detailed pieces, and shots of their weapons/accessories. You’ll also find in the pages additional lore details handcrafted by our writers here at Santa Monica Studio and more sketches from *B is for Boy* artist Romina Tempest.\n\nAfter you’ve taken a look at the new guides, make sure you check out the interview with Lead Character Artists Dela Longfish below on how the team approached creating the designs for Freya, Thor, and Angrboda.\n\n## Community cosplay partners\n\nIn addition to the new guides, we’ve once again partnered with members of our extremely talented cosplay community to provide resources and tips on creating three of the characters from the updated guides – Freya, Angrboda, and Thor.\n\n### Freya – Ibelinn Cosplay\n\n[![](media/a82133f9147f3665fca43a9339037d5adc7c482850a8632da5f3a3b66c8076fa.jpg)](https://live.staticflickr.com/65535/52639629778_355ed694c2_h.jpg)\n\n*Cosplay Credit: Ibelinn Cosplay | Photo Credit: Katrix\\_Media*\n\nRepresenting Freya is none other than Ibelinn Cosplay, who did an enchanting Witch of the Wilds back when God of War (2018) released. We’re thrilled to partner with her to create Freya’s updated design in God of War Ragnarök.\n\nIbelinn has put together an expert guide on how to plan a cosplay, along with her how-to videos on creating the former Valkyrie Queen – you can see them [here](https://www.playstation.com/en-us/god-of-war/community/).\n\n### Angrboda – Kizuki Cosplay\n\n[![](media/3d62e304bd526289c06d93caefcec97a04ec541a17f0f804936ecd0212a152cb.jpg)](https://live.staticflickr.com/65535/52638637437_496165464a_h.jpg)\n\n*Cosplay Credit: Kizuki Cosplay*\n\nTo embody the Giantess of Ironwood, we’ve partnered with the wonderful Kizuki Cosplay, who brings a wealth of experience crafting intricate and detailed designs.\n\nBringing her expert and versatile skills to the creation of her cosplay, Kizuki has created a guide on making a wig for Angrboda, as well as tips on how she approached the other pieces of the costume, which you can see [here](https://www.playstation.com/en-us/god-of-war/community/).\n\n### Thor – The Ronin Cosplay\n\n[![](media/455c70f03d36f6dceb4ef33859cb93078bf2e70919d620c8a3e5562567366f3f.jpg)](https://live.staticflickr.com/65535/52639409544_5207c05d49_h.jpg)\n\n*Cosplay Credit: The Ronin Cosplay*\n\nTo become the God of Thunder, we partnered with The Ronin Cosplay, who has been a longtime pillar of the God of War cosplay community. From Kratos to Sigrun, Ronin has taken on some of the most complex character designs in our games and made them look absolutely incredible.\n\nRonin has provided us with his expertise in creating the intricate leather pieces for Thor’s armor in his guide, as well as insights into his process with his tips video – check them out [here](https://www.playstation.com/en-us/god-of-war/community/).\n\n## Interview with Lead Character Artist Dela Longfish\n\nTo provide insights into the three characters we’ve partnered with community cosplayers to make, we’ve sat down with Dela Longfish, a lead character artist on God of War Ragnarök, to discuss how these designs came to be.\n\n### Freya\n\n[![](media/d64febf3901610f6c170e2005c471e1f250595cb660167ddddc9148e6d839476.jpg)](https://live.staticflickr.com/65535/52639154256_7a1a6d29ee_h.jpg)\n\n*God of War Ragnarök – Freya Cosplay Guide Pg. 3*\n\n**Grace Orlady: At the end of the last game, Freya undergoes a traumatic event with the death of her son – changing her from friend to hunter, vowing vengeance on Kratos. How did the team want to go about changing Freya’s visual look to represent her emotional state at the start of God of War Ragnarök?**\n\n**Dela Longfish:** After the events of the last game, we knew we would be seeing a completely different side of Freya in God of War Ragnarök.\n\nWhile we wanted to retain the iconic look of her design, we added a light armor under her clothing that is visible around her neck and shoulders. Not only did this show she’s ready for battle, but also using the armor in this way also allowed to make the costume darker to reflect the grief and rage she has because of the loss of her son.\n\nElements of her appearance were designed to look unkempt as we imagined she has spent sleepless days and nights in her endless pursuit of Kratos. Covered in a layer of dirt to show her rough living, we also smudged the kohl around her eyes intentionally made to resemble tears to show that behind all that anger there’s a layer of sadness she can’t escape from.\n\n[![](media/8c2b29e26a657e9fafc2e0dfd08e0d3fa74cf63fead375d1155a9fbd806e821e.jpg)](https://live.staticflickr.com/65535/52638637287_4937486706_h.jpg)\n\n*God of War Ragnarök – Freya Cosplay Guide Pg. 4*\n\n**When we first meet Freya again, she is living on Midgard in the heights of Fimbulwinter. Did the harsh climate influence any aspects of her design?**\n\nWe always imagined Gods have a stronger resilience to the cold than the humans in Midgard. With her single motivation to kill Kratos she has neglected any other mortal needs. The flame of anger she feels towards Kratos is all she needs to keep her warm while on the hunt.\n\n[![](media/d7d4b26f09192e8f00f0072c0118ab22829e9ab427bc63bb461fe3b45b5b2291.jpg)](https://live.staticflickr.com/65535/52639630108_40ed57f5bb_h.jpg)\n\n*Freya Concept Art by Shan Qiao and Rafael Grassetti*\n\n**Which elements of Freya’s original look as the Witch of the Wilds did the team feel were important to maintain across this next installment?**\n\nWe wanted this version of her costume to be an evolution from when we had last seen her. That meant that we retained a lot of the elements from her God of War (2018) look while building on top and around them. Players will recognize elements like the gold disc around her waist which was always a nod back to her royal position in Vanaheim.\n\nSmaller elements of her costume like the weaving and shawl also remain consistent in her God of War Ragnarök design.\n\n**We also know that Freya was once the Valkyrie Queen. With her ability to fight somewhat restored at the beginning of the game as she pursues Kratos and Atreus, are there any particular visual references to her past as a warrior incorporated into her updated look?**\n\nIn the beginning of God of War Ragnarök, we see firsthand her skill in fighting that made her the Queen of the Valkyries. Her ability is quickly evident, wounding Kratos and proving immediately she is equal to him in every way. The increased armor and covering in her design reflects a practical choice for more combat-ready clothing while she pursues Kratos. Not only does she have the leather undershirt now guarding her torso, but she also has additional leathers on her waist to provide additional protection while keeping extremely nimble.\n\nEven using her ability to shapeshift into a falcon to deliver cunning attacks from the air all hint back to her role as the winged queen. You can see the falcon feathers in her hair have been kept in God of War Ragnarök.\n\nWhile her sword was always present in God of War (2018), it was always sheathed on her back. This is the first time we see her draw it and use it to deadly effect. Throughout the game we see more elements from her past as a Vanir leader and Valkyrie return to her design as she reclaims her power and agency back from Odin.\n\n[![](media/b0fc224fe2ada34b875c6de6279d720050a13a6d0410938cef880aa0af4b51c6.jpg)](https://live.staticflickr.com/65535/52639629828_0aaa3c9190_h.jpg)\n\n*God of War Ragnarök – Freya Cosplay Guide Pg. 15*\n\n**Is there any aspect of Freya’s design that you especially want players to notice?**\n\nSome fans will notice elements from Baldur’s costume throughout her designs, such as the Twilight Pendant and the orange warps he wore around his legs that she now wears. These are mementos she carries with her to always remember her son.\n\n### Thor\n\n[![](media/cf7f615546cd7982aaa07b330cf1da3e37f38305a43606c1951a84eafeb41022.jpg)](https://live.staticflickr.com/65535/52639409329_121592d011_h.jpg)\n\n*God of War Ragnarök – Thor Cosplay Guide Pg. 3*\n\n**When Thor’s design was shown after the first God of War Ragnarök trailer, the internet exploded (just a bit) with discussions. Were you expecting our take on Thor to be such a hot topic among gamers?**\n\nIt’s always interesting seeing what catches fire across the internet. With a character like Thor that has so many great depictions in pop-culture, people grow a special connection to them. So, in that way it’s understandable a discussion is prompted when a new take on that type of character comes out.\n\nOur hope is to be able to build that same connection between our characters and gamers. For our interpretation, we wanted a design that fit within the visual language of the world we had established in God of War (2018), while also complimenting the story and gameplay the team had in mind.\n\nWe wanted to design a character that embodied a thunderstorm, the concept of pure power coupled with a degree of chaotic unpredictability. As the strongest god in the Norse pantheon, we took inspiration from real world strongmen and powerlifters which gave him a solid build while also reflecting the general time period we reference for the game.\n\n[![](media/d51a0611835b71a10f0a7a1c1ee0b7838b45791329d3b6a2dace98cf64a435a2.jpg)](https://live.staticflickr.com/65535/52639465054_a8bb2da7c1_h.jpg)\n\n*God of War Ragnarök – Thor Cosplay Guide Pg. 5*\n\n**We’ve referenced Thor’s descriptions in the Eddas for a lot of inspiration in his design, was the teams’ visual interpretation of him from the myths pretty defined from the start or did it take a lot of iteration to settle on the final look?**\n\nWe typically start any character design with a wide range of visual exploration. Thor was no different in this case. We had actually started concepts for him back on God of War (2018), but those early explorations were put on pause.\n\nWhen the team began work on God of War Ragnarök, we started re-exploring what he would look like.  The myths were a big inspiration and depicted the God of Thunder as a great warrior, but also someone who was less than heroic at times, even dangerous and reckless in his actions.\n\nWe wanted his look to reflect those aspects and multiple artists did work with that in mind.  As the designs began to evolve and various elements began to resonate with the team our art director Rafael Grassetti did a pass and that is the final design of Thor seen in game.\n\n[![](media/a9938b44b4b05b56940994520b992a80064c9aa40aef4467353fcebf2290cc82.jpg)](https://live.staticflickr.com/65535/52639629638_4df4ed8299_h.jpg)\n\n*Thor Concept Art by Rafael Grassetti*\n\n**Mjölnir is not only an iconic weapon in modern pop culture, but also within the story of our game needs to be a worthy rival to the Leviathan Axe, which is now one of the most iconic God of War weapons. Could you take us through how the team created the Huldra Brothers’ (second) greatest creation?**\n\nThere are so many good interpretations for Mjölnir already in pop culture. For us Thor’s hammer, which he always holds in his left hand, was inspired by the angled look of Norse artifacts and amulets of the time.\n\nArtist Yefim Kligerman designed the hammer for the post credits scene in God of War (2018). Even back then to visually connect these two iconic weapons, Yefim included a runic skill tree etched into the face of the hammer in the same manner we find on the blade of the Leviathan Axe. This way we can see the signature craftmanship of Brok and Sindri in both weapons.\n\n[![](media/70a5c45e7a11ac8d290fc0425089270f21b12310f8157e87cf45b51e11985068.jpg)](https://live.staticflickr.com/65535/52639409294_42da723876_h.jpg)\n\n*God of War Ragnarök – Thor Cosplay Guide Pg. 14*\n\n**Is there any aspect of Thor’s design that you especially want players to notice?**\n\nAlong with making sure we get the overall look we want for any character we also enjoy layering in small hints and design details.  Thor’s goats, Tanngrisnir and Tanngnjostr, make an appearance in the bottom gold carved cap of Thor’s hammer. Keen-eyed players and cosplayers will also notice there are other goat motifs reflected in his design.\n\n[![](media/dc44c92f03b1f2f42450ea524f1890ceb05419ca505f2955d8f1aa58336c3de2.jpg)](https://live.staticflickr.com/65535/52639629803_e9742d69ab_h.jpg)\n\n*God of War Ragnarök – Thor Cosplay Guide Pg. 7*\n\n### Angrboda\n\n[![](media/d98c194f45502d3179c4342b31d2d8b0df1c2871ba36f0120617bd6b44f4092a.jpg)](https://live.staticflickr.com/65535/52639629948_478b295c8c_h.jpg)\n\n*God of War Ragnarök – Angrboda Cosplay Guide Pg. 3*\n\n**While we were able to visit Jötunheim at the end of the last game and saw parts of their culture represented through Faye’s art and the triptychs, Angrboda is the first Giant we meet that is actually from Jötunheim and currently calls it home. What were some of the key elements you wanted to include in her design to show visually how the Giants are unique from the Midgardians and Aesir?**\n\nThe Giants were master artisans and craft folks.  Even though Angrboda has been surviving on her own for so long, we wanted an elegance and beauty reflected in her design that we don’t find in the inhabitants of other Realms.\n\nAs one of the last living Giants, she represents that part of Atreus’s heritage which is something no one else can share with him. Not only does she carry with her the knowledge of her people, but she also physically carried individually carved marbles that contained the souls of the Giants.\n\n[![](media/cfb0572a216ca5d2e094995bd1e49b26bc885ad444ca55184487035474a7a9e0.jpg)](https://live.staticflickr.com/65535/52639700013_d985be2552_h.jpg)\n\n*Angrboda Concept Art by Rafael Grassetti*\n\n**You mentioned Thor’s goats are referenced as motifs in his design, are there any nods to the Norse myths within Angrboda’s clothing?**\n\nAngrboda has a few serpent motifs recurring throughout her design, which was a nod to her being known as the mother of Jörmungandr in the myths. That theme can be seen most evidently in her gold hair accessory which is shaped like a snake, as well as in her brooches, necklace, and various patterns in her clothing.\n\n[![](media/ef47ec4a0b0d31d00b87de81673aa06855e17c3dc82272fe3970ecc604520952.jpg)](https://live.staticflickr.com/65535/52639154266_de6895beda_h.jpg)\n\n*God of War Ragnarök – Angrboda Cosplay Guide Pg. 8*\n\n**Angrboda has some of the most unique tattoos in the game in terms of color and design. Why did the team decide to go in this direction with her ink?**\n\nWith each of the different mythical cultures in the game, the team will look for specific aspects unique to each that set them apart visually. Angroboda’s tattoos were an example of this in that they have a much more organic and natural feel to them than many of the other tattoos you see on other characters. We wanted all aspects of her design, including her tattoos, to reflect a unique aesthetic that is carried through their art and craftsmanship.\n\nThe yellow was a color that represented Faye and the Giants throughout God of War (2018). As one of the last of her people left, we wanted that shade to be present in her design.\n\n[![](media/ab7c291ccca3f7693fc478009e92a50fbe7d80e5ddf0bd2813abed6e569e1399.jpg)](https://live.staticflickr.com/65535/52639154291_45cc7091da_h.jpg)\n\n*God of War Ragnarök – Angrboda Cosplay Guide Pg. 5*\n\n**When it comes to visual storytelling, what aspects of Angroboda’s character are the most important to convey through her design?**\n\nUnlike some of the more fantastic characters and creatures of the game, we took a more subtle approach to the details in Angrboda’s design.\n\nFor example, Atreus’ new look features a huge splash of yellow to honor his Giant heritage and connection to his mother. Angrboda, while being a Giant and living in Jötunheim, has clothing that features mostly shades of browns, teals, and grays. While her primary clothing pieces don’t have the same statement yellow piece that Atreus’ does, we still wanted to include smaller touches of the color to show her ties to the Giants and to Atreus.\n\nNot only are her tattoos yellow as mentioned before, but you can also see other pops of yellow woven through her hair, in some of the stitching of her clothing, and in the bronze jewelry she wears. These were all layered throughout her design to give a consistent, but subtle, reference to the Giants.\n\n[![](media/2234bdbc1f3537d43428964258905fa48c27a62896ce1ec2e29ea9d244f61359.jpg)](https://live.staticflickr.com/65535/52639586800_0e43b189d3_h.jpg)\n\n*God of War Ragnarök – Angrboda Cosplay Guide Pg. 6*\n\nIf you decide to cosplay a character from God of War, make sure you tag Santa Monica Studio on social or use the hashtag #GodofWarRagnarok! We always love to see your work.", "excerpt": "With the release of God of War (2018), we were absolutely amazed by how many people wanted to cosplay characters from the game – even those we didn’t have the chance to make guides for.\n\nWith the G", "readingMinutes": 19, "images": [{"src": "media/0f4fa80f99a524f23bba248a0f36d1a9f2b310634c000350bf322207045ecb53.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/a82133f9147f3665fca43a9339037d5adc7c482850a8632da5f3a3b66c8076fa.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/3d62e304bd526289c06d93caefcec97a04ec541a17f0f804936ecd0212a152cb.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/455c70f03d36f6dceb4ef33859cb93078bf2e70919d620c8a3e5562567366f3f.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/d64febf3901610f6c170e2005c471e1f250595cb660167ddddc9148e6d839476.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/8c2b29e26a657e9fafc2e0dfd08e0d3fa74cf63fead375d1155a9fbd806e821e.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/d7d4b26f09192e8f00f0072c0118ab22829e9ab427bc63bb461fe3b45b5b2291.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/b0fc224fe2ada34b875c6de6279d720050a13a6d0410938cef880aa0af4b51c6.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/cf7f615546cd7982aaa07b330cf1da3e37f38305a43606c1951a84eafeb41022.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/d51a0611835b71a10f0a7a1c1ee0b7838b45791329d3b6a2dace98cf64a435a2.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/a9938b44b4b05b56940994520b992a80064c9aa40aef4467353fcebf2290cc82.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/70a5c45e7a11ac8d290fc0425089270f21b12310f8157e87cf45b51e11985068.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/dc44c92f03b1f2f42450ea524f1890ceb05419ca505f2955d8f1aa58336c3de2.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/d98c194f45502d3179c4342b31d2d8b0df1c2871ba36f0120617bd6b44f4092a.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/cfb0572a216ca5d2e094995bd1e49b26bc885ad444ca55184487035474a7a9e0.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/ef47ec4a0b0d31d00b87de81673aa06855e17c3dc82272fe3970ecc604520952.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/ab7c291ccca3f7693fc478009e92a50fbe7d80e5ddf0bd2813abed6e569e1399.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}, {"src": "media/2234bdbc1f3537d43428964258905fa48c27a62896ce1ec2e29ea9d244f61359.jpg", "alt": "From Concept Art to Cosplay: Creating iconic characters for God of War Ragnarök"}], "cover": "media/0f4fa80f99a524f23bba248a0f36d1a9f2b310634c000350bf322207045ecb53.jpg"}, {"id": "a5edfae9724b1a2b6a3d2f49", "title": "From Concept Art to Cosplay: Creating Kratos and Atreus’ new looks for God of War Ragnarök", "summary": "Santa Monica Studio Art Director Raf Grassetti explains the updated looks for the father and son duo.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2022/10/20/from-concept-art-to-cosplay-creating-kratos-and-atreus-new-looks-for-god-of-war-ragnarok/", "publishedAt": "2022-10-20T09:01:48-07:00", "author": "", "markdown": "![From Concept Art to Cosplay: Creating Kratos and Atreus’ new looks for God of War Ragnarök](media/caf72fd98cbfaa40b73d727abc67d8d5a2819658688318cf08dae1e9b8996e0d.jpg)\n\nAt Santa Monica Studio, one our guiding phrases is “we’re fans of our fans.” Whether it’s a reaction to a trailer, a deep-dive lore video, or cosplay – knowing that there is an audience that appreciates all the details in our work motivates us to create something worthy of God of War fans.\n\nCosplayers are a huge part of our community and have been since the very first game released in 2005. Over many years we’ve seen how much time, love, and dedication it takes to create a single character. God of War characters especially have many different materials, layers, and details to account for. One thing we’ve learned is that the best starting block for any cosplayer is a good reference of the character they’re portraying!\n\nWith that in mind, we are really excited to
