b599675936d4.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/56f9add99f34e4140dd5dc82f0ea1f3f119e81a9958a552daf215433c712c0ec.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/dca5e4b9185a00ffc998d09551879a0baec2c191a2d2b8b3fd0a596b462b8d32.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/2adfb33453d992f1a256d0dfe29cd8c4ae79e3a8f4b1ef04badef9701e60fa81.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/a5d229721f363c4430c83dcd4f5ec618414cb54f7a3e2fee50aa8c2682a9164f.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/dcfb0467f00b33ad80edb960c7b3f07ca2de0425a11fc5aaa8b845b2077f9580.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/ffd8ad7600d1d11916b11257bd5f65144249804f577915c978db59f163ff3f54.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/5c24bd07d59134bdf3758db6bdf765d0a96e6296e0b70442cb8f344c6da528b5.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/e3d6462e3e28e7ac309b5388b139f87b0ef4f32cf3189ee5977376cb3febef1b.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/09b5901d6e7d803dd7eccb71043c108bddc154a0067cc90db63d4530b23e1723.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/a9761b2091607c6a07737066660415802bbcb326f4be0d647255a3d6ea1a0638.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/9f6471d25b31148f505ef948be750871e2c50a551cde166b11d54e888a82821e.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/7d138348fee4a3c4a7cdf4b87ea0ad91f93e3e6b909703a171b95554ca631cb5.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/87c151efe3119f65ac326c8ca1beb6c0f141ec4d05eaf7ba4aa97865c05d8cfb.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/50c18be74440c1d41e7d30ee487b572bc33620eaac2a717eddda70b1b025c389.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/4270a5f6935375491bb47b56235eb706c0d5edd61364662b9fb9262e18a401e4.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/7ce02adde50854d4c4d047c4fd15856ad78c12c9305af5d4a376f638a8ddea36.jpg", "alt": "Ghost of Tsushima - Concept Art"}, {"src": "media/219749faeecc73019158be3ccc5cc5ad1a3c044cd1d864890a5df765a9fe2839.jpg", "alt": "Ghost of Tsushima - Concept Art"}], "cover": "media/8d763ec3039c31b2fd15e028905ad7eee0ad9234361c21580d9e7b98c450208a.jpg"}, {"id": "022cf967338b7a6c5f22861e", "title": "From concept to completion: Creating Port Royale 4’s key art", "summary": "A look at the creative process and concept art of the upcoming Caribbean simulation game.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2020/06/17/from-concept-to-completion-creating-port-royale-4s-key-art/", "publishedAt": "2020-06-17T06:06:25-07:00", "author": "Daniel Thiele", "markdown": "![From concept to completion: Creating Port Royale 4’s key art](media/5b2a420589aeb1ffa708ed6d7e7f2f1467270458d9dff158cb26438143a35ffd.jpg)\n\nPort Royale 4, the latest entry in our trading simulation series, is coming to PS4 on September 25. We’re putting in a huge amount of work to make the Caribbean setting as beautiful as possible, so we thought we’d give you a behind-the-scenes look at how the key art has progressed from initial concepts to the finished visual.\n\nThe key art is the most important graphic for representing a game and will be used for online stores, cover art, social media and more. For many it’ll be their first impression of the game, so we have to get it right.\n\n[![Port Royale 4](media/31ae1e4ffcc04df12b9b92c6d04483e93884fd791aac0c57a7ea60f0dc9dfe5a.jpg)](https://live.staticflickr.com/65535/50011136641_051dcea49b_o.jpg)\n\nAs you can see, the final piece features two sailing ships locked in a ferocious sea battle – pretty straightforward and obvious for a game like Port Royale 4, right? Well, maybe not. Getting to this point was a detailed process with some important questions:\n\n**1) Should we show a character, or a ship?**\n\nWhenever you start a new game in Port Royale 4, you will choose a character to suit your play style. There are two male and two female characters that each represent different ways of playing — so we thought it might make sense to use these characters for the cover design as well, as characters are more approachable and have more of a personal connection than ships.\n\nIf you look at the illustrations below, you can see how the characters evolved from rough sketches to coloured drawings and finally to full concept art:\n\n[![Port Royale 4](media/3189fc462e54fea0087073bd1583d516a37f04d17ae0740e3774b272dd1a45c6.jpg)](https://live.staticflickr.com/65535/50010606048_7f0b0e44df_o.jpg)[![Port Royale 4](media/070edc70f29ec93611bd9b79c8ef1692bc452e87143c2fa5b90c576e499428b5.jpg)](https://live.staticflickr.com/65535/50010606068_023a131322_o.jpg)[![Port Royale 4](media/e5368531f73446afef59459a905e446ff82ee3940e9fac40a922a1c160d6afbb.jpg)](https://live.staticflickr.com/65535/50011397632_87ffe68006_o.jpg)[![Port Royale 4](media/78c3144c36db2705dcb39c4607cb94465f2bbb571cb491eb0bf910f0bf866f6f.jpg)](https://live.staticflickr.com/65535/50011397452_6dcd483c6c_k.jpg)\n\nWhile I love the character work, the alternative to this would be to show a ship, which is a more crucial and prevalent gameplay element that potentially gives a better impression of the setting and era of the game.\n\n**2) Should we show a quiet scene, or lots of action?**\n\nPort Royale 4 is by nature a pretty chill game where you spend a lot of your time buying and selling goods or planning trade routes, which led to this concept art:\n\n[![Port Royale 4](media/77b234a58471f7d537937697510c36ba235b8f9b249341720307e235ba37de7a.jpg)](https://live.staticflickr.com/65535/50010605978_d83e8a58db_k.jpg)\n\nHowever, sea battles are a core part of the gameplay too. Maybe your nation is at war with a rival, or you’re hunting for pirates – or er, maybe you have raised the black flag yourself. And since the key art represents the game at all points of sale – be it as a banner at PlayStation Store, or on the physical cover itself in stores, we decided that a graphic with a more action-packed scene might be more fitting.\n\n**3) What kind of colour scheme and lighting should we use?**\n\nAlongside the bright skies, crystal clear blue water and lush green islands of the concept above, we also wanted to see if scenes at dusk could work, with their warmer colours and gradients. It’s amazing what difference a variation in colour can have on the feel and mood of an otherwise (mostly) identical motif:\n\n[![Port Royale 4](media/4ba42ec587e74ed0b88e6bf7ea9c3d32b233a6e10a12d301c0bfee3ea7d731cf.jpg)](https://live.staticflickr.com/65535/50011397567_a3208568f0_k.jpg)\n\nFun fact! All the sketches and concepts of the characters I’ve shown you are in the final game, and even the ships are exactly the same as the 3D models you’ll be using when the game hits shelves in September. So we haven’t shown anything in the key art that you can’t also find in-game.\n\n[![Port Royale 4](media/31ae1e4ffcc04df12b9b92c6d04483e93884fd791aac0c57a7ea60f0dc9dfe5a.jpg)](https://live.staticflickr.com/65535/50011136641_051dcea49b_o.jpg)\n\nFor the final key art, we decided to use two ships locked in a naval battle at dusk. If you take another look at the concept art above, you’ll see that none of them *exactly* matches this final result. Instead, we took the idea of having the two ships from concepts 1 and 2 but had them facing different directions. We then went with the colour scheme of concept 5.\n\nBy showing two ships, we were able to show the contrast of a pirate ship and one serving a nation, representing another core game mechanic, while the warm, dusky sunlight and action-packed scene give a more striking visual impact — hopefully catching the eye of anyone that sees it.\n\nWe hope that this article has given you an idea of the importance of the key art, the creative process and how we got from a set of very different ideas to the final graphic. You’ll be able to see the final piece at PlayStation Store and box art very soon, when Port Royale 4 releases on September 25. See you on deck!", "excerpt": "Port Royale 4, the latest entry in our trading simulation series, is coming to PS4 on September 25. We’re putting in a huge amount of work to make the Caribbean setting as beautiful as possible, so", "readingMinutes": 6, "images": [{"src": "media/5b2a420589aeb1ffa708ed6d7e7f2f1467270458d9dff158cb26438143a35ffd.jpg", "alt": "From concept to completion: Creating Port Royale 4’s key art"}, {"src": "media/31ae1e4ffcc04df12b9b92c6d04483e93884fd791aac0c57a7ea60f0dc9dfe5a.jpg", "alt": "Port Royale 4"}, {"src": "media/3189fc462e54fea0087073bd1583d516a37f04d17ae0740e3774b272dd1a45c6.jpg", "alt": "Port Royale 4"}, {"src": "media/070edc70f29ec93611bd9b79c8ef1692bc452e87143c2fa5b90c576e499428b5.jpg", "alt": "Port Royale 4"}, {"src": "media/e5368531f73446afef59459a905e446ff82ee3940e9fac40a922a1c160d6afbb.jpg", "alt": "Port Royale 4"}, {"src": "media/78c3144c36db2705dcb39c4607cb94465f2bbb571cb491eb0bf910f0bf866f6f.jpg", "alt": "Port Royale 4"}, {"src": "media/77b234a58471f7d537937697510c36ba235b8f9b249341720307e235ba37de7a.jpg", "alt": "Port Royale 4"}, {"src": "media/4ba42ec587e74ed0b88e6bf7ea9c3d32b233a6e10a12d301c0bfee3ea7d731cf.jpg", "alt": "Port Royale 4"}], "cover": "media/5b2a420589aeb1ffa708ed6d7e7f2f1467270458d9dff158cb26438143a35ffd.jpg"}, {"id": "b9924de4baef7a0cd42244f0", "title": "Minecraft community art gallery", "summary": "A charming collection of community creations!", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "minecraft", "sourceName": "Minecraft", "sourceUrl": "https://www.minecraft.net/en-us/article/minecraft-community-art-gallery", "publishedAt": "2020-04-10T07:00:00.000+0000", "author": "Nova Barlow", "markdown": "![](media/68ee4e8567c49e53c8af0604f19377ce801623b8a8e2625ffe517af6fd20fe3f.jpg)\n\nDeep Dives\n\nA charming collection of community creations!\n\nIt’s time for a brand new community spotlight! During our first foray into the world of fan art, we were delighted to learn about the abundance of talent just waiting for us within the Minecraft community. We’ve started off this collection with ditto’s, beautiful render of Alex balancing on a lily pad, but we have much more to share. Let’s take a look at the latest creations created by our community members.\n\n![](media/ffe0a53755a1ac01c94b761a920c5976a2ce4a6d17551c314f2150ce6c01e1e6.png)\n\nDrawn by GoldGrabber07\n\n![](media/399cfce84eac26c0ba7ba7083b0ca60023764821fe5e2a5b385506218c290fa1.png)\n\nCartoon by GoldGrabber07\n\n![](media/c0644076f282da3ea10d07c4f2ff05dcf435125dac2be4ca1ff5d34221e73c61.jpg)\n\nSketch by GoldGrabber07\n\n![](media/320bb6447bfd986064d4c679a70508b2b04046c01e3dab2f79698ab8ecc28a85.jpg)\n\nCreated by Star\n\n![](media/af0b7d2da3acb774f28a3172cc2739f41670ca60eba2e51054908d135acd98bb.png)\n\nMade by paytnan90\n\n![](media/8cad65d3e8d52ec647b7a37dca95573f91bcff703dea56fa016a0e3e11fab899.png)\n\nRender from paytnan90\n\n![](media/3c3519a6f99f1ccc712bf6f5497a8850e700f9e4d936775eb19649c6c024ffcf.png)\n\nCreated by paytnan90\n\n![](media/f5ddc71ec02700d66be600b3257c2b035699f7dc95e76228da0b59aee4364dea.jpg)\n\nImage provided by \\_ditto\\_\\_\n\n![](media/1adf2939c7646c976cedb5fedd637a61761e09afe85dec63a22d12d284649aa3.jpg)\n\nDoodle by SweetRose236\n\n![](media/f87e4e1996ec4534f992ef01aba0afa50b529dfda7045927e6d6bf1abf50c045.jpg)\n\nImage by SweetRose236\n\n![](media/2bcb15b10f7c46a71cb4df14a51ca50f77aad57b530ca5418c848c6900643114.jpg)\n\nIllustration by SweetRose236\n\n![](media/a2571f656a81c8843d0b7148459ba8d581444ac3985aab804e0c3d06bdf43d2d.jpg)\n\nArt by paytnan90\n\nReady to submit your art? Send it to FeatureMe@minecraft.net, keep your fingers crossed, and it might get featured! We can’t wait to share what everyone’s making next.\n\n---\n\n## Share this story\n\n## Newest News\n\nCatch up on the latest Minecraft news & game updates!", "excerpt": "Deep Dives\n\nA charming collection of community creations!\n\nIt’s time for a brand new community spotlight! During our first foray into the world of fan art, we were delighted to learn about the abun", "readingMinutes": 2, "images": [{"src": "media/68ee4e8567c49e53c8af0604f19377ce801623b8a8e2625ffe517af6fd20fe3f.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/ffe0a53755a1ac01c94b761a920c5976a2ce4a6d17551c314f2150ce6c01e1e6.png", "alt": "Minecraft community art gallery"}, {"src": "media/399cfce84eac26c0ba7ba7083b0ca60023764821fe5e2a5b385506218c290fa1.png", "alt": "Minecraft community art gallery"}, {"src": "media/c0644076f282da3ea10d07c4f2ff05dcf435125dac2be4ca1ff5d34221e73c61.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/320bb6447bfd986064d4c679a70508b2b04046c01e3dab2f79698ab8ecc28a85.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/af0b7d2da3acb774f28a3172cc2739f41670ca60eba2e51054908d135acd98bb.png", "alt": "Minecraft community art gallery"}, {"src": "media/8cad65d3e8d52ec647b7a37dca95573f91bcff703dea56fa016a0e3e11fab899.png", "alt": "Minecraft community art gallery"}, {"src": "media/3c3519a6f99f1ccc712bf6f5497a8850e700f9e4d936775eb19649c6c024ffcf.png", "alt": "Minecraft community art gallery"}, {"src": "media/f5ddc71ec02700d66be600b3257c2b035699f7dc95e76228da0b59aee4364dea.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/1adf2939c7646c976cedb5fedd637a61761e09afe85dec63a22d12d284649aa3.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/f87e4e1996ec4534f992ef01aba0afa50b529dfda7045927e6d6bf1abf50c045.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/2bcb15b10f7c46a71cb4df14a51ca50f77aad57b530ca5418c848c6900643114.jpg", "alt": "Minecraft community art gallery"}, {"src": "media/a2571f656a81c8843d0b7148459ba8d581444ac3985aab804e0c3d06bdf43d2d.jpg", "alt": "Minecraft community art gallery"}], "cover": "media/68ee4e8567c49e53c8af0604f19377ce801623b8a8e2625ffe517af6fd20fe3f.jpg"}, {"id": "233d6f6fb99412805f038ba7", "title": "Creating art with Minecraft", "summary": "Fan Art… or Fine Art?", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "minecraft", "sourceName": "Minecraft", "sourceUrl": "https://www.minecraft.net/en-us/article/creating-art-minecraft", "publishedAt": "2019-12-31T08:00:00.000+0000", "author": "Nova Barlow", "markdown": "![Fan Art… or Fine Art?](media/1d9a722284b669bbbec8d0c7cf6e1ffd67aa43150d7a8515a2e5bf33644a79be.png)\n\nDeep Dives\n\nFan Art… or Fine Art?\n\nWhat’s your favorite part of Minecraft? The mining? The crafting? The constant jumpscares of a Creeper hissing in your ear as it sneaks up on you from behind? For us, it’s showcasing all the amazing things the community creates, whether it’s a great build filled with wonders we didn’t even think possible or a fresh new way to look at a block to spark our imagination. We simply can’t get enough of it – especially when you take your love for Minecraft outside the game to create something truly impressive, which is just what our community member **RobotPantaloons** did**.**\n\nDesigned in the style of high quality renders, RobotPantaloons has been creating Minecraft fan art for a while as well as a large number of wallpapers for the community. This diverse portfolio is filled several dozen renders, including a wide range of styles: vast vistas, amazing action shots, cuddly critters, and dramatically stark blank and white shots. Check out some of our favorites below.\n\n![](media/6c43d11d6a1e17960bb77a58463ca50ee6f739df3ca8a90dd470d1b8e50560ac.png)\n\n**This cutie is definitely demonstrating some #MinecraftGoals.**\n\n![Alex](media/74fbc4c674415cde1103f95f0df9b8437c74fa999753aa01e71c502d615d81d9.jpg)\n\n**Dive into adventure and dig up your own tale! Or dig up Steve, who somehow ended up at the bottom of the pit!**\n\n![Player and wolf](media/1d2708d35f8547d45f35707a74f8dd0b7d2497ebf9aee2773840bb6fc1e119d3.jpg)\n\n**A dramatic black and white render to spark our storytelling imaginations.**\n\n![](media/d861a67601d0253485707711d63b3588635e6c37c29fcf5afc802cd5b2a2ec48.png)\n\n**Hey stray, go back to bed! No one is going to play with you in the middle of the night!**\n\nWe have so many talented artists in the community, and now we’re ready to keep shining our spotlight on the very best creators we can find. Is it you? Your art doesn’t even have to be digital. If you can draw, paint, bake, or even sew, let us know! Art comes in all forms, and we can’t wait to see yours. Do you know an artist who makes magnificent Minecraft based art? Send them to us!\n\nNow that you’ve seen some of the possibilities, it’s time for you to start collecting your art together and contact us at FeatureMe@minecraft.net with some samples. Tell us a little about you, your creations, a peek at your process, and you just might be featured here!\n\n---\n\n## Share this story\n\n## Newest News\n\nCatch up on the latest Minecraft news & game updates!", "excerpt": "Deep Dives\n\nFan Art… or Fine Art?\n\nWhat’s your favorite part of Minecraft? The mining? The crafting? The constant jumpscares of a Creeper hissing in your ear as it sneaks up on you from behind? For", "readingMinutes": 3, "images": [{"src": "media/1d9a722284b669bbbec8d0c7cf6e1ffd67aa43150d7a8515a2e5bf33644a79be.png", "alt": "Fan Art… or Fine Art?"}, {"src": "media/6c43d11d6a1e17960bb77a58463ca50ee6f739df3ca8a90dd470d1b8e50560ac.png", "alt": "Creating art with Minecraft"}, {"src": "media/74fbc4c674415cde1103f95f0df9b8437c74fa999753aa01e71c502d615d81d9.jpg", "alt": "Alex"}, {"src": "media/1d2708d35f8547d45f35707a74f8dd0b7d2497ebf9aee2773840bb6fc1e119d3.jpg", "alt": "Player and wolf"}, {"src": "media/d861a67601d0253485707711d63b3588635e6c37c29fcf5afc802cd5b2a2ec48.png", "alt": "Creating art with Minecraft"}], "cover": "media/1d9a722284b669bbbec8d0c7cf6e1ffd67aa43150d7a8515a2e5bf33644a79be.png"}, {"id": "b8cd4d5772f1922bf52293ce", "title": "Santa Monica Studio Celebrates 20 Years with Concept Art from God of War", "summary": "Past and present SMS artists share their most inspired artwork.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2019/12/19/santa-monica-studio-celebrates-20-years-with-concept-art-from-god-of-war/", "publishedAt": "2019-12-19T08:30:20-08:00", "author": "", "markdown": "![Santa Monica Studio Celebrates 20 Years with Concept Art from God of War](media/bddc13ef0f2dfe99fbf822ec57a25b0719917c058fceb7e70755cad3d268d54d.jpg)\n\nAs we celebrate the 20th anniversary of Santa Monica Studio, we’re turning back the clock on some of the most memorable art from God of War — art that helped define the franchise that built our studio. From in-house concept artists still with us today to numerous legendary artists of our past, we asked each to select their most inspired God of War art piece that made a significant impact on them or the franchise. Many of these contain never before shared behind-the-scenes sdetails… and certainly some perhaps you never knew.\n\n[![God of War Concept Art](media/73f79a6780c5f8deb27a5122bbb699813ff16d8308ab86bc62ee0951d4312a4e.jpg)](https://live.staticflickr.com/65535/49235566118_fa709afbb4_k.jpg)\n\n***Charlie Wen – Former Concept Artist***\n\n*(“Kratos Legendary Napkin Design” – God of War)*\n\nIt has to be the napkin sketches I did when I first captured who Kratos was going to be.\n\nAfter going through several iterations of the main character, I was having a bit more clarity of who Kratos was, and came prepared for a lunch/design session — armed with multiple pens, even a brush pen. Then, as ideas started to flow, I realized I had no sketchbook — good thing the restaurant had napkins. A vision of Kratos came to me that needed to get out of my head and onto paper (or napkin) — he had wide double blades attached to his forearms by chains that he would fling around. The napkins soon filled with Kratos flying through the air with double blades. I remember going through several napkins to the point that 90% of Kratos’s finished design came out in that lunch session. As for the napkin sketches, most of them probably got crumpled in some jean pocket and eaten by the wash… but thankfully, not all of them.\n\n[![God of War Concept Art](media/ed0d965ee5cb35994e65aaa8a5012b3d8f3d0dce3378a5efdb1bee3ed61aa6f6.jpg)](https://live.staticflickr.com/65535/49235566188_62c667252f_k.jpg)\n\n***Cecil Kim – Former Concept Artist***\n\n*(“Suicide Bluffs – God of War”)*\n\nI did this piece early in the God of War 1 production, which means we knew Kratos will jump off the cliff at the beginning of the game. What a depressing start of a game! I also remember we tried to emphasize how emotionally beaten he is leading up to this point. I remember they (probably design team, David Jaffe) were telling me Kratos could barely drag himself up to the top which was the original plan. (I did not know what event took place before this. Which was the final Zeus battle at the end of the game!) That’s why you see a narrow trail leading up to the top on the left side of the cliff in my artwork.\n\nAlso, we were a fairly small art team back then; Ken Feldman, who was in charge of the level, also sat with me and shared his challenge to build all the areas with the graphical limitations we had. So no trees! I needed a perfect angle to show everything, so I made all the rocks in a stylized way, rather focus on a dark, chill tone of the area. Unfortunately, you do not see this view in the opening scene but you can feel and smell the same air if you know what I mean!\n\n[![God of War Concept Art](media/813a4658d989ec53d7344b7e2c04116e43080bd0a7ce16b236601a639c6147af.jpg)](https://live.staticflickr.com/65535/49236263802_d07aa4e772_k.jpg)\n\n***Scott Seeto – Former Concept Artist***\n\n*(“Icarus” – God of War II)*\n\nUltimately I’ll have to go with Icarus. One: it is always fun to design a crazy character and show it in their features and pose. It may not have been a big character but he was fun to do! Two: I was satisfied with the outcome of the illustration. For sure, some things could have been done better on it, but for time I had on it, I was pleased. Three: it is hard to see and it did not make it into the game I do not think. As part of his craziness, I originally thought of him holding a deceased cat all the time as a pet (it must have been a late night when I thought of it)! I would like to add, my time as a concept artist on God of War was a blast!\n\n[![God of War Concept Art](media/bec72c6797aabf2d9ea537ab31307d7caaa95b3d65d722775a2f9d66baf0ae61.jpg)](https://live.staticflickr.com/65535/49236263952_aa1c012d41_h.jpg)\n\n***Andy Park – Former Concept Artist***\n\n*(“Kratos vs Poseidon” – God of War III)*\n\nI would have to say the concept design illustration I did of the first main boss of God of War 3, Poseidon, was pretty special for me. I remember getting the prompt of a water-based behemoth that the Poseidon god would transform into and thinking what a fun challenge that was going to be to tackle. However, as I was letting my imagination run wild with the possibilities of this kind of creature that would attack Kratos in several simply massive ways I caught myself thinking, “How the heck are they going to pull off any of these things?” It’s one thing to design it but a totally another thing to make come alive in a 3D gameplay environment, *and* with the limitations of the PS3 platform engine.\n\nWell, it was a pleasure to design a crazy boss character like this that has never been seen in the God of War franchise, if not even the entire PS3 line of games, but it might have been an even bigger pleasure to see the amazing team execute this in reality for the game. A special shout out goes to Max Ancar making a character made of water come alive! Poseidon was definitely my favorite design I got to do during my long run on the God of War franchise.\n\n[![God of War Concept Art](media/38b6856629566640764cd78d1d1720b3644bf6f34ad8dc2c291710814c42e7ed.jpg)](https://live.staticflickr.com/65535/49236036731_1f33a27e08_h.jpg)[![God of War Concept Art](media/e3a7ebc31383abb72c5720e462c4b59af9f054ec9fd90288a76b3779b19f9874.jpg)](https://live.staticflickr.com/65535/49235566098_a8f3a517eb_h.jpg)\n\n***Erik San Juan – Former Concept Artist***\n\n*(“Amazonian Warrior” – God of War Ascension)*\n\nDuring pre-production for God of War: Ascension, the concept team had a month of “blue-sky” design time where we would toss around crazy ideas. With the mysterious fate of Kratos at the end of God of War 3, we knew we wanted to give him a successor — a new hero who would go looking for him. Not unlike the most recent entry in the series, we imagined that he had a hidden daughter and began sketching ideas of what she would look like. Other ideas we tossed around were using Artemis as the focus with similar rage and vengeance as Kratos — even concepting her to be a Centaur with magical powers!\n\nShown here was my only contribution to the team with a tattoo design on her face. Once we knew we were bringing back Kratos in a Prequel these designs would later evolve into the Amazonian Warrior that we see in Ascension. Santa Monica Studio is an incredible environment for creativity and I will always carry fond memories like these of my time working with such amazing artists.\n\n[![God of War Concept Art](media/44be71e3ffcc0dc8e11a982aebe88497697d858f4e1ac09b96288679557fe3fc.jpg)](https://live.staticflickr.com/65535/49236037611_6471247da8_k.jpg)\n\n***Luke Berliner – Present, Lead Concept Artist***\n\n*(“Canyon Bull” – God of War: Ascension)*\n\nI did this concept eight years ago when I first joined Santa Monica Studio on God of War: Ascension, I was so proud of it and felt like I was finally starting to understand what makes something work in a God of War game. Flash forward to today and this image is hung on the wall as you enter our internal space. I walk by it every day. When I look at it now years later I see how much I have grown as an artist at Santa Monica Studio and it’s fun to see how our games have changed too.\n\n[![God of War Concept Art](media/f91ba503c009a3fd6c243940d6018c2e97ecafa211c65d8a5fbdf75e4bbfec1c.jpg)](https://live.staticflickr.com/65535/49236037186_31105cd7ab_k.jpg)\n\n***Joe Kennedy – Present, Senior Concept Artist***\n\n*(“The Hunt” – God of War 2018)*\n\nThe team chose the comic medium for “The Hunt” since it was an ideal tool that could simultaneously visualize components of gameplay and storytelling. The scene is a vertical slice of God of War that I had the creative freedom to visualize how Kratos and his son, Atreus, would begin this new journey. It was great to see the concepts illustrated in The Hunt maintain integrity throughout the development process and the team helped see it into the final game.\n\n[![God of War Concept Art](media/3672ce233265dea3938babde11a38eb03942bef20547002cf30a2052d5acafd2.jpg)](https://live.staticflickr.com/65535/49235565958_f4c0164924_k.jpg)\n\n***Yefim Kligerman – Present, Concept Artist***\n\n*(“The Ancient” – God of War 2018)*\n\nI chose this concept of the Ancient because it shows a different take on the very common rock monster. I was able to integrate some curves to break up the solid rock shapes, as well as explore the humanity of this old magical being. The Ancient was always a great prompt to work off of because it’s supposed to be one of the oldest things in this world, a living being powered by magic and created as monument for prayer.\n\n[![God of War Concept Art](media/b23a1be84aabb302c9fed571aa7b011ee8075532a2754d3ffbe0be99589ac12f.jpg)](https://live.staticflickr.com/65535/49236036921_7cfd1eabbb_k.jpg)\n\n***Annis Naeem – Former Concept Artist***\n\n*(“Helheim” – God of War 2018)*\n\nI had been struggling to get a look and feel for Helheim until this pivotal piece. The brief was that it would be extremely cold and icy but it wouldn’t be a frozen wonderland. The walking dead that were infused together on the bridge, the stormy look, the towering columns/gates. Some of the elements in the painting were inspired by Zdzislaw Beksinkski and how he paints bony super structures.\n\n[![God of War Concept Art](media/ced6a62df23e51b308aab2bb7b9b10bd36db36469e19eeaa14cc683b5087f4bd.jpg)](https://live.staticflickr.com/65535/49235566543_7fd57c620f_k.jpg)\n\n***Jin Kim – Former Concept Artist***\n\n*(“Helheim Hræsvelg” – God of War 2018)*\n\nMy portion of contribution to the project was mainly on the realm of Helheim. For that reason, I chose the artwork with the eagle chained up on top of the Helheim monolith because the eagle is such an iconic creature to the realm. Things shown in this shot can represent almost everything happening in Helheim from the Sea of Knives to the cold weather that the eagle is creating by its giant wings, giant monoliths connected with the bridges that the dead walk on and so on. I personally grew fond of this one because of how long I was working on this place and how I thought it was so cool to have a cold version of Hell was back then.\n\nThe team back then was struggling with the decision on how to have the eagle’s appearance in the realm, and I remember when they finally brought the task of concepting the scene to me to have the eagle in the very center of the Helheim, I was very excited to paint the shot. It was really nice to see everyone’s reaction when we showed the concept to people too. It also felt like a good collaboration with other artists because of some of the elements in the painting that were designed by other concept artists, and it was really nice to orchestrate them in one illustration. This was a good finale to the whole Helheim-concepting act to me.\n\n[![God of War Concept Art](media/7775dbe49ac2b216dad0f7bbf9d8e8de5fe081a16011385ae3c3d05833e9da3f.jpg)](https://live.staticflickr.com/65535/49236264377_33d6fba10a_k.jpg)\n\n***Dela Longfish – Present, Lead Concept Artist***\n\n*(“Draugr” – God of War 2018)*\n\nThe Draugr were one of the earliest characters I worked on. Knowing this was a character we would see in almost every area in the game we explored a wide range of looks for what they could be. I eventually explored an idea of a character whose body is dead but was unnaturally being brought back to life by the pure will of its spirit. To further complement that, I made their bodies broken and fractured, to sell the idea that they were no longer from the land of the living.\n\n[![God of War Concept Art](media/f127f0d76cd0ba13aed0177508971f626205e415b22610ea08722471c53033e9.jpg)](https://live.staticflickr.com/65535/49235566258_a22a5ac9bc_h.jpg)\n\n***Abe Taraky – Present, Senior Concept Artist***\n\n*(“Týr” – God of War 2018)*\n\nWhen Kratos and Atreus discover the flooded area, they are amazed at the opulence and destruction of the temple. In support of these two themes, I ensured that every design choice added to this duality. A good example of this is the monolithic statue of Tyr that sits on the temple entrance. Its jewel encrusted shield, weapon and armor plating, stands in stark contrast to large hole at its chest and flames that engulf its helmet. Early on, this helps the player question the environment and wonder, what manner of god built such a temple and why was it was destroyed?\n\n[![God of War Concept Art](media/d476b622a709e2dece7253cc6411e8b9d82d0fc461e35aa9d7b4b72df747a927.jpg)](https://live.staticflickr.com/65535/49235565998_cb491ec9e5_h.jpg)\n\n***Vance Kovacs***\n\n*(“A Call From The Wilds” – God of War 2018)*\n\nThe set of images for PlayStation Experience were special for me. Specifically, this one, as it aimed to capture the boy in a fading moment of solemn beauty and inevitable death.\n\n[![God of War Concept Art](media/728e85f0e7f7b8f2a98d5a82da0da2796cd3eaf37fed68b76801eeaa5d0eab10.jpg)](https://live.staticflickr.com/65535/49236037226_c03ad9c993_k.jpg)\n\n***Jose Cabrera***\n\n*(“Faye’s Funeral” – God of War 2018)*\n\nThe reason is just that it somewhat helped me reconnect with the loss of my own mother, which is something that happened when I was a teen, and I had encapsulated that memory to have it as something that wouldn’t affect me at all. Working on this piece made me remember her. I can guess most developers had their little personal moments during the development because the game touches some very primal fibers here and there.\n\n---\n\nMake sure to hit up the PlayStation Store where we have a very special Santa Monica Studio showcase, featuring sales on many of our PlayStation 4 games, and a journey through our history. You can also now watch our full-length feature documentary, Raising Kratos, on your PlayStation console free, through the PlayStation Store as well.\n\nThank you once again, your unwavering support these past 20 years has truly transformed us.", "excerpt": "As we celebrate the 20th anniversary of Santa Monica Studio, we’re turning back the clock on some of the most memorable art from God of War — art that helped define the franchise that built our stu", "readingMinutes": 16, "images": [{"src": "media/bddc13ef0f2dfe99fbf822ec57a25b0719917c058fceb7e70755cad3d268d54d.jpg", "alt": "Santa Monica Studio Celebrates 20 Years with Concept Art from God of War"}, {"src": "media/73f79a6780c5f8deb27a5122bbb699813ff16d8308ab86bc62ee0951d4312a4e.jpg", "alt": "God of War Concept Art"}, {"src": "media/ed0d965ee5cb35994e65aaa8a5012b3d8f3d0dce3378a5efdb1bee3ed61aa6f6.jpg", "alt": "God of War Concept Art"}, {"src": "media/813a4658d989ec53d7344b7e2c04116e43080bd0a7ce16b236601a639c6147af.jpg", "alt": "God of War Concept Art"}, {"src": "media/bec72c6797aabf2d9ea537ab31307d7caaa95b3d65d722775a2f9d66baf0ae61.jpg", "alt": "God of War Concept Art"}, {"src": "media/38b6856629566640764cd78d1d1720b3644bf6f34ad8dc2c291710814c42e7ed.jpg", "alt": "God of War Concept Art"}, {"src": "media/e3a7ebc31383abb72c5720e462c4b59af9f054ec9fd90288a76b3779b19f9874.jpg", "alt": "God of War Concept Art"}, {"src": "media/44be71e3ffcc0dc8e11a982aebe88497697d858f4e1ac09b96288679557fe3fc.jpg", "alt": "God of War Concept Art"}, {"src": "media/f91ba503c009a3fd6c243940d6018c2e97ecafa211c65d8a5fbdf75e4bbfec1c.jpg", "alt": "God of War Concept Art"}, {"src": "media/3672ce233265dea3938babde11a38eb03942bef20547002cf30a2052d5acafd2.jpg", "alt": "God of War Concept Art"}, {"src": "media/b23a1be84aabb302c9fed571aa7b011ee8075532a2754d3ffbe0be99589ac12f.jpg", "alt": "God of War Concept Art"}, {"src": "media/ced6a62df23e51b308aab2bb7b9b10bd36db36469e19eeaa14cc683b5087f4bd.jpg", "alt": "God of War Concept Art"}, {"src": "media/7775dbe49ac2b216dad0f7bbf9d8e8de5fe081a16011385ae3c3d05833e9da3f.jpg", "alt": "God of War Concept Art"}, {"src": "media/f127f0d76cd0ba13aed0177508971f626205e415b22610ea08722471c53033e9.jpg", "alt": "God of War Concept Art"}, {"src": "media/d476b622a709e2dece7253cc6411e8b9d82d0fc461e35aa9d7b4b72df747a927.jpg", "alt": "God of War Concept Art"}, {"src": "media/728e85f0e7f7b8f2a98d5a82da0da2796cd3eaf37fed68b76801eeaa5d0eab10.jpg", "alt": "God of War Concept Art"}], "cover": "media/bddc13ef0f2dfe99fbf822ec57a25b0719917c058fceb7e70755cad3d268d54d.jpg"}, {"id": "a7b5e3ebd653ed631883bfd0", "title": "Decay of Logos Out August 27, Concept Art Gallery & Launch Trailer Now Live", "summary": "One person’s side project has become a living world full of its own history and stories.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2019/08/23/decay-of-logos-out-august-27-concept-art-gallery-launch-trailer-now-live/", "publishedAt": "2019-08-23T06:00:21-07:00", "author": "", "markdown": "![Decay of Logos Out August 27, Concept Art Gallery & Launch Trailer Now Live](media/4899da8c971d2fd598754900930352cd9d803f007b8139657c2468d111678b9a.jpg)\n\nIt’s been almost four years since our programmer André joined the studio. At that time, we were focusing on creating Unity tools, but we soon realized that André had brought more than his programming skills. He brought an idea… one that became the seed for Decay of Logos.\n\n[![Decay of Logos](media/ab5344fe082ba31fd12aa990714b2a45a9e0294e5b1e49c2e756005463a0ccf4.jpg)](https://live.staticflickr.com/65535/48601090891_aa3b943e60_k.jpg)\n\n[![Decay of Logos](media/b77e833b0757523411254cb1b7e5490a0939a66710055bfc6ad89dbc94ab3cd6.jpg)](https://live.staticflickr.com/65535/48601090821_5d6f0ef7bc_k.jpg)[![Decay of Logos](media/8c6da874a068525cc25c4495ccb15602ac78ce787ef6e452116332fbfb32313a.jpg)](https://live.staticflickr.com/65535/48601091031_8fbae4935d_k.jpg)\n\n*[Decay of Logos // Screenshots](https://www.flickr.com/photos/playstationblog/albums/72157710498039121)*\n\nAt first, it was a prototype he experimented with at nights after work. But the more we saw, the more we realized that this was the game that we had to make. We knew it was risky, and we knew it would be a challenge – but we were ready to do the work.\n\nIn that way, our own story matches up with that of the game’s heroine – Ada. When her village gets burned to the ground, she sets out on an adventure far bigger than herself. She’s not a warrior, but driven by revenge, she doesn’t shy away from taking on overwhelming obstacles and enemies.\n\n[![Decay of Logos](media/8519650aded41f1c4a2cf23af851b669f8c6709871b4f6e53943e7befb63b4be.jpg)](https://live.staticflickr.com/65535/48601093206_c6e428217d_o.png)\n\n[![Decay of Logos](media/33b6b12ccf1bc2a8613f94b80156b04dd751b7cafd284b55bdbe8cefc14e501f.jpg)](https://live.staticflickr.com/65535/48601093401_1e1afd1bd9_o.jpg)[![Decay of Logos](media/4218b39959e6de6c2fcffe9eb53aced892cac1be7fe090a99fc02d6c16cd6699.jpg)](https://live.staticflickr.com/65535/48601228132_a4f146c937_k.jpg)\n\n*[Decay of Logos // Concept Art Gallery](https://www.flickr.com/photos/playstationblog/albums/72157710498023466)*\n\nToday, we’re revealing the launch trailer of Decay of Logos! We have designed the game to be a challenging experience with very little hand holding – so we hope you’re up to the task. Your journey might be hard and unforgiving, but we hope you will be inspired by Ada’s bravery and get ready to take on this adventure alongside her when the game releases for PlayStation 4 on August 27!\n\nMuch love,  \nThe Amplify Team", "excerpt": "It’s been almost four years since our programmer André joined the studio. At that time, we were focusing on creating Unity tools, but we soon realized that André had brought more than his programmi", "readingMinutes": 3, "images": [{"src": "media/4899da8c971d2fd598754900930352cd9d803f007b8139657c2468d111678b9a.jpg", "alt": "Decay of Logos Out August 27, Concept Art Gallery & Launch Trailer Now Live"}, {"src": "media/ab5344fe082ba31fd12aa990714b2a45a9e0294e5b1e49c2e756005463a0ccf4.jpg", "alt": "Decay of Logos"}, {"src": "media/b77e833b0757523411254cb1b7e5490a0939a66710055bfc6ad89dbc94ab3cd6.jpg", "alt": "Decay of Logos"}, {"src": "media/8c6da874a068525cc25c4495ccb15602ac78ce787ef6e452116332fbfb32313a.jpg", "alt": "Decay of Logos"}, {"src": "media/8519650aded41f1c4a2cf23af851b669f8c6709871b4f6e53943e7befb63b4be.jpg", "alt": "Decay of Logos"}, {"src": "media/33b6b12ccf1bc2a8613f94b80156b04dd751b7cafd284b55bdbe8cefc14e501f.jpg", "alt": "Decay of Logos"}, {"src": "media/4218b39959e6de6c2fcffe9eb53aced892cac1be7fe090a99fc02d6c16cd6699.jpg", "alt": "Decay of Logos"}], "cover": "media/4899da8c971d2fd598754900930352cd9d803f007b8139657c2468d111678b9a.jpg"}, {"id": "b77fce7d1ca2ff8ee0c643bf", "title": "Oninaki Out August 22, New Concept Art Gallery", "summary": "Get a closer look at Tokyo RPG's beautiful new adventure in this new gallery, with descriptions of each piece from producer Ryutaro Sasaki.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2019/08/08/oninaki-out-august-22-new-concept-art-gallery/", "publishedAt": "2019-08-08T06:10:17-07:00", "author": "", "markdown": "![Oninaki Out August 22, New Concept Art Gallery](media/ab9ab33141e6a1a279f4594ab1aad4f19eda90c297a32a2f940fd3e2972c8d32.jpg)\n\n[Oninaki](https://www.playstation.com/en-us/games/oninaki-ps4/?smcid=pssocial%3Ablog%3Agame%3Aoninaki_out_august_22_new_concept_art_gallery%3A8_8_19), the third game by the team at Square Enix’s Tokyo RPG Factory, releases on PS4 August 22. Following up JRPG tributes I Am Setsuna and Lost Sphear, Oninaki features a bold, anime-influenced art style with expressive characters and gorgeous lands to explore.\n\nWe reached out to Square Enix to get a closer look at the concept art behind some of Oninaki’s vibrant locales, objects, and enemies. The captions below are written by producer Ryutaro Sasaki, and you can click through on each image for a higher resolution version.\n\nWorld\n\n[![Oninaki - Great Plain](media/04404d498024c09eb60f89aff9400279bf9cc3f86c2823ddcc99b81d68368931.jpg)](https://live.staticflickr.com/65535/48475926431_4afe7e6c78_k.jpg)\n\nGreat Plain\n\nDrawn by Background Designer Oga Takeshi\n\n“This image board is for a place that we called the “Great Plain” during the early stages of development, and it was very useful for solidifying the visual image of the world of the dead, Beyond the Veil. We have created a setting that is not just a dark and cold land of the dead, but also has a mysterious and fantastical atmosphere, with interesting features such as the pale lights that appear to shine up from the ground and the uniquely shaped trees that are reminiscent of Eastern designs and traditional Japanese aesthetics.”\n\n[![Oninaki - Szaka](media/2813691cb612dbd4fbb9f3371c8585de54e5f05b7c73380130e350948aaf8eea.jpg)](https://live.staticflickr.com/65535/48475925961_4e86acc245_k.jpg)\n\nSzaka\n\nDrawn by Background Designer Oga Takeshi\n\n“In order to create the unique setting for this title, we deliberately utilized a variety of Eastern design influences. This image board is for the capital city of Szaka, which has a particularly strong central Asian flavor. Special care was taken when depicting the cityscape, centered on the sovereign’s palace that symbolizes the precept of reincarnation itself, as well as the uniquely expressive sky, possessed of a character that is at once the glow of dawn and the haze of sunset.”\n\n[![Oninaki - Ehir Palace](media/b14f0d6d1164b2c74d8eb62ede7a11f2c70692c68b1598a2b0b8a875358fdbb4.jpg)](https://live.staticflickr.com/65535/48475926651_f60f23df66_k.jpg)\n\nEhir Palace\n\nDrawn by Background Designer Oga Takeshi\n\n“This image board depicts the throne in Ehir Palace, residence of the sovereign who rules over the capital Szaka, and by extension the Inner Kingdom where the story of Oninaki is set. Steeped in an aura of dread majesty, this throne has been the seat for generations of sovereigns who embodied of the precept of reincarnation. The current incumbent is Lady Lobelia.”\n\nObjects\n\n[![Oninaki - World Pillars](media/72e506113a0c0cd67736125ed062d977aa85b3c046659786885f682424fd5360.jpg)](https://live.staticflickr.com/65535/48476071912_ed7e457e49_k.jpg)\n\nWorld Pillars\n\nDrawn by Background Designer Oga Takeshi\n\n“This is a design for one of the objects known as the World Pillars that can occasionally be seen in the world of Oninaki. Nobody knows who built these artefacts or for what purpose, and their true age is unknown, yet they project a solemn sense of gravitas and the passing of the ages.”\n\n[![Oninaki - Objects of the Inner Kingdom](media/ec18c632daee9d6273b511d5b1bbdc6e4f3d7757bcef01909fe3c2534c16afa7.jpg)](https://live.staticflickr.com/65535/48476072052_a35327c255_k.jpg)\n\nObjects of the Inner Kingdom\n\nDrawn by Background Designer Oga Takeshi\n\n“The objects shown in these designs offer a window into the lives of the regular people who live in the Inner Kingdom. Many Asian influences have been incorporated into the designs for the cityscape and the pillars, such as objects resembling Shinto shrines and Buddhist jizo statues. However, when combined on the streets of Szaka, it results in a unique visual atmosphere that appears neither wholly Eastern nor Western.”\n\n[![Oninaki - Research Room](media/04d3d464e95b3fd35baf08e0dc5e24538902e01af757d8bb5ccb5c3553b2c5b4.jpg)](https://live.staticflickr.com/65535/48475926081_67e8ab4508_k.jpg)\n\nResearch Room\n\nDrawn by Background Designer Oga Takeshi\n\n“This is a design drawing for a certain research facility that exists somewhere in the world. As for who works here and what kind of research they are doing in this dark, windowless room… you will just have to find that out yourself!”\n\nFallen Souls\n\n[![Oninaki - Fallen Soul 1](media/86b2ecdadab08e16a050361a3dadda587d64f5d5ff846c1400483155d866de28.jpg)](https://live.staticflickr.com/65535/48476072212_2180559c2b_k.jpg)\n\nFallen Soul 1\n\nDrawn by Monster Designer Morinaga Koji\n\n“The design for this Fallen Soul is based on one of the monsters that appears in all Tokyo RPG Factory games. In the world of Oninaki, when people who have become estranged from the wheel of reincarnation eventually perish, they will transform into the Fallen, and the particle like pattern on its body is based on this concept. I think that the gently flickering flame on its head is quite charming.”\n\n[![Oninaki - Fallen Soul 2](media/e6274aa6a01a6c183e2eb27ed1dd5ce1639e4453db93d64b11c18a46b08482e9.jpg)](https://live.staticflickr.com/65535/48476072167_da1d0cb3a0_k.jpg)\n\nFallen Soul 2\n\nDrawn by Monster Designer Morinaga Koji\n\n“This is a design for a Fallen Soul with a fungoid aspect. You can see how it attacks by billowing spores from its head, an attack that will cause no end of grief for Kagachi in the game.”\n\n[![Oninaki - Fallen Soul 3](media/b023f7c0eafbcfaeec86405f08e57f2e92b73337c1b228f713dfc27a3dbb95fb.jpg)](https://live.staticflickr.com/65535/48475926186_06f2b4241b_k.jpg)\n\nFallen Soul 3\n\nDrawn by Monster Designer Morinaga Koji\n\n“This Fallen Soul is an airborne type. The distinctive design features translucent wings and a single strong leg, and reminds you that the fallen in the world of Oninaki were all originally human. It gives a sense of the fleeting beauty in all living things.”", "excerpt": ", the third game by the team at Square Enix’s Tokyo RPG Factory, releases on PS4 August 22. Following up JRPG tributes I Am Setsuna and Lost Sphear, Oninaki features a bold, anime-influenced art s", "readingMinutes": 7, "images": [{"src": "media/ab9ab33141e6a1a279f4594ab1aad4f19eda90c297a32a2f940fd3e2972c8d32.jpg", "alt": "Oninaki Out August 22, New Concept Art Gallery"}, {"src": "media/04404d498024c09eb60f89aff9400279bf9cc3f86c2823ddcc99b81d68368931.jpg", "alt": "Oninaki - Great Plain"}, {"src": "media/2813691cb612dbd4fbb9f3371c8585de54e5f05b7c73380130e350948aaf8eea.jpg", "alt": "Oninaki - Szaka"}, {"src": "media/b14f0d6d1164b2c74d8eb62ede7a11f2c70692c68b1598a2b0b8a875358fdbb4.jpg", "alt": "Oninaki - Ehir Palace"}, {"src": "media/72e506113a0c0cd67736125ed062d977aa85b3c046659786885f682424fd5360.jpg", "alt": "Oninaki - World Pillars"}, {"src": "media/ec18c632daee9d6273b511d5b1bbdc6e4f3d7757bcef01909fe3c2534c16afa7.jpg", "alt": "Oninaki - Objects of the Inner Kingdom"}, {"src": "media/04d3d464e95b3fd35baf08e0dc5e24538902e01af757d8bb5ccb5c3553b2c5b4.jpg", "alt": "Oninaki - Research Room"}, {"src": "media/86b2ecdadab08e16a050361a3dadda587d64f5d5ff846c1400483155d866de28.jpg", "alt": "Oninaki - Fallen Soul 1"}, {"src": "media/e6274aa6a01a6c183e2eb27ed1dd5ce1639e4453db93d64b11c18a46b08482e9.jpg", "alt": "Oninaki - Fallen Soul 2"}, {"src": "media/b023f7c0eafbcfaeec86405f08e57f2e92b73337c1b228f713dfc27a3dbb95fb.jpg", "alt": "Oninaki - Fallen Soul 3"}], "cover": "media/ab9ab33141e6a1a279f4594ab1aad4f19eda90c297a32a2f940fd3e2972c8d32.jpg"}, {"id": "1ccd4818658a6d7de09108d2", "title": "Murdered: Soul Suspect Concept Art Explored", "summary": "We had the pleasure of sitting down with the young and incredibly gifted Concept Artist, Yuki Matsuzawa, who was responsible for visual development on Murdered: Soul Suspect on PS4 and PS3. Yuki already had a rich history in Concept Art even before joining the Murdered: Soul Suspect team, having joined Square Enix in 2004 to [...]", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2014/06/05/murdered-soul-suspect-concept-art-explored/", "publishedAt": "2014-06-05T07:00:05-07:00", "author": "", "markdown": "![Murdered: Soul Suspect Concept Art Explored](media/32bc51abccde446c50694d009e01588da1239ceabe33c2a14f7acf269b9ad9ee.jpg)\n\nWe had the pleasure of sitting down with the young and incredibly gifted Concept Artist, Yuki Matsuzawa, who was responsible for visual development on [Murdered: Soul Suspect](http://www.playstation.com/en-us/games/murdered-soul-suspect-ps4) on [PS4](https://blog.us.playstation.com/category/ps4/) and [PS3](https://blog.us.playstation.com/category/ps3/).\n\nYuki already had a rich history in Concept Art even before joining the Murdered: Soul Suspect team, having joined Square Enix in 2004 to work with Isamu Kamikokuryo on Final Fantasy XIII for several years. Isamu joined us today as well to see how his protégé had applied his experience with Final Fantasy to a more western game.\n\nIn order to show you just how successful this collaboration turned out to be, we were fortunate enough to not only talk about the origins of the game, but Yuki even shared some of his original work for you to feast your eyes on.\n\n[![Murdered: Soul Suspect Concept Art](media/fcd3cebe1b42943f58781704bbf60afe93de8216298329dd3df578f3e2572930.jpg)](https://www.flickr.com/photos/playstationblog/14346171824 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nFirst up is a sketch of our protagonist, Ronan O’Connor, which was drawn soon after Matsuzawa joined the Murdered team. As there were no reference materials depicting the reality of a ghost-on-ghost fight (whether they had guns or hit each other with their fists), Matsuzawa came up with several ideas about how best to show such a ghostly battle.\n\nThe image is “a proposal for having the protagonist inflict damage on enemy ghosts by passing through their bodies,” says Matsuzawa. Kamikokuryo believes that this piece primarily focused on the “large glowing effects that the ghosts produce.” Look closely enough and you’ll see a floating ghost within the light’s momentum. “You can definitely get the feeling of the team being a little lost while searching for and refining the concepts for the project,” he added.\n\n[![Murdered: Soul Suspect Concept Art](media/2367cc3eb08d1b07e07094f07b00b79e939319fa5eba2381f9875458ff25154d.jpg)](https://www.flickr.com/photos/playstationblog/14160353628 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nThe above image shows Ronan protecting the ghost of an innocent young girl from the dark spirits that roam the city. Notice how a cat has sensed the dark spirit but it’s invisible to the living homeless man.\n\n“It takes on a very tricky composition,” Kamikokuryo stated, “the decision to have the girl, the most emotional of these characters, deliberately positioned right at the edge gives idea of the game’s unstable and uncertain setting.”\n\n[![Murdered: Soul Suspect Concept Art](media/06abf692f75f8e03ec2ad98984547115c3bd382df447f4e5c53631bd7185d83b.jpg)](https://www.flickr.com/photos/playstationblog/14160353488 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nOur next piece of art also depicts the relationship between the world of the living and the spirit world. The living are completely oblivious to the presence of ghosts and the dark spirit approaching from the horizon.\n\nCommenting on the image Matsuzawa said: “At the time this was drawn the spirit world had a conceit where objects related to the deceased in a previous life remained,” and if you look closely enough you can see the ghostly remnants of hospital beds remaining.\n\n[![Murdered: Soul Suspect Concept Art](media/ced78ef6d0cdd0012fef1d06de3b9aabe39d10529f694003af04839cd1eed13f.jpg)](https://www.flickr.com/photos/playstationblog/14160353308 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nThis image is an experiment with the world’s setting and atmosphere in order to add stronger ties between the real and spirit worlds. The vista is based on old-time cities and contains fantastical elements such as the tower that connects the earthbound land of the living with the realm of “heaven.”\n\nThe buildings in the backdrop have a strong sense of originality about them. “In some ways, I can see the kind of fantasy aesthetic that has been cultivated with the Final Fantasy series here,” says Kamikokuryo.\n\n[![Murdered: Soul Suspect Concept Art](media/28059360adba1efb7c51d4a60e61b0a7577dee680b7478addc4ddc5ceb395745.jpg)](https://www.flickr.com/photos/playstationblog/14345408722 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nThis image was conceived to explore the key visual elements for the game. Ronan reaches out to touch his wife as she mourns at his own funeral but his hand passes through her.\n\nMatsuzawa comments that: “The world setting and scenario have been greatly changed since this was drawn, and as a result this sequence has been removed, but it gives a glimpse of the sadness consuming our central character.”\n\n[![Murdered: Soul Suspect Concept Art](media/313e839a2cc13379dd7b4b7e5403da071c2cb93deb2f56790bd70f9242443bd2.jpg)](https://www.flickr.com/photos/playstationblog/14347009375 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nIn this particular image, the enemy ghosts are depicted as creepy gentlemen with black suits and red ties. These evil spirits were also proposed to have different appearances, such as insect-like monsters, armored figures, and creatures with a robotic form.\n\n“The first thing that strikes me is the great expressions worn by the ghosts,” says Kamikokuryo. “The surrounding buildings have a slightly non-specific cultural base but provide a very atmospheric setting.” As you can see, it seems Ronan’s visual style has been more or less fixed down by this point.\n\n[![Murdered: Soul Suspect Concept Art](media/fcffb5d0f28541bc1bca834e3b0240a5f3afbf4ed477adc67bee99b52b9437c1.jpg)](https://www.flickr.com/photos/playstationblog/14323873016 \"Murdered: Soul Suspect Concept Art by PlayStation.Blog, on Flickr\")\n\nOur final piece of concept art was created around the same time as the previous one and illustrates a confrontation between two spirits.\n\nWhen asked about the idea to set the scene on a stage show, Matsuzawa commented: “The idea of ghosts fighting a fierce battle while living humans can’t see them was an interesting one, so we chose a stage during mid-performance for the setting as it is somewhere that many eyes would be turned to.” In agreement Kamikokuryo added: “I was drawn to consider the visceral impact of the visuals before looking deeper to try to make sense of the setting. The backdrop, characters, and effects are all drawn with a flawless sense of balance”.\n\nSo what do you think of the concept art? Hit us up with your questions in the comments below. We hope you’ve enjoyed reading about the origins of Murdered: Soul Suspect as much as we enjoyed discovering it!\n\nMurdered: Soul Suspect is out now on PS4 and PS3.", "excerpt": "We had the pleasure of sitting down with the young and incredibly gifted Concept Artist, Yuki Matsuzawa, who was responsible for visual development on   on   and  .\n\nYuki already had a rich history", "readingMinutes": 8, "images": [{"src": "media/32bc51abccde446c50694d009e01588da1239ceabe33c2a14f7acf269b9ad9ee.jpg", "alt": "Murdered: Soul Suspect Concept Art Explored"}, {"src": "media/fcd3cebe1b42943f58781704bbf60afe93de8216298329dd3df578f3e2572930.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/2367cc3eb08d1b07e07094f07b00b79e939319fa5eba2381f9875458ff25154d.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/06abf692f75f8e03ec2ad98984547115c3bd382df447f4e5c53631bd7185d83b.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/ced78ef6d0cdd0012fef1d06de3b9aabe39d10529f694003af04839cd1eed13f.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/28059360adba1efb7c51d4a60e61b0a7577dee680b7478addc4ddc5ceb395745.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/313e839a2cc13379dd7b4b7e5403da071c2cb93deb2f56790bd70f9242443bd2.jpg", "alt": "Murdered: Soul Suspect Concept Art"}, {"src": "media/fcffb5d0f28541bc1bca834e3b0240a5f3afbf4ed477adc67bee99b52b9437c1.jpg", "alt": "Murdered: Soul Suspect Concept Art"}], "cover": "media/32bc51abccde446c50694d009e01588da1239ceabe33c2a14f7acf269b9ad9ee.jpg"}], "categories": [{"key": "gaming", "name": "Game Culture", "count": 44}], "total": 44, "siteName": "Game Culture Journal", "siteMode": "category", "locale": "en", "ui": {"all_articles": "All articles", "search_results": "Search results", "searching": "Search:", "reading_time": "min read", "source_link": "View original source", "skip_link": "Skip to content", "category_navigation": "Categories", "home": "home", "menu_open": "Open categories", "search_label": "Search articles", "search_placeholder": "Search titles, sources or articles...", "empty_title": "No articles found", "empty_description": "Try another keyword or category.", "copyright": "Content belongs to its original authors and publishers. Origina
