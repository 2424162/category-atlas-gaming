e leaders that VFX updates could be harming the community rather than helping it: Angry players + Discouraged devs = Not Worth.\n\nWe love getting your constructive feedback because it shows us you’re really passionate about this endeavor. This keeps us going and helps us make League a better game!\n\n## The Future of VFX Updates\n\nWe hope you learned something from this post! We haven’t talked much about the VFX updates process in the past, and that’s something we wanted to fix. Whenever a new VFX update happens and you see a post about it on social media channels, please don’t hesitate to leave your feedback! We always try to read as much feedback from all of you as possible.\n\nAnd as for who’s getting the next VFX update... Well, that’s a secret! But don’t worry, we’re hard at work on more VFX updates to make sure your favorite champions get the sparkles and love they deserve!", "excerpt": "Hello, Riot Sirhaian here! I’m a senior VFX artist on the Skins team who sometimes updates older League champions’ VFX.\n\nVFX updates started out as a personal project a few years ago with Veigar (n", "readingMinutes": 13, "images": [{"src": "media/879166bdd09a967428039063c7f3e6ca5a19d80394285438bbb17709641a8ca3.webp", "alt": "/Dev: Behind the Scenes of VFX Updates"}, {"src": "media/78a1dc56b7c1c4909e0935ca27dcad3bcf7d2d9d46fbe2d1607b8dfe92d1278b.jpg", "alt": "042522_Veiger_VFX.jpg"}, {"src": "media/71ee7b9ca98a98d2d842d5a5cd46fe3aae45cdb7752b526f885220a385d27346.jpg", "alt": "042522_Blitz_VFX.jpg"}, {"src": "media/2570bec6d3eccbb8eba7304b57768fcbf9cd34f215b56f6164e904053b2e1830.jpg", "alt": "042522_Amumu_VFX.jpg"}, {"src": "media/9d7803b9106069836b49b2c422bcbccf695c453bd2859d592584cb8b9efdec68.jpg", "alt": "042522_Thresh_VFX.jpg"}, {"src": "media/6b3ea7f33308d8dcbbf01cd4dfe0e3d29ca8595fa40d3817a317c847dea7d28b.jpg", "alt": "042522_YasTeemo_FVX.jpg"}], "cover": "media/879166bdd09a967428039063c7f3e6ca5a19d80394285438bbb17709641a8ca3.webp"}, {"id": "a45f2e0690524090a722f258", "title": "From brush to blade: The concept art process behind Ghost of Tsushima", "summary": "Creating the characters, environments, and visual identity of a samurai epic.", "category": "gaming", "categoryName": "Game Culture", "group": "art", "groupName": "Artwork & Posters", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2020/10/26/from-brush-to-blade-the-concept-art-process-behind-ghost-of-tsushima/", "publishedAt": "2020-10-26T06:00:03-07:00", "author": "", "markdown": "![From brush to blade: The concept art process behind Ghost of Tsushima](media/8d763ec3039c31b2fd15e028905ad7eee0ad9234361c21580d9e7b98c450208a.jpg)\n\nHi! My name is Ian Jun Wei Chiew, Lead Concept Artist at Sucker Punch Productions, and I was fortunate enough to have worked on Ghost of Tsushima since the very beginning. Ghost of Tsushima is set in 1274 during the Kamakura period, which comes with a lot of challenges as well as interesting opportunities to explore visual designs for the game.\n\nOur main story inspiration was the Mongol invasion of Japan of 1274, and the main character was a survivor of that invasion who defies all odds to defend his homeland. This was the core player fantasy that served as an overarching guide for everyone at the studio. We began by exposing ourselves to as much research and content as we could on the Kamakura Era, Japanese culture, old Samurai films and the Invasion of Tsushima, which led to the final designs of our characters, outfits, landscape, architecture, etc. A lot of the references we gathered were from museum exhibits and photos taken by teams that the studio sent out to Tsushima as well as the main island of Japan***.***\n\n## **Characters**\n\nWe spent a lot of time gathering reference material for our characters, which ranged from Samurai films, online books and resources, to photographing museum exhibits, from the most intricate Samurai and lavish armor, down to poor and rough bandits. Usually the concepts for characters are done well before the actors are cast. We try to invoke a personality fit for the character on the face as well as provide references for the general tone the character should give off. This helps with finding and casting the actors later. Once the actors are cast, we fit their faces onto the outfit designs and from there they do an amazing job capturing the personality and nuances of the character through their lens. The general process was to get a brief narrative of the character, doing research and reference gathering, coming up with some thumbnail sketches, rounds of iterations, and reworks to address any technical issues we faced.\n\n### **Jin and His Allies**\n\nIn the early drawing boards for Jin, we knew that we needed someone that can fulfill the fantasy of hiding in the shadows, but still having a look that feels like it was inspired by some of his samurai armor and aesthetic. While there are some stealthy assassins that actually appear from various points in history, there wasn’t a lot of information about the first warrior of that kind. Knowing that we wanted a character to have to let go of tradition and evolve into something out of necessity gave us this opportunity to tell a fictional story of a new kind of warrior. We avoided going the route of your traditional assassin trope with the iconic black and fully cloth-based outfit, and instead incorporated a touch of samurai armor elements in the Ghost outfit to help add a sense of realism. Jin’s arc of turning from the honorable samurai to the new dishonorable warrior was portrayed by including subtle intricate patterns as well as traditional armor plating pieces to make the Ghost outfit look more believable for that time.\n\n[![Ghost of Tsushima - Concept Art](media/7368e9a54dc39f114e729501e83decbec84a8ae7eb97bae7e02283d41603491b.jpg)](https://live.staticflickr.com/65535/50520376513_532e40a277_k.jpg) [![Ghost of Tsushima - Concept Art](media/522b25ec5cd7edf4355d4452eb0287adfc0f73b3769afe9bad80fc9533a57efa.jpg)](https://live.staticflickr.com/65535/50520376478_19838e7a3d_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/8e7b1eda48d5e68173499abe6dda74eee2f8c38a6fc601daccfd191296afc7a2.jpg)](https://live.staticflickr.com/65535/50520376253_cc7aa5e762_k.jpg) [![Ghost of Tsushima - Concept Art](media/e241c0c45d038d34456ba37e7a6c8dd4788ea98fe6ff6803059ab7578f4dd334.jpg)](https://live.staticflickr.com/65535/50521277382_5fac5ffba7_k.jpg)\n\nFor Jin’s more traditional samurai outfits, we looked closely at armor references from the Kamakura and Heian periods. Those radiated a sense of regality which fits Jin’s arc and contrasts well with the dark and muted scheme of the Ghost armor. We started off with Jin as a full-fledged samurai, then a broken samurai, and then to be reborn as the Ghost. The bulky and angular shapes from the traditional samurai armor contrast well with the more light and agile make of the Ghost armor.\n\n[![Ghost of Tsushima - Concept Art](media/e07f36892190f8023395d5cc02ba7545173f5b6f726523ff8b88711e58a6a882.jpg)](https://live.staticflickr.com/65535/50521098666_2e2a5f16b8_k.jpg) [![Ghost of Tsushima - Concept Art](media/24625b39e14b80d1d2d3a07df7a7b2802ca170e050eff58fac3d600265c65f06.jpg)](https://live.staticflickr.com/65535/50521276712_b2e6e6d38b_k.jpg)\n\nWe also created a lineup of outfits that Jin can acquire throughout his journey, and for these, we had a bit more creative freedom in designing outfits that helped sell the samurai fantasy, such as Tadayori’s Armor, which was inspired by Yabusume (traditional Japanese mounted archery). The more cloth-based outfits such as Kensei and Traveler’s outfit were designed with the intent of making the player feel like a lone wandering ronin, just like in those old samurai films. Since the wind plays a big part in our game, we made sure to always have parts of the outfit that reacted to the wind, such as capes and tassels. This helps make the characters feel more connected to the world.\n\n[![Ghost of Tsushima - Concept Art](media/bf40be7eecaf2f347f89ed6678207da1fa74bddae35cc7f22420b62f8e96b833.jpg)](https://live.staticflickr.com/65535/50521282922_9042475336_k.jpg) [![Ghost of Tsushima - Concept Art](media/aa4a3bc3ef48b967978f722b24468b3bda01d6f804d5933552124052e2fbe7c1.jpg)](https://live.staticflickr.com/65535/50521103661_e8f056fdfa_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/8ed5259e43eb49e26eb5e3777bc2adeb890d837f824d1d1a5b1ae7e05c5e399c.jpg)](https://live.staticflickr.com/65535/50521281627_fdd6bad850_k.jpg) [![Ghost of Tsushima - Concept Art](media/6da218fcf70e60ca977946d69bffcdf6ba3c085e524729345b091486696e2708.jpg)](https://live.staticflickr.com/65535/50521102556_0c52217e8c_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/72810a00b783df3cadac892eb28575b506a0235d6388d50eb2d2675de716bee6.jpg)](https://live.staticflickr.com/65535/50521101651_c512322c8d_k.jpg) [![Ghost of Tsushima - Concept Art](media/cb71d45555aac866d7f3009d793f16025b27a9c2237b8d59dd41f658980b5251.jpg)](https://live.staticflickr.com/65535/50521101241_26ef6ec8e8_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/439110487ef4eccc555e999358c1b761bce9fb5f32667bd6e20664e1ab0d1216.jpg)](https://live.staticflickr.com/65535/50521279167_a910085ad9_k.jpg) [![Ghost of Tsushima - Concept Art](media/8553aa31fc7a716dc44e0cab37ed65663c2c23557263ed8ef60dacd21a4422f4.jpg)](https://live.staticflickr.com/65535/50521278422_4953ba6d6c_k.jpg)\n\nWe went through the same process with our other primary and secondary characters. A lot of intricacy and thought was given to each side character, just like our main cast. From the ornate pattern of Shimura’s armor to the scarf and cloudy patterns for Yuriko, which hints at her fading memory.\n\n[![Ghost of Tsushima - Concept Art](media/815345e586b02ca0561b6fc63974481509b62deb9a7057b5ea67710c3093c9b5.jpg)](https://live.staticflickr.com/65535/50521278157_2ab32e4dcb_k.jpg) [![Ghost of Tsushima - Concept Art](media/3323c203f0d7a5833db741687f1cfdfc18b84c3652c4e716dd80a455056de35e.jpg)](https://live.staticflickr.com/65535/50521099601_5bbc064d03_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/68faab2351cb1a73e305cc2bc7e9bbdece2ba4bda0b40f8120258a7b979515d2.jpg)](https://live.staticflickr.com/65535/50521278072_f7a3eb640c_k.jpg) [![Ghost of Tsushima - Concept Art](media/c4f8a86ddaf5f576ca97ee42f749287639797ceb01a152dd19be57e595b61c77.jpg)](https://live.staticflickr.com/65535/50520377003_e15d97195d_h.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/d898fa4de8b1390de2c073cf25faf2fcab9ce120ae7440158246494d008264d0.jpg)](https://live.staticflickr.com/65535/50520376833_8847974461_k.jpg) [![Ghost of Tsushima - Concept Art](media/c1ebf2e401ef2c50ccff91c870ace5eb1047f893b3e33597f66897cf494beeaa.jpg)](https://live.staticflickr.com/65535/50521277852_f35fa63bf4_k.jpg) [![Ghost of Tsushima - Concept Art](media/a50fa15f1f5e8dce8769e91dd0e651ee7391da41bd3e083eb5646e181568ff0b.jpg)](https://live.staticflickr.com/65535/50521099316_8a7e839579_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/cf2d9a19d2469245273b9b38d3362046d264d8b7ca5766160e2d894fc417b567.jpg)](https://flic.kr/p/2jYnQFn) [![Ghost of Tsushima - Concept Art](media/a6f7f23c74fb2140c527110c36f91649be64062fc0a0ee41d56302fb3db75d43.jpg)](https://live.staticflickr.com/65535/50520376753_3af5ae727f_b.jpg) [![Ghost of Tsushima - Concept Art](media/1da5fd07b359736d173d941a131b1e0c83826b020004cab8dd844c7237a49574.jpg)](https://live.staticflickr.com/65535/50521277747_623b47512e_b.jpg) [![Ghost of Tsushima - Concept Art](media/4cc77dbc7fc6e9a1b9a7d6d5b1eae848177b2ce11f6561e9fc5080ef7b91d1b5.jpg)](https://live.staticflickr.com/65535/50521099151_d0980b445b_h.jpg)\n\n### **Khotun Khan & His Army**\n\nKhotun Khan is an intelligent and ruthless leader, and it was important for us to show it in his design along with his fearsome and menacing force that contrasts with the strict and orderly samurai. The Khan has two outfits. One has a more traditional color palette with organic patterning and aesthetics, and the other, which is more armored, is void of color, with more angular patterns that feel oppressive. The Mongolian army consists of five tribes, and we had to differentiate them across the island and acts. The more powerful the tribe, the more armored and fur-laden they are. This is to show enemy scaling as you play through the game, as well as to consider the cold temperatures of the snowy area of Kamiagata as you get closer to the end of the game. Within those ranks are several classes, each with a unique general silhouette that players can hopefully distinguish from a distance, such as the archer having a more triangular silhouettes, while the brutes had more of a bulky rectangular shape.\n\n[![Ghost of Tsushima - Concept Art](media/f703cee02bcee88a4aff8e9d268a163b1bd7925917ae0834b3b6707872c0bd85.jpg)](https://live.staticflickr.com/65535/50520562488_7905637188_h.jpg) [![Ghost of Tsushima - Concept Art](media/684ee2ff35606935ec00fea5b30ee1b4231b0526da6c61d85d7c52279aaf6937.jpg)](https://live.staticflickr.com/65535/50520562263_37dbc9a209_h.jpg) [![Ghost of Tsushima - Concept Art](media/20e50f36163652b5165c3e685fa6d2dc4c7304015cf593bbc52ff61805bab965.jpg)](https://live.staticflickr.com/65535/50521463807_870bd5433d_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/7dac57381610f26c76df6ad30e03ffdadaf20b8237b9db6ccdd47f91d9b83fc4.jpg)](https://live.staticflickr.com/65535/50521462907_3f03d1cde5_k.jpg) [![Ghost of Tsushima - Concept Art](media/1a143b515e9c8386e4e731e43812739781de7e19c922ebf0d43bb6972adc15ef.jpg)](https://live.staticflickr.com/65535/50520562033_b1c8f4f45a_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/6dbe104730a4a6c333fc2d31e859299d77e730ae34cb45bfcf5a397385843b8a.jpg)](https://live.staticflickr.com/65535/50521463667_0c7a344961_k.jpg) [![Ghost of Tsushima - Concept Art](media/2f5f4a25ffee6539b8ab1ca0bf8b8df9c9c79cbe1abce1bbb9682cf2e2777084.jpg)](https://live.staticflickr.com/65535/50521463582_52f26e8b14_k.jpg) [![Ghost of Tsushima - Concept Art](media/a7ba2d42593f95ec98d88b3457184aa458fa37592ac296bdb9414433bc9339de.jpg)](https://live.staticflickr.com/65535/50521463197_31a5300835_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/b7d96d6af368a388ff74cedb51b85d8971d76c5b57edf1429edd4fdbaf79c2ca.jpg)](https://live.staticflickr.com/65535/50521284726_bab082f4fd_k.jpg) [![Ghost of Tsushima - Concept Art](media/ef69b2950a073f797d86cf762bfb3a810d0df2fce77d9f53646042d5b1e41668.jpg)](https://live.staticflickr.com/65535/50520563193_baf11e06c5_k.jpg) [![Ghost of Tsushima - Concept Art](media/de4c65c1ea787670d6d18d6be582541fd9411edd66acb4897f99df0439496bb5.jpg)](https://live.staticflickr.com/65535/50521286591_f50ea0e99f_k.jpg)\n\n## **Environments**\n\nFirst and foremost, we wanted to create a visually stunning game, and working in a historical setting can often be tricky to find the right balance for accuracy. We always had to think about what to keep historically accurate, and when to break away. ‘Realistic’ is not a word we like using here, our goal was to make sure the game had a sense of style, even though we were making a historical epic. We wanted to create a world that feels like 1274 Japan, but at the same time be more expressive with it. This came in many forms, like bold color choices, stark environment themes, impressive set-ups for the player to stumble upon, etc. In general, what ends up in the game is often a toned-down version of the concepts, so it was important for us to really push and crank up the themes and colors from the concept stage to ensure it was delivered more evidently in the final game.\n\n[![Ghost of Tsushima - Concept Art](media/263986c8daae167267086623e7f041b2915cc45d2ef7a2cd803d4bc5e6dbf7c0.jpg)](https://live.staticflickr.com/65535/50521302121_3da4de4c35_k.jpg) [![Ghost of Tsushima - Concept Art](media/6ec16e2ebdeed7b9a89eb9ddff8c80fcd3d64e4e664a2d29c03a0eae1267d8a7.jpg)](https://live.staticflickr.com/65535/50521302051_d26d23eb17_k.jpg)\n\nWe did a lot of research when it comes to the architecture of the game, from farmsteads, towns and castles to shrines and temples. A lot of the references available online are from later periods and there are not a lot of details on the Kamakura era, which made it a little tricky. We were truly fortunate to have gotten support from Japan Studio as well as cultural experts during production. The Yayoi architecture style in the Toyotama region of the game was unique and hardly seen in other media. It feels very old, ancient looking, and historically works well too since it predates 1274.\n\nAfter building a defined architecture ruleset, we used this to then create interesting themes for the towns, such as the medicine town of Akashima, the Straw Hats hideout of Umugi, and the hot springs of Hiyoshi, to name a few. In general, we would start conceptualizing a town by getting the general narrative and theme set, putting together reference and mood boards that showcased those thematic elements, and then starting to concept the general look and feel and mission beats.\n\n[![Ghost of Tsushima - Concept Art](media/eff988decddbe63b661b1e0343af4cb07597fac4028e9c2669e9d258c0f56b85.jpg)](https://live.staticflickr.com/65535/50521479247_51889a8e2c_k.jpg) [![Ghost of Tsushima - Concept Art](media/8d5422e970a69c29f7f7f537edf0450e416721a5c272f431a6979bc512dc8441.jpg)](https://live.staticflickr.com/65535/50521301956_77cfd1155c_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/ea5847fb5ce596de2f432f3763044eb396bdebb2c63a83e4e6a8870e72ba7c36.jpg)](https://live.staticflickr.com/65535/50521479132_f4119731be_o.jpg) [![Ghost of Tsushima - Concept Art](media/fd7ee146fe455b15d7b771fa90b28b71daf7071f4f19caa45f672f75d247522a.jpg)](https://live.staticflickr.com/65535/50521479107_5255f145f6_k.jpg)\n\nLet’s look at the early development of Akashima as an example. We knew we wanted a town that represents healing with a sense of mystery to its identity. We started brainstorming and hunting down lots of references of traditional ancient Japanese medicines and healing techniques together with interesting rural villages and towns, to then doing visual layouts and concept iterations. We wanted the town to look as if there’s generations of teachings being passed down with a peaceful and serene, yet eerie and mysterious feel. We achieved this by having props and set dressing that evoke those feelings such as the white statues, the paper plastered around the walls, the white stone ground, bird cages, foggy time of day, and having the white skunk-cabbage biome be a part of the town. This all helped emphasize the mysterious and bleached color theme across the town to make it memorable and different from other parts of the game.\n\n[![Ghost of Tsushima - Concept Art](media/08342e499270091d66131782f6f4452af97f1a5a11143a0360e8df5ff51212e4.jpg)](https://live.staticflickr.com/65535/50520577273_82fcea4ac6_k.jpg) [![Ghost of Tsushima - Concept Art](media/7fbedc63db3aaaee48539295a5a29b82c1c884ce67531924c20d2778a19b4b8c.jpg)](https://live.staticflickr.com/65535/50520577243_ec50f00efc_k.jpg)[![Ghost of Tsushima - Concept Art](media/50b2051f42c07da1b4f800fd4b48c2e867010c383975df7d0497862bfde4bc15.jpg)](https://live.staticflickr.com/65535/50521301791_82a988843b_k.jpg)\n\nWe had the most creative and expressive time when coming up with biome ideas, since biomes, for the most part, are purely for visuals. The concept and environment team came together to brainstorm ideas to help keep each prefecture unique across the island. That involved taking the main key elements of the biome and cranking that up a lot while reducing other less important aspects. This helps make the biome visually striking and memorable, which helps differentiate from other locations. The goal here was to be an expressive art form, and not to mimic what it would look like in the real world.\n\n[![Ghost of Tsushima - Concept Art](media/09e8a949b971d5ed4854790a4511496a0f6812c7d37f92096f979abc5971091d.jpg)](https://live.staticflickr.com/65535/50520577188_6d3d326df6_k.jpg) [![Ghost of Tsushima - Concept Art](media/43721e49fd8882fe868a119da56db0628c7aa09ce92442bd9b6db599675936d4.jpg)](https://live.staticflickr.com/65535/50521478982_d805e93175_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/56f9add99f34e4140dd5dc82f0ea1f3f119e81a9958a552daf215433c712c0ec.jpg)](https://live.staticflickr.com/65535/50521301646_4ae9acf01e_k.jpg) [![Ghost of Tsushima - Concept Art](media/dca5e4b9185a00ffc998d09551879a0baec2c191a2d2b8b3fd0a596b462b8d32.jpg)](https://live.staticflickr.com/65535/50521301516_5eb4dd60fa_o.jpg)\n\nMongolian architecture and aspects in the game shows areas of occupancy, which primarily consists of traditional yurts, props & set dressing as well as signs of destruction. Farmsteads and war camps are where we show most of the Mongolian themes and we intend to show oppression towards the population of Tsushima together with scarring of the Japanese architecture and landscape. Examples would be showing trampled grass, ruined rice paddy fields, and destroyed and ransacked Japanese buildings.Most Mongolian assets are quite different from Japanese assets, and mainly consist of wooden makeshift structures, fur, and pelt props as well as their unique banners, to name a few. This creates a strong differentiation when you come across an untouched area compared to an occupied one.\n\n[![Ghost of Tsushima - Concept Art](media/2adfb33453d992f1a256d0dfe29cd8c4ae79e3a8f4b1ef04badef9701e60fa81.jpg)](https://live.staticflickr.com/65535/50520577773_137092821a_k.jpg) [![Ghost of Tsushima - Concept Art](media/a5d229721f363c4430c83dcd4f5ec618414cb54f7a3e2fee50aa8c2682a9164f.jpg)](https://live.staticflickr.com/65535/50521479442_73047d710f_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/dcfb0467f00b33ad80edb960c7b3f07ca2de0425a11fc5aaa8b845b2077f9580.jpg)](https://live.staticflickr.com/65535/50521478882_0a05f71bdb_k.jpg) [![Ghost of Tsushima - Concept Art](media/ffd8ad7600d1d11916b11257bd5f65144249804f577915c978db59f163ff3f54.jpg)](https://live.staticflickr.com/65535/50521302131_6d3bee6674_k.jpg)\n\n## **Visual Identity**\n\nEarly on, we knew we wanted to head toward a more modern and classic aesthetic compared to keeping things purely traditional. Old samurai movie posters, modern and traditional graphic design and packaging were key inspirations when concepting early mockups. We incorporated this look into our UI, logos, 2D cutscenes, and even our merchandise and marketing materials. Below are some concepts we explored for the steelbook cover as well as the end credits sequence.\n\n[![Ghost of Tsushima - Concept Art](media/5c24bd07d59134bdf3758db6bdf765d0a96e6296e0b70442cb8f344c6da528b5.jpg)](https://live.staticflickr.com/65535/50520654298_e9a1979e9e_k.jpg) [![Ghost of Tsushima - Concept Art](media/e3d6462e3e28e7ac309b5388b139f87b0ef4f32cf3189ee5977376cb3febef1b.jpg)](https://live.staticflickr.com/65535/50521378286_4df3f1aa88_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/09b5901d6e7d803dd7eccb71043c108bddc154a0067cc90db63d4530b23e1723.jpg)](https://live.staticflickr.com/65535/50521556172_222746cc78_k.jpg) [![Ghost of Tsushima - Concept Art](media/a9761b2091607c6a07737066660415802bbcb326f4be0d647255a3d6ea1a0638.jpg)](https://live.staticflickr.com/65535/50521378206_9bcb615903_k.jpg)\n\nOur 2D ink cutscenes were a fun aspect of the game we worked on. We skewed away from the traditional sumi-e feel and went with a starker and more aggressive look. Using fewer soft edges and thin ink, and more contrast, hard edges, graphic, and thick brush marks. These began with receiving the narrative and script, then storyboarding it out, fully painting each frame, and lastly handing it off for animation and post-production.\n\n[![Ghost of Tsushima - Concept Art](media/9f6471d25b31148f505ef948be750871e2c50a551cde166b11d54e888a82821e.jpg)](https://live.staticflickr.com/65535/50520654188_9334f46498_k.jpg) [![Ghost of Tsushima - Concept Art](media/7d138348fee4a3c4a7cdf4b87ea0ad91f93e3e6b909703a171b95554ca631cb5.jpg)](https://live.staticflickr.com/65535/50521556062_c7a61397c0_k.jpg) [![Ghost of Tsushima - Concept Art](media/87c151efe3119f65ac326c8ca1beb6c0f141ec4d05eaf7ba4aa97865c05d8cfb.jpg)](https://live.staticflickr.com/65535/50520654098_89663385ca_k.jpg)\n\n[![Ghost of Tsushima - Concept Art](media/50c18be74440c1d41e7d30ee487b572bc33620eaac2a717eddda70b1b025c389.jpg)](https://live.staticflickr.com/65535/50521555977_20eab8c1f0_k.jpg) [![Ghost of Tsushima - Concept Art](media/4270a5f6935375491bb47b56235eb706c0d5edd61364662b9fb9262e18a401e4.jpg)](https://live.staticflickr.com/65535/50521555927_a8db005fa9_k.jpg) [![Ghost of Tsushima - Concept Art](media/7ce02adde50854d4c4d047c4fd15856ad78c12c9305af5d4a376f638a8ddea36.jpg)](https://live.staticflickr.com/65535/50521378361_428e9dc94c_k.jpg)\n\n## **Final Thoughts**\n\nConcept art is just one part of the entire development process that starts from the very beginning. When designing the look of Ghost of Tsushima, we worked together with artists from various departments and came together to bring our unified vision to fruition. Achieving that vision was a team effort, with talents from 3D character and environment, texture, lighting, tech, designers, animation, UI, visual effects teams, and more.\n\nI hope you enjoyed this little glimpse of how the concept team helped visualize our world of Tsushima!\n\n[![Ghost of Tsushima - Concept Art](media/219749faeecc73019158be3ccc5cc5ad1a3c044cd1d864890a5df765a9fe2839.jpg)](https://live.staticflickr.com/65535/50521402886_019851263d_k.jpg)", "excerpt": "Hi! My name is Ian Jun Wei Chiew, Lead Concept Artist at Sucker Punch Productions, and I was fortunate enough to have worked on Ghost of Tsushima since the very beginning. Ghost of Tsushima is set", "readingMinutes": 25, "images": [{"src": "media/8d763ec3039c31b2fd15e028905ad7eee0ad9234361c21580d9e7b98c450208a.jpg", "alt": "From brush to blade: The concept art process behind Ghost of Tsushima"}, {
