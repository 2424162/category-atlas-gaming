 her sleepy backwater town of Blue Moon Lagoon, or “Big Suck” as its colloquially named by the three friends.\n\nShe’s extremely passionate and endlessly knowledgeable about music of all kinds – obscure and pretentious – but undeniably charming in her delivery. Her character oozes enthusiasm that’ll feel relatable to music fans, from the big songs that make her titular mixtape to passing comments about analogue music production and certain stereos to the (stellar) opinion that Portishead’s debut album is a triumph. It’s a love letter from Stacey to you – often directly into camera – about the experiences we have and the way we remember them.\n\n![](media/f747e4978498c47107d87e59d85796f339f4544fd10bda3d78a7fac7513e49a4.jpg)\n\n*Mixtape*’s gameplay is made up of a series of light interactive experiences that allow you to focus on the narrative at hand. The core story plays out across different locations with thematic soundtracks, and from these spots, you’ll peek into Stacey’s past memories, all of the decisions and debauchery that brought them through their formative teenage years and up to this very night.\n\nIn one memory, you’ll headbang on a drive to Silverchair by pressing buttons along to the beat, and in another, you’ll pose in a photo booth and click the shutter while Harper’s Bizarre plays alongside. Some sections are designed to carry you along a narrative beat, like a high-octane sequence that follows the trio careening down a highway in a shopping trolley while Rainbow’s ‘Sensitive to Light’ is blasting (a song I never thought I’d hear in a video game).\n\n![](media/5c4bc6ed231ff93afd74ae77bee1978acaec0075c8e43c28c52985b9e016ccdd.jpg)\n\nA personal highlight for me was hitting baseballs along to one of my personal all-time favourite songs (which I won’t spoil), introduced by a borderline pompous Stacey Rockford monologue that could rival my own. The inclusion of this song specifically punctuates a deeply personal experience – while these might not be life-changing songs for you – most of us have songs that can transport us back to a time and place in an extremely visceral way, and *Mixtape* captures that masterfully.\n\nOther sections are longer, and hand some light exploration over to players. One delightful sequence takes you on one special night through an abandoned dinosaur park, where the trio rides into a hopeful sunset on the back of a giant sauropod, dreaming up future plans and mapping out the rest of their lives.  It’s this scene that particularly accentuates what Mixtape is about: A dreamlike, melancholy snapshot of how it feels to be young, and what it means to have to grow up.\n\n![](media/071420688f0dc77c4cf06534080efd3be633e7b8559e1d2c42073f6b47cfaf22.jpg)\n\nBottling that notion is what makes *Mixtape* feel truly special. It’s a spectacle, that plays out like a film rather than a traditional video game, operatic in parts and solemn in others, but it doesn’t lose sight of actually being interactive. There’s something for you to do in almost every sequence, be it steering a skateboard down a hill, choosing flavors at the slushy machine, or manually wrapping two wet tongues around each other in a kissing mini-game I never want to think about again in my life. Every mechanic you encounter feels lovingly crafted specifically for the moment it accompanies, making you a part of these vignettes, rather than just a spectator. It’s a joyful, magical celebration of music like nothing I’ve ever seen, and a gorgeous, ethereal experience that needs to be seen to be truly appreciated.\n\n![](media/12948b2479b1d0afa39dbf59393a95dd56ed3c796dd55d46d472b599e6a9439b.jpg)\n\nThere are indeed, a lot of rules to making a Mixtape, but maybe, for one night, wouldn’t it be better to make your own?\n\nDevo was right – everybody wants a good thing too, and you can have it, when ***[Mixtape](https://www.xbox.com/en-us/games/store/mixtape/9nh0msg29x6l)*** launches today, available on Xbox Series X|S, Xbox on PC and Xbox Cloud as an Xbox Play Anywhere title, and playable with Xbox Game Pass.", "excerpt": "As author Nick Hornby once wrote in his seminal novel ‘High Fidelity’: “Making a tape is like writing a letter – there’s a lot of erasing and rethinking and starting again…” and I think that same l", "readingMinutes": 7, "images": [{"src": "media/a8b2ca96fe22bd7469fc9a378273f1af47789fd45502a0e66b19b1d33bcbb5c6.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/fe114738d8e483badc66d5e00709fe112b64cc4c708842ba54b8d39043ee42c3.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/a50d51ae3c0f6067518c5922e2905c27312325ba0cb87e0f1cf90b3a4f6a3b86.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/f747e4978498c47107d87e59d85796f339f4544fd10bda3d78a7fac7513e49a4.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/5c4bc6ed231ff93afd74ae77bee1978acaec0075c8e43c28c52985b9e016ccdd.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/071420688f0dc77c4cf06534080efd3be633e7b8559e1d2c42073f6b47cfaf22.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}, {"src": "media/12948b2479b1d0afa39dbf59393a95dd56ed3c796dd55d46d472b599e6a9439b.jpg", "alt": "Mixtape: Decks, Debauchery and Dreams Carry This New Narrative Experience, Out Now with Game Pass"}], "cover": "media/a8b2ca96fe22bd7469fc9a378273f1af47789fd45502a0e66b19b1d33bcbb5c6.jpg"}, {"id": "c1944ddbf5104186057478e5", "title": "Riding on Community Feedback, Descenders Next Gets Bigger with the Grand Tour Update", "summary": "I’m here to share the next news for Descenders Next, alongside a big thank you to our community for their continued help and support.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/06/riding-community-feedback-descenders-next-grand-tour-update/", "publishedAt": "2026-05-06T17:00:00+00:00", "author": "Mike Nelson, XBOX Wire Editor", "markdown": "![Riding on Community Feedback, Descenders Next Gets Bigger with the Grand Tour Update](media/6c53f09cfd1799f0650659a9c302607ac389d2acd39dc5f0eea798440294d1c2.jpg)\n\n### Summary\n\n- The Grand Tour Update for *Descenders Next* adds new challenges, locations, and features like Career Mode.\n- All of our big updates have been led by our *Descenders* community, and we can’t thank you enough for the love and constant feedback you’ve been giving us.\n- [*Descenders Next (Game Preview)*](https://www.xbox.com/en-US/games/store/descenders-next-game-preview/9N66JJQFX3RX/0010) is available now on Xbox Series X|S, Xbox on PC, Xbox Cloud, and with Game Pass.\n\nAs you may know, we’ve had massive success with the original ***Descenders***. To this day it’s still one of our most popular games ever. The core of its success boils down to its unique formula and all the fun features you enjoy the most. We’ve been taking [***Descenders Next (Game Preview)***](https://www.xbox.com/en-US/games/store/descenders-next-game-preview/9N66JJQFX3RX/0010) in the same direction – everything you’ve enjoyed about the original, but bigger and better. Today, I’m here to share the *next* news for *Descenders Next*, alongside a big thank you to our community for their continued help and support.\n\nThanks to your feedback, we’ve made some great changes to *Next* so far and the *Descenders* formula is working better than ever. We’ve already brought some big community-driven updates, including bringing back the classic Career Mode, a familiar way to earn gear, further Multiplayer additions, and much more! But it turns out we weren’t *quite* finished adding things into our maps just yet…\n\n![Descenders Next Screenshot](media/cfb752818546015b23640e3f3279747cf9592eddd70924e1c356e39c66b294e7.jpg)\n\nWe’ve been keeping a close eye on our socials and chatter with *Descenders Next*, and that’s given us some big inspiration with our future updates and how we want to go forward with development of the game. We wanted to prioritize bringing these changes to the game now over our initial plans — we know you’ve expressed how much you’d like to see some classic *Descenders* features make a return in *Next*.\n\nAnd that brings us to the Grand Tour Update**.** Our Grand Tour challenges were a hit in *Descenders* (and still are!), and we wanted to give you the chance to experience them again in *Nex*t. In the Grand Tour Update, we’ve smashed together both the Career Mode and the Grand Tour to give you a new way to unlock Parks, Slopestyles, and Races!\n\n![Descenders Next Screenshot](media/81a16ef3be9a8f4938f293c385db926ad3c9f0de671bae041d5b580d1e7bbf25.jpg)\n\nThis is very much an update for you the players – we want to bring back the *Descenders* familiarity with progression and challenges, which we know is a big thing for our community, so we think you’re all going to have a great time with this one! Once you log in after the update goes live, you can find all the locations you’ve unlocked so far from the Grand Tour menu, beat extra challenges, unlock medals and trophies, and even play the locations at dusk and at night. We’ve also included spectator mode for multiplayer, so you can sit back and enjoy the show!\n\nWe aren’t stopping there though. Since launch, we’ve seen lots of chatter in bringing back a popular mechanic from *Descenders*, which honestly, we think is a great feature too. If you’ve been enjoying jumping from extreme heights but not enjoying the leg-crushing landings, we’ve popped in a solution for you – Counter Pumping has made its way to *Next* to help you land softer on some of those harder jumps. Just give your right stick a flick with good timing, and your rider will be safe!\n\n![Descenders Next Screenshot](media/47ec8bb4288446ff8a50aaf7d905ca907398bfd14d51517e4296c33bd9b4cd10.jpg)\n\nThere’s still so much to explore with *Next* and we’re so glad you’re having a great time with it. Enjoy the new locations, hanging out with your friends, and some potentially softer landings! All of our big updates so far have all been led by our *Descenders* community, and we can’t thank you all enough for the love and constant feedback you’ve been giving us with [***Descenders Next* (Game Preview)**](https://www.xbox.com/en-US/games/store/descenders-next-game-preview/9N66JJQFX3RX/0010). We’re super pleased the game is shaping to be the best it can with every update, and it’s all thanks to you. We’ve got loads more to come – we’ll see you *Next* time!\n\n---\n\n---", "excerpt": "Summary\n\n- The Grand Tour Update for  Descenders Next  adds new challenges, locations, and features like Career Mode.\n- All of our big updates have been led by our  Descenders  community, and w", "readingMinutes": 5, "images": [{"src": "media/6c53f09cfd1799f0650659a9c302607ac389d2acd39dc5f0eea798440294d1c2.jpg", "alt": "Riding on Community Feedback, Descenders Next Gets Bigger with the Grand Tour Update"}, {"src": "media/cfb752818546015b23640e3f3279747cf9592eddd70924e1c356e39c66b294e7.jpg", "alt": "Descenders Next Screenshot"}, {"src": "media/81a16ef3be9a8f4938f293c385db926ad3c9f0de671bae041d5b580d1e7bbf25.jpg", "alt": "Descenders Next Screenshot"}, {"src": "media/47ec8bb4288446ff8a50aaf7d905ca907398bfd14d51517e4296c33bd9b4cd10.jpg", "alt": "Descenders Next Screenshot"}], "cover": "media/6c53f09cfd1799f0650659a9c302607ac389d2acd39dc5f0eea798440294d1c2.jpg"}, {"id": "9f929a9348c334b98dbd49cf", "title": "Inside the Design of Phasmophobia’s Player Character Update", "summary": "Phasmophobia's Art Director goes into the thinking behind its extensive new player characters update, in anticipation of 1.0 later this year.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/05/phasmophobia-player-character-update/", "publishedAt": "2026-05-05T15:00:00+00:00", "author": "Will Fulton, XBOX Wire Editor", "markdown": "![Inside the Design of Phasmophobia’s Player Character Update](media/5bde4215edb446d9bee9a0e2191cbf0b8c62b565c53c6f5a15911febe5a1ef01.jpg)\n\n### Summary\n\n- Co-op horror paranormal investigation game *[Phasmophobia](https://www.xbox.com/en-us/games/store/phasmophobia-game-preview/9n6d60sbzn05)* launches its next major update on its road to 1.0.\n- The game’s Art Director goes into detail on the new Player Character Update, which introduces avatar customisability for the first time\n- The update also features many immersion enhancements, such as seeing your own body, seeing teammate equipment at a glance, and improved death animations.\n\nThis year, *Phasmophobia* is coming up to its sixth birthday in Early Access, and finally approaching its full 1.0 release. In that time, the game has grown and evolved in ways we couldn’t have imagined at the start. I joined early on in that journey, when things were still new and felt a little experimental. Since then, we’ve expanded and improved almost every part of the game, from new ghost types and equipment, to complete overhauls of existing maps. These improvements are all part of our final vision for the game when it releases into 1.0 this year, but some parts, such as the player character system, still remain largely unchanged.\n\nWe first started thinking about reworks, including the player character system, nearly five years ago with the intention of making the experience of playing *Phasmophobia* more realistic. Now, as we approach full launch, it felt like the right time to finally tackle it.\n\n![Phasmophobia screenshot](media/50e3febf2b90e4ef0c14fea7ae46ba5380f7521fb304c13e8e7ff2e6742cac6c.jpg)\n![Phasmophobia screenshot](media/3867ede161281793e01b9612c849a3824597c2b8936a17a91db257a38a5bf431.jpg)\n\nOne of the biggest changes is also the simplest: you now have a body!\n\nFor the first time, players can now look down and see legs, move through environments in a way that feels more physical, and hold equipment properly. Equipment is now visible on your character when it’s not in your hands, so you can quickly see what your teammates are carrying without needing to ask. Also, the flashlights are no longer stuck in place as players have a left hand –  which makes a bigger difference than you’d expect when moving through a dark place mid-investigation.\n\nWe wanted it to feel like you’re actually in the game rather than just floating through a space, as this will ultimately help players feel more immersed in the world.\n\nWe’ve also moved away from some of the ‘visual quirks’ of the old system. Loved by many, the ‘bendy backs’ and odd movements had their charm, but they could break the tension at the wrong moment. We of course want players laughing with each other, but not at what is happening on screen. The horror immersion works best when it is more realistic, and should make the scarier moments easier to digest without someone bending in half next to them.\n\n*Phasmophobia* works best when you’re communicating, reacting, and figuring the investigation out together. When you can easily read what your teammates are doing and feel more present in the space, the experience clicks in a different way.\n\n![Phasmophobia screenshot](media/283be1bd72edd58d526bae2e83603159c1ae054e83f4fd15dd302e9dad570121.jpg)\n![Phasmophobia screenshot](media/e1dd2545e47355cbbb3b0529f399a968c1e2370aef3a8e3c8946f9d74e7ecdf3.jpg)\n\nCustomisation was another big focus. Before, you would often see multiple of the same character repeated in a lobby, and this system didn’t give much room for individual player identity. Players have loved expressing themselves with the existing ID cards backgrounds and badges feature, so with this rework, we wanted to open that up further, so investigations feel more personal.\n\nThere is now much more variety for customisable elements, which goes a long way in a co-op game. Hair colour and outfit options are just the start, and we’ll be expanding this over time with more choices.\n\nAlongside this, animation has been a major area of improvement. We wanted movement to be more believable across the board whilst also giving certain moments more impact – especially death. The team have completely reworked the death animations: dying in a *[Phasmophobia](https://www.xbox.com/en-us/games/store/phasmophobia-game-preview/9n6d60sbzn05)* game should feel like a whole moment in itself, and this is something we will continue to build on as we introduce new ghosts later on.\n\nA lot of the work on this update has been behind the scenes, and it’s easily been one of the more complex tasks we’ve taken on. It’s been a big milestone for the team, and one we’ve been thinking about for years. Seeing it all come together has been incredibly rewarding, and it’s only the beginning of pushing the horror experience as we head towards 1.0 and beyond.\n\nWe’re really excited for players to jump in and experience these new moments, even if it means dying a little more and losing some of their hard-earned equipment along the way.", "excerpt": "Summary\n\n- Co-op horror paranormal investigation game     launches its next major update on its road to 1.0.\n- The game’s Art Director goes into detail on the new Player Character Update, which", "readingMinutes": 6, "images": [{"src": "media/5bde4215edb446d9bee9a0e2191cbf0b8c62b565c53c6f5a15911febe5a1ef01.jpg", "alt": "Inside the Design of Phasmophobia’s Player Character Update"}, {"src": "media/50e3febf2b90e4ef0c14fea7ae46ba5380f7521fb304c13e8e7ff2e6742cac6c.jpg", "alt": "Phasmophobia screenshot"}, {"src": "media/3867ede161281793e01b9612c849a3824597c2b8936a17a91db257a38a5bf431.jpg", "alt": "Phasmophobia screenshot"}, {"src": "media/283be1bd72edd58d526bae2e83603159c1ae054e83f4fd15dd302e9dad570121.jpg", "alt": "Phasmophobia screenshot"}, {"src": "media/e1dd2545e47355cbbb3b0529f399a968c1e2370aef3a8e3c8946f9d74e7ecdf3.jpg", "alt": "Phasmophobia screenshot"}], "cover": "media/5bde4215edb446d9bee9a0e2191cbf0b8c62b565c53c6f5a15911febe5a1ef01.jpg"}, {"id": "ad2d8d4ec490dc955abcb925", "title": "Accessibility in our Cozy Punk Game, Wax Heads!", "summary": "Learn about the thoughtfully implemented accessibility features for cozy punk record shop game Wax Heads, available today on Xbox Series X|S and PC.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/05/wax-heads-accessibility/", "publishedAt": "2026-05-05T14:00:00+00:00", "author": "Will Fulton, XBOX Wire Editor", "markdown": "![Accessibility in our Cozy Punk Game, Wax Heads!](media/d855fed8e5c806789304e9194760432c5dc3baae70fef82502a21baec729d758.jpg)\n\nWe wanted to share a clear overview of how we’ve made *[Wax Heads](https://www.xbox.com/en-US/games/store/wax-heads/9N1K3MJ9MQG8/0010)* easier to play for more people! Accessibility is incredibly important to us, and we want everyone to enjoy the experience. Here’s how we approached it:\n\n## **01 – Language**\n\nLanguage is an accessibility feature. Many games rely heavily on English, which can be a barrier in story-driven experiences.\n\n*Wax Heads* is available in English plus four additional languages. All essential gameplay text is translated, and when images contain important embedded text, you can view it in your selected language.\n\nWe chose not to translate record covers, song titles, or band names, as they’re typically presented in their original language in real record shops. However, liner notes and any text relevant to gameplay are translated.\n\nWhen a band plays at a concert, the lyrics are synced to the music in their original language – but if you’ve chosen a different language, the translation shows up just below, so you can follow along in both at the same time!\n\nPatattie Games is just two people. A Spanish woman and a Scottish guy. Localization matters a lot to us personally. We really wish we could cover more languages, and hopefully we’ll be able to add more in the future.\n\n## **02 – Skipping and Difficulty**\n\nDifficulty is one of those accessibility topics that doesn’t always get talked about, but it matters just as much as anything else. Not everyone plays games the same way, and for some people the challenge itself – not the story, not the characters, not the music – is what gets in the way.\n\nEvery minigame can be skipped. If one is getting in the way of the story, you can skip it and move on. Skipping may change the text outcome slightly in future conversations, but there are no extra penalisations.\n\nRecord recommendations are the heart of the game. There are two modes:\n\n- Original mode – one shot per customer\n- “The customer is always right” – unlimited tries, no penalisation\n\nThe second mode is great if you have a low frustration tolerance, want more breathing room, or enjoy exploring every record before making your pick. You can keep trying until you find the perfect match, or move the conversation on whenever you feel ready. Both ways of playing are equally valid.\n\n![Wax Heads screenshot](media/1c42854ab04cfac79938d707c3a3aff6d273d1aa3a1dafc5480f12ca789e08e4.jpg)\n\n## **03 Fonts and Reading**\n\nThe game’s default fonts are already on the readable side: clean, sans-serif! But for people with dyslexia, even a well-designed standard font can make reading harder than it needs to be.\n\nWe include two fonts specifically designed to help with that:\n\n- OpenDyslexic 2\n- Atkinson Hyperlegible\n\nBoth can be switched on in the settings at any time. Because the game leans so heavily on reading, we felt it was important to get this right. If you have dyslexia, we wanted you to be able to enjoy that side of the game without the extra effort of fighting the text.\n\n![Wax Heads screenshot](media/572535758dfe68e6e7662ea06693840805682dcc27e6549a4ef1803b0bfb474f.jpg)\n\n## **04 – Playing Your Way**\n\n### **Button interactions**\n\nWe tried to make every interaction simple enough that you can play the game using just a mouse and a single left-click, or a touchscreen.\n\nSomething that feels completely natural to many people (like moving the left stick while holding a button, or controlling two sticks at the same time) can be hard or even impossible for others. We kept that in mind when designing every interaction, and we avoid any mechanics that require pressing or holding multiple inputs at the same time.\n\nFor items you can pick up and move, the game adapts to how you interact. Click and hold to drag; or just perform a single click and the item follows your cursor until you click again to place it – no holding needed. The game reads your intent and responds.\n\n![Wax Heads screenshot](media/83a2bf9afcdda64b7f1cfffc76af338feeceb63a1f4253528576490230fe29e7.jpg)\n\n### **Cooperative play**\n\nSome people may find it hard to handle all the interactions on their own. A second person can plug in their own controller and their inputs combine with yours. It’s not a co-op mode itself – it’s more like having someone by your side when you need it, while you still have the full experience of playing the game!\n\n## **05 – Everything else**\n\n### **Stick vs D-pad**\n\nThe D-pad is a full alternative to the analog stick: it works for menus and anywhere in the game where you’d normally move a cursor or navigate.\n\n### **Virtual cursor pointer sensitivity**\n\nIn the few places where a virtual cursor is the right tool for the job, you can adjust how fast the pointer moves in the settings to match what feels comfortable. Your regular system mouse pointer is not affected.\n\n### **Adapted controllers**\n\nThe game works with adaptive hardware (such as the Xbox Adaptive Controller) as long as it is registered as a controller and follows the SDL standard.\n\n### **Seeing things clearly**\n\nWe made buttons, arrows, and key icons bigger than usual, and paired them with clear symbols so they don’t rely only on shape or colour to communicate meaning. Focused elements get a bright frame if they’re interactive so they’re easy to spot.\n\nWhen you’re using a controller, objects show the button you need to press to interact with them – reducing the mental load of keeping track of controls. Button prompts are on by default, and you can turn them off if they become visual noise.\n\nWe spent a lot of time making sure important elements stand out clearly from their backgrounds, checking contrast ratios against accessibility standards.\n\n![Wax Heads screenshot](media/c8c17d329df59ac39c58bb38fe580d9a19b1d9011e9f95c6c1e3a9808653f98f.jpg)\n\n### **Tutorials and help**\n\nThe tutorial is a small zine available in the in-game store that explains the core mechanics in plain language. It’s easy to find and read – not interactive, but clear and friendly. It also reminds you of the core loop and the things you’ll do most often, which can be helpful if you find it difficult to retain instructions or just want a quick refresher!\n\nThat’s all for now. We really hope you enjoy *[Wax Heads](https://www.xbox.com/en-US/games/store/wax-heads/9N1K3MJ9MQG8/0010)*!", "excerpt": "We wanted to share a clear overview of how we’ve made     easier to play for more people! Accessibility is incredibly important to us, and we want everyone to enjoy the experience. Here’s how we ap", "readingMinutes": 7, "images": [{"src": "media/d855fed8e5c806789304e9194760432c5dc3baae70fef82502a21baec729d758.jpg", "alt": "Accessibility in our Cozy Punk Game, Wax Heads!"}, {"src": "media/1c42854ab04cfac79938d707c3a3aff6d273d1aa3a1dafc5480f12ca789e08e4.jpg", "alt": "Wax Heads screenshot"}, {"src": "media/572535758dfe68e6e7662ea06693840805682dcc27e6549a4ef1803b0bfb474f.jpg", "alt": "Wax Heads screenshot"}, {"src": "media/83a2bf9afcdda64b7f1cfffc76af338feeceb63a1f4253528576490230fe29e7.jpg", "alt": "Wax Heads screenshot"}, {"src": "media/c8c17d329df59ac39c58bb38fe580d9a19b1d9011e9f95c6c1e3a9808653f98f.jpg", "alt": "Wax Heads screenshot"}], "cover": "media/d855fed8e5c806789304e9194760432c5dc3baae70fef82502a21baec729d758.jpg"}, {"id": "40996665e94a6ff2c731349a", "title": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media", "summary": "Hello! Today I’m excited to share some exclusive details about our next story arc, Children of Krypton. The teams at Dimensional Ink and Daybreak Games have been hard at work on this new adventure, which centers on a fan-favorite DC character who’s been gaining serious momentum in pop culture: Kara Zor-El, better known as Supergirl.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/05/01/dc-universe-online-supergirl-story-arc-evolving-state-of-superhero-media/", "publishedAt": "2026-05-01T17:00:00+00:00", "author": "Mike Nelson, XBOX Wire Editor", "markdown": "![DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media](media/c475459c116f4c3bd168765b82492831d27f3049158448312c6e2c115bbbe3fd.jpg)\n\n### Summary\n\n- ***[DC Universe Online](https://www.xbox.com/en-US/games/store/dc-universe-online-for-xbox-one/C59QBPB8P1XJ/)***’s upcoming story arc, Children of Krypton: Shadows Over Argo, centers on Supergirl’s pursuit of the villain Kryb.\n- Argo City’s location is at the bottom of the Atlantic Ocean – and the Atlantic means Aquaman!\n- *Children of Krypton: Shadows Over Argo* launches for *DC Universe Online* in June 2026 on Xbox One and Xbox Series X|S.\n\nHello! Today I’m excited to share some exclusive details about our next story arc, Children of Krypton. The teams at Dimensional Ink and Daybreak Games have been hard at work on this new adventure, which centers on a fan-favorite DC character who’s been gaining serious momentum in pop culture: Kara Zor-El, better known as Supergirl.\n\n![DC Universe Online Supergirl Model](media/61c038e027605fddddba120ef909d4bc909b37e8951c73a6e848e8d89d5c2b8f.jpg)\n\nWe recently wrapped our first story arc, [Light and Rain](https://www.dcuniverseonline.com/light-and-rain?chapter=1), a four-chapter narrative released over the course of a year. That story explored themes of loss, regret, and redemption, and this new multi-chapter approach has given us the opportunity to tell more nuanced stories with higher emotional stakes and deeper character development. Children of Kryptonbuilds on that foundation, beginning with its first chapter, Shadows Over Argo.\n\nAt the end of Light and Rain, players discovered a newfound evil, Kryb, a monstrous figure from the Lantern storyline and a long-standing enemy of Guy Gardner. In this new arc, Supergirl is going to be the star of the show and pick up where Guy left off. The two share a history through the Lantern Corps, particularly during Supergirl’s time as a Red Lantern, and that connection drives her pursuit of Kryb back to Earth. Her search ultimately leads her to Argo, now resting at the bottom of the Atlantic Ocean.\n\n- ![DC Universe Online Kryb Screenshot](media/e802bb0a195c3520e3a9e1816de980f672617e97eeb397f8b96ce5aa8cf7c8b2.jpg)\n- ![DC Universe Online Kryb Screenshot](media/d4c7e245a2a9e393ae33172fc9325afe2ea9ebae4a9ce39e7a3d49830f8ac4c3.jpg)\n\nSupergirl has always been one of my favorite characters. When I met my wife, she was also a huge fan and had a collection of signed Supergirl comics, which I felt was kismet. I’ve wanted to tell a Supergirl story for a long time, especially one involving one of her classic adversaries. As we began exploring the idea, DC let us know a Supergirl film was on the horizon, and the timing couldn’t have been better.\n\nWhat draws me to Supergirl is her depth. She’s been portrayed in many different ways over the years, but I’ve always been most interested in versions of the character that explored her grief, anger, and not fitting in. That interpretation felt grounded and relatable in contrast to some of the more lighthearted Supergirls we’ve seen. I was really excited to see that the new Supergirl film draws inspiration from “Woman of Tomorrow,” which captures that complexity beautifully. We wanted to lean into that, so players are going to encounter plenty of Kryptonian lore and characters. This is, at its core, a Supergirl story.\n\n![Supergirl Comic Cover](media/bfcb940b64577f102ac745d57be5257f9391cd7e30e37c33b9fe9b6efa762292.jpg)\n![Supergirl Comic Cover](media/adcb85842219f659fbecf808c5b2fa09a3eda5bb6a7de79fe52075adf7c06b73.jpg)\n![Supergirl Comic Cover](media/01e16021d2a62534dace189684fd9d5d9589f43fee82c71f84dbd42628dd2722.jpg)\n\nAs we began shaping this storyline, one of our key priorities was being thoughtful about representation – particularly within the history of comics. If you look back at the Golden Age, female characters were often relegated to supporting roles as love interests or sidekicks. Over time, we’ve seen a steady shift toward more prominent and fully realized female leads across comics, television, and film. That progress matters, and we wanted to be intentional about continuing it. With Supergirl, especially as she returns to the spotlight in broader media, it was important to us to do justice to the character and present her as a strong, central figure in her own story.\n\nOf course, in DCUO, the “U” stands for universe. While Supergirl leads the narrative, she won’t be alone. Guy Gardner has been called off on official Green Lantern business, so unfortunately, the best haircut in the universe will not be appearing this time. However, Argo City’s location is at the bottom of the Atlantic Ocean – and Atlantic means Aquaman! Naturally, this brings Atlantis into play, and so players can expect to encounter several prominent Atlantean heroes, along with a few additional surprises we’re keeping under wraps for now.\n\n![](media/ed9276af9ab016e3b2591c90a983436e6d2bbd2ce70b03bcfa789c34631d0976.jpg)\n![](media/d4d113916804413054cbf645d0d83c4a9983ccc4b6a6663f2109d1e1fc70a457.jpg)\n![](media/873c32b5c05647a29cb32b22dbef58c88fcbc166268c062ea3cae7f2e8ecb0e0.jpg)\n![](media/e0317b59c96f37eeaa6a7e233488a3e3a0fbcf493013912bdcaaf690dc5201a3.jpg)\n\nWe have much more to say about Supergirl and the Children of Krypton story arc, which includes our thoughts about how expectations about superhero stories have changed as they’ve grown to dominate pop culture, geeking out about Supergirl, and a few surprises.\n\nSee you in ***[DCUO](https://www.xbox.com/en-US/games/store/dc-universe-online-for-xbox-one/C59QBPB8P1XJ/)***, when *Children of Krypton: Shadows Over Argo* launches in June.\n\n---\n\n---\n\n---", "excerpt": "Summary\n\n-        ’s upcoming story arc, Children of Krypton: Shadows Over Argo, centers on Supergirl’s pursuit of the villain Kryb.\n- Argo City’s location is at the bottom of the Atlantic Ocea", "readingMinutes": 6, "images": [{"src": "media/c475459c116f4c3bd168765b82492831d27f3049158448312c6e2c115bbbe3fd.jpg", "alt": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media"}, {"src": "media/61c038e027605fddddba120ef909d4bc909b37e8951c73a6e848e8d89d5c2b8f.jpg", "alt": "DC Universe Online Supergirl Model"}, {"src": "media/e802bb0a195c3520e3a9e1816de980f672617e97eeb397f8b96ce5aa8cf7c8b2.jpg", "alt": "DC Universe Online Kryb Screenshot"}, {"src": "media/d4c7e245a2a9e393ae33172fc9325afe2ea9ebae4a9ce39e7a3d49830f8ac4c3.jpg", "alt": "DC Universe Online Kryb Screenshot"}, {"src": "media/bfcb940b64577f102ac745d57be5257f9391cd7e30e37c33b9fe9b6efa762292.jpg", "alt": "Supergirl Comic Cover"}, {"src": "media/adcb85842219f659fbecf808c5b2fa09a3eda5bb6a7de79fe52075adf7c06b73.jpg", "alt": "Supergirl Comic Cover"}, {"src": "media/01e16021d2a62534dace189684fd9d5d9589f43fee82c71f84dbd42628dd2722.jpg", "alt": "Supergirl Comic Cover"}, {"src": "media/ed9276af9ab016e3b2591c90a983436e6d2bbd2ce70b03bcfa789c34631d0976.jpg", "alt": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media"}, {"src": "media/d4d113916804413054cbf645d0d83c4a9983ccc4b6a6663f2109d1e1fc70a457.jpg", "alt": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media"}, {"src": "media/873c32b5c05647a29cb32b22dbef58c88fcbc166268c062ea3cae7f2e8ecb0e0.jpg", "alt": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media"}, {"src": "media/e0317b59c96f37eeaa6a7e233488a3e3a0fbcf493013912bdcaaf690dc5201a3.jpg", "alt": "DC Universe Online – How Supergirl’s Story Arc Reflects the Evolving State of Superhero Media"}], "cover": "media/c475459c116f4c3bd168765b82492831d27f3049158448312c6e2c115bbbe3fd.jpg"}, {"id": "d2fa0c8ba013bd565ab69a83", "title": "Overwatch: The New Year-Long Narrative, Explained", "summary": "The Reign of Talon begins! Overwatch Narrative Lead, Miranda Moyer tells us all about the game’s first complete story arc.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2026/02/04/overwatch-story-lore-explained-reign-of-talon-new-heroes/", "publishedAt": "2026-02-04T18:45:00+00:00", "author": "Joe Skrebels, XBOX Wire Editor-in-Chief", "markdown": "![Overwatch: The New Year-Long Narrative, Explained](media/f0ba07d57f2407697dd73888a26a6283b492941b160b3a470c984468e933e7da.jpg)\n\n### Summary\n\n- *Overwatch*narrative lead Miranda Moyer tells us more about *The Reign of Talon*: the first complete, year-long story arc for *Overwatch*.\n- The new narrative launches with immediate global conflict as Talon challenges Overwatch, and will introduce 10 new heroes, each woven directly into the unfolding story.\n- Get ready for an *Overwatch* story that keeps you at the edge of your seat, with non-stop action, evolving characters, and plot twists.\n\n*Today, Blizzard’s Overwatch Spotlight announced the start of an exciting new story‑driven era for Overwatch, highlighted by a year-long narrative arc called The Reign of Talon, all‑new UI/UX design, and much more. Be sure to check out the*[*full video*](https://www.youtube.com/watch?v=N8Sgnn72e9Y)*for all of the details. As an extra treat, we’re joined by Lead Narrative Designer Miranda Moyer to dive deeper into what this new story‑driven chapter means for Overwatch.*\n\nFor the first time in *Overwatch*’s history, we’re telling a complete story.\n\nI don’t say that lightly. Over the past decade, *Overwatch*’s narrative has been about possibility – introductions, hints, and setups. We’ve met heroes, discovered conflicts, and learned just enough to know there was something bigger happening beyond the edges of the screen. But this year, we’re doing something we’ve never done before: telling a story with a clear beginning, middle… and yes, an end.\n\nThat means things move. When something happens in the world of Overwatch now, it doesn’t sit untouched. Objectives are set, and met. You’ll see outcomes unfold across seasons. We’re finally seeing payoff for parts of the Overwatch world that you’ve maybe wondered about for years. This evolving story will be brought to life through a variety of mediums – including Hero Trailers, motion comics, and more – so you can experience each chapter in unique ways. All these pieces will be available on our dedicated narrative viewer, organized in chapters that guide you through the year’s epic narrative.\n\nAt the center of this year’s *Overwatch* narrative is a global conflict that’s impossible to ignore. Vendetta has seized control of Talon, overthrowing Doomfist and rejecting the clandestine nature in which he operated. Where Talon once skulked in the shadows, Vendetta believes in acting loudly, decisively, and without restraint. Her goal is explicit: she wants the world, and she believes Overwatch is the only force standing in her way. Because of that, we’re not winding up to conflict: we’re starting with it. Talon strikes early, attempting to remove Overwatch from the equation.\n\n![Overwatch Concept Art](media/f2678c4c3c7955fd5a4c20d1d46a30da5f07a42b8ba391c02e42e22c5d9e04e8.jpg)\n\nWhat’s fresh about the way we’re telling this story is how deeply our heroes are embedded in it. Every new character plays a direct role in the narrative. Those new faces are also a great vehicle to continue the stories of established ones. We’re touching so many parts of the world of Overwatch, and the more stories we develop, the more opportunities we’ll have to progress the journeys of heroes both new and longstanding.\n\nOne of the biggest highlights for *Overwatch* this year is the introduction of 10 new heroes. In Season 1, which begins February 10, you’ll meet five of them at once: each with their own narrative thread which helps set the tone for what’s to come.\n\n- **Domina** operates on the edges of Talon’s chaos, not publicly aligned with Vendetta (for fear of unsavory headlines), but more than willing to profit from the destruction she causes.\n- **Emre** is caught in a far more dangerous position, coerced into cooperation under the threat of catastrophic loss.\n- **Mizuki** finds himself torn between old obligations and the people who have become his family.\n- **Anran** enters the fight on Overwatch’s side, driven and connected to the story in deeply personal ways.\n\n![Overwatch Concept Art](media/6479e5d075c1c847b9ab6e4b49c14bce5fd233083b19a7e17ef75a53fae02fea.jpg)\n\n- And then there’s **Jetpack Cat**, a long-running meme turned mobile support. She’s worth keeping an eye on, both for the future of her curious tale (tail?), as well as to make sure she isn’t knocking anything off counters.\n\nThis year’s narrative is about convergence—threads coming together, tensions peaking, and long-running questions colliding in ways that matter. Both established and new heroes will see movement in their stories, evolving amid this conflict. For *Overwatch*, this is the most ambitious narrative we’ve taken on. Each piece builds on the last, pushing characters and conflicts forward.\n\nJoin us on this new journey, and jump into Season 1 on February 10 and see it unfold for yourself.", "excerpt": "Summary\n\n-  Overwatch narrative lead Miranda Moyer tells us more about  The Reign of Talon : the first complete, year-long story arc for  Overwatch .\n- The new narrative launches with immediate", "readingMinutes": 5, "images": [{"src": "media/f0ba07d57f2407697dd73888a26a6283b492941b160b3a470c984468e933e7da.jpg", "alt": "Overwatch: The New Year-Long Narrative, Explained"}, {"src": "media/f2678c4c3c7955fd5a4c20d1d46a30da5f07a42b8ba391c02e42e22c5d9e04e8.jpg", "alt": "Overwatch Concept Art"}, {"src": "media/6479e5d075c1c847b9ab6e4b49c14bce5fd233083b19a7e17ef75a53fae02fea.jpg", "alt": "Overwatch Concept Art"}], "cover": "media/f0ba07d57f2407697dd73888a26a6283b492941b160b3a470c984468e933e7da.jpg"}, {"id": "d11d9782629da1c349394fad", "title": "Skate Story launches into the PlayStation Plus Game Catalog on Dec 8, hands-on report", "summary": "Get on board for giant frogs, glass demons, and smooth skating.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "playstation", "sourceName": "PlayStation.Blog", "sourceUrl": "https://blog.playstation.com/2025/11/24/skate-story-launches-into-the-playstation-plus-game-catalog-on-dec-8-hands-on-report/", "publishedAt": "2025-11-24T09:00:04-08:00", "author": "Corey Brotherson", "markdown": "![Skate Story launches into the PlayStation Plus Game Catalog on Dec 8, hands-on report](media/2358872ad4374595fd1f5777adecd807d55ceec84fe033f301caabd9fdba7853.jpg)\n\nCelestial skateboarding, a deal with the Devil, and giant philosophizing heads? Skate Story is far from your everyday action sports tale, which you’ll be finding out soon enough when it flips onto PS5 December 8 as a PlayStation Plus Game Catalog day one release.\\*\n\nI got the chance to speed deeper into the underworld with the complete version of Sam Eng’s striking adventure, and shine a light on what it means to be a strange looking demon in the pursuit of eating the Moon.\n\n## Slick tricks with a story\n\nSo, you’re a skateboarding demon made of glass and pain. And that pain is only highlighted by the sleepless torment partly caused by the Moon’s brightness. Hungry and tired, the nameless demon aims to consume the pale planetoid, but the only way they can reach it is via a skateboard granted by the Devil… for a price.\n\nAfter an intense introduction to the basics and skating into an unusual Lyceum full of giant stone heads pondering the meaning of life, Skate Story opens up into a wider adventure that dramatically goes beyond the first steps of the demon’s cosmos shaking quest.\n\nWisely, the game eases you into the vast number of moves at your disposal. I started off with a basic power slide by holding the square button, and ollie by holding down the circle button, but by the time I reached the end of the Lyceum I was brimming with techniques.\n\nIn fact, the very first boss fight acts as a trick tutorial, as you’re taught how to combine the L buttons with the circle button to pull off stunts like a Pop Shuvit, Heelflip, and Front Pop. However, there’s a catch.\n\n## Mix up your skills against bosses\n\nFor the most part you’ll be skating across large, open environments, or fast and narrow lanes, leaping over obstacles, jumping through gates to close disapproving disembodied white eyes, and completing hilarious and bizarre tasks, which I’ll get to in a moment. But when it comes to your skating ability, you will be judged.\n\nIt’s not enough to use the same move over and over. A combo meter tracks which tricks you’re performing, and it’ll only grow quickly if you change up your flips. You can also pick up extra points for releasing your jumps at a sweet spot, giving you a timing bonus. Crash or bump, and the meter drops back to zero.\n\nThis is all essential in the boss battles, where the only way to deal meaningful damage is to skate fast and pop a variety of tricks to build a combo, then pressing the square button in mid-air before landing to perform a devastating stomp. The higher the combo chain, the heavier the damage, so risking it all for meaningful attacks feels fun and frantic.\n\nOne particular boss fight was a mixture of everything I’d learned so far in the game, putting me on a cosmic chase through a constantly moving track where I needed to perform tricks while jumping over obstructions and attacks, making sure I stomped each time to deal damage before my demon was turned into shards.\n\n## Strange souls and chasing the Devil’s pants\n\nGoing back to the missions, Skate Story manages to mix things up to keep my demon on their glass toes. Many required me to use my skateboard to jump over placements like manholes, spin through environmental elements like the spindly soulflowers, or grind across a set number of surfaces.\n\nThe underworld is also littered with imaginative characters needing assistance, with floating skulls, a pillowy demon and a giant frog just a small selection of the bizarre souls that I encountered.\n\nIn one stage, a large talking trash bag asked if I could help it by taking down a smelly monolith it had taken a dislike towards. Another objective had me chasing the Devil’s clothes which had sprung to life and were trying to escape being dried after a wash. Skate Story’s sense of humour was a constant surprise and always kept the narrative lively.\n\n## Make the board yours\n\nAccompanied by Rabbie the ghostly rabbit, you’re granted a shapeless soul space which acts as a hub that bridges each story chapter, but also gives you the opportunity to customize your skateboard. The soul currency you pick up by performing stunts can be used to purchase wheels, stickers and more at gift shops.\n\n## The devil is in the details\n\nWith its oddly endearing millipede train, the shattered remains of your skater’s failed attempts littering the environment, and a versatile soundtrack which slides from melancholic horns to funky bass-heavy electronica, Skate Story is full of nice touches.\n\nA few times I was distracted by the DualSense wireless controller’s light bar to see how it was going to reflect the on-screen environment. While the demon’s skateboard itself told a tale of my journey, showing scrapes, nicks and wear influenced by my choices (and accidents), especially around the board’s tail ends due to my overenthusiastic grinding.\n\nIt was an experience which left me wanting to see where this celestial journey would take me next.\n\nIntrigued? You’ll be craving the moon soon enough on December 8, when Skate Story grinds its way onto PS5 and the PlayStation Plus Game Catalog.\n\n*\\*PlayStation Plus Game Catalog available with Extra and Premium memberships.*", "excerpt": "Celestial skateboarding, a deal with the Devil, and giant philosophizing heads? Skate Story is far from your everyday action sports tale, which you’ll be finding out soon enough when it flips onto", "readingMinutes": 6, "images": [{"src": "media/2358872ad4374595fd1f5777adecd807d55ceec84fe033f301caabd9fdba7853.jpg", "alt": "Skate Story launches into the PlayStation Plus Game Catalog on Dec 8, hands-on report"}], "cover": "media/2358872ad4374595fd1f5777adecd807d55ceec84fe033f301caabd9fdba7853.jpg"}, {"id": "f62f3ccd06c5ea439a715fc5", "title": "Brawlhalla: 10 Years of Community", "summary": "Brawlhalla Managing Director Zeke Sparkes talks about its early days, what’s to come, and how the community remains a core part of the game’s vision.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2025/11/07/brawlhalla-10-years-of-community/", "publishedAt": "2025-11-07T17:00:00+00:00", "author": "Will Fulton, XBOX Wire Editor", "markdown": "![Brawlhalla: 10 Years of Community](media/21942e786b0e375ff14ddf1aaf324e4fe2c835cb20fb6ca296ec6287b8c9805a.jpg)\n\n### Summary\n\n- *Brawlhalla* is celebrating its 10th anniversary.\n- Players should check out the BCX event for exciting new announcements, as well as play the free in-game anniversary event.\n- Managing Director Zeke Sparkes reflects on the early days of the game, how it’s grown to a community over 125 million players strong, and keeping the community at the core of the game’s vision.\n\n*Brawlhalla*, the free-to-play platform fighting game, is celebrating its 10th anniversary since launching its open beta in 2015. What started as an indie game with five playable Legends has grown into a pillar of the fighting game community, with 67 playable Legends; a plethora of maps and biomes; crossovers with popular IP such as Star Wars, Avatar: The Last Airbender, and Halo, among many others; and over 125 million lifetime players.\n\n![Brawlhalla 10th Anniversary](media/854a75cfa70e4249d5c48e098573fd457879ddfceedbb64ede6c5d43059dd8f8.png)\n\nEach year, around its anniversary, *Brawlhalla* celebrates in two ways: an in-game anniversary celebration, and the in-person Brawlhalla World Championship Expo (BCX). BCX 2025 is taking place at the Gateway Center in Atlanta, GA from November 21-23, and will feature world-class competitive *Brawlhalla*, announcements of what’s coming in 2026, and an expo packed with dev panels, cosplay, and more.\n\n![Brawlhalla 10th Anniversary](media/0196f42af3def8e2fd4b8999a86b657915da34d7ddf11cc00a9991f25e4edd61.png)\n\nThe in-game anniversary event runs now through December 3: a month-long celebration of *Brawlhalla* featuring new content, community events, rewards, and surprises. The festival introduces a new Legend – a cleric named Lady Vera – as well as the long-awaited Guild feature, which allows players to build community in new and exciting ways. Whether you’re a seasoned competitor or a new player, *Brawlhalla*’s 10th anniversary is the perfect time to log in, join a Guild, and brawl it out in the arena.\n\nZeke Sparkes is *Brawlhalla*’s managing director, and he’s been a developer on the game since its inception. We spoke to him to learn more about *Brawlhalla*’s beginning, how it’s continued to grow over the past decade, and how the team kept the player community at the core of the game’s vision.\n\n**What can you tell us about *Brawlhalla*’s early days of development and the vision for the game?**\n\nIt was exciting because we realized pretty early on that we had something that had legs, but we didn’t know how far it could go. So, we poured our hearts into it and built really strong ties with the community early on. We knew, especially being free to play, that we had to be talking and listening and adapting based on what the community was saying. And so, we put ourselves out there and it’s been a wild ride seeing how far we can go.\n\n**Has the approach to development changed in the last decade?**\n\nI’d say the mentality is still the same. It’s a team that loves the game – everybody is here because they want to be working on *Brawlhalla*, and we are connected to the community. We’re constantly finding new ways to listen to the community and figure out what we can do to tweak the game, keep people interested and excited, see what things we’re doing that are working well, and what things we’re doing that aren’t working so well that we need to update. We’ve had a constant commitment to that.\n\nOver the years, we’ve gone from launching just on Steam, where we could patch two, three, four, five times a week – really, really fast – to being on every major platform. That adds a layer of logistics we didn’t have early on; we have to plan a bit further ahead. So, the processes changed a little bit, but the heart and mentality are still the same.\n\n**As you’ve mentioned, community is a huge part of *Brawlhalla*, and being connected to the community has been the plan since day one. How did you build that community relationship? Was there any surprising feedback?**\n\nOne of the first things we did was stream the game on Twitch, even before we really understood what Twitch was or how to do a good stream. We knew that it was going to be important, and it was one of the first times you could get real-time feedback from players as a developer, which was really exciting.\n\nBecause of that connection, we had a really big change early on. Originally, the game wasn’t character-focused; you would build an avatar and then spec out exactly how you wanted your character to be based on the weapons we dropped for you during gameplay. The early feedback told us the prototype was cool, the combat’s fun, but characters were missing. That’s when we started to think about pivoting to a character-centric game and started figuring out what archetypes we could add based on what we had made. We started with five Legends and released the 67th this month.\n\nNow, we’ve got a full-on livestream studio with a set and awesome production values and motion graphics, but the core of the experience is still there, where it’s us talking to the community about what we’re doing, what’s going on, seeing how they react to stuff, and listening to the things they want to see in the game. That’s how we keep *Brawlhalla* moving forward.\n\n***Brawlhalla*’s World Championship Expo (BCX) is taking place November 21-23 in Atlanta. What can fans expect this year?**\n\n![Brawlhalla 10th Anniversary](media/c17cb6c4f64c431a0c531518f981b9567a1df46064a8608755779574c3c29a06.png)\n\nThat is the place to tune into. You get the best *Brawlhalla* gameplay in the entire world, and it just gets better every year. It’s incredible – the atmosphere is amazing, and it’s where we make some of our biggest announcements and reveals. We’ve got some really good ones lined up this year (I’m thinking of a couple now that are going to make people go crazy), so make sure you tune in on [twitch.tv/Brawlhalla](https://www.twitch.tv/Brawlhalla).\n\n**Any reflections on the past decade you’d like to share? What’s up next for *Brawlhalla*?**\n\nLady Vera, our 67th Legend, is out now. She’s a cleric with some really interesting signature moves, and you can do some pretty fun stuff with her. She has a lot of radial skills, so depending on where you are when you do the move, the direction that your opponent goes can change pretty dramatically. So, if you’re creative, this really is a character for you. We’ve also just released phase one of our Guilds feature, which is a long-time player request. You’ll be able to build your community of players around a Guild that works across all different platforms, and that’s just phase one. We’ll continue to add cool, new, engaging mechanisms to Guilds as we move forward. Tune into BCX 2025 for more specifics of what’s to come!\n\n![Brawlhalla 10th Anniversary](media/66db66640f1b53260befc491c628ab36315aa6f9aa448a3ac4cd9b98fbffad20.png)\n\nI’d also like to say that building *Brawlhalla* with this team and with the community has been amazing. Over the past decade, players have shaped this game’s direction, fueled its esports scene, and fostered a welcoming space for brawlers of all backgrounds. The Anniversary Event is as much a celebration of the community as it is of the game itself. It’s exactly what we love to do and we’re so thankful for everybody that’s been on this journey with us whether you’re brand new today or you’ve been playing *Brawlhalla* since the closed alpha. We’re super excited that there’s a community of people that love the game and love what we’re doing.\n\n*Brawlhalla is free to play on Xbox Series X|S and Xbox One.*", "excerpt": "Summary\n\n-  Brawlhalla  is celebrating its 10th anniversary.\n- Players should check out the BCX event for exciting new announcements, as well as play the free in-game anniversary event.\n- Manag", "readingMinutes": 8, "images": [{"src": "media/21942e786b0e375ff14ddf1aaf324e4fe2c835cb20fb6ca296ec6287b8c9805a.jpg", "alt": "Brawlhalla: 10 Years of Community"}, {"src": "media/854a75cfa70e4249d5c48e098573fd457879ddfceedbb64ede6c5d43059dd8f8.png", "alt": "Brawlhalla 10th Anniversary"}, {"src": "media/0196f42af3def8e2fd4b8999a86b657915da34d7ddf11cc00a9991f25e4edd61.png", "alt": "Brawlhalla 10th Anniversary"}, {"src": "media/c17cb6c4f64c431a0c531518f981b9567a1df46064a8608755779574c3c29a06.png", "alt": "Brawlhalla 10th Anniversary"}, {"src": "media/66db66640f1b53260befc491c628ab36315aa6f9aa448a3ac4cd9b98fbffad20.png", "alt": "Brawlhalla 10th Anniversary"}], "cover": "media/21942e786b0e375ff14ddf1aaf324e4fe2c835cb20fb6ca296ec6287b8c9805a.jpg"}, {"id": "c42ed65225361b004dbcbc40", "title": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds", "summary": "Get inspired to make a splash in Planet Coaster 2 with these impressive community creations, handpicked by the Frontier team.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2025/07/17/planet-coaster-2-park-inspiration-xbox-community-builds/", "publishedAt": "2025-07-17T18:00:00+00:00", "author": "Danielle Partis, XBOX Wire Editor", "markdown": "![Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds](media/583f6ebe5492993f10a9d1af0e25012c1bafec403d18b43049bbd6754f290e14.jpg)\n\nIn ***[Planet Coaster 2](https://www.xbox.com/en-US/games/store/planet-coaster-2/9PK5WS0HXQKQ/0010)***, you can push the boundaries of your creativity like never before. With enhanced and improved building tools, you can design a true water and theme park paradise that will delight and thrill your guests.\n\nThe latest free updates have included many new features for players to explore including modular souvenir shops, on-ride photos for guests to take home their memories, and tasty sit-down restaurants that can be fully customised to fit any theme in your park. Returning themes from the original *Planet Coaster* have also unlocked even more creative possibilities!\n\nWith this in mind, we’ve picked some of our favourite Xbox community creations from the Frontier Workshop to get you inspired and we can’t wait to share them with you!\n\nThese blueprints and park builds show off the fantastic tools and features you can use to create amazing theme and water parks in *Planet Coaster 2,* which can be downloaded into your game.\n\n---\n\n### **1. Lazy River by Baaty**\n\n**Share Code** – 62T-9L7-44L\n\n![](media/2cec70521b3ccbfc55ee50d578e7084a9f7314b42ffbef00ec16b22f804f4589.jpg)\n\nA lazy river is a classic staple in any water park! The use of scenery items like the inflatables scattered around the pool add a fun moment of realism to the paradise created by the trees and plants along the water’s edge. A great example of the scenery brush, a tool that gives you the ability to place lots of objects in a short amount of time!\n\n---\n\n### **2. Ragnarök Ridge – Viking Themed Coaster by BluerRoosterUK**\n\n**Share Code** – 1NY-G28-19L\n\n![](media/6c289cddd1633c158329d033dcfe50b52f7be4e186406235d46dcf53c2e7debc.jpg)\n\nBuilding rides in *Planet Coaster 2* isn’t only about the visuals! This epic build doesn’t just look great as a focal point for any park, it boasts excellent stats, making it ideal for Franchise Mode. It also features amazing custom animatronics that breathe life into this fierce Viking-themed rollercoaster.\n\n---\n\n### **3. Shabadoo’s Electric Garden by Daypass**\n\n**Share Code** – 3JG-Y3Y-S3Y\n\n![](media/bde9e541d6bef5b9b816d6e3b9a9beee5a7895e3ef5f47bc9b8e5179c3ef9879.jpg)\n\nDark rides are a fantastic way to play with the lighting in your park, and this ride shows that off brilliantly with a range of glowing scenery pieces and lights that really stand out! The number of lights and effects in *Planet Coaster 2* allow you to create awesome dark ride experiences that your guests (*and you – thank you first person mode!*) can enjoy.\n\n---\n\n### **4. AquaAdventure World by SplashZone**\n\n**Share Code** – 2Z6-8J0-PJT\n\n![](media/57b221a779819f685276ac9ff5c46dd8b681a5e989d032c123b302e550857768.jpg)\n\nThis theme park is what Planet Coaster 2 is all about! Using rocks, water and terrain tools allows you to add levels to the space, instead of having a flat theme park. The fantastic mix of coaster and water park elements on an epic scale looks amazing and goes down well with your guests too.\n\n---\n\n### **5. Fantasy Building by Birtie**\n\n**Share Code** – 1F2-J6W-016\n\n![](media/f8d5e8c627096a6210ced21bc5a3baada6006ab9989fc561ac4603481f64dd5e.jpg)\n\nPlanet Coaster 2’s themes have wonderful versatility for creating details in your parks. By using the Aquatic, Mythology and Viking themes, this park building adds the perfect fantasy flair with all the little details – we want to walk around here ourselves!\n\nIf you’re looking for even more inspiration for your wonderful and wacky park building ideas, check out the [*Planet Coaster 2* community](https://www.planetcoaster.com/community) page to see the Featured Creators and Workshop Creations we’re loving right now.\n\nSo, what are you waiting for? Dive in and create a splash.", "excerpt": "In        , you can push the boundaries of your creativity like never before. With enhanced and improved building tools, you can design a true water and theme park paradise that will delight and th", "readingMinutes": 4, "images": [{"src": "media/583f6ebe5492993f10a9d1af0e25012c1bafec403d18b43049bbd6754f290e14.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}, {"src": "media/2cec70521b3ccbfc55ee50d578e7084a9f7314b42ffbef00ec16b22f804f4589.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}, {"src": "media/6c289cddd1633c158329d033dcfe50b52f7be4e186406235d46dcf53c2e7debc.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}, {"src": "media/bde9e541d6bef5b9b816d6e3b9a9beee5a7895e3ef5f47bc9b8e5179c3ef9879.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}, {"src": "media/57b221a779819f685276ac9ff5c46dd8b681a5e989d032c123b302e550857768.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}, {"src": "media/f8d5e8c627096a6210ced21bc5a3baada6006ab9989fc561ac4603481f64dd5e.jpg", "alt": "Planet Coaster 2: Fuel Your Park Inspiration with Frontier’s Favorite Xbox Community Builds"}], "cover": "media/583f6ebe5492993f10a9d1af0e25012c1bafec403d18b43049bbd6754f290e14.jpg"}, {"id": "59e918ac33531efde74b54c5", "title": "June Xbox Insider Community Update", "summary": "Level Up Your Insider Game! Ready to power up your Xbox Insider experience? We've got some epic updates and exciting news to share with you. Grab your", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2025/06/04/june-xbox-insider-community-update/", "publishedAt": "2025-06-04T23:01:58+00:00", "author": "Austin Olney", "markdown": "![June Xbox Insider Community Update](media/2f93393c968759f1b3e19235f40c6f9facaec6247415ddf22eb4456dcf5469b4.png)\n\n**Level Up Your Insider Game!**\n\nReady to power up your Xbox Insider experience? We’ve got some epic updates and exciting news to share with you. Grab your controllers and let’s dive in!\n\n**Introducing the Xbox Insider Badges**\n\nWe’re thrilled to announce a new way to recognize and reward our dedicated Insiders. We’re rolling out gold, silver, and bronze badges for excellent participation! These badges are the ultimate achievement and will be awarded to those who consistently go above and beyond! These badges will be rare, but anyone can earn these badges with good participation. Keep joining playtests, completing activities, posting on the subreddit, and submitting excellent feedback\n\n- ![](media/40484984edf769623f36e889ae70d8fba7eb0622b2ff88b804a713ecca51495a.png)\n- ![](media/45c5a5e793ab58d21db705ee56b734ab192a08183a057ef9efc6c1f08f6beac4.png)\n\n**Gold Badge Spotlight**\n\nThe Gold badge represents the highest level of recognition in the Xbox Insider Program. In this first round, we’re proud to honor **bowski477, aka Scratch**, **WPAK**, and others—our dedicated subreddit moderators—whose leadership and commitment have meaningfully shaped and supported the Insider community. We asked our winners a few questions:\n\nWhat’s a comfort game you can always go back to and enjoy playing, and why?\n\n**Bowski477**\n\n*For me it’s Minecraft. There’s no pressure, it’s simple, and the music is soothing. There’s always something new to create and discover.*\n\n**WPAK**\n\n*A game I have been going back to for years is Civilization. I only do single player, so no time pressure and it brings me back to my younger self.*\n\nIf you could live in any video game world, which one would it be and why?\n\n**aka Scratch**\n\n*Probably Minecraft so I could explore and live in a world of floating half trees.*\n\n**Silver Badge Spotlight**\n\nLongtime contributors to the Xbox Insider Program, **Mikro**, **CID**, and **Joern** have earned the Silver badge for their sustained dedication and impact. Their feedback, testing, and community engagement continue to help shape the future of Xbox.\n\nIf you could have any video game character as your best friend, who would it be?\n\n**Mikro**\n\n*Ooo The Master Chief of course, Halo.*\n\nWhat’s the funniest glitch or bug you’ve encountered in a game?\n\n**CID**\n\n*Seeing infinite ladder glitches in games like The Division or finding out that you could fly due to a ladder glitch in the game Raft. Plenty of random funky situations and experiences. Some of the most entertaining experiences can come from those unexpected “instances” when gaming. Always a good time to randomly be thrown into outer limits spontaneously when greeting another player.”*\n\nWhat’s the most challenging game you have ever played, and did you beat it?\n\n**Joern**\n\n*Even though it’s been almost 20 years, I still remember playing Call of Duty 2 on veteran difficulty on the Xbox 360. This feels like the hardest game, yet I beat it.”*\n\n**Bronze Badge Spotlight**\n\nThe Bronze badge recognizes Insiders who have shown consistent involvement and enthusiasm throughout their time in the program. For this first round of bronze badges, we want to recognize: “**KJ**” and **deadeagleman**! Both have been resolute Insiders who have contributed to the program in a meaningful way.\n\nHave you ever pulled an all-nighter playing a game? If so, what game?\n\n“**KJ**“\n\n*All night game list is very long*\n\n**Deadeagleman**\n\n*Yes, elite dangerous, long grind for the corvette ship in the game*\n\n**You’ve Earned XP for Providing Feedback!**\n\nIn addition to the new badges, we are excited to officially announce that we’ve been awarding Xbox Insider XP for the valuable feedback you provide! While this is the first time we’re talking about it, we have been recognizing your contributions with XP for some time now. Your insights are crucial in helping us improve, and we want to ensure you know how much we appreciate them. While the badges are rare, your feedback and participation can still earn you XP. The better your feedback is, the more likely it is to be awarded XP, so be sure to provide detailed, clear feedback and include screenshots when you can. That said, we review allfeedback submitted through Report a Problem on the console. So, if you haven’t received XP for providing feedback yet, you just might in the future! If you haven’t submitted feedback before, you can get started today and learn more about the process by visiting the [Provide Feedback to Team Xbox](https://support.xbox.com/help/account-profile/manage-account/xbox-insider-hub-report-a-problem) page. We can’t wait to hear from you!\n\n![](media/4a4166774e4541f1b37bededfb49b570b4a81026064aff858d1a8d01131d0c1c.png)\n\n**Here’s what else we’ve done since the last community update:**\n\n**OS Flighting**  \nOur team has been grinding hard to bring you the best experience possible. From mouse and keyboard support and stream your own game with Xbox Cloud Gaming (Beta) to getting better recommendations when freeing up space, and the new ways to personalize Home, we’ve seen so many new features introduced together. We’ve loved seeing your reactions to everything being released and your feedback has been incredibly helpful (as always). Your continued feedback helps us identify and resolve issues, making everyone’s experience better, so thank you for being part of this awesome community!\n\n**General Flighting Update**  \nThe Xbox Insider Team wants to get to know more about your gaming preferences. We’ve recently launched surveys on both PC and console asking about the game genres you play. Be sure to complete the “Xbox Insider Game Genre Survey” in the Xbox Insider Hub and look out for questions in the Weekly Pulse survey. Your input helps us learn more about our community and tailor the experience to your tastes.\n\nThank you for being a part of the Xbox Insider community! Keep gaming and stay awesome!\n\n## **Other resources:**\n\n- [Get the Xbox Insider Hub app](https://support.xbox.com/en-US/help/account-profile/manage-account/xbox-insider-hub)\n- [Xbox Insider FAQ](https://support.xbox.com/en-US/help/account-profile/manage-account/xbox-insider-program)\n- [How to provide feedback as an Xbox Insider](https://support.xbox.com/en-US/help/account-profile/manage-account/xbox-insider-hub-report-a-problem)\n\n*For more information: follow us on X/Twitter at*[*@XboxInsider*](https://twitter.com/xboxinsider)*and this blog for announcements and more. And feel free to interact with the community on the*[*Xbox Insider SubReddit*](https://www.reddit.com/r/xboxinsiders/)*.*", "excerpt": "Level Up Your Insider Game!  \n\nReady to power up your Xbox Insider experience? We’ve got some epic updates and exciting news to share with you. Grab your controllers and let’s dive in!\n\n  Introdu", "readingMinutes": 7, "images": [{"src": "media/2f93393c968759f1b3e19235f40c6f9facaec6247415ddf22eb4456dcf5469b4.png", "alt": "June Xbox Insider Community Update"}, {"src": "media/40484984edf769623f36e889ae70d8fba7eb0622b2ff88b804a713ecca51495a.png", "alt": "June Xbox Insider Community Update"}, {"src": "media/45c5a5e793ab58d21db705ee56b734ab192a08183a057ef9efc6c1f08f6beac4.png", "alt": "June Xbox Insider Community Update"}, {"src": "media/4a4166774e4541f1b37bededfb49b570b4a81026064aff858d1a8d01131d0c1c.png", "alt": "June Xbox Insider Community Update"}], "cover": "media/2f93393c968759f1b3e19235f40c6f9facaec6247415ddf22eb4456dcf5469b4.png"}, {"id": "efe0fd10de46b69d158ca160", "title": "Xbox Celebrates Global Accessibility Awareness Day", "summary": "This GAAD, Xbox is leveling up accessibility! From new features in games such as DOOM: The Dark Ages, Candy Crush Soda Saga, World of Warcraft, and beyond - we’re committed to making gaming for everyone.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2025/05/15/global-accessibility-awareness-day-2025-xbox/", "publishedAt": "2025-05-15T16:00:00+00:00", "author": "Joe Skrebels, XBOX Wire Editor-in-Chief", "markdown": "![Xbox Celebrates Global Accessibility Awareness Day](media/438a457945db5e685f1fe1d66648d0b268c5cf2dfde854f6085fb258717aafc1.jpg)\n\nGlobal Accessibility Awareness Day, celebrated annually on the third Thursday of May, is dedicated to recognizing and raising awareness about the importance of accessibility. With billions of people playing video games in the world, including nearly 450 million players with some form of disability, our mission at Xbox is to create welcoming and accessible experiences so as many people as possible can enjoy the community and fun of gaming.\n\nWe recognize that every player can have different accessibility needs or preferences to support their play. This is why it’s critical we partner with members of the disability community to help inform the hardware, platform experiences, and games we create. While this ongoing collaboration is embedded into the fabric of our design processes, we’re thrilled to share some exciting accessibility news in celebration of Global Accessibility Awareness Day today. These include:\n\n- Revealing new and exciting accessibility features in *DOOM: The Dark Ages, Candy Crush Soda Saga*, and *World of Warcraft.*\n\n- Spotlighting how players can customize their gameplay as they make their way through the American Deep South in *South of Midnight* or slay their way through the depths of Hell in *Diablo IV.*\n\n- Sharing how we continue to bring accessibility to the forefront through industry initiatives, the hardware we make, and employee engagement.\n\n## **Welcoming More Players By Increasing Accessibility in Games**\n\n***DOOM: The Dark Ages***\n\n![Key art for DOOM: The Dark Ages](media/ab117850041aab9b1a08dc883315601a5d40fb42eac9803885ace28e17048b38.jpg)\n\n*DOOM: The Dark Ages*, the prequel to *DOOM (2016)* and *DOOM Eternal*, puts players into the blood-stained boots of the DOOM Slayer, in this never-before-seen dark and sinister medieval war against Hell. The game was designed to be a DOOM for *all* Slayers – approachable, yet challenging – so that as many people as possible can play.\n\nToday, we’re excited to reveal that many new accessibility features are being launched for the first time in the *DOOM* franchise. Among *Doom: The Dark Ages*’ key accessibility features:\n\n- **Game Difficulty Customization:** Game difficulty modifiers, such as game speed, can be changed at any time during gameplay.\n\n- **Sound Effect Visualization**: The Threat Detector setting can be enabled to show the directionality of incoming threats from enemies as icons around the screen.\n\n- **High Contrast Mode:** Enable the World Desaturation setting to help enemies and objects stand out from the desaturated background. The color and strength of the visual highlight effect can be customized for multiple enemy and object categories.\n\n- **Text Size:** There are multiple settings to adjust the size of the subtitles, UI text, and HUD elements. Magnification Mode can be used to further increase the size of some text, such as tutorials.\n\n- **Reduce Motion-Related Discomfort**: Adjust a variety of camera and visual effect settings. These include field of view (FOV), environmental screen shake, chromatic aberration, head bob, and weapon bob.\n\n- **Input Adjustments:** Remap the controls for various gameplay and menu categories. Other adjustments are available to customize the feel of the controls and reduce the number of hold actions.\n\nCheck out the [accessibility guide](https://slayersclub.bethesda.net/en-US/article/doom-the-dark-ages-accessibility-guide) for more information. [***DOOM: The Dark Ages***](https://www.xbox.com/games/doom-the-dark-ages)is available now for Xbox Series X|S, theXbox App for Windows PC, Steam, and PlayStation 5 – and you can play it with Game Pass.\n\n**Candy Crush Soda Saga**\n\n![A green soda gummy green bear playing with the accessibility settings. Other bears are having fun around him.](media/7132d0d97c96ebf5323b9e2cb8507c0e7baccb0b0917ec705876ebb06d200bfc.jpg)\n\n*Candy Crush Soda Saga*, the mouth-watering puzzle adventure from the makers of the legendary *Candy Crush Saga*, brought its accessibility menu, which has historically only been available on iOS, to Android on May 8. Accessibility features in this menu include the ability to choose the game board colors, contrast options of the candies (depending on people’s visual preferences) as well as ways to personalize the players’ audio experience with:\n\n- Bass control\n- Reduction of high frequencies\n- Ability to adapt sound effects\n- Mono and stereo music controls\n\nThe unified accessibility menu allows players to find all audio, visual and haptic options in one singular view, and is available to all players from level one within the Settings main menu.\n\n[***Candy Crush Soda Saga***](https://www.king.com/game/candycrushsoda/) is available on the Amazon App Store, Apple App Store, Google Play store and from the Microsoft Store.\n\n**World of Warcraft**\n\n*World of Warcraft* will soon be releasing new UI options in patch 11.1.7 designed to improve the accessibility and approachability of combat. These UI options will allow players to better understand and execute combat rotations for damage spells. This improves combat accessibility for players in these two ways:\n\n- Single-Button Assistant – Serves as a one button rotation helper. Using this single button keybind will cast the next recommended damage ability in the rotation sequence. This assistant is designed to have a small additional global cooldown added between abilities so that it is still useful for learning new skills, aiding those who are looking for additional help, or for those who want to experience the story or game on a more casual basis.\n- Combat Assistant – Once enabled, this adds an extra highlight via the action bars to show what damage ability is recommended next based on resources and the situation your character is in. This feature is designed to help new players, players who are trying out a new specialization, or those looking for additional guidance on the abilities they should use.\n\nPatch 11.1.7 will be released at a later date. More information about how the *World of Warcraft* team is evolving their UI can be found in [this episode of WoWCast with game director Ion Hazzikostas](https://www.youtube.com/watch?v=-hqJ210XWeU).\n\n[***World of Warcraft: The War Within***](https://worldofwarcraft.blizzard.com/)is available now on PC via Battle.net.\n\n**South of Midnight**\n\n![Key art for South of Midnight](media/e6d422a30b9dc48024226bb66c0c2cb626c7da749617300ab99dc02df6c1f72d.jpg)\n\nFrom Compulsion Games, the creators of *Contrast* and *We Happy Few*, *South of Midnight* is a spellbinding third person action-adventure game set in a magic realist version of the American Deep South. As Hazel, players explore the mythos and encounter creatures of Southern folklore in a macabre and fantastical world.\n\nIn addition to a crafted visual style, touching storytelling, and immersive music inspired by the complex and rich history of the South, the game offers various accessibility features that allow players to customize their experience, including:\n\n- Ability to adjust difficulty at any time (5 options: Scryer, Healer, Weaver, Grand Weaver, and Custom)\n- Controls (Control remapping, sensitivity, alternative input, etc.)\n- Language (23 languages supported, subtitles, captions, etc.)\n- Audio (Dynamic range, volume mixer, song vocals, etc.)\n- Graphics (Temporal upscaling, motion blur, V-Sync, shadow quality, etc.)\n- Gameplay (Stop motion on/off, camera follow, skip gameplay sequences, etc.)\n- Interface (Text size, persistent dot, HUD scale, HUD display, etc.)\n\nAdditionally, *South of Midnight* has a dedicated accessibility menu with options such as:\n\n- Color Profile (8 colorblind profiles presets & customization)\n- Menu Narration\n- Navigation Assistance (visual and audio settings)\n- Motion Sickness (including stop motion on/off for gameplay)\n- Gameplay
