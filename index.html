finally be able to debut the brand-new [Official God of War Ragnarök Cosplay Guides for Kratos and Atreus](https://www.playstation.com/en-us/god-of-war/community/).\n\nWith that in mind, we are really excited to finally be able to debut the brand-new [Official God of War Ragnarök Cosplay Guides for Kratos and Atreus](https://www.playstation.com/games/god-of-war-ragnarok/).\n\nOnce you’ve taken a peek at the new guides, make sure you check out the interview below with Santa Monica Studio Art Director Raf Grassetti on how the team updated the designs of Kratos and Atreus in God of War Ragnarök!\n\n## Official Kratos and Atreus cosplay guides\n\nTo show our appreciation for all the God of War cosplayers who have taken on Kratos and Atreus over the years, we wanted to make their updated guides for God of War Ragnarök even more comprehensive than the ones we did for God of War (2018).\n\nWe’re worked with our fantastic character artists and writers at SMS, as well as *B is for Boy* artist Romina Tempest, to create guides that not only give the in-depth references necessary for cosplayers, but also let us play more in the world of God of War by looking at these designs through the lens of our characters.\n\n[![A leather workbook cover shows a frayed emerald green bookmark on the top right. Inlayed in the middle of the cover is a metal brand flanked by runes. Below them embossed directly into the leather are the words: Lúnda’s Workshop Notes.](media/ce59898d898abadb2b0651ae8b725c3d12ab1b42a1c5001583dcddad08ba76b5.jpg)](https://live.staticflickr.com/65535/52440204818_d6b5a89b29_3k.jpg)[![The interior of the book shows dark blue paper bound with leather straps. Laying on top of the page is a torn piece of parchment with a note addressed to Brok and Sindri. Written in the middle of the page are the words Property of Lúnda. Written underneath that in pale yellow ink and flowy handwriting is text reading: with contributions from Sindri. Sindri is crossed out messily with blue ink, written underneath it in gruff, block letters is Brok. This is crossed out in yellow ink, with Sindri’s name written beneath it again.](media/d1e95cc8b98127f4ba84a27df1d694cad8ade67c6110ba82456ea57fbf739a17.jpg)](https://live.staticflickr.com/65535/52440137935_94442ad87c_3k.jpg)\n\n[![This page houses an introduction of Kratos written by Lúnda with a note from Sindri. Kratos holds the Leviathan Axe on the right-hand side of the page.](media/9e3245dfcd7881aa3c968e2e977cb02a370e5ecaf38b6ced211338ec1884d6ba.jpg)](https://live.staticflickr.com/65535/52439968659_f9cbda46d3_3k.jpg)[![This page houses an introduction of Atreus written by Lúnda with a note from Sindri. Atreus stands with the Talon Bow held in his left hand.](media/20f86a104527c5260e663e174a0359637249adae894b34a678253c6545502e7b.jpg)](https://live.staticflickr.com/65535/52440204253_6a58e4103d_3k.jpg)\n\n## Community cosplay partners\n\n[![This image shows cosplayers portraying Kratos and Atreus in front of a stream. Kratos has his axe raised looking off at an unseen target while Atreus points his bow towards it, ready to fire.](media/a0a21a19de286fdb2099d3d9352347835d73f2323aad465355bd73de0653f531.jpg)](https://live.staticflickr.com/65535/52440167010_9b81b63eb7_z.jpg)\n\n*Photo Credit: Carlos Adama Photography*\n\nWhile we know visual references are key, we also wanted to bring in the expertise of two of our community cosplayers to provide how-to resources and tips they put together while making the cosplays themselves!\n\n[![This image shows cosplayers portraying Kratos and Atreus emerging from a forest. Kratos They look ready for battle with their weapons drawn.](media/7236e7d75ec9c03c2cc60e4e4d8af842467e1fe6cb3253e9511da47284d4fb84.jpg)](https://live.staticflickr.com/65535/52440233543_30d63e103b_b.jpg)\n\n*Photo Credit: Laughing Orc Photography*\n\nWe’re thrilled to have partnered with Opal Ink Cosplay (Atreus) and Jonny Mathers – Baldsasquatch (Kratos), who both did fantastic versions of Kratos and Atreus back in 2018.\n\nThey have put together a wealth of resources for cosplayers to reference alongside the official cosplay guides, not to mention they’ll be releasing videos documenting key parts of their creation process on their own channels.\n\n## Interview with Art Director Raf Grassetti\n\nThe new designs for Kratos and Atreus you’ve seen for God of War Ragnarök are a culmination many months of iteration among the talented character and concept artists here at Santa Monica Studio. Atreus especially posed a unique challenge and opportunity for us with several years having passed since the last game.\n\nTo discuss the Fimbulwinter-ready looks of our heroes in God of War Ragnarök, Art Director Raf Grassetti walked us through some of the key choices that were made along the way.\n\n—\n\n**Grace Orlady: Let’s start at the beginning with the early development phase of God of War Ragnarök. When you found out there was going to be a time-skip for the characters between the games – what first went through your head in terms of what that meant for Kratos and Atreus’ visual looks?**\n\n**Raf Grassetti:** It was amazing to revisit our heroes and design their costumes thinking about what they have been going through since we last saw them. Since we knew they were training on their own and without the help of the Huldra Brothers, we went back to more simple and iconic costumes, from the way they would have made their own armor.\n\nYou can see that reflected in the way things are stitched, the choice of materials, and being more thoughtful on how they are surviving the extreme weather conditions.\n\n[![Concept art of Kratos by Santa Monica Studio Art Director Raf Grassetti.](media/b8606c452028e0ad5877ac3e0c360ac68a53aec20d369dbcc7e502177e68a1e0.jpg)](https://live.staticflickr.com/65535/52439971034_67f76afb83_3k.jpg)\n\n*Kratos Concept Art by Rafael Grassetti*\n\n**We’ve established that God of War Ragnarök begins during the event of Fimbulwinter. Midgard, where Kratos and Atreus live, looks to be covered in snow and ice. How did that influence the design choices the team?**\n\nWe incorporated a lot of elements to illustrate the characters journey from the end of God of War (2018) to the beginning of God of War Ragnarök. The cold weather was definitely a very important factor, you can see on Atreus’ costume, for example, the inverted pelt to protect him from the cold and Kratos using a bear pelt as well.\n\n[![This image is an excerpt from the Cosplay Guide showing full-body Kratos standing from four different angles with his bear fur cloak on.](media/1ff30498f983a73329851d0fa9b794de5c83a37773163cef0245507312d24a48.jpg)](https://live.staticflickr.com/65535/52439181392_d948c4fcae_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 5*\n\n**In God of War (2018), the team significantly changed Kratos’ look to match the new setting while still maintaining the iconic elements of the character that make him instantly recognizable.**\n\n**With the Norse era Kratos design now established in players’ minds, what considerations or challenges did you face with updating his look for God of War Ragnarök?**\n\nSince God of War Ragnarök is a sequel, we knew we didn’t want to completely change Kratos, a lot of the choices made were to update his look to reflect the new setting. We decided to preserve his right pauldron and keep his iconic tattoos visible.\n\nEven though Kratos looks similar to the version of him in God of War (2018), his 3D model was completely re-done to improve quality for the PS5, all detail maps and costumes were made from scratch.\n\n[![This image is an excerpt from the Cosplay Guide showing full-body Kratos standing from four different angles.](media/a7ae29fe2a5ebb162a3939cc96f7c07c874a157cb56e1b56fd09bcc4228fe8a5.jpg)](https://live.staticflickr.com/65535/52440137775_be80cf96e8_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 4*\n\n**When it comes to visual storytelling, what aspects of Kratos’ character are most important to convey through his design and how did you do so?**\n\nKratos has been through a lot and his design always reflects that. He cares about function more than visuals, so a lot of the decisions made on his design serve a practical purpose. Several pieces are there based on their utility in battle, for example, the pauldron with metal pieces protects his dominant arm and the bracers can be used to shield him if necessary.\n\nWe also include touches of his past, such as the red Spartan skirt material, that are reminders of where he has come from. All the design elements together are deliberately chosen to make Kratos believable as a character.\n\n**Is there any aspect of Kratos’ design for God of War Ragnarök that you are especially proud of or want players to notice?**\n\nAt the end of God of War (2018), Kratos removes his bandages and sets them free into the winds of Jötunheim, revealing his scars to Atreus. That was such a powerful moment for the character, so we decided to put a piece of the bandages that Kratos kept at his home on his new gear as a visual callback. On his right bracer, you can see him using them to keep the armor together.\n\n[![This image is an excerpt from the Cosplay Guide showing multiple angles of Kratos’ right arm.](media/313eca54ad25dbcc122d7db1c9d83ffa0a78e0d1496db37eb24a45c74eff47c7.jpg)](https://live.staticflickr.com/65535/52440204388_c341db9fa7_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 15*\n\n**Enough of the dad, let’s get to the son! Atreus has hit a growth-spurt or five since God of War (2018), he’s obviously had a few birthdays and got some new digs since we last saw him. Can you take us through how that initial design brainstorm for older Atreus went?**\n\nAtreus is always so much fun to work on, being able to collaborate with the writers and see the character grow gives us much to play with as artists and reflect those choices in his look.\n\nMore than on Kratos, we knew that the training would have a big impact on him, so he needed to have better gear to protect himself. With Atreus, we can also play a bit more with design elements just for visual interest and make him look cool.\n\n[![This image is an excerpt from the Cosplay Guide showing full-body Atreus standing from four different angles.](media/b359088a256e3ccd8f063dc8dca92b84a3ebda1a8b28c9266f924c1d0b15b4c7.jpg)](https://live.staticflickr.com/65535/52439181087_a8efd3cecd_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 31*\n\n**Are there any unique challenges the team faced when iterating on Atreus’ new design?**\n\nKratos is so iconic that we needed to make sure we found what made Atreus unique so that he could stand next to the big guy and be recognizable. That’s never an easy task. We ended up focusing on the elements that we felt made his design special from God of War (2018) and built upon those pieces.\n\n**What made you settle on going with the final direction we see in the Atreus cosplay guide?**\n\nWe knew we needed to keep the pieces that symbolize his parents, specifically Atreus’ yellow scarf representing Faye and his red skirt piece from Kratos’ Greek outfit.\n\nWe also wanted to keep the “X” shape on his chest, as that was one of the most memorable visual elements from his outfit as a kid. From that base, we explored a lot of different variations.\n\nDela Longfish (Lead Character Concept Artist) had some amazing designs for Atreus and the one we see now is an evolution of many iterations to find the perfect version.\n\n[![Concept art of Atreus by Santa Monica Studio Lead Character Concept Artist Dela Longfish.](media/7eed35ead09fb20fefd86f6f565aef54234c9670a7cda4ca013084a06783583e.jpg)](https://live.staticflickr.com/65535/52440215203_f80436328f_5k.jpg)\n\n*Atreus Concept Art by Dela Longfish*\n\n**When it comes to visual storytelling, what aspects of Atreus’ character are most important to convey through his design?**\n\nAtreus is a teenager and we wanted to make his outfit an avenue in which he could express himself, especially since he makes a lot of his own clothing. It’s important to us that our character designs reflect the times they are living in, so the use of materials, stitching, and coloring of the costume need to be grounded, but not so much as to be overly limiting.\n\nWe always try to find the balance between realism and interesting designs that make the characters in God of War so iconic.\n\n**Atreus in the last game had some pops of color. In God of War Ragnarök he looks to have leaned in a lot more to bright colors. What made the team want to go this direction with his design?**\n\nAt this point in his life, Atreus is trying to find out who he is and the color choices play with that theme. The yellow from the Giants is very strong and something we have used since God of War (2018) to hint at what was to come regarding his heritage.\n\nThe influence of his father is shown in the red waist cloth piece, the aggressive red arrows, and the red in his bow – you will be able to see how that influence impacts his future upgrades in God of War Ragnarök.\n\n[![This image is an excerpt from the Cosplay Guide showing the front angle of Atreus’ waist. The page also has several close-ups of his armor.](media/fd62800d43eff4ab7e26827b8ca7ee57da2a5c04e7adc4073eef7db6bcd29ed1.jpg)](https://live.staticflickr.com/65535/52440181390_c9c739d224_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 36*\n\n**Is there any aspect of Atreus’ design for God of War Ragnarök that you are especially proud of or want players to notice?**\n\nAtreus is a product of his environment and the people around him. A very interesting detail that most people won’t notice is the hint of Kratos’ tattoos coming through his armor design.\n\nYou can see on his left arm/shoulder the cuts of Kratos’ tattoo coming through the costume –  like father, like son.\n\n[![This image is an excerpt from the Cosplay Guide showing the front angle of Atreus’ chest. The page also features Lúnda’s sketch of Atreus’ mistletoe necklace.](media/9ff402b58745e744ddbd2ae686a1d89f2740529bbb5d62dd02d6ff336bb7d054.jpg)](https://live.staticflickr.com/65535/52440137320_71f83e414a_3k.jpg)\n\n*God of War Ragnarök Cosplay Guide – Pg. 34*\n\n**Any message for our God of War cosplayer community?**\n\nOne of the most rewarding things as an artist is to see cosplayers do such an amazing job recreating these characters. We do this with all our hearts to give fans characters that seem believable and it’s incredible to see people relate so much that they decide to cosplay them.\n\nI know the amount of work that goes into making things this complex, so I thank you and appreciate every single one of you.\n\nIf you decide to cosplay a character from God of War, make sure you tag Santa Monica Studio on social or use the hashtag #GodofWarRagnarok! We always love to see your work.\n\n—–\n\nFor the latest updates around God of War Ragnarök, make sure you follow Santa Monica Studio on [Twitter](https://twitter.com/SonySantaMonica), [Facebook](https://www.facebook.com/godofwar), and [Instagram](https://www.instagram.com/santamonicastudio/).\n\nTo join the conversation with other fans, head to the official [Santa Monica Studio Discord](https://blog.playstation.com/2022/10/20/from-concept-art-to-cosplay-creating-kratos-and-atreus-new-looks-for-god-of-war-ragnarok/blank).\n\nGod of War Ragnarök launches November 9, 2022. [Pre-order your copy here](https://www.playstation.com/games/god-of-war-ragnarok//?smcid=mablog).", "excerpt": "At Santa Monica Studio, one our guiding phrases is “we’re fans of our fans.” Whether it’s a reaction to a trailer, a deep-dive lore video, or cosplay – knowing that there is an audience that apprec", "readingMinutes": 18, "images": [{"src": "media/caf72fd98cbfaa40b73d727abc67d8d5a2819658688318cf08dae1e9b8996e0d.jpg", "alt": "From Concept Art to Cosplay: Creating Kratos and Atreus’ new looks for God of War Ragnarök"}, {"src": "media/ce59898d898abadb2b0651ae8b725c3d12ab1b42a1c5001583dcddad08ba76b5.jpg", "alt": "A leather workbook cover shows a frayed emerald green bookmark on the top right. Inlayed in the middle of the cover is a metal brand flanked by runes. Below them embossed directly into the leather are the words: Lúnda’s Workshop Notes."}, {"src": "media/d1e95cc8b98127f4ba84a27df1d694cad8ade67c6110ba82456ea57fbf739a17.jpg", "alt": "The interior of the book shows dark blue paper bound with leather straps. Laying on top of the page is a torn piece of parchment with a note addressed to Brok and Sindri. Written in the middle of the page are the words Property of Lúnda. Written underneath that in pale yellow ink and flowy handwriting is text reading: with contributions from Sindri. Sindri is crossed out messily with blue ink, written underneath it in gruff, block letters is Brok. This is crossed out in yellow ink, with Sindri’s name written beneath it again."}, {"src": "media/9e3245dfcd7881aa3c968e2e977cb02a370e5ecaf38b6ced211338ec1884d6ba.jpg", "alt": "This page houses an introduction of Kratos written by Lúnda with a note from Sindri. Kratos holds the Leviathan Axe on the right-hand side of the page."}, {"src": "media/20f86a104527c5260e663e174a0359637249adae894b34a678253c6545502e7b.jpg", "alt": "This page houses an introduction of Atreus written by Lúnda with a note from Sindri. Atreus stands with the Talon Bow held in his left hand."}, {"src": "media/a0a21a19de286fdb2099d3d9352347835d73f2323aad465355bd73de0653f531.jpg", "alt": "This image shows cosplayers portraying Kratos and Atreus in front of a stream. Kratos has his axe raised looking off at an unseen target while Atreus points his bow towards it, ready to fire."}, {"src": "media/7236e7d75ec9c03c2cc60e4e4d8af842467e1fe6cb3253e9511da47284d4fb84.jpg", "alt": "This image shows cosplayers portraying Kratos and Atreus emerging from a forest. Kratos They look ready for battle with their weapons drawn."}, {"src": "media/b8606c452028e0ad5877ac3e0c360ac68a53aec20d369dbcc7e502177e68a1e0.jpg", "alt": "Concept art of Kratos by Santa Monica Studio Art Director Raf Grassetti."}, {"src": "media/1ff30498f983a73329851d0fa9b794de5c83a37773163cef0245507312d24a48.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing full-body Kratos standing from four different angles with his bear fur cloak on."}, {"src": "media/a7ae29fe2a5ebb162a3939cc96f7c07c874a157cb56e1b56fd09bcc4228fe8a5.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing full-body Kratos standing from four different angles."}, {"src": "media/313eca54ad25dbcc122d7db1c9d83ffa0a78e0d1496db37eb24a45c74eff47c7.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing multiple angles of Kratos’ right arm."}, {"src": "media/b359088a256e3ccd8f063dc8dca92b84a3ebda1a8b28c9266f924c1d0b15b4c7.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing full-body Atreus standing from four different angles."}, {"src": "media/7eed35ead09fb20fefd86f6f565aef54234c9670a7cda4ca013084a06783583e.jpg", "alt": "Concept art of Atreus by Santa Monica Studio Lead Character Concept Artist Dela Longfish."}, {"src": "media/fd62800d43eff4ab7e26827b8ca7ee57da2a5c04e7adc4073eef7db6bcd29ed1.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing the front angle of Atreus’ waist. The page also has several close-ups of his armor."}, {"src": "media/9ff402b58745e744ddbd2ae686a1d89f2740529bbb5d62dd02d6ff336bb7d054.jpg", "alt": "This image is an excerpt from the Cosplay Guide showing the front angle of Atreus’ chest. The page also features Lúnda’s sketch of Atreus’ mistletoe necklace."}], "cover": "media/caf72fd98cbfaa40b73d727abc67d8d5a2819658688318cf08dae1e9b8996e0d.jpg"}, {"id": "07572963395df7943de80eb1", "title": "Champion Insights: K’Sante", "summary": "The Gigachad of Nazumah", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-k-sante/", "publishedAt": "2022-10-18T15:00:00.000Z", "author": "Riot Cashmiir", "markdown": "![Champion Insights: K’Sante](media/eb4443a18d15f05c691fff0e9767abde6c179c4f329619384849033b43b2b0c5.webp)\n\n*Author’s Note: As a reminder, we **do not have a place for hate or prejudice of any kind in our community**.*\n\nChampions are more than just the pixels on the screen. They’re the culmination of the blood, sweat, and tears of the developers who created them, and the teams who supported them along the way.\n\nK’Sante is the result of teams across Riot who wanted to create a character who brought something new to League: A tank who shirks his defenses to 1v1 the most terrifying duelists. A man who gives a new look at what it is to be Black in Runeterra and draws inspiration from West African culture. A fabled monster hunter whose desire to live up to his own expectations causes him to hurt the man he loves most. This is K’Sante’s development story.\n\n## Fine, I’ll Do It Myself\n\nTanks are incredibly powerful. They occupy a unique—and much needed—role in the roster by engaging, peeling, and protecting their carries. But being an unkillable meatball comes with downsides. They get counterpicked by duelists and victimized under tower while praying they don’t get dove by the Fiora at level 6.\n\nSo when K’Sante’s team was thinking about the type of champion they wanted to make, they knew they wanted a tank who could *occasionally* avoid that situation, someone who could take matters into their own hands.\n\n“Everyone asks, ‘Where is the tank?’ No one asks, ‘How is the tank?’ And we wanted to sort of answer that question by giving them a tank that addresses some of the pain points of the role with a new fantasy,” explains game designer Buike “AzuBK” Ndefo-Dahl. “Our goal from the beginning was to create a tank who was very skill-reliant—meaning that he has a very high skill ceiling. I had the idea that this tank would have a moment where he says, ‘I’m going to get this done myself.’ And we just went from there.”\n\nWhat does it mean when a tank takes things into their own hands? Everyone knows the 1v1 power of the tank, bruiser, assassin, enchanter, support, front-liner, back-liner, burst DPS mage... Ornn. But that’s just one tank, and he wasn’t originally designed to clap every champ in League. K’Sante, on the other hand, was.\n\n[![KSanteAllOut.png](media/a9e0e767baf1c6041a403b3dfcb640a1f6c872a579a3b0a5d71442d552cd1231.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ceb26e5b3979c467b13e7f989bc03ad9adc22c0f-593x606.png)\n\nK’Sante’s kit has all of the things you would expect from a tank: shielding, dashing to allies, and CC. He scales off defensive stats. And he kicks you through terrain and simply kills you. Like we said, everything you would expect from a tank.\n\n“When designing K’Sante’s ultimate I kept thinking of that moment in Naruto where Rock Lee drops his leg weights and everyone goes, ‘Wait he can do that?’ And when I handed over K’Sante’s design, that’s how I explained his ultimate,” laughs AzuBK. “The idea was that he’d be in the front of a teamfight, use all of his abilities to protect his carries and set up his team, and then once everything was on cooldown he’d go, ‘Welp, got nothing left. Time to frag.’”\n\n“That Naruto moment was really key when I took over K’Sante’s design. In the earliest version of his ultimate—which has always been called All Out—he didn’t actually kick his enemy through the wall. We were thinking about how to make a tank the star of the show, and it turns out the answer is to just let them beat the f\\*&^ out of you,” laughs design lead Daniel “Riot Maxw3ll” Emmons. “That said, this isn’t some pure upside ability because in deciding to have his huge, exciting moment, K’Sante leaves his team without a tank. That’s why we added the kick—his carries become vulnerable to the enemy team, because he just completely leaves the teamfight to have his 1v1. There’s a tradeoff he’s taking that allows this spell to be a bit more balanced than him just taking over the fight.”\n\nWhen K’Sante sees his moment to go all in, he must decide between protecting his team and hunting his quarry. So the team decided to make that decision a bit easier for K’Sante players.\n\n“Getting K’Sante’s W, Path Maker, right was the most challenging part of his kit for me. It was problematic because during playtests people didn’t want to use it before he used his ultimate because it’s an exciting outplay moment,” says game designer Jacob “Riot Llama” Crouch. “Tanks very rarely have a moment where crowds freak out over a defensive play—Yasuo’s windwall is the closest thing you can get to that. But Path Maker should hit that same dopamine rush because it’s both a serious damage reduction *and* it counters CC. So to solve the problem of people not wanting to use it before he ults and finds himself in a potentially vulnerable 1v1, we just made the cooldown refresh any time he enters his All Out.”\n\n## A Monster Hunter of Nazumah\n\nK’Sante’s dual warden/skirmisher playstyle brings some interesting challenges outside of his gameplay. For one, what kind of weapon does someone use when they can both defend against damage while also beating the snot out of you? Where did K’Sante learn to fight like this? And, an even better question, why?\n\n[![ja_nazumah_studies_final_WEB.jpg](media/4ff9cea0306d3eb5c4cdfd1de246c4f1487b4e402fe1ecbb2caa6dec3b1adf34.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/20618ddef46cfaa8b7d5566229cbe8c6529fcea8-1939x800.jpg)\n\n“During the Shuriman conflict between the Darkin and the Ascended, there was an absolutely astounding amount of refugees fleeing the conflict. A huge number of them traveled south and settled at the edge of the desert near an oasis and founded the city of Nazumah,” explains senior narrative writer Michael “SkiptoMyLuo” Luo. “The city has thrived in the 500-or-so years since it was founded. And it is composed of people from different regions, races, and cultures who have fled warfare over the years.”\n\nBut the oasis Nazumah’s founders settled on is far from a paradise. Their water source is the only one for hundreds of miles, and Nazumans have been forced to defend their home from Void incursions, sand leviathans, marauding raiders, and something far more terrifying.\n\n[![ja_k_sante_cobralion_final-WEB.jpg](media/b7c421e3fe967c03489bee2683e7bc215286ea7e0f7761effe2f6c4bb1e02cf2.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e6607d0dadfd7945f4cf7d9b83e7e7e2cb51f84e-2065x800.jpg)\n\nIn an effort to supplant Azir, Xerath did the unthinkable: He forced giant Shuriman desert monsters to undergo the Ascension ritual. The result of the failed Ascension being awful, twisted creatures called the baccai. These monsters threaten Nazumah and its residents, so the founders of the democratic city-state did the only thing they could: They hunted the baccai and the other monsters threatening their home and safety.\n\n“Something that I hope is unique about Nazumah’s take on monster hunting is that they take the essence or characteristics of the monsters they slay and imbue their weapons, clothing, and general goods with it, opposed to just wielding bones and wearing leather outright,” explains senior concept artist Justin “Riot Earp” Albers. “K’Sante’s weapon comes from the hide of a cobra-lion and has reptilian characteristics, meaning they have regenerative properties. This worked really well with his gameplay, as he breaks the defensive hide of his weapons when he goes All Out.”\n\nK’Sante’s weapons (called ntofos) draw from an unusual source of inspiration: tonfas.\n\n[![ksante-in-game-WEB.jpg](media/6c8abbaa93bb78f3915a1814b7b81d5ea21a76489d55fa8f162a3f777ea96d5a.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7850db49753205b33dc76a4367c01d00f47170b1-1061x514.jpg)\n\nTonfas are weapons used primarily in Okinawan martial arts, and can be used for both blocking *and* striking—things K’Sante does in-game. In our world these weapons are often used to take the momentum of an attacker’s strike and redirect it back at them.\n\n“Ultimately what K’Sante has aren’t *actual* tonfas. They’re much heavier and larger, which makes sense for his 6’7”, 250lb frame. But K’Sante uses them in a similar way. He blocks with them, swaps his grip and then can slam the earth and cause a small shockwave with his sheer strength,” says Riot Earp.\n\nOh yeah, we should probably talk about that... K’Sante isn’t magical. He’s just a man. A man who has been training his entire life to be the best monster hunter in Nazumah, and he is the embodiment of human perfection.\n\n[![ksante_portrait-WEB.jpg](media/aeaff1f55f013686edfcb77a1da60d076eb659e3ac9e2ab5f078743a9e83a029.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ba23eae18bf56a0c33dbc1060f9b39c6027169aa-528x800.jpg)\n\nNazumah historically relied heavily on monster hunting to survive. But they’ve long since moved on from mere survival—monster hunting has become one of the ways Nazuman culture has *thrived*. So the team started to think about ways it would be incorporated into their culture.\n\n“The monster hunters of Nazumah are so idolized by their people that they take on a sort of celebrity status. I drew real-world parallels to Olympic athletes. K’Sante has trained his entire life to get to this level,” explains SkiptoMyLuo. “He stands out among the champions from Shurima who are magical, imperialist, god-like beings. He’s someone that the kids of Nazumah could grow up to become. I always had this mental image of him standing toe-to-toe with Azir, looking into his eyes, and just being like, ‘You are no one to me.’ And I think that image helps bring balance to that conflict. Humans can be incredibly powerful if they’re given the chance.”\n\n## West Africa Meets Runeterra\n\n“I spent a lot of time thinking about how we could create a Black champion who felt different from the other ones we already have,” explains AzuBK. “Senna, Lucian, Ekko, Rell, and Pyke are all great characters... in spite of something. They’re all defined by their problems or circumstances. Ekko is smart, plucky, and clever for a child of the Undercity. Lucian is a deeply hurt man whose entire life is about avenging his wife’s death. Senna is that dead wife who was stolen and imprisoned. Rell was imprisoned at a ‘school’ and experimented on. Pyke is a zombie obsessed with killing people. For the most part, they haven’t had agency in their own lives and stories.”\n\n“That’s not to say this is a problem for these champions individually—many great characters are defined by their problems. But good representation, especially in a broad roster like League’s, comes from presenting all angles,” AzuBK continues. “There’s no Black champion like Garen who faces problems, but isn’t *defined* by them. No one is in charge. And so we wanted to create a Black character like that. Someone who has issues, yes, but someone in charge of their situation in life and their destiny, a paragon of Nazumah.”\n\n“A paragon of Nazumah” became a north star for the team. They wanted to create a character who was the first thing you thought of when you thought of Nazumah—a place inspired by West African traditions and culture—particularly those of Ghana.\n\n[![ksante-WIP-16---portrait_WEB.jpg](media/abd3ca4e9cbcf6edd50c4f2712fc1c9186165aa046be4c8d1050ed7d17bb4a2c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ceab1553595bfb7c8854adee627576a4e26281f9-1775x400.jpg)\n\n“We had another goal when we started K’Sante, and that was to create a champion inspired by Ghana. A good part of my family is from Nigeria, we’re neighbors and occasional rivals of Ghana. And so I talked to my mother about Ghanaian fashion designers, photographers, and general inspiration,” AzuBK shares. “She turned me on to a lot of cool Ghanaian designers and artists, and something that we immediately wanted to capture was the vibrant patterning and the cloth.”\n\nWest Africa is known for its beautiful fabrics and patterning. Kente is one of the most famous fabrics in the world, and it comes from Ghana. It’s known for its vibrant colors that have deep meaning, and its intricate patterning. And Ankara fabrics can be seen all over Africa and the rest of the world besides. The team knew instantly that this was the perfect starting point for K’Sante’s costuming.\n\nThe team wanted to pay homage to Nazumah’s monster hunting culture, but there are a lot of concerns with a West African-inspired character being decked out in clothing that is *clearly* made from monsters. Nazumah is a city of artisan craftspeople who are technologically and scientifically on par with Noxus—they don’t wear bones and leather. They embellish their clothing with rich designs and precious jewels. So Ghanaian fabric fit perfectly when the team started costuming for K’Sante... until they ran into League problems.\n\n“Sources of power are important in League. We try to draw players’ eyes to them, and K’Sante’s source of power isn’t his clothing, it’s his weapons. Ghanaian textiles are so vibrant and intricate, they naturally draw the eye,” explains Riot Earp. “We ran into a few challenges with making it work in League. But ultimately we decided that if we were going to do this right, we needed to move forward with bold colors and patterning. To try to balance the in-game read, we saturated the colors and added some texturing and motifs to his weapons to make them stand out against his clothing.”\n\n[![ksante-WIP-16---daylight-WEB.jpg](media/d37d5f1c50956eca328f33b5f227720fd5e548b3e06d5dc07185ca7c78ad96e2.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5fc3a2624909cc868d45514e6abc5d5d1854d1e5-2734x600.jpg)\n\nBeyond his visuals, the team wanted to convey West African culture and tradition through K’Sante’s backstory as well.\n\n“We worked really closely with the Riot Noir RIG (Editor’s Note: Riot Noir is our Black Rioter Employee Resource Group) and they told us how important oral storytelling and folklore are in African culture—which was similar for me personally, as this is commonplace in Hui Chinese culture as well,” shares SkiptoMyLuo. “K’Sante had grown up hearing about these amazing stories and tales of his great, great, great, great, great uncle who fought against the Ascended, or how his father defeated some amazing monster and crafted his weapon. These stories are so ingrained into Nazuman culture that they’re built into the city and part of the people. They’re part of what drives K’Sante to become the pride of Nazumah.”\n\n## A Tale of Two Hunters\n\nSometimes characters just become whole. When you spend time thinking about them, it’s like they speak to you and write themselves. And as SkiptoMyLuo was thinking about K’Sante—about everything he was, everything he could be, his hopes and fears, his dreams... K’Sante told his own story.\n\n“When K’Sante’s direction and kit were pretty much locked I spent a lot of time thinking about his personality. We had created this champion who was meant to solve some frustrations that top lane tanks face, and I wanted to create a character who sort of embodied the player’s experience there,” recalls SkiptoMyLuo. And so he wrote.\n\nK’Sante lives with a massive amount of self-inflicted pressure. From his dreams of being the greatest monster hunter in Nazumah, to his desires to prove himself to his people and... well, himself. He’s a fiercely proud Nazuman: He proudly stands up against the Ascended, and he’s proud of how much work he has put in to get to where he is now. But pride is blinding, and it is sure to hurt those we love most.\n\n[![ja_tope_final_WEB.jpg](media/9544c4082db8ced1ca365e9f86bbabd8537b00da0f021a157a3468452eb31ce0.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b3fbdedb81adbcac1f1374d8fb323477b9c222f9-1376x800.jpg)\n\nTope, K’Sante’s former other half\n\nTope and K’Sante were a natural pair—Tope cool and tempered, while K’Sante runs hot. Together they could accomplish anything. Together they hunted—Tope understands their enemy, while K’Sante lands the killing blow. And so the two men, who worked together so well, fell in love. Until they faced an insurmountable obstacle: pride and youth.\n\n“They eventually reached this moment where they were unable to kill the lion-cobra baccai they hunted. And that’s where the falling out started to happen. K’Sante **needed** to kill it to live up to his own expectations as this heroic hunter and idol to his people. Tope tried to convince him to slow down and take a moment, but they would just devolve into arguments,” explains SkiptoMyLuo.\n\n“Romantic relationships are often the place where a lot of your worst attributes come to light. But overall I want K’Sante and Tope’s story to be relatable to everyone,” SkiptoMyLuo continues. “We worked really closely with the Rainbow Rioters (Editor’s Note: Our LGBTQIA+ RIG) to craft a common experience to have a relationship where you and the other person aren’t quite able to successfully convey all your feelings and frustrations to your partner. And your partner ALSO doesn’t quite convey their own feelings and frustrations that they’re prioritizing. So at the end of the day you have to go your own separate ways—romantic relationship, friendship, or otherwise. Ultimately both K’Sante and Tope grew from this experience and acknowledged that they each had a part to play in their breakup, but still remained friendly.”\n\n[![topejournal.jpg](media/61835c804983261e639d2cc95b0b69eb159271bcb257ba1597a5f178e3955365.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3111870c2c59641072cf114e5e3053388ba8504e-1192x826.jpg)\n\n“Tope and K’Sante’s story might not be relatable or perfect for every single person. I think it’s important to embrace that. We needed to just find our story and tell it. Because the answer to good representation isn’t making something perfect. It’s doing it, and then doing it again, and again, and again,” says AzuBK. “I spent a lot of time talking to SkiptoMyLuo about K’Sante’s sexuality because spoilers: I’m gay. So I have a lot of opinions about K’Sante’s backstory. And it’s not perfect—it can’t be. So I had to put my player hat on and think about this not as a League dev, but as a gay Black man. I asked myself, ‘If I’m seeing this as a player do I think this is a good, solid attempt? Do I think this is worthy?’”\n\n“I know it can’t be perfect, because one gay male character can’t make up for all the queer characters we haven’t made,” AzuBK continues. “But ultimately I think the answer is yeah. Yeah, I think this is worthy. And it’s a start. Now we just have to do it again. And again. And again.”", "excerpt": "Author’s Note: As a reminder, we   do not have a place for hate or prejudice of any kind in our community  . \n\nChampions are more than just the pixels on the screen. They’re the culmination of the", "readingMinutes": 21, "images": [{"src": "media/eb4443a18d15f05c691fff0e9767abde6c179c4f329619384849033b43b2b0c5.webp", "alt": "Champion Insights: K’Sante"}, {"src": "media/a9e0e767baf1c6041a403b3dfcb640a1f6c872a579a3b0a5d71442d552cd1231.png", "alt": "KSanteAllOut.png"}, {"src": "media/4ff9cea0306d3eb5c4cdfd1de246c4f1487b4e402fe1ecbb2caa6dec3b1adf34.jpg", "alt": "ja_nazumah_studies_final_WEB.jpg"}, {"src": "media/b7c421e3fe967c03489bee2683e7bc215286ea7e0f7761effe2f6c4bb1e02cf2.jpg", "alt": "ja_k_sante_cobralion_final-WEB.jpg"}, {"src": "media/6c8abbaa93bb78f3915a1814b7b81d5ea21a76489d55fa8f162a3f777ea96d5a.jpg", "alt": "ksante-in-game-WEB.jpg"}, {"src": "media/aeaff1f55f013686edfcb77a1da60d076eb659e3ac9e2ab5f078743a9e83a029.jpg", "alt": "ksante_portrait-WEB.jpg"}, {"src": "media/abd3ca4e9cbcf6edd50c4f2712fc1c9186165aa046be4c8d1050ed7d17bb4a2c.jpg", "alt": "ksante-WIP-16---portrait_WEB.jpg"}, {"src": "media/d37d5f1c50956eca328f33b5f227720fd5e548b3e06d5dc07185ca7c78ad96e2.jpg", "alt": "ksante-WIP-16---daylight-WEB.jpg"}, {"src": "media/9544c4082db8ced1ca365e9f86bbabd8537b00da0f021a157a3468452eb31ce0.jpg", "alt": "ja_tope_final_WEB.jpg"}, {"src": "media/61835c804983261e639d2cc95b0b69eb159271bcb257ba1597a5f178e3955365.jpg", "alt": "topejournal.jpg"}], "cover": "media/eb4443a18d15f05c691fff0e9767abde6c179c4f329619384849033b43b2b0c5.webp"}, {"id": "8a3f8579cda83deeff161560", "title": "/dev: Star Guardian Narrative", "summary": "The words and wordsmiths behind Star Guardian’s stories.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/dev-star-guardian-narrative/", "publishedAt": "2022-08-08T15:00:00.000Z", "author": "Riot Lady Smalls", "markdown": "![/dev: Star Guardian Narrative](media/987fa3c740de7d56b0c00a428025159d7c3ed3afaa1e74cf2e12b20ca870ffe2.webp)\n\nHello players and lore enthusiasts! I’m Stephanie “Riot Lady Smalls” Bedford, Narrative Producer on League and Wild Rift and a resident Star Guardian expert!\n\nIt has been a minute since the Narrative team put out a [/dev blog](https://nexus.leagueoflegends.com/en-us/2019/09/dev-narrative-in-2019/) (Hello 2019! We were all so much younger!). Since then, we’ve been deep in the word mines™, but we’re really happy to speak with y’all today. The League Narrative team has changed quite a bit since we last spoke, and we have a big new cast of Rioters to introduce (including me, hi!) as well as some returning favorites.\n\nWhen we started on this year’s chapter of Star Guardian, we wanted to make sure we delivered on the commitments made when we reflected on the [Sentinels of Light event](https://www.leagueoflegends.com/en-us/news/dev/looking-back-on-sentinels-of-light/). Today is intended to give you a peek at what it took to make the Star Guardian event this year.\n\n## Star Guardian 2022: Written in the Stars\n\nWe were super excited to bring back Star Guardian, and to expand on the story we started seeding in 2019. A lot of players around the world have been fans of this world since then (or even before!), and we were ready to get you all back into this world. Star Guardian is one of our favorite thematics internally for a huge amount of us, and it’s incredible to see how many of you are invested in this story each time we add more.\n\nWhen thinking about the stories we wanted to tell this year, we had overall goals that we prioritized while crafting the narrative of this next iteration. We wanted to honor continuity, elevate Lux and her team to their well-deserved “legendary” status, reflect the changes that team made on their world, make space for a new generation of Guardians, and ensure the new Guardians reflected and challenged the values instated by the previous Guardians’ successes and failures. In short, we wanted to focus on topics like identity, relationships, and belonging, things that are part of the universal human experience... while also telling the stories of magical heroes who are protecting and saving the world while still trying to pass their high school classes! Things we can *all* relate to.\n\nFrom the very beginning of development, the Narrative team created a strategy to ensure the event would be consistent across every game and execution. Because the event was planned for League of Legends, Wild Rift, *and* Legends of Runeterra, we wanted to make sure that players experienced a unified Star Guardian Universe that was consistent across all of our games.\n\n[![08082022_SG2022NarrativeArticle_Morgana-Encounter-15_WEB.jpg](media/e80c0be6b29f76c86f91b568b405745c4658eaa96511d248046c8e3cfd0edcc9.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6416d3eafbff04d908f15e99c7a8d33dec15e8f8-1200x600.jpg)\n\nWe also wanted to incorporate learnings from the Sentinels of Light, Spirit Blossom, and RiotxArcane events to make Star Guardians bigger (and better) than other story-driven events we’ve done. With that feedback we felt it was imperative to empower other teams with information as storytelling experts to ensure Star Guardian still *felt* like Star Guardian, no matter the medium. We wanted you as players to be able to invest in the truth of this Universe and the stories we are telling. This led to a strategy that became our North Star (hehe) in many conversations along the development.\n\nThe following are the Narrative pillars which were the foundation that let us bring Star Guardian to life:\n\n- Narrative for this event must be cohesive with past Star Guardian lore.\n- Story moments of the past should be felt in the future; character and story changes are durable.\n- All narrative content takes place somewhere on the Star Guardian canonical timeline; chronology and continuity are maintained and story moments should not be represented more than once.\n- All content must align to the tone and thematic pillars of the Universe; products and media can have variance but share the same core truths.\n\nNarrative cohesion was our top priority for Star Guardian, and the League Narrative team (who wrote for both League PC and Wild Rift) worked closely with other teams at Riot to ensure *everything* for Star Guardian was cohesive and worked together to tell a single story. We also made sure to keep future Star Guardian storytelling in mind, because if one thing’s for certain, we’ll never *truly* leave Valoran City.\n\nWe were also very aware of the need to pay off our narrative debts. Basically, investing in certain character arcs we’d already begun and eliminating some of the unhelpful ambiguity in the stories that previously existed. To do this, we worked with other teams on the campaign to continue stories like Star Guardian Xayah and Rakan’s story arc on Wild Rift as well as keeping Star Guardian’s core truths of friendship and chronology in mind in things like [Everything Goes On](https://youtu.be/eEFVxI9lqjU), the [vlogs, comics](http://starguardian.riotgames.com/), and other content all along the Star Guardian Event.\n\n[![08082022_SG2022NarrativeArticle_BattleTwilightStarWeb.jpg](media/a5cea6a482c8833d041f3d04e422cfe5232b651998707b90774b24d40b1a195f.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7329ebe703244eff1b7249c60e6c71a2bedd0679-633x750.jpg)\n\nI just want to warn y’all that this part might get a little in the weeds with Narrative processes, but I think it’s important to explain just how much time we spent thinking about this.\n\nWe worked closely with all of the various teams on Star Guardian to make sure that every piece of content created worked together to tell the cohesive story. Everything that you’ve seen across League, Wild Rift, and Legends of Runeterra—Star Guardian Seraphine’s Vlogs, Another Sky, Everything Goes On, [Shadow of a Doubt](https://youtu.be/K0p8HNpn0Qo), Twin Stars, the skins... The list is too big to name.\n\nWe created documentation around the story (the number of documents I’ve seen and maintained...) to present to our partners both around Riot, and externally. Because each decision made in this campaign—even something as small as the publishing date of an editorial article—could impact the overall story and *how* we told it, we were careful to prioritize narrative outcomes through production details. We wouldn’t want to spoil the end of Another Sky without players having the chance to finish it, after all!\n\nBecause of this focus, the entirety of Narrative was empowered to surface opportunities throughout the process of creating Star Guardians 2022 (which we’ve been doing since 2021!) so the story would be stronger for all of you. A lot of this effort is seen in small things, like the art style cohesion from game-to-game, the sound effects of the skins, and the canon-ified [Previously on Star Guardian](https://www.leagueoflegends.com/en-us/news/lore/previously-on-star-guardian/) article from before the event started. The goal was to make this event an event that you could jump right into and love, regardless of your previous familiarity. We wanted to invite everyone to come love the thing we put so much effort into creating and lower that barrier to entry where possible.\n\n[![08082022_SG2022NarrativeArticle_Morgana-Encounter-01_WEB.jpg](media/e1ba033e1556f6ec560e9ae89a31110aa68377818bcd7c35c9912b84a09840a0.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2d84e16163ddc3bcb11591afc9e9cea53a347bf9-1200x600.jpg)\n\nInternally, we maintained a dedicated weekly Narrative sync that was across all products to make sure all parts of the event were working in concert with one another. There was so much respect from our partners during the entire process, and we worked together to find creative pivots any time we ran into issues. We had a Narrative representative advocating for the story every step of the way, and we hope that is something that our players feel when they look at the cohesion of the storytelling across the whole event.\n\nOur regional teams also created some really amazing ways to honor the Star Guardian Universe and take part in the event in their regions that helped expand on the Universe. It was amazing to be partners to so many globally and support their lore questions and truly unique experiences they created.\n\n[![08082022_SG2022NarrativeArticle_SG22_Franchise-KV_Final.jpg](media/38940b189e51ff0ee9012fd8ed4241e3e1e8a11c628b6dd8cbb5f798051893f5.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/64008dd57fddfa0a3baad95b72e3bdd13068a97f-1920x1080.jpg)\n\n## A Word of Thanks\n\nMaking Star Guardian this year was a labor of love, and it couldn’t have been achieved without so many amazing Rioters who brought their whole heart to the writing. Creating something of this scale takes an army and, even if I’m only highlighting a single discipline here, I’d like to take a moment to list out those contributors who are deserving of all the praise I can muster:\n\nEvent Narrative Production: Stephanie Bedford\n\nEvent Lead Writer: Jared Rosen\n\nAnother Sky Writing: Jared Rosen, Ty Sheedlo, Taylor Dinwiddie\n\nAnother Sky Editing: John Chambers, Anastasia Basil\n\nPC Legendary Scripts: Michael Luo, Brooke Jaffe, Nicholas Werner, John Chambers\n\nNilah (Narrative): Jared Rosen, Elan Stimmel, John Chambers\n\nPreviously on Star Guardian: Erika Haas, Stephanie Bedford\n\nLoL Social and Website: Caytie Davenport, Ty Sheedlo\n\nEverything Goes On: Bethany Higa; Supporting writers: Phillip Vargas, Cat Cheresh, Caytie Davenport, Julia Shen, Winnie Huang\n\nShadow of a Doubt: Brooke Jaffe, Calle C. Miller  \nDeveloping the Star Nemesis Villains: Kenny Cameron\n\nWild Rift Metagame Writing: Ty Sheedlo\n\nWild Rift Metagame Editing: Nicholas Werner, John Chambers\n\nWild Rift Legendary Scripts: Kristina Atanasoski, Nicholas Werner, John Chambers\n\nWild Rift Vlogs: Cat Cheresh, Phillip Vargas, Julia Shen\n\nWild Rift Comics: Callie C. Miller, Jared Rosen, Sabrina Futch, Molly Mahan\n\nWild Rift Social and Website: Julia Shen\n\nTwin Stars: Cat Cheresh, Siege Gary, Phillip Vargas\n\nLegends of Runeterra Star Guardian Kai’Sa: Conor Sheehy, Rowan Williams\n\nLegends of Runeterra Flavor Text: Esther Kao\n\nLegends of Runeterra Social and Website: Winnie Huang, Esther Kao\n\n[![08082022_SG2022NarrativeArticle_Fiddle_WEB.jpg](media/2e142e9cbdc2c57907d1b03338d26d7d2b173415c2851ff2f3afd8e0f4c19611.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0587c25b3e4e5d437db9ee7f6c319b549b689aa9-425x600.jpg)\n\nAll of this is to say... Star Guardians was, is, and always will be a love letter, by fans for fans. None of this would have been possible without the support and understanding of players around the world. And it’s only because of you that we’re able to do things like this!", "excerpt": "Hello players and lore enthusiasts! I’m Stephanie “Riot Lady Smalls” Bedford, Narrative Producer on League and Wild Rift and a resident Star Guardian expert!\n\nIt has been a minute since the Narrati", "readingMinutes": 12, "images": [{"src": "media/987fa3c740de7d56b0c00a428025159d7c3ed3afaa1e74cf2e12b20ca870ffe2.webp", "alt": "/dev: Star Guardian Narrative"}, {"src": "media/e80c0be6b29f76c86f91b568b405745c4658eaa96511d248046c8e3cfd0edcc9.jpg", "alt": "08082022_SG2022NarrativeArticle_Morgana-Encounter-15_WEB.jpg"}, {"src": "media/a5cea6a482c8833d041f3d04e422cfe5232b651998707b90774b24d40b1a195f.jpg", "alt": "08082022_SG2022NarrativeArticle_BattleTwilightStarWeb.jpg"}, {"src": "media/e1ba033e1556f6ec560e9ae89a31110aa68377818bcd7c35c9912b84a09840a0.jpg", "alt": "08082022_SG2022NarrativeArticle_Morgana-Encounter-01_WEB.jpg"}, {"src": "media/38940b189e51ff0ee9012fd8ed4241e3e1e8a11c628b6dd8cbb5f798051893f5.jpg", "alt": "08082022_SG2022NarrativeArticle_SG22_Franchise-KV_Final.jpg"}, {"src": "media/2e142e9cbdc2c57907d1b03338d26d7d2b173415c2851ff2f3afd8e0f4c19611.jpg", "alt": "08082022_SG2022NarrativeArticle_Fiddle_WEB.jpg"}], "cover": "media/987fa3c740de7d56b0c00a428025159d7c3ed3afaa1e74cf2e12b20ca870ffe2.webp"}, {"id": "e9ae41816067dedf275d5479", "title": "Champion Insights: Nilah", "summary": "The feminine urge to slay 40-story sea serpents.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-nilah/", "publishedAt": "2022-06-22T15:00:00.000Z", "author": "SMALL BABY PANDA", "markdown": "![Champion Insights: Nilah](media/879ca4bf5174dcc4827e13f73c13bfde468d0ea133f8950e5c6b5c18fb6ccce7.webp)\n\nThe most recent additions to the League roster have been, how do you say… big meanies.\n\nEarlier this year, we released [Renata Glasc](https://www.leagueoflegends.com/en-us/news/dev/champion-insights-renata-glasc/), the manipulative and powerful Chem-Baroness, and [Bel’Veth](https://www.leagueoflegends.com/en-us/news/dev/champion-insights-bel-veth/), the monstrous manta mommy Void Empress.\n\nBut we’re breaking the cycle with a surge of joy named Nilah (\"Nee-lah\").\n\n## Her Waters Cut Deep\n\nNilah’s development started with a core gameplay idea: a melee skirmisher ADC. The goal was to create a new experience not only for bot laners, but also for Yasuo or Yone mains who might want to try their hand (sword?) at another position. We know, we know... before you bot and support mains turn caps lock on, keep reading.\n\nThe team really didn’t want to create another sad Ionian sword boi. With this in mind, concept artist Nancy “Riot Sojyoo” Kim began looking into weapons that might fit the bill and stumbled upon the urumi, a flexible whip-like sword with South Asian origins. This worked out beautifully, as the team wanted to increase South Asian representation in League. Similar to how we've approached champions like Samira, Akshan, or Zeri, we want players from everywhere to see reflections of themselves in League, and we were lacking South Asian representation, especially for women.\n\n[![062222_01_Whip_Concepts.jpg](media/76c9313920c403b229e0f4818804c466da7c91698622fbb8bb868811a2d93043.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4704c201759cc700f2db9719395528cb759d306c-2000x1381.jpg)\n\nThe urumi fit Nilah’s intended background, her melee gameplay, and is just really, *really* cool. Plus, whips were essentially missing in League. The idea had been floated before, but never quite made it onto the Rift.\n\n“When Nancy’s first group of concepts came back, there was one with, like, six arms and one with a more traditional talwar (curved sword),” says principal narrative writer Jared “Carnival Knights” Rosen. “But when we saw the concept with the urumi we were like ‘Oh my god, do we not have a whip champion? There has to be one. Maybe Zyra? No, she’s a plant lady. Anybody else?’ And there just wasn’t anyone.”\n\n“It felt like the perfect time to finally create a whip-wielding champion because the urumi is a good nod to her South Asian inspiration *and* it fits her gameplay,” Riot Sojyoo adds.\n\n[![062222_02_Nilah_Concepts.jpg](media/e3635092c56c81276213728142ec986ac4acc7467680deb58024b885ca39ea00.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a270a6fc5a162f4222d4ea2328816d4502082dd8-3000x964.jpg)\n\nBut making a whip-sword look realistic and feel good in game was a challenge. Have you ever *seen* an urumi in action? Recreating the snappy yet flowing movements was a challenge for the animation team.\n\n“We spent extra time early on to determine if a fluid, satisfying whip was a weapon we could achieve with the tools we usually use,” says lead animator Drew “sandwichtown” Morgan. “We tried a few different approaches to help sell the physics, but ended up landing on a mostly hand-animated style, with some different technical tricks layered in there.”\n\nBefore continuing, we should talk about the difference between tool-based animation and hand animation. A lot of modern games utilize physics and simulation with engine tools, but Nilah’s whip needed to be custom animated just for her. This meant sandwichtown set all the keys and animated every frame of motion.\n\n“I think the most challenging part was just how many attack animations that were required to make all the motions feel directionally appropriate, at different distances with different conditions,” sandwichtown explains.\n\n[*![062222_03_Animation.gif](media/d35aecce0b0c2242e7bfd0a8279c6edfae0a31e2fd4df67cfb5fedfebb035e60.gif)*](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fb1557dd3ff9767c20154b3ccb2c965659fd28d2-400x400.gif)\n\n*Animation testing of Nilah’s basic attack.*\n\nBut Nilah’s whip isn’t just any old whip. It’s a two-pronged, flexible water-sword that she unsheathes from a magical jar that sits on her hip. Honestly, it’s pretty cracked. So obviously it needed some extra visual attention.\n\n“To convey a joyfulness to her visual effects and not have it look like ‘just water,’ I added a sense of iridescence and rainbow to her abilities,” explains VFX artist Megan “Fairy Flan” Bayona. “In a way it's as if the influence of the demon of joy refracts outwards and Nilah uses it as her strength.”\n\n[![062222_04_Ability.gif](media/7a87e481e45e348addc169cdcba2fd03fd58f13f63d0981529bd3a44ef43a9c3.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3d06cd8b0340616cef499fcdeb81aa8cf3cb0882-450x269.gif)\n\n*Nilah’s water whip hits with the force of a rogue wave, only sharp.*\n\n## Joy Unbound\n\nYep, you heard Fairy Flan right. Nilah channels the power of a *demon of joy* to slay mythical beasts and defeat her enemies. She’s an epic, monster-slaying hero who’s building out her own legend day by day. (Editor’s note: Let’s be real, would this be a Carnival Knights champ without demons?)\n\nAn ascetic warrior, Nilah practices a strict code of rite and ritual that gives her power over Ashlesh, an ancient demon of joy who was sealed away eons ago.\n\nAshlesh is a member of [The Ten](https://universe.leagueoflegends.com/en_US/story/fiddlesticks-color-story/), the oldest and most powerful demons in existence. It pushes joy to its hideous extremes, feeding on the dark, inverted aspects of the emotion, like delirium and obsession. But Nilah has harnessed Ashlesh’s power to do good.\n\nNilah didn’t always have these otherworldly powers. Once upon a time, she was a normal girl with a normal life—until she wasn’t.\n\n“She goes beneath her home city and disappears for a decade. When she emerges, she immediately starts putting down demi-gods and giant dragons that are bigger than mountains. She’s fighting creatures that should not be able to be defeated,” explains Carnival Knights.\n\nBut wielding Ashlesh’s immense power comes with a heavy burden: Nilah is erased from living memory. There is no record of her ever being born. She is a stranger to all she ever knew, even her own family.\n\n[![062222_05_Full_Nilah.jpg](media/f8557227dea8b35ded0a7fefbc85213ae7685595f1a3cdddac26399ad6a55079.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/708bb36efa00c2d0bdb42c96a91e4aef37459220-3353x1440.jpg)\n\n“She returns not as this bookworm, but as a wiry stranger with heroic strength. She has no past and her future is unwritten. She’s literally lost herself to joy,” says Carnival Knights, noting that Nilah’s unflinching positivity is completely involuntary. “Ashlesh annihilates her entire emotional spectrum besides joy. She can observe that she is feeling other things, or that she *wants* to feel other things. There’s a lot of sadness and loss in her life, but she can’t feel anything but positive towards it, which is conflicting.”\n\nShe’s truly living her best life… whether she likes it or not.\n\n“Very much like a hero from the [Ramayana](https://www.britannica.com/topic/Ramayana-Indian-epic), she has given up everything for this incredible power and uses it to protect the world from ancient threats that have been long thought invincible,” Carnival Knights explains.\n\n[![062222_06_Portrait.jpg](media/5e8d3fac1ea0d30a69beb1bee6e0974ebcb0dd7eadc59d475d0ac9dab542630a.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f795e77dc17136eba9fd4b0c1babb2b7977f51b8-1601x2005.jpg)\n\n“Because she’s a very nimble character, we wanted to make sure her outfit wasn’t restricting and it was light and it allowed her to do a lot of jumps and tricks,” says Riot Sojyoo, noting that the art team wanted to convey Nilah’s ascetic warrior identity, while keeping her clothing practical for slaying mythical beasts.\"\n\n[![062222_07_Seven_Hands.png](media/85f08420b3b7bfc507cf404e3bc4c2b0db3d0e62df2790ec771b81594e0d8cbb.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9707bd2e41e6a1831b03142ff4e3d2faeb6bfa5a-2176x1216.png)\n\n*Legend has it Ashlesh has seven arms and is trapped in the seventh layer of an underworld.*\n\nNow, the wider world of Runeterra will bear witness to Nilah's legendary powers.\n\nAfter the Ruination, Nilah leaves Kathkan and decides to cross the ocean to Bilgewater to seek information on Viego—who is now imprisoned on her home continent—and The Ten. And she might as well hang around [Oyster Bill’s](https://www.leagueoflegends.com/en-us/news/dev/champion-roadmap-april-2022/) Oyster Bar and slay some sea serpents who are rampaging around the docks while she’s at it.\n\n[![062222_08_Nilah_Splash.jpg](media/3519b000aa88601b76f80240baa4cb546a11114d0d3c07504de031b8f5e7e901.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c58c0f4d349274c48e9521417476cd10917fcfb9-2000x1125.jpg)\n\nNilah’s goal is to do good wherever she goes, expanding the epic tale of her life—and to keep up with her ritual prayers so she stays in full control of Ashlesh.\n\n“This is one of the most powerful women on the planet, and she spends almost all of every day sitting around in the dark, reading books or reciting prayers to make sure that she’s not possessed by a demon. And then occasionally she gets up, kills like a 40-story tall sea serpent and then goes back to doing the thing she was doing before,” says Carnival Knights. “In the parlance of our time, she gives no f\\*&^s.”\n\n## The Star of the Show\n\nOutside of being an absolute monster-slaying badass possessed by an ancient joy demon, Nilah is designed to be a hypercarry—but she can’t go it alone. Just like her pledge to the Seventh Layer, Nilah’s allegiance to your team will help it reach its full potential.\n\nWhile she has the weaknesses you’d expect to find in a melee bot laner (like being susceptible to every single spell from the enemy “support” mage), she makes up for them when her allies rally around her. When there’s an ally nearby, she has tools that relieve some of the burden of CS’ing well and managing laning phase without any CC.\n\nHer passive, for example, allows her to amplify and share healing and shielding that’s done to her or that her nearby allies do to themselves.\n\n[![062222_09_Heal_Sharing.gif](media/71f935b22afee8dd90a0a7be2b76fb515e6682b8cdd5551ffeac6d7d77c0b7e1.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/340a2069a9f9097b66c4c275b9711c0f4df06845-581x548.gif)\n\n*Yasuo mains, now you can stop begging your team to pick knock-up champs and start begging them to pick enchanters.*\n\n“If she is with a character who has some sort of shield or heal, then she’s making them better. And at the same time, she’s sort of selfishly taking more for herself too,” explains senior game designer Blake “Squad5” Smith.\n\nNilah’s passive also includes an XP bonus that she shares with a nearby ally—but she has to last-hit minions to get it. So stay off her wave, Zyra mains.\n\n“Her passive basically says, if you support me, I will make us win,” Squad5 laughs. But even though sharing is caring, she’s perfect for the player who wants to show off a little. “More so than almost every other character in the game, Nilah says put the spotlight on me. There’s a lot of pressure that goes along with playing her. But if you want to be the star, and you want to kill everybody, this is a great character to pick.”\n\n[![062222_10_Final_Concept.jpg](media/ae058c9d07b8d4056ba76f2c54d1b8ed480c1f0fa4cfd1c27200a3624dbb4325.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9efc976abf70f69a19bbb345478e4f104746bf65-3847x2245.jpg)\n\nThe killing everybody part doesn’t come easily though. Nilah isn’t the type of champ that will simply snowball and dominate lane.\n\n“We wanted to make sure she was not like a Jarvan or Pantheon lane where they’re just repeatedly killing you over and over and over again ‘cause that’s all they can do,” Squad5 says. “She actually needs to function in a way that feels familiar to bot lane players in that she wants to farm and is more oriented around trading. She’s not constantly going for those all-ins like other melee bot laners.”\n\n[![062222_11_Whirlpool.gif](media/5c041cfe397580ce7fb1f5ed1ddf14106995897f753f97b6291408d1e32c2970.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a6e52afdf08a14cbe93f63ba371224dd2603d4e1-400x350.gif)\n\nThe rest of Nilah’s kit shows off the true splendor of her magical water weapon. She can strike out in a line with her urumi, veil herself in mist, dash as though sliding over iridescent water, and pull enemies into her wake with her ultimate, an effervescent whirlpool.\n\n“The idea is that she can lash out with the whip, dash into enemy targets, do her whirlpool ultimate, pull everybody in, hit them with the Q, and then just be sweeping auto attacks on all of them at the same time,” Squad5 laughs. “Her sustained area of effect damage is extremely good and should hopefully mean that she’s a top tier team fighter.”\n\nBasically, get Nilah in a teamfight in late game and all bets are off. She’ll be demoralizing the enemy team in no time—with a smile and a laugh.", "excerpt": "The most recent additions to the League roster have been, how do you say… big meanies.\n\nEarlier this year, we released  , the manipulative and powerful Chem-Baroness, and  , the monstrous manta mom", "readingMinutes": 15, "images": [{"src": "media/879ca4bf5174dcc4827e13f73c13bfde468d0ea133f8950e5c6b5c18fb6ccce7.webp", "alt": "Champion Insights: Nilah"}, {"src": "media/76c9313920c403b229e0f4818804c466da7c91698622fbb8bb868811a2d93043.jpg", "alt": "062222_01_Whip_Concepts.jpg"}, {"src": "media/e3635092c56c81276213728142ec986ac4acc7467680deb58024b885ca39ea00.jpg", "alt": "062222_02_Nilah_Concepts.jpg"}, {"src": "media/d35aecce0b0c2242e7bfd0a8279c6edfae0a31e2fd4df67cfb5fedfebb035e60.gif", "alt": "062222_03_Animation.gif"}, {"src": "media/7a87e481e45e348addc169cdcba2fd03fd58f13f63d0981529bd3a44ef43a9c3.gif", "alt": "062222_04_Ability.gif"}, {"src": "media/f8557227dea8b35ded0a7fefbc85213ae7685595f1a3cdddac26399ad6a55079.jpg", "alt": "062222_05_Full_Nilah.jpg"}, {"src": "media/5e8d3fac1ea0d30a69beb1bee6e0974ebcb0dd7eadc59d475d0ac9dab542630a.jpg", "alt": "062222_06_Portrait.jpg"}, {"src": "media/85f08420b3b7bfc507cf404e3bc4c2b0db3d0e62df2790ec771b81594e0d8cbb.png", "alt": "062222_07_Seven_Hands.png"}, {"src": "media/3519b000aa88601b76f80240baa4cb546a11114d0d3c07504de031b8f5e7e901.jpg", "alt": "062222_08_Nilah_Splash.jpg"}, {"src": "media/71f935b22afee8dd90a0a7be2b76fb515e6682b8cdd5551ffeac6d7d77c0b7e1.gif", "alt": "062222_09_Heal_Sharing.gif"}, {"src": "media/ae058c9d07b8d4056ba76f2c54d1b8ed480c1f0fa4cfd1c27200a3624dbb4325.jpg", "alt": "062222_10_Final_Concept.jpg"}, {"src": "media/5c041cfe397580ce7fb1f5ed1ddf14106995897f753f97b6291408d1e32c2970.gif", "alt": "062222_11_Whirlpool.gif"}], "cover": "media/879ca4bf5174dcc4827e13f73c13bfde468d0ea133f8950e5c6b5c18fb6ccce7.webp"}, {"id": "7c772e1b7864ebccd2ad4e84", "title": "/Dev: Behind the Scenes of VFX Updates", "summary": "Learn more about the VFX updates process and how you can help!", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/dev-behind-the-scenes-of-vfx-updates/", "publishedAt": "2022-04-25T18:00:00.000Z", "author": "Riot Sirhaian, Riot Riru", "markdown": "![/Dev: Behind the Scenes of VFX Updates](media/879166bdd09a967428039063c7f3e6ca5a19d80394285438bbb17709641a8ca3.webp)\n\nHello, Riot Sirhaian here! I’m a senior VFX artist on the Skins team who sometimes updates older League champions’ VFX.\n\nVFX updates started out as a personal project a few years ago with Veigar (never forget the old Veigar cage ❤). Now, a few years down the line, we’re a small team of passion-fueled VFX artists working to modernize League’s roster and [improve gameplay readability](https://www.leagueoflegends.com/en-us/news/dev/clarity-in-league/).\n\nWith more VFX updates coming, we thought it would be a great opportunity to talk about why we’re doing them, how we go about it, and how you can help us improve!\n\n[![042522_Veiger_VFX.jpg](media/78a1dc56b7c1c4909e0935ca27dcad3bcf7d2d9d46fbe2d1607b8dfe92d1278b.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3f03c51115201b90a9b89f1c012780c0e6f6bf15-777x359.jpg)\n\n*Veigar’s cage before and after the 2018 update*\n\n## VFX Updates Explained\n\nVFX updates—or visual effects updates—are small improvements geared toward sprucing up some of the oldest champions in League’s roster. They’re done to upgrade overall gameplay consistency, readability, and graphics quality, all while elevating champions’ thematics and resonance.\n\nUnlike VGUs, VFX updates only affect the visual effects of a given champion, not all of a champ’s visuals. Most of the time, VFX are the spells they cast, or the effects that play around them when they emote. Explosions, magic, sparkles, you name it! There are a few exceptions to this rule, though. Occasionally the audio team might make a few tweaks or add new sound effects, and we may make *small* adjustments to animations or quickcast indicators **if they’re really inaccurate** (like Annie’s pre-update W). But when it comes to gameplay, models, textures, and character animations, there are no changes. This tight scoping allows us to ship VFX updates a lot faster than VGUs or ASUs (Art and Sustainability Updates).\n\nBecause VFX updates are a lot faster than VGUs or ASUs, we have a lot more free reign on which champions to tackle next. A huge factor for us is passion, but we also focus on the champions that need the update most. To figure out who this is, we have some goals we use as guidelines:\n\n- **Primary:** Fix gameplay issues such as inaccurate or missing hitbox indicators, VFX features that broke over the years, or wrong visual communication (does something read as its appropriate spell)\n- **Secondary:** Improve gameplay readability (how easy it is to see abilities), reduce overall visual noise (reduce the “busy-ness” of textures that have a lot of very fine, unneeded details) and adjust spells' visual power levels (spells should not be too bright *or* too hard to see)\n- **Tertiary:** Enhance thematic resonance (make a Void champion feel more Voidy, for example)\n\nOur goals are ranked in order of importance, so gameplay readability will always prevail over thematic resonance, and the primary goal of VFX Updates will **always** be to prioritize the correction of inaccurate hitbox indicators.\n\n[![042522_Blitz_VFX.jpg](media/71ee7b9ca98a98d2d842d5a5cd46fe3aae45cdb7752b526f885220a385d27346.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6825620290cdea7ff5c3302da8f6a178b7dcd535-778x359.jpg)\n\n*Blitzcrank’s R, before and after his VFX Update*\n\nThere are a few other things we have to consider when working on and shipping VFX updates. For example, just like our engineers have made strides to remove spaghetti code from the game, we’ve been hard at work removing the... marinara (blood) that dressed it. This is something we could get away with in the olden times, but not anymore, no matter how much it pains us (who doesn’t love some good marinara on their spaghetti code?).\n\n[![042522_Amumu_VFX.jpg](media/2570bec6d3eccbb8eba7304b57768fcbf9cd34f215b56f6164e904053b2e1830.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cb18fc6c5e77c8fd9d8398f416acb6959b66388d-777x388.jpg)\n\n*Trying to match the style from The Curse of the Sad Mummy for Amumu’s new R VFX*\n\nWe also try to add more flair to skins that under-deliver relative to their skin tier. That said, we have to be mindful of the time commitment when we’re approaching skin catalogs. Here are some general guidelines we follow when updating skins:\n\n- All skins will receive appropriate changes to match the new base changes. For example, if an indicator is made bigger on base to better match the gameplay, all indicators should have the exact same size on all the skins.\n\n- Skins that already had modified or unique VFX before the VFX update will preserve that same level of distinction\n- **750 RP** (and lower) skins can only receive *one* small tweak if it makes sense\n- **975 RP** skins will receive a small recolor **if** it makes sense, and some added elements **if** it makes sense\n- **1350 RP** skins will receive entirely new VFX if they don’t already have them\n- **1820+ RP** skins will receive entirely new VFX if they don’t already have them, and **can** receive VFX for their emotes where/if it makes sense\n\nSkins that already have modern VFX matching their tier will likely not receive new VFX (there’s no need to update the brand new skin your favorite champion just received if they already have modernized VFX).\n\n## How We Approach VFX Updates\n\nAre you still with me? Good! Now I’m here to tell you how we actually *do the thing* in seven simple steps!\n\n1. **We choose a champion to update.** This can be a champion a particular artist really enjoys, one we feel really needs a touch-up, or just someone next on our list. Some champions need more work than we can solve (like VGU or ASU tier), and we pass on these during our evaluation. So, if your favorite champion has very old VFX, they may be even more challenging than they appear—but that doesn’t mean we won’t get to them eventually.\n2. Once the champion is selected, **the VFX artist starts** with the base skin. Throughout production there’s a constant feedback loop between the artist, the VFX Update team, and the entire LeagueVFX Community at Riot. This involves sound designers, game designers, and a whole lot more people. While it is most often a single artist working on a given VFX update, it’s always a team effort, especially when it comes to feedback.\n3. Once the base is solid and approved, **the VFX artist starts working on the skins**. All skins are made to match the updates made to the base. Older skins tend to receive more changes than newer ones, as more modern skins are usually pretty up-to-date.\n4. After this, everything's **sent to testing** to catch potential oversights and bugs.\n5. Once bugs have been fixed we **ship the VFX update to PBE**, often sharing a little video on Reddit or social media so we can look to players and the community for feedback.\n6. We try to **gather as much feedback as we can**, constantly watching Twitter, YouTube, and the League of Legends and LeaguePBE subreddits. We make sure to look at each champion's “main” subreddits as well.\n7. And finally we **ship the VFX update to live**. If anything comes up at a later date, we’ll apply it in an update in the following patch to make it right.\n\n## How You Can Help\n\nBecause VFX updates are faster than other in-game updates like VGUs or ASUs, we don’t publish development blogs along our journey. That said, we still love to get your feedback! We always try to read as much as we can, but sadly we cannot reply to everyone. But if your feedback is constructive, helpful, and provides an alternative that we hadn’t run into before, there’s a chance we’ll follow up to get more of your insight!\n\nIn general, the best place to offer feedback is through our [r/LeaguePBE Subreddit](https://www.reddit.com/r/LeaguePBE/) posts such as these: [Leona VFX Update Feedback Thread](https://www.reddit.com/r/LeaguePBE/comments/tsdq5o/leona_vfx_update/) or [Shaco VFX Update Feedback Thread](https://www.reddit.com/r/LeaguePBE/comments/tsdq0o/shaco_vfx_update/).\n\n[![042522_Thresh_VFX.jpg](media/9d7803b9106069836b49b2c422bcbccf695c453bd2859d592584cb8b9efdec68.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d6653a823554dd756a3f9d8dc39d59415b7e68ef-775x405.jpg)\n\n*Working on the Thresh Lantern for his 2020 VFX Update*\n\nAll this said, sometimes it can be hard to make feedback constructive, especially if we're talking about your main! Here are a few things we look for:\n\n**1. Is it actionable?**\n\nSpecific feedback that points to a specific change is by far the most useful. This might look like “This skin could use a new Q indicator like the others of the same tier” or “This hitbox looks incorrect, can you take a look at it?” Or even, “The projectile isn’t very visible and is hard to read.” These are all examples of great *actionable* feedback that we can take a look at and address.\n\nVague feedback is hard to act on because it's less clear what would address it, and all-encompassing feedback (like adjusting theming) is usually out of scope for VFX updates.\n\n**2. Is it objective?**\n\nLike all art, VFX can elicit opinions. While one person might love the original design, someone else could hate it. So saying “I hate the color green, can you change it?” unfortunately isn’t something we can solve. *But* we could potentially address “This color green doesn’t match the skin.”\n\n**3. Is it mostly unanimous?**\n\nThis is a pretty big one. While we always try to make as many of you happy as possible, the reality is that not everyone likes the same things. We’re more likely to act on overwhelming consensus than we are a single person’s dissent (even a main's!).\n\nSomething else to note here is that League is a *global game*, so while something is trending in your language or region, that might not be the global response. At the end of the day we try to listen to the majority of people everywhere, not just the loudest!\n\n[![042522_YasTeemo_FVX.jpg](media/6b3ea7f33308d8dcbbf01cd4dfe0e3d29ca8595fa40d3817a317c847dea7d28b.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dff57b1a18de3a5e4257e00b1ff49dccb3deb469-406x226.jpg)\n\nAs a special callout, I just want to add that insulting an individual artist is never the right approach. Constructively calling out issues with the work is alright (encouraged, even!) but personal insults make it less likely that members of the team will want to keep working on these extracurricular passion projects. They also risk sending a signal to Leagu
