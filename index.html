(echo object timer, additional audio cues, additional vibration, etc.)\n- And more!\n\nMore information about accessibility in *South of Midnight* can be [found in the accessibility support guide](https://support.xbox.com/en-CA/game/south-of-midnight/support/accessibility-settings-in-south-of-midnight). [***South of Midnight***](https://www.xbox.com/en-US/games/store/south-of-midnight/9NJCVGS6T30K/0017) is available on Xbox Series X|S, Xbox App for Windows PC, Steam and cloud, and Game Pass.\n\n***Diablo IV***\n\nThe gates of Hell are open to all. *Diablo IV* designers and engineers have worked alongside accessibility experts to perfect its advanced screen reader technology and develop new tools for navigation assistance. This includes the addition of the compass and audio enhancements to ensure as many players as possible can slay the forces of Hell and defend Sanctuary. The video above provides an in-depth look at how these features were concepted, built, tested, and refined, and also showcases how accessibility fits into the overall development workflow for *Diablo IV*.\n\n[***Diablo IV***](https://diablo4.blizzard.com/), featuring cross-play and cross-progression, is available on PC via Battle.net and Game Pass, Xbox Series X|S, Xbox One, PlayStation 5, and PlayStation 4, plus up to four player co-op, including two-player couch co-op on consoles.\n\n## **Bringing Accessibility to the Forefront via the Games Industry, Hardware and Events**\n\n**Xbox Helps Launch the Accessible Games Initiative**\n\nIn March, Xbox joined partners across the gaming industry to unveil the [Accessible Games Initiative](https://www.accessiblegames.com/). Helmed by the Entertainment Software Association (ESA), this initiative strives to provide players with clear information about the accessibility features in games through a set of “tags” shared across the industry that are surfaced on storefronts and game product description pages. These tags have specific criteria to help ensure that users who rely on them have consistently delightful experiences.\n\nWe have also begun transitioning our current Xbox Accessibility Feature tags to the Accessible Games Initiative tags. As part of this process, players may notice some discrepancies in the tag names that appear in various Xbox experiences during this time and these potential discrepancies will be resolved once transition engineering work is completed by July 2025. Any Xbox Game Accessibility Feature tags that do not have equivalent Accessible Games Initiative tags will remain on our platform. This combination of tags will make it even easier for players with disabilities to find their next great game and understand the accessibility features available to play.\n\n**Xbox Adaptive Joystick Now Available for Purchase**\n\n![Photo depicting all the ways the Xbox Adaptive Joystick can be used, via a person’s chin, toes, hands, and limbs.](media/2c180498e9ab711a711a5592438e6e20f60bb223d7cd50fe06e84e10f3893e91.jpg)\n\nAs part of the Microsoft Ability Summit in March, we announced that the [Xbox Adaptive Joystick](https://www.xbox.com/en-US/accessories/controllers/xbox-adaptive-joystick?msockid=089f906b07cf65993956845e067564ec) is now available for purchase exclusively through the [Microsoft Store.](https://www.xbox.com/accessories/controllers/xbox-adaptive-joystick) Built in collaboration with the Gaming and Disability community, the Xbox Adaptive Joystick is a singular, wired controller primarily designed to meet the needs of players with limited mobility. Its versatility helps players seamlessly incorporate it into their existing gaming setups.\n\nTo learn more about the Xbox Adaptive Joystick’s features and customization options, visit [Xbox Support](https://support.xbox.com/en-US/help/account-profile/accessibility/xbox-adaptive-joystick).\n\n**King Player Accessibility Days (PAD)**\n\n![A group of four people huddling in a room, on their phones and computers.](media/672bca8a8b2c10901a511f5097e44e0c755cdf369beb679e7d96bf6f6a4cfdb3.jpg)\n\nKing is proud to announce the return of Player Accessibility Days (PAD) in 2025, which will be bigger, bolder, and more inclusive than ever.\n\nThis initiative, which kicked off last year, started as a way to raise awareness across King of the challenges that players with accessibility needs face when playing our games. With educational talks from industry leaders and first-hand stories from the players themselves, PAD aims to ensure that inclusive game design is at the heart of everything we do.\n\nThis year, we’re collaborating with Xbox Research to empower teams across King to create more inclusive games, products, and player experiences. From enhanced audio features that cater to players with auditory disabilities to visual adjustments that improve gameplay for those with visual challenges, we’re putting accessibility into motion across several aspects of our games. By integrating these features and fostering a culture of inclusivity, we’re ensuring that every player, regardless of ability, can enjoy the magic of mobile gaming.\n\nBuilding on last year’s momentum, PAD 2025 marks a significant step forward in our commitment to accessibility, with the goal of transforming it from a checklist into a company-wide mindset.\n\n---\n\nJoin teams across Xbox as we continue to champion accessibility on Global Accessibility Awareness Day, and beyond.", "excerpt": "Global Accessibility Awareness Day, celebrated annually on the third Thursday of May, is dedicated to recognizing and raising awareness about the importance of accessibility. With billions of peopl", "readingMinutes": 15, "images": [{"src": "media/438a457945db5e685f1fe1d66648d0b268c5cf2dfde854f6085fb258717aafc1.jpg", "alt": "Xbox Celebrates Global Accessibility Awareness Day"}, {"src": "media/ab117850041aab9b1a08dc883315601a5d40fb42eac9803885ace28e17048b38.jpg", "alt": "Key art for DOOM: The Dark Ages"}, {"src": "media/7132d0d97c96ebf5323b9e2cb8507c0e7baccb0b0917ec705876ebb06d200bfc.jpg", "alt": "A green soda gummy green bear playing with the accessibility settings. Other bears are having fun around him."}, {"src": "media/e6d422a30b9dc48024226bb66c0c2cb626c7da749617300ab99dc02df6c1f72d.jpg", "alt": "Key art for South of Midnight"}, {"src": "media/2c180498e9ab711a711a5592438e6e20f60bb223d7cd50fe06e84e10f3893e91.jpg", "alt": "Photo depicting all the ways the Xbox Adaptive Joystick can be used, via a person’s chin, toes, hands, and limbs."}, {"src": "media/672bca8a8b2c10901a511f5097e44e0c755cdf369beb679e7d96bf6f6a4cfdb3.jpg", "alt": "A group of four people huddling in a room, on their phones and computers."}], "cover": "media/438a457945db5e685f1fe1d66648d0b268c5cf2dfde854f6085fb258717aafc1.jpg"}, {"id": "e0996a193314228a7e86d43e", "title": "Wildgate Community Preview Coming May 9!", "summary": "We are excited to bring Wildgate Community Preview to Xbox Insiders on Xbox Series X|S consoles! The playtest will begin on May 9 at 9:00 AM PDT (17:00", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "xboxwire", "sourceName": "Xbox Wire", "sourceUrl": "https://news.xbox.com/en-us/2025/05/05/wildgate-community-preview-coming-may-9/", "publishedAt": "2025-05-05T19:00:00+00:00", "author": "Tim", "markdown": "![Wildgate Community Preview Coming May 9!](media/f51dc6abbdfeedc547f708be4e5e8e377fc805c6cdffcbaf75032727f14ec96d.jpg)\n\nWe are excited to bring Wildgate Community Preview to Xbox Insiders on Xbox Series X|S consoles! The playtest will begin on May 9 at 9:00 AM PDT (17:00 BST) and Xbox Insiders are able to sign up to participate. Space is still available, so join now to secure your spot! Join other prospectors in epic spaceship battles and leave with the Artifact, bragging rights, or at least a few stories.\n\n## **Key Features:**\n\n**Epic Spaceship Battles:**  \nBlast rivals with hi-tech cannons and gadgets, lure them into deadly traps, or even mess with their ship… as long as they don’t sabotage yours first. When your perfect plan goes out the airlock, there’s only one option… wing it!\n\n**New Adventures, Every Match:**  \nStay one step ahead as you and your crew navigate the Reach — a vast, procedurally-generated map that changes with every game. Just be sure to beat other Prospectors to the punch, or risk flying away empty-handed.\n\n**Unique Prospectors:**  \nChoose from a variety of daring Prospectors, each with their own abilities and tools. Whether you’re a brave pilot or a clever trickster, there’s no wrong way to commit space crimes!\n\n**Explore the Reach:**  \nThe Reach is a dangerous, unpredictable place, filled with deadly hazards and treasure beyond your wildest dreams. Navigate through cosmic storms, battle space vermin, and plunder alien outposts for lost caches of loot.\n\n**Outgun or Outrun:**  \nThe Artifact is the most valuable object in the known universe. Be the first to find it, snatch it, and pass through the exit point, or destroy the ships of every other crew and be the last crew standing.\n\n## **Playtest Times:**\n\n**Start**: Friday, **May 9** 9:00 AM PDT (17:00 BST)  \n**End**: Monday **May 12** 5:00 PM PDT (**May 13** 01:00 BST)\n\n## **How to Participate:**\n\n1. Sign-in on your Xbox Series X|S console and **launch the Xbox Insider Hub** app (or install the Xbox Insider Hub from the Store first if necessary)\n2. Navigate to **Previews** > **Wildgate Community Preview**\n3. Select **Join**\n4. Wait for the registration to complete to secure your spot for the Community Preview!\n\n**NOTE**: Wildgate Community Preview begins on May 9 at 9 AM PDT. Joining now secures your spot for the playtest. Return to the Xbox Insider Hub on May 9 and select Show in Store to begin installing the game. You’ll also receive an Xbox Insider notification when the playtest begins.  \n**NOTE**: Limited space is available and offered first-come first-served.  \n**NOTE**: This playtest is only available on Xbox Series X|S consoles.", "excerpt": "We are excited to bring Wildgate Community Preview to Xbox Insiders on Xbox Series X|S consoles! The playtest will begin on May 9 at 9:00 AM PDT (17:00 BST) and Xbox Insiders are able to sign up to", "readingMinutes": 3, "images": [{"src": "media/f51dc6abbdfeedc547f708be4e5e8e377fc805c6cdffcbaf75032727f14ec96d.jpg", "alt": "Wildgate Community Preview Coming May 9!"}], "cover": "media/f51dc6abbdfeedc547f708be4e5e8e377fc805c6cdffcbaf75032727f14ec96d.jpg"}, {"id": "9c3dafdad80e86074d9170a9", "title": "Minecraft National Park", "summary": "To rally our next generation of planet protectors, Mojang Studios joined forces with over 50 creators and the Minecraft community to build the in-game Minecraft National Park map in 2024. This was the first time a map was created solely to benefit a charity, The Nature Conservancy, which is an environmental organization that works to conserve lands and waters.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "minecraft", "sourceName": "Minecraft", "sourceUrl": "https://www.minecraft.net/en-us/article/a-minecraft-national-park", "publishedAt": "2025-03-28T16:00:00.000+0000", "author": "Staff", "markdown": "![pic of person in jungle with animals, lion and mountains in the background](media/0caa0329988407c565ef4bea3980c8cb2e2e6e3395023820d272b6d87e0d2900.jpg)\n\nAwareness through play\n\nNature and sustainability have never been more important than it is now. A healthy eco-system, thriving wildlife, and fresh air are crucial as we humans are moving forward.\n\nTo rally our next generation of planet protectors, Mojang Studios joined forces with over 50 creators and the Minecraft community to build the in-game Minecraft National Park map in 2024. This was the first time a map of this size was created to benefit a charity, [The Nature Conservancy](https://www.nature.org/), which is an environmental organization that works to conserve lands and waters.\n\nThe aim of the map was to educate players about environmental sustainability and the importance of animal crossings. In October of 2024, the map sale was launched, and in December, a National Park map Fundraising Stream was held, with all proceeds from the stream and net proceeds from map sales, along with an additional $100,000 donation from Mojang Studios, totaled a whopping $287,000 being donated to The Nature Conservancy.\n\n> *MNP inspired us to build with passion. We loved brainstorming how we could design a beautiful national park that educated players on why it’s important to preserve nature.* - Mike Bozza, Mush Co\n\n> *I enjoyed being part of a massive community project. It was a fond reminder of what made the early days of Minecraft so great.*- The World Foundry\n\n> *I truly enjoyed contributing my ideas and watching them come to life. Working on MNP felt like crafting a story - a story built by many hands, each adding their unique creativity and vision.*  \n> - MrAniman2\n\n## A build challenge\n\nBack in May of 2024, a build challenge was organized where the Minecraft community could submit their take on what should be the park’s main monument inside the Central Visiting Center. Following the theme of nature’s beauty and diversity plus including at least one mob or plant from Minecraft, anyone could participate! The selected monument was created by GuilleAnimations with their adorable, and wholesome axolotl build.\n\n![pic of build or axolotl ](media/407aabfc9001e2464d605a5c8feab96ba0a99aa1824391854dc4dbacaf8a3168.jpg)\n\n## Just one of many steps to come\n\nThe Minecraft National Park map was a success, and through this partnership, Minecraft is helping to support The Nature Conservancy’s global conservation work, including projects like protecting wildlife on 48,000 acres in the Central Cascades by reconnecting parcels of land and installing innovative critter crossings to help animal migrations and prevent deadly vehicle and wildlife collisions.\n\nThe park is one of many steps in Mojang Studios’ commitment in championing sustainability. The work to Build a Better World continues, and we’re planning more efforts to protect nature and wildlife and educate about sustainable choices!\n\n---\n\n## Share this story\n\n## Newest News\n\nCatch up on the latest Minecraft news & game updates!", "excerpt": "Awareness through play\n\nNature and sustainability have never been more important than it is now. A healthy eco-system, thriving wildlife, and fresh air are crucial as we humans are moving forward.", "readingMinutes": 3, "images": [{"src": "media/0caa0329988407c565ef4bea3980c8cb2e2e6e3395023820d272b6d87e0d2900.jpg", "alt": "pic of person in jungle with animals, lion and mountains in the background"}, {"src": "media/407aabfc9001e2464d605a5c8feab96ba0a99aa1824391854dc4dbacaf8a3168.jpg", "alt": "pic of build or axolotl "}], "cover": "media/0caa0329988407c565ef4bea3980c8cb2e2e6e3395023820d272b6d87e0d2900.jpg"}, {"id": "d07ebf8c0990127e5707b69f", "title": "Champion Insights: Smolder", "summary": "ADC: Audacious Dragon Cutie.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-smolder/", "publishedAt": "2024-01-08T16:00:00.000Z", "author": "SMALL BABY PANDA", "markdown": "![Champion Insights: Smolder](media/4517dc8b102f778d34b54d21e8399cbe72e36218091e0aa0e192704c51007116.webp)\n\nBot lane is a place for very serious gaming. Miss a cannon? Straight to jail. Forget to swap to blue trinket? Straight to jail. Die? Jail.\n\nAnd many of the champions who occupy the ADC role take themselves just as seriously. Ashe, Aphelios, Jhin, Varus—super fun at parties. After taking stock of the marksman roster, the Champions team thought it was time to throw a little charm and cuteness into the mix. (While some of us believe in the adorableness of Kog’Maw, others are nonbelievers.)\n\nSo it’s time for us to introduce you to Smolder, the Fiery Fledgling. He sure is cute, but he’s still a powerful dragon—his mom told him so! Just tread carefully, or you might get burned.\n\n## Just A Silly Little Guy\n\nWhile making an aww-inspiring marksman was a big goal for the team, another aim was to add an AD carry that was straightforwardly fun to play.\n\n“We wanted to introduce a simple to play marksman because all of the ones that we've shipped recently are really mechanically complex, like Zeri, Samira, Aphelios, and Nilah… who’s like a melee marksman. We thought it was time to introduce a champ that's a bit easier to play, a bit more traditional for the role. You don't need to be [Ruler](https://www.tiktok.com/@lolesports/video/7308843104835226926) to play it, kind of thing,” recalls producer Rob “Riot KingCobra” Rosa.\n\nThe cute creature thematic seemed like it could fit really well within these gameplay goals. But what *kind* of cute creature? After exploring a few other creature possibilities, the team decided on a dragon since it has the range to be a natural marksman.\n\nBut in the realm of dragons, there are infinite variations of cute. Concept artist Oussama “Riot Whiteleyth” Agazzoum did some intensely adorable concept art explorations to figure out exactly the kind of cute that Smolder should be.\n\n[![01CuteConcepts.jpg](media/d4e2dea123323bdd9f036219a1506ce1f61fd49adfcaf4e25903b8ce9f6b7b9a.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/bb579501ffad9756550ab49a18f5333ceba989eb-2000x1006.jpg?disposition=inline)\n\n“I explored different feels and personalities that could fit within the bounds of cute, from the typical wide-eyed innocent little guy, to something on the pretty side, to something more cocky or grumpy, but also cuddly. That last one resonated with a lot of the team members, but we didn’t want Smolder to feel bratty or unlikeable. We looked for the right balance and focused on him being proud rather than cocky,” explains Riot Whiteleyth.\n\n“Another exploration that caught people's attention felt very princely and elevated with an interesting headpiece, which translated into the final design as Smolder’s fiery horns.”\n\n[![02SmugConcept.jpg](media/4fdf4e23bba1bfe89607fa8365193c38bee542c3e94b85e2b8e958d21a8a10da.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6b4de472602c2cc8be3523c62167cdc53dd9a21b-2000x1006.jpg?disposition=inline)\n\nSmolder is a little overconfident, but not in an obnoxious way. He’s also very playful, a trait the champions team leaned into to make sure Smolder’s personality felt different enough from other young champs like Nunu and Milio.\n\nWhile Smolder is League’s only *young* dragon, he’s in good company with other dragon champs, namely Shyvana and Aurelion Sol—or as Smolder calls him, Mr. Airy Lion Soul. However, he’s not linked to them directly. He’s also not related to the elemental drakes (because that would be pretty weird for a juvenile dragon to be regularly taking down adult versions of itself).\n\nFor Smolder’s background, the team looked to a more mysterious part of Runeterra: Camavor. Lucky for the champions team, Legends of Runeterra already had some inspiration at the ready.\n\n[![03Camavoran_Dragon.jpg](media/e578b574f1a61a7c84b20a9a5aebecaa508eb4d9f461739792490cd50fab7569.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/496ba461edef37d39ba8587cd9e86643698ca1d0-2048x1024.jpg?disposition=inline)\n\nCamavoran Dragon Legends of Runeterra card art. LoR mentioned.\n\n“The Camavoran Dragon that some players are familiar with from Legends of Runeterra has been twisted by the Black Mist. So we were trying to imagine a version from before the Ruination,” explains Riot Whiteleyth.\n\nThe imperial dragons of Camavor are immensely powerful creatures who had strong ties with the [royal family](https://www.leagueoflegends.com/en-us/news/dev/champion-insights-viego/) before the Ruination. Once thought to be lost forever, we now know that their lineage lives on in Smolder—and he’s pretty stoked about it (though he doesn’t quite understand the gravity of what it means).\n\n> “Here he is, the most splendifirous prize of Camaroar! Meeeeee!”\n\nBut before he learned about his imperial dragon heritage, Smolder was separated from his mother after being stolen by Noxian beastmasters. Their ship was destroyed before they could collect their reward, but the dragon hatchling was lost to the sea.\n\nAfter the waves carried him to an island, Smolder found himself in the care of an unlikely friend who taught him some less-than-draconic mannerisms.\n\n[![04Expressions.jpg](media/1316b9ca1dc484f41f24999094ef2e11ff8462a06c8b32138e395521bd61e4a1.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c6a4a05dc7f0fb47349ad0582036ef9b06a34400-2000x1000.jpg?disposition=inline)\n\n“A lot of Smolder’s personality comes out of the fact that after his mom lost him, he ended up finding a little boy named Marinos who became his friend. Marinos taught him how to talk and play in a sort of Smolder-was-his-secret-outside-pet kind of way,” explains senior narrative writer Kristina “Riot Goblin” Atanasoski.\n\nAs a result, Smolder walks, talks, and jokes around like a human—and he drapes his wings on his back like a royal cape. This is also where the name Smolder comes from, because what imperial dragon names their heir Smolder? Ignacarious Gigantareno Rex Le Spes Offerentis, on the other hand? That’ll do.\n\nAs the years passed, Marinos became an adult while Smolder aged more slowly into a young dragon. With a family of his own, Marinos had less time to play with Smolder, who spent time on his own discovering little pieces of his dragon power. After a sneeze gone awry, an entire forest went up in flames, drawing the attention of Smolder’s mom who had been searching for a sign of him for decades. But more on her later…\n\n[![05Dragon_Prince.jpg](media/9762310523d9ef9ecc0bd040e60bd2ebbfe0b62fb1b3944c0c4e47126e16fa14.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e8a85eed63cabc368fc8fd657b58143606a1fe57-1500x600.jpg?disposition=inline)\n\nDespite Smolder’s Camavoran origins, he still has some things in common with Shyvana and Aurelion Sol—they are all dragons after all.\n\n“It would be kind of a crime to make a dragon that doesn't one, breathe fire, and two, fly,” says game designer Glenn “Riot TwinEnso” Anderson. “We did that originally with ASol… it didn’t work out. We did that with Shyvana… she's the most commonly requested VGU. Dragons fly and they breathe fire and that should happen in any dragon that we make.”\n\nBut there is one aspect that really differentiates Smolder’s gameplay from his fellow dragons. Whereas Shyvana and Aurelion Sol are fearsome dragons from the time the announcer welcomes you to Summoner’s Rift, Smolder takes a little time to warm up.\n\n## How to Dragon\n\n“Smolder starts the game as like a little baby tadpole of a dragon,” says game designer Jacob “Riot Llama” Crouch. “He's kind of got little squirtgun fire. He’s learning how to dragon. Like, as long as I keep shooting fire and keep learning and figuring out how to fly I'm gonna get better and better.”\n\n[![06Evolution.jpg](media/c74ea5084b83df286a3b7dde2345e9f9615af8d095d45867c5873ed8b2e5ed8c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6912b3790e255fa414107d3ca83659f338e904b5-2000x802.jpg?disposition=inline)\n\nThe full extent of Smolder’s imperial dragon power lies in performing consistently throughout the game. Smolder’s passive grants him stacks of “Dragon Practice” when he hits champions with Abilities and kills enemies with his Q, Super Scorcher Breath. You’ll start the game weak, so if you’re not last hitting and making the right moves at the right times, it’ll be tough to reach your full potential.\n\n“Everything Asol does looks very effortless. He's like, ‘I'm just gonna rip this moon out of the sky and drop it on you,’” laughs Riot TwinEnso. “And Smolder's like, ‘I'm gonna fly two feet and that's gonna take my entire body and mind to accomplish.’”\n\nSmolder’s journey of growth and learning is told through not only his design, but every discipline. Sure, his building strength shows up in his gameplay with his spells getting stronger and more confident over time, but his trajectory of growth also shows up in his sound effects and visuals, as well as his voiceover throughout the game.\n\n[![07Fire.jpg](media/3d5326fc11640cd5ea6047779de5a5dc9eff1837652345c6c961f1faadd1720c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/98cb214d98e128b67dc674b20861e4342b6ba8e5-2000x1240.jpg?disposition=inline)\n\nFor instance, when Smolder gains more stacks, his Q evolves to deal area of effect damage, and splits off to throw more fireballs.\n\n“These upgrades not only happen to gameplay, but also audio as well,” explains sound designer Daniel “Riot KDan” Kim. “They sound bigger and more powerful as you unlock new thresholds. As you’re playing Smolder, you’ll feel like you’re becoming stronger.”\n\nMaking sure these pieces are working together in a cohesive way is vital to making a champion’s story, personality, and thematic come to life.\n\n## I’m Calling My Mom!!!\n\nOne of Smolder’s most iconic abilities is undeniably his ultimate—appropriately named “MMOOOMMMM!”—where he calls in his mom to help him rain dragon fire down on his enemies. After being separated from her baby for too long, she takes helicopter parenting literally.\n\n[![08Ultimate.gif](media/14fa12036de3f2edaae987f749c86225606daee287731c6bfc1b0b4f51bd9d40.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/903dee8dc1a9c590123e47239359906f4a1f6630-500x283.gif?disposition=inline)\n\nWhile Smolder’s mom doesn’t actually set foot on the Rift, you’ll see her shadow soaring across it. You’ll also hear her fearsome roars, carefully designed by Riot KDan to include animal cries including tigers, hawks, buffalos, crocodiles, dogs, snakes, and sometimes even mongooses.\n\nAnd she’s not the only dragon with real life creatures woven into her sound design. Smolder’s auto attacks and E incorporate Riot KingCobra’s dog Hagen, and his W sneeze and Emotes feature Riot KDan’s wife’s family dog Simba.\n\n*Simba at work.*\n\n*Recordings of Simba were used as sound elements in Smolder’s emotes.*\n\nBut bringing Smolder’s mom into the game prompted an important question: does it feel like Smolder is being overshadowed (pun intended) by his mom?\n\n“One of the biggest challenges we faced with the ultimate was making it feel like you're the one doing it and you have the power,” says Riot KingCobra. “We spent a lot of time on animation and sound and timing to make it feel impactful, and more importantly make you feel tied to the power it carries. People put in a lot of work to make that moment feel as awesome as it feels now.”\n\n“We knew we needed to make sure that he wasn't undermined and that he felt like he had a place there,” adds Riot Goblin. “It shouldn't just be his mom. So trying to make sure that he seemed confident enough with himself while still being childish and also not obnoxious and arrogant. It was a fun balancing act.”\n\nAfter a few iterations, the balance needed to shift in the opposite direction—the ability had started to feel like it was *only* Smolder’s power and playtesters questioned why his mom even needed to be there.\n\n“I would get gameplay feedback that mom was lost in the moment,” Riot Llama remembers from playtests later on in the development process. “People would be like, Smolder's doing this crazy fire breath, but where's his mom? He's the one doing it. So I got to add in a game mechanic late in the process where Smolder's mom actually heals him as she breathes fire on him. There are even little heart VFX to show that she's helping him out in this moment.”\n\nAfter decades of searching, Smolder’s mom isn’t letting him out of her sight. She’s teaching him how to harness his power, while sharing stories and artifacts of the imperial dragons that came before them. This is really just the beginning for Smolder.\n\n“Will he be a menace that ends the world? Who's to say,” laughs Riot Goblin. “Is he gonna be an ally to all? The world is his oyster and he’s gonna burn it.”\n\n[![11laugh.gif](media/a277759325b7ff7f0e41b1354b32f129f00eb57e757ffb8ff74a5bc3533b419b.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/af3c125d9f042d7b4b77c462219387d4c173a13d-600x451.gif?disposition=inline)", "excerpt": "Bot lane is a place for very serious gaming. Miss a cannon? Straight to jail. Forget to swap to blue trinket? Straight to jail. Die? Jail.\n\nAnd many of the champions who occupy the ADC role take th", "readingMinutes": 14, "images": [{"src": "media/4517dc8b102f778d34b54d21e8399cbe72e36218091e0aa0e192704c51007116.webp", "alt": "Champion Insights: Smolder"}, {"src": "media/d4e2dea123323bdd9f036219a1506ce1f61fd49adfcaf4e25903b8ce9f6b7b9a.jpg", "alt": "01CuteConcepts.jpg"}, {"src": "media/4fdf4e23bba1bfe89607fa8365193c38bee542c3e94b85e2b8e958d21a8a10da.jpg", "alt": "02SmugConcept.jpg"}, {"src": "media/e578b574f1a61a7c84b20a9a5aebecaa508eb4d9f461739792490cd50fab7569.jpg", "alt": "03Camavoran_Dragon.jpg"}, {"src": "media/1316b9ca1dc484f41f24999094ef2e11ff8462a06c8b32138e395521bd61e4a1.jpg", "alt": "04Expressions.jpg"}, {"src": "media/9762310523d9ef9ecc0bd040e60bd2ebbfe0b62fb1b3944c0c4e47126e16fa14.jpg", "alt": "05Dragon_Prince.jpg"}, {"src": "media/c74ea5084b83df286a3b7dde2345e9f9615af8d095d45867c5873ed8b2e5ed8c.jpg", "alt": "06Evolution.jpg"}, {"src": "media/3d5326fc11640cd5ea6047779de5a5dc9eff1837652345c6c961f1faadd1720c.jpg", "alt": "07Fire.jpg"}, {"src": "media/14fa12036de3f2edaae987f749c86225606daee287731c6bfc1b0b4f51bd9d40.gif", "alt": "08Ultimate.gif"}, {"src": "media/a277759325b7ff7f0e41b1354b32f129f00eb57e757ffb8ff74a5bc3533b419b.gif", "alt": "11laugh.gif"}], "cover": "media/4517dc8b102f778d34b54d21e8399cbe72e36218091e0aa0e192704c51007116.webp"}, {"id": "58044e871070289c653c9163", "title": "Champion Insights: Hwei", "summary": "Every match can be a masterpiece.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-hwei/", "publishedAt": "2023-11-19T16:00:00.000Z", "author": "SMALL BABY PANDA", "markdown": "![Champion Insights: Hwei](media/58c4b99fccd26a4e13b0bc8f586a006f26f33b14eb24ea1c3245441f73b6d736.webp)\n\nFor many artists and creatives, the need to create surpasses the need for much else. Putting whatever is in your mind on paper or canvas feels essential, like breathing.\n\nThis is exceedingly true for Hwei, League’s newest champion, a mid-lane mage who paints the artistic visions that fill his head. But instead of painting on canvas, Hwei’s works are dynamic, living images that affect anyone who witnesses them.\n\nWith his paintbrush, Hwei wields destruction or support, controlling the thoughts and emotions of those around him. He may not have a sword or gun, but don’t underestimate the might of this brooding artist and his brush.\n\n## More Than Meets The Eye\n\nThe beginning of Hwei is a tale of three pitches: a paint mage, a brooding antihero, and a humanoid male mid laner without purple skin or an exoskeleton. The art mage idea had been brewing for a while, and a number of Rioters contributed to shaping the concept.\n\n[![11192023_HWEI23ChampionInsightsArticle_01AnimationStudy.jpg](media/f58cb153ffb8c30ba699b6dde92c15de71f6a3d6707c7bdcb9b169c705eae837.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7b054413bca3399b3f298889c1ada9fb32aab108-2000x1599.jpg)\n\n“As soon as the possibility of an artistic mage was on the table, everyone gravitated to it,” says narrative writer Isa Mari “orkidian” De Leon. “This is an idea that's been of interest for a long time, but never yet executed, so I feel really lucky for this to be the first new champion I've contributed to.”\n\nThe Champions Team also wanted to end the year on a complex note, introducing a champ with a high skill ceiling.\n\nBut nailing down a difficult-to-master kit that fit within Hwei’s art thematic wasn’t easy. Three game designers had a hand in the process, each building on the last iteration. But something about it wasn’t quite working. So before the champ concept was put on the shelf in favor of other ideas, the team decided to try an about-face on his gameplay (more on all of this later). As a result, his narrative and art evolved as well.\n\nHwei’s visions and magic became more recognizable images and were infused with bright color, clearly communicating his new abilities. Armed with an Ionian paintbrush and a colorful palette, his power is fueled by his own artistic expression.\n\n[![11192023_HWEI23ChampionInsightsArticle_02_ConceptExploration.jpg](media/854720eb342c03e3ce42e28a96bfd4ade8279229874ae059e4f713b285c74ed4.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/930b187ca11832a39c9d55b2a8c8eb38f821a4b1-3000x1141.jpg)\n\n\nEarly Hwei concepts from artist Nancy “Sojyoo” Kim\n\n“I've been secretly waiting in the shadows for when we could do an art mage,” laughs art director Gem “Lonewingy” Lim. “We wanted to do a spell mixer mage, but being an elementalist or a druid had already been done several times, and the art thematic was a unique take for this kind of archetype for gameplay.”\n\nHwei’s inherent power bursts forth when he’s painting, manifesting in colorful washes of pigment and imagery. His source of power isn’t his brush, it’s the artistic ability within.\n\n“Hwei’s not a warrior or a swordsman, so we didn't want to treat the brush as if that's what's elevating him. The power is all internal, and for a mage specifically, I think that that kind of internal inherent power makes more sense,” says orkidian.\n\n[![11192023_HWEI23ChampionInsightsArticle_03FinalConcept.jpg](media/1750363b352b97274c37f64dc6dea1f573fe0464ef2f68b44c628543506b2388.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/adea9d122b47a2b9d792dc8a1dae248eb4fb2b87-2200x2481.jpg)\n\n\nFinal Hwei concept art by Gem “Lonewingy” Lim\n\nHwei's outward appearance hints at the creative power churning inside of him. This sad fellow is mostly muted in color, save for his powerful palette… and his eyes which change color based on his mood—a feature he’s unable to control.\n\n“He chronically and magically needs to share how he's feeling and what he's envisioning. It's a thematic link to his source of power, which is the power of expression, and holding nothing back from what’s inside you,” says orkidian.\n\n“There’s more than meets the eye for someone like him,” adds Lonewingy. “You don’t know that there are beautiful things happening in his mind and how he sees reality. That's impressionism. And how he combines fiction and reality, like realistic experience and also imagination—that's surrealism.”\n\n[![11192023_HWEI23ChampionInsightsArticle_04HweiAnimation.gif](media/974cae230e05d2173407904bf98016c762ffd837775d19bdd12ac25d4ab14705.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5a0279c1ae1e445f59b09b4dcec79ba30e33fa21-650x405.gif)\n\nHwei is a genius at his craft. But with his brilliance and mastery comes a heaping dose of humility—an artist's belief that they can always do better.\n\n“He's genuinely one of the best artists of his time, but he would never admit that,” orkidian laughs.\n\nBut that level of commitment comes with sacrifice. Lonewingy conveyed Hwei’s dedication to painting through his somewhat disheveled appearance. The time and effort Hwei puts into his art leaves him little time to pay attention to how he looks to the outside world. Though he'd prefer you focus on the art over the artist, he still manages to have that \"just rolled out of the painting studio\" sophistication.\n\n“He doesn't think about how he needs to properly present himself to be accepted. He’s just like, I don't care. I'm just into the things that I like to do,” laughs Lonewingy. “We have characters where it’s like, it’s obvious she likes to dress up or he likes to put his hair this way. But Hwei is ready to give everything for his passion, which is painting and artistry.”\n\n## All In The Imagination\n\nHwei’s early life was spent in a temple on the tiny Ionian island of Koyehn, mastering the art of painting. The famed artistic temple in a small mill town is a place for pupils to learn the precision and balance necessary to wield the power of artistic magic.\n\nBut when Hwei attempts to combine his intense imagination with his talent for painting, the temple masters tell him he must rein in his abilities in favor of more traditional practices.\n\n[![11192023_HWEI23ChampionInsightsArticle_05_temple.jpg](media/b873870cd3b0e04d4fb74cfab4ff923d63573f16b79651f6a64b2c77fe1022af.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/245816db057891787deadc6fbad6073c341b6d4d-1131x1600.jpg)\n\n\nConcept art of Hwei’s temple on Koyehn\n\n“He ends up hurting people with the force of his expression in his youth, but is darkly intrigued by that force and feels the artistic drive to explore it,” explains orkidian. “So he lives out his life in this duality between painting what is expected of him and what he's learned versus painting alone in his extremely expressive and emotional style.”\n\nHwei’s imagination is ceaseless, so he must practice his true art in secret, fascinated and fearful of his own power. Still, he thrives at the temple, a well-respected member of the community, while hiding the full extent of his power.\n\nLater on in life, another remarkable artist arrives at the temple to hone his craft. He gets close to Hwei over the course of his time on Koyehn—but his visit concludes in a crescendo of destruction and death, forever altering Hwei’s path.\n\n> “Jhin, you opened my eyes to so much. I won't spare you from any of it.”\n\n*- Hwei’s VO line when he first encounters Jhin in game*\n\n“Hwei did not know Jhin's true nature until it was too late,” explains orkidian. “And that complexity carries through when the atrocity happens. This person betrayed me and is not at all what I thought, but at the same time, witnessed and understood my art on a level that I hadn't allowed anyone to before, and showed me something that empowered it.”\n\nFollowing Jhin’s attack on the temple, Hwei is devastated. He wants answers, setting out into greater Ionia to seek out closure to ease his mind. As he tries to make sense of his experiences, he is confrontational and intense, but kind and empathetic. Solemn and broody, but not defeated.\n\n[![11192023_HWEI23ChampionInsightsArticle_06_HweiWalk.gif](media/0b4f2f57e6099357b17b11ad89ab8a1f9f5717b8a3a15aca2a1d2986f9965306.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7ed0a563d5588efaf6b11f3186587acc2fe51d1e-720x442.gif)\n\n\"Hwei has experienced major loss, but emerged out of it still as an artist, not as an avenger or a cynic. Through his art, he navigates his deep sorrow and inner turmoil,” says orkidian.\n\nComplexity is simply the nature of Hwei, from his kit to his personality to his backstory. He has a darkness within that recognizes Jhin’s forceful, limitless expression. But Hwei’s empathy and kindness allow him to hold onto his inner light.\n\n“This is not a character you can overread,” says orkidian. “The depth of play is purposeful as is the depth of narrative. It was fun for me to write and dig into all the layers that he presents. And I hope that it's equally as fun for players to dig into what makes him tick and try to put together the nuances.”\n\nHe’s also not a character you can over-play. So while you’re piecing together your intricate lore theories, you can make some 300 IQ plays to match.\n\n## Kit’s Complicated\n\nHwei’s kit is all about giving you the tools to answer any problem you may encounter on the Rift. He wields a total of 10 abilities—three spellbooks containing three abilities each, along with an ultimate—to assist his allies, empower himself, and take down his enemies.\n\nHwei was always going to be a mage targeted towards high-skill players, but it took a few tries to nail down exactly what his gameplay hook should be. Like we mentioned earlier, multiple game designers had a hand in Hwei’s kit over time, trying out things like custom Summoner Spells and terrain manipulation. But when game designer Myles “Riot Emizery” Salholm threw out the idea of spell mixing, designer Daniel \"Riot Maxw3ll\" Emmons ran with it before heading off to lead what became Arena.\n\n[![11192023_HWEI23ChampionInsightsArticle_07SpellConcepts.png](media/3497e24079cfb85c0773a364403100fb7f6ea378497a19a28a629503bd3e966f.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3e9ce62952688b562c093ad25d4cc72729e9acf3-1182x491.png)\n\n\nArt explorations for what different abilities could look like\n\n“Jonathan ‘EndlessPillows’ Fuller picked up the kit from Maxw3ll to create rules-based spell mixing—almost like an algorithm—where it was like, all the Q2’s are going to be a missile and all of the E2’s are going to be a fox-fire ability. There was a lot of value with that, so a lot of things are carried over,” says Riot Emizery.\n\nBut something wasn’t quite working. Hwei’s kit needed to shift dramatically, eventually landing on the 10 unique abilities he has now. These design changes also broke open Hwei’s narrative and art, which shifted in concert with his gameplay.\n\nRiot Emizery focused Hwei’s abilities around three core subjects—disasters, serenities, and torments. By choosing a subject, you’re choosing what to paint, which spellbook to open, and what kind of magic to create. Within each of these three subjects, there are three abilities: disaster contains damaging abilities, serenity focuses on utility, and torment on control.\n\n[![11192023_HWEI23ChampionInsightsArticle_08AbilityShapes.png](media/1b0e7f8704fece845c0c46d78dd087f387dd2fa1c4b5b038f0ef50184f7b9967.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5d7a3a783772e15c9e134665bf42421640ffd686-438x195.png)\n\n\nConcept art for the symbols representing disaster, serenity, and torment\n\n“A kit with so many abilities for different scenarios is definitely difficult to get the hang of, but don’t be intimidated out of trying Hwei. Most people who try Hwei have been pleasantly surprised by their first game,” says Riot Emizery. “I tried to set up what I call his spam buttons to be good buttons,” he says.\n\nBasically, pressing Q, W, or E twice should have pretty good results for all you button mashers out there. But you won’t be able to get away with button mashing for long (or maybe you could, but you definitely won’t be climbing.)\n\n“Ultimately, the long-term balance goal with Hwei is not to cater to low-skill players. He is for the elite player that is trying to get the most out of this character. Chances are if you're succeeding on him you're climbing with him.”\n\nTo master Hwei’s many abilities is to know which one to use at what time—it’s an art in and of itself.\n\n“You can mix your different abilities together without being tied down to specific combos every time,” says Riot Emizery. “This added a lot of feeling like you were mixing paint and making artistic choices. Rather than just, ‘I'm following what I've learned from the past 10 games that I played and these are the combos and I just do the same thing every time.’”\n\nBut with an extensive arsenal, there may be games where certain parts of Hwei’s kit just don’t feel useful. That’s intentional—don’t expect to use each individual ability an equal amount in every game. You’ll end up favoring certain abilities over others to play around enemy champions or synergize with your teammates.\n\n“Every single ability has a niche purpose because we wanted to make sure that there is a reason to cast it and not the other two abilities,” explains Riot Emizery. “Some games you may encounter an ability that you almost never cast, and you might feel like it’s a bad ability during that particular game. But there's going to be another game where it's the best ability on your kit and you're using it constantly off cooldown.”\n\nIt’s been a while since the Champions Team put [so many years](https://nexus.leagueoflegends.com/en-us/2019/11/champion-insights-aphelios/) of design experience into a champ. With his versatile palette of abilities, Hwei invokes a new level of skill expression in the mid lane, and League in general. The League team is always looking for new ways to help players illustrate their mastery and skill expression on the Rift—hopefully the Visionary of Ionia’s formidable artistry helps you do just that.", "excerpt": "For many artists and creatives, the need to create surpasses the need for much else. Putting whatever is in your mind on paper or canvas feels essential, like breathing.\n\nThis is exceedingly true f", "readingMinutes": 16, "images": [{"src": "media/58c4b99fccd26a4e13b0bc8f586a006f26f33b14eb24ea1c3245441f73b6d736.webp", "alt": "Champion Insights: Hwei"}, {"src": "media/f58cb153ffb8c30ba699b6dde92c15de71f6a3d6707c7bdcb9b169c705eae837.jpg", "alt": "11192023_HWEI23ChampionInsightsArticle_01AnimationStudy.jpg"}, {"src": "media/854720eb342c03e3ce42e28a96bfd4ade8279229874ae059e4f713b285c74ed4.jpg", "alt": "11192023_HWEI23ChampionInsightsArticle_02_ConceptExploration.jpg"}, {"src": "media/1750363b352b97274c37f64dc6dea1f573fe0464ef2f68b44c628543506b2388.jpg", "alt": "11192023_HWEI23ChampionInsightsArticle_03FinalConcept.jpg"}, {"src": "media/974cae230e05d2173407904bf98016c762ffd837775d19bdd12ac25d4ab14705.gif", "alt": "11192023_HWEI23ChampionInsightsArticle_04HweiAnimation.gif"}, {"src": "media/b873870cd3b0e04d4fb74cfab4ff923d63573f16b79651f6a64b2c77fe1022af.jpg", "alt": "11192023_HWEI23ChampionInsightsArticle_05_temple.jpg"}, {"src": "media/0b4f2f57e6099357b17b11ad89ab8a1f9f5717b8a3a15aca2a1d2986f9965306.gif", "alt": "11192023_HWEI23ChampionInsightsArticle_06_HweiWalk.gif"}, {"src": "media/3497e24079cfb85c0773a364403100fb7f6ea378497a19a28a629503bd3e966f.png", "alt": "11192023_HWEI23ChampionInsightsArticle_07SpellConcepts.png"}, {"src": "media/1b0e7f8704fece845c0c46d78dd087f387dd2fa1c4b5b038f0ef50184f7b9967.png", "alt": "11192023_HWEI23ChampionInsightsArticle_08AbilityShapes.png"}], "cover": "media/58c4b99fccd26a4e13b0bc8f586a006f26f33b14eb24ea1c3245441f73b6d736.webp"}, {"id": "0a21149c12b4575e0560b055", "title": "TL;DW: Champs, Lore & More Dev Update", "summary": "A short rundown of updates from Riot Brightmoon, Meddler, Poisonpixxi, and Riot Lexical.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/tl-dw-champs-lore-more-dev-update/", "publishedAt": "2023-10-12T17:30:00.000Z", "author": "Riot Brightmoon, Meddler, Poisonpixxi, Riot Lexical", "markdown": "![TL;DW: Champs, Lore & More Dev Update](media/88076b3608039057400f9a8650a85cf74d579eecb5ff22d985e24b570f745a5f.webp)\n\nHey everyone, Riot Brightmoon and Meddler here with another TL;DW of today’s Dev Update:\n\n[![10122023_TLDWChampsLoreAndMoreDevUpdateArticle_artisticmageteaser.jpg](media/59ca637a7d5eae16ff41d4a796f0827f5fcab154e1bdb30c12c33e6403fc1621.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6941a4a84301cbcf01e3341766347cb8dc93b9d3-1299x900.jpg)\n\n- The [next champion](https://leagueoflegends.com/en-us/news/dev/champion-roadmap-october-2023/) coming to League is our artistic midlaner, Hwei.\n- After Hwei, there will be a new creature champion who is smoldering with power.\n- Further out is a Vastayan solo laner.\n\n[![10122023_TLDWChampsLoreAndMoreDevUpdateArticle_Skarner_GuardianoftheSands_finalconcept_WEB.jpg](media/db7c9f7de49bf5e62e1791e52bf0529fbddad1175793b84c47de8baf2ab38b51.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/418d7290111f7c77bb255ac7499b143b85abdfd0-2052x900.jpg)\n\n- The Skarner team has an update on his gameplay in the [Champion Roadmap](https://leagueoflegends.com/en-us/news/dev/champion-roadmap-october-2023/).\n- Over time, we’ve introduced inconsistencies in League’s lore—like Hextech and Yorick’s involvement in Sentinels of Light.\n- From today, all new storytelling is part of one shared canon.\n- The process of bringing everything together will take time, but we’re not going back to retcon every champion or story we’ve told. Instead, we’ll weave together inconsistent threads as we touch parts of the League universe.\n\n[![10122023_TLDWChampsLoreAndMoreDevUpdateArticle_Aatrox_Concept_WEB.jpg](media/8867cd555e1f782cb2793d647b47e4370170fe96f2a1176b331f7ff80c75e17c.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a94cc9e425d494fd91d57f537ef9abc8a2a09670-1670x900.jpg)\n\n- Future cinematics, including the Season Start 2024 cinematic, will be integrated in our storytelling.\n- Skarner’s updated lore is also integrated into our storytelling, and we’ll be making updates over time to champions like him, Seraphine, and Camille.\n- Song of Nunu will be canon, and offer more insight into the Freljord as it officially launches on Nov. 1st.\n- We’ve deliberately moved away from short stories as a medium due to how niche they are—we want to focus more on storytelling through other mediums.\n- Language select is coming out in November and will allow you to choose from the 21 languages we support in the Riot Client.\n\n[![10122023_TLDWChampsLoreAndMoreDevUpdateArticle_03BlueEssence.jpeg](media/f8ddcabb2c166816ac0f00416be5f51e041e944ceb8a51c6eee3b6d24cd9b2d5.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/847e096308ac3e3cf7b8cb4ac6abb6688faad350-640x360.jpg)\n\n- The Blue Essence Emporium is returning in December with the full range of Emporium eligible chromas, mystery icons, mystery wards, mystery gifting, and 50% off rune pages.\n- [Quickplay](https://leagueoflegends.com/en-us/news/dev/quickplay-mode/) is going to PBE at the end of October and will be rolling out more broadly after.", "excerpt": "Hey everyone, Riot Brightmoon and Meddler here with another TL;DW of today’s Dev Update:\n\n ](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news live/6941a4a84301cbcf01e3341766347cb8dc93b9d3-129", "readingMinutes": 3, "images": [{"src": "media/88076b3608039057400f9a8650a85cf74d579eecb5ff22d985e24b570f745a5f.webp", "alt": "TL;DW: Champs, Lore & More Dev Update"}, {"src": "media/59ca637a7d5eae16ff41d4a796f0827f5fcab154e1bdb30c12c33e6403fc1621.jpg", "alt": "10122023_TLDWChampsLoreAndMoreDevUpdateArticle_artisticmageteaser.jpg"}, {"src": "media/db7c9f7de49bf5e62e1791e52bf0529fbddad1175793b84c47de8baf2ab38b51.jpg", "alt": "10122023_TLDWChampsLoreAndMoreDevUpdateArticle_Skarner_GuardianoftheSands_finalconcept_WEB.jpg"}, {"src": "media/8867cd555e1f782cb2793d647b47e4370170fe96f2a1176b331f7ff80c75e17c.jpg", "alt": "10122023_TLDWChampsLoreAndMoreDevUpdateArticle_Aatrox_Concept_WEB.jpg"}, {"src": "media/f8ddcabb2c166816ac0f00416be5f51e041e944ceb8a51c6eee3b6d24cd9b2d5.jpg", "alt": "10122023_TLDWChampsLoreAndMoreDevUpdateArticle_03BlueEssence.jpeg"}], "cover": "media/88076b3608039057400f9a8650a85cf74d579eecb5ff22d985e24b570f745a5f.webp"}, {"id": "9b507d2c71ea39cc94802d03", "title": "Bees, Minecraft, and the WWF", "summary": "We worked with WWF on the Buzzy Bees update to raise awareness and money for bees in the real world.", "category": "gaming", "categoryName": "Game Culture", "group": "society", "groupName": "Games & Society", "site": "minecraft", "sourceName": "Minecraft", "sourceUrl": "https://www.minecraft.net/en-us/article/bees--minecraft--and-wwf", "publishedAt": "2023-10-02T13:55:37.097+0000", "author": "Staff", "markdown": "![The Buzzy Bees update raised awareness and money for bees in the real world.](media/b0f7b17b5cf34845811d39f8c9ead0ee63f78884ed1e3d5d3444a03d60b60272.jpg)\n\nWe got busy teaching people about bees!\n\nOur Buzzy Bees update added loads of new stuff to do in-game, but it also provided an opportunity for us to work alongside the WWF to educate our community about bees and their importance in the real world, and to donate to a fantastic initiative.\n\nBees are an essential part of healthy ecosystems and essential to produce food around the world, but climate change, habitat loss, and fragmentation are leading to a decline in their populations.\n\n![The Minecraft bee](media/bf89908260f0493a4f0f8f6a19532386560cd06d69b1e0caaa3916003767e95e.jpg)\n\nWe partnered with the WWF and donated $100,000 to support their amazing conservation work to raise awareness about bees and why they are so important for our world. We also sold a special Bumblebee costume on our in-game marketplace and donated 62.5% of our net proceeds the WWF. This is a great example of how Minecraft can educate, inform, and raise funds for important initiatives in a way that resonates with our epic community.\n\nThe in-game costume was a great success, but we also went into real-life and a clothing collection that featured our fuzzy friends in their blocky Minecraft form, alongside a cool Minecraft-inspired edition of the WWF’s iconic logo. The net proceeds went straight to the charity.\n\n---\n\n## Share this story\n\n## Newest News\n\nCatch up on the latest Minecraft news & game updates!", "excerpt": "We got busy teaching people about bees!\n\nOur Buzzy Bees update added loads of new stuff to do in-game, but it also provided an opportunity for us to work alongside the WWF to educate our community", "readingMinutes": 2, "images": [{"src": "media/b0f7b17b5cf34845811d39f8c9ead0ee63f78884ed1e3d5d3444a03d60b60272.jpg", "alt": "The Buzzy Bees update raised awareness and money for bees in the real world."}, {"src": "media/bf89908260f0493a4f0f8f6a19532386560cd06d69b1e0caaa3916003767e95e.jpg", "alt": "The Minecraft bee"}], "cover": "media/b0f7b17b5cf34845811d39f8c9ead0ee63f78884ed1e3d5d3444a03d60b60272.jpg"}, {"id": "ad18e1098a86c6c6c6b19e69", "title": "Champion Insights: Briar", "summary": "Thirsty for blood, hungry for life.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-briar/", "publishedAt": "2023-08-30T15:00:00.000Z", "author": "Karnifexlol", "markdown": "![Champion Insights: Briar](media/457b52125d81e005a05893240cfff59d3a36ce28ffda2b3291ae32476717e5f3.webp)\n\nWelcome to Noxus. The home of ruthless warlords, expansionist dreams, and quite possibly your new best friend—at least, if she had it her way.\n\nBriar *isn’t* your typical Noxian. While she might have an everlasting thirst for blood, she also has an insatiable hunger for something else. Life experience.\n\n## A Sanguine Story\n\nMost of the Noxians we know (looking at you, Swain and Sion) want nothing more than to dominate their opponents. But killing things has always come easily to Briar. A little too easily. That’s because she was made for it.\n\nBriar was created from hemomancy (aka blood magic) by the Black Rose to be a living weapon. She needs to consume blood to fuel herself. And boy oh boy, does she like blood…\n\nThe Black Rose made her sentient so that she could understand and execute orders, but there was one flaw. In order to kill her targets, the Black Rose kept Briar in a frenzied state. She was in a perpetual bloodthirsty rage. In this state of mind, Briar’s intelligence and vocabulary basically dwindled down to, “AHHHH! MORE BLOOD!”\n\n[![08312023_ChampionInsightsBriarArticle_Frenzy_Orthographic.png](media/7f7c9d9a3392cbb96312c224b2cb779b4d7aae30b7cf72fb408d6b3f7607794d.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/52572f690d675152511a87966ee368479c54ef8e-956x650.png)\n\n\nAn orthographic rendering of Briar in her frenzied form. Yikes. Chill.\n\n“She really only went out on two missions,” reveals narrative lead Max “TwoWeevils” Folkman. “And both times she failed by the Black Rose’s standards because she was uncontrollable. She actually killed too many other people. So Briar knows that she was a failed experiment. That’s part of her burden now. She’s redefining herself.”\n\nBriar not only killed her targets, but anyone who stood in her path. For the calculated and discrete Black Rose, she proved to be more of a liability than an asset.\n\n[![08312023_ChampionInsightsBriarArticle_SEQ_Day1_01.0000.png](media/8c3bd34a866b1f519630409ce9c7f82c185798d2f6c3287fe40c5fd3330ae16f.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f5a9ab25831bf660a8d743d2b70debd4403a0c87-632x430.png)\n\n\nFinal art of the interior of the holding facility. Briar’s cell is at the end of the hall.\n\nAfter Briar failed her first mission, the Black Rose put her in a pillory until they knew her next target. And after failing *that* mission, she was captured by Swain’s forces and confined to a cell in a holding facility. Needless to say, the pillory stays on. The device was locked by a hemolith—a gemstone with magical properties that helps restrain Briar and refocus her mind. The pillory was meant to be a permanent fixture after she was confined to her cell. But after some time, Briar figured out how to loosen the hemolith and unlock the restraint. Lucky for those around her, Briar enjoys the presence of mind that the pillory brings.\n\n“Prior to being in the pillory, she was on autopilot with her sensations. Especially with her hunger,” explains narrative editor Elan “Qulani” Stimmel. “Her violence was essentially created to be a part of her existence, and after having that pillory put on her, she realized that this device was sort of a cursing and a blessing. Yes, a cursing [laughs]. You can quote me on that.”\n\n[![08312023_ChampionInsightsBriarArticle_pillory.png](media/4e1e3909a1a7ddeaad1b70781f10c284ac4818cdc13b5cf86d1dc4c5472db775.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/76f7e49cc398f6e039b69fc010ddd83afdf851b8-699x480.png)\n\n\nThe final 3D model for Briar’s pillory with the hemolith gemstone in the center that holds the halves together… for now.\n\nShe was no longer bound by her frenzy. Instead, she was bound by the pillory. She quickly learned to enjoy the mental clarity that restraint brought with it. With the combination of prison and pillory, Briar had time to reflect, but also to learn. She internalized her cell guards’ conversations, chatted with other captives in holding, and studied the strange insects that crawled into her cell. All of these outside influences revealed to her that there was so much more to be discovered.\n\n“She was finally able to mellow out and start processing what it means to think and have thoughts,” Qulani adds. “Her pillory brought to her a period of reflection and learning—about identity, and wanting an identity of her own.”\n\nBriar already knew the identity she *didn’t* want to have. She didn’t want to be a mindless killing machine any longer. And she definitely didn’t want to follow orders. Instead, Briar wanted to choose her own path and she was eager to make up for lost time. She couldn’t stay in the facility any longer.\n\nThis is when we first encounter Briar—well on her way to bigger and better (and bloodier?) things. But more importantly, ready to experience the world.\n\nIn her champion reveal, we meet an eager, bright-eyed Briar who becomes friends with the first person she sees—at least in her mind. Companionship and the occasional warm pint of blood are the motivations that keep Briar going, and they’re also what bring her back from her frenzy.\n\nNowadays, she’ll only break out of the device when she absolutely needs to—a blessing for her, but a “cursing” for her opponents.\n\nOverall, Briar was a balancing act to create. The team wanted to build Briar around a loss of control, but they still needed to preserve a sense of autonomy. They knew she should be a champion with flaws, but not a victim; naive, but not childish; a woman, but not sexualized; enthusiastic about life, but not annoying. Briar has all the confidence of a fresh college graduate with the same penchant for awkward humor. Plus, she can shred you to pieces. And she’s beginning to discover her power and place in Runeterra.\n\n[![08312023_ChampionInsightsBriarArticle_Vampire_AnimStudy3.png](media/ae2dd4ab825d691df3f7a0afc68f240dca21f9ec01ca334d2a988f2e8e048fa6.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1ba831490dacc4d401323787d249d4f4a106c3cf-1857x1000.png)\n\n\nBriar’s personality starts to come through in early movement studies.\n\nMuch of that power and personality was brought to life through her voice actor, Julie Nathanson.\n\n“We felt so much better when we found Julie as our actor,” TwoWeevils says. “She was so great for giving us different kinds of reads for every line. It was actually hard to choose sometimes which ones we should pick for the game. She helped us find the perfect balance with Briar’s newfound personality and her frenzied state.”\n\nThe VO team collaborates closely with the NA voice actor to help inform how they finalize the character, both in writing and performance. That performance also serves to influence how other regions finalize the character around the world. Finally being able to *hear* the clear delineation between the blood-crazed Briar and her restrained personality in Julie’s performance was a big sigh of relief. And it lined up perfectly with her gameplay.\n\n## Unholy Diver\n\nA willful loss of control was part of Briar’s kit from the very beginning. The design team actually had this mechanic in their arsenal after work on another recent champ with a nose for blood—Naafiri.\n\n“Glenn ‘Riot Twin Enso’ Anderson was working on Naafiri when he came up with Briar’s W, her frenzy,” lead game designer, August Browning reveals. “You’d lose control and go rip somebody apart. That felt good for a dog champ, but it didn’t feel like an assassin, which is what Naafiri was always meant to be. Assassins want to kill their targets as fast as possible. A frenzied state needs some time to feel correct.”\n\nSo if frenzy is bad for an assassin, how about putting it on a champion who was canonically bad at *being* an assassin? Gigabrain move.\n\nAugust and the team wanted Briar to be a diver and berserker. They took inspiration from the vampires of Eastern European folklore, not the sly, cunning Westernized vampires who chill in their castles sipping on blood wine. With Briar’s gameplay, they wanted to capture the essence of the monstrous, terrifying blood-hunters who ravage entire villages when they’re in need of sustenance.\n\nSo they got to work on developing a kit that brought this frenzied fantasy to life.\n\n[![08312023_ChampionInsightsBriarArticle_Vampire_AnimStudyf.png](media/314db8a5dbaca5371fc2a475ee3920044c5b4a7fce97e30255c19d52c78dccb9.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fa41bcd57a78dea5a82f07e0a3654b88be5eedcd-1236x700.png)\n\n\nEarly study for Briar’s movement and ability animations.\n\n“From the beginning, she had a bleed, she had her berserk/frenzy, and she had her targeted stun,” August explains. “So those have all been present for a long time. But her E, her ultimate, and parts of her passive came later.”\n\nWith Briar’s E, the team quickly realized she needed some kind of off-button for her W (Blood Frenzy) so that she had some more control over her fights. That way, every time a player popped her W she wasn’t obligated to commit to the full rampage and overextend.\n\nBriar also needs to feed, as she has no passive health regen. She only heals when she does damage (or consumes blood) to minions or champions. The lower Briar’s HP, the hangrier she gets. So watch out, because that also means her self-healing is increased.\n\nAnd for Briar’s ultimate, the team experimented with a couple wildly different ideas. There were multiple versions where she would mark a target and just go on a rampage and tunnel-vision on that target. But there was also another iteration that the team was very excited about.\n\n“At one point she had a revive, similar to old Aatrox,” August says smiling. “It was on her ultimate. When it was off cooldown, if you died, you would suck blood from everybody around you and you’d revive with a lot of health. But it also had an active use. The active was that she killed herself. She would do 1 million true damage to herself, but then obviously trigger the passive to resurrect and drain everybody near you.”\n\nAs you might imagine, a champ who moves like a bat out of hell, heals herself in a frenzied state, has targeted stuns, and does healthy damage, probably also doesn’t need to be fully revived once she’s finally killed. So thankfully, Briar’s suicide-self-revive-wombo-combo was quickly removed.\n\n[![08312023_ChampionInsightsBriarArticle_Briar_Ult_Gif.gif](media/c04448e9394fd04696e2f30c915ba4dd8d70270372219a26585bd2a11aea5ad9.gif)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7df19984ba5310b0b605b01f473015ccd30a84f8-640x360.gif)\n\n\nBriar popping out her pillory’s hemolith and kicking it at an opponent in an early animation study for her ult.\n\nAugust and the team eventually landed on the current form of the ult—a projectile skillshot that causes Briar to immediately rush to the first champion it hits. Initially, this projectile only had 1000 range. But the team thought that since it was a skillshot, could be dodged like a projectile, and was a guaranteed dive when it landed, there would be enough counterplay to give the projectile *nearly global* range. At one point it was truly global, but the team nerfed it so that if Briar shot it from base, she wouldn’t accidentally int into the enemy fountain.\n\n“Briar isn’t technically a hard champion to play,” August says. “But she does require some extreme awareness and good decision making. The best Briar players will be the ones who learn how to manage her frenzy state because she can easily get herself killed with her W and her ultimate if she isn’t careful.”\n\nLike Briar herself, players should be selective when choosing to take that pillory off and let the bloodthirst take over.\n\n## It’s Giving Sweet But Deadly\n\nAlong with her backstory and some solid gameplay mechanics, a lot of careful thought went into Briar’s visual representation in the game. Lead concept artist, Sunny “Kindlejack” Pandita, worked hard to insert the right balance of Briar’s personality and gameplay into her look.\n\n“We knew Briar was going to have some kind of dark side that would be let out when she chose to,” explains Kindlejack. “We needed to visually communicate this idea of game design's (the idea of holding back a powerful, monstrous nature) so we zeroed in on the concept of a physical restraint. And pretty early on, Gem \"Lonewingy\" Lim actually did the first sketch of her in a pillory. We believed in that idea. She looked comfortable in her restraint, which immediately creates curiosity.”\n\n[![08312023_ChampionInsightsBriarArticle_Gem_Image.png](media/55b3b3af39e3dcc61f929e2ede34fead587b5b7290628222d9ff78a9536f2b96.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8bc4938aeed7f52b2c677acadad7a2c1cddc5b37-1309x956.png)\n\n\nLonewingy’s first exploration of the pillory.\n\nKindlejack took the idea of the pillory and ran with it. He added some thoughtful, yet subtle, shape language to the device to reflect the brutalist design theme of Noxus.\n\n[![08312023_ChampionInsightsBriarArticle_silhou1.png](media/6ffc7ed1dec5be4a1f6d574271c567c71be2b27ba73ad4c38b548b20dc318d6f.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fd97f0bc0c4e1ab909aec9b1dfb8e2e31007c67f-850x704.png)\n\n\nEarly explorations for the shape of Briar’s pillory.\n\n“The general design of her restraint has these sort of nails and spikes pointing into the middle toward her head,” Kindlejack explains. “I really wanted to create a visual design that communicated the metaphor of keeping her mind under control. It was sort of inspired by those diamond-tipped head braces that you get when you have neck surgery or something. They’re literally drilled into your head, but for Briar it’s not quite as gruesome as all that.”\n\nWhile Briar might come from slightly gruesome origins, she is by no means a dark, sad champion. And this is immediately recognizable when you look at her.\n\n“Because she’s a very complex character,” Kindlejack adds, “the way that I wanted to visually communicate her personality is thus: Her face and expressions show a lot of her eagerness and excitement. But her feet and stance communicate her hesitance and trepidation on entering the human world. And then her hands—restrained at the wrists—show her inner hunger.”\n\n[![08312023_ChampionInsightsBriarArticle_ID_ingame_06.png](media/c675b1136702f2a1b6cc9e67478abf8a67089b6c79771139b0536242889d066e.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/aa80534788224908be8a442bb791da534733c61f-659x510.png)\n\n\nAn early look at Briar’s stance in the game.\n\nAt first glance, these details might not be something that you pick up on consciously. But on further study it becomes clear that the position of her claw-like hands, pigeon-toed feet, and eccentric face are all working together to communicate the main beats of her character.\n\nBut the visual metaphors didn’t stop there. Kindlejack played with Briar’s vampire inspiration in her eyes and even in her silhouette.\n\n“For her eyes, I was referencing real-world medical photos of cataracts because I wanted her eyes to give you the sense of the full moon,” Kindlejack reveals. “It’s a vampiric thing, sure, but also the romance of the full moon is generally a gothic thing. So she’s got these kind of milky white opaque eyes that look at you the way the moon looks at us as it follows us home.”\n\n“It’s kind of subtle, but with Briar’s shape, I wanted to give her thicker legs and bottom-half with a more petite upper body,” Kindlejack adds. “The idea here is that if she’s actually made from blood magic or living blood, she should be a little bit more bottom-heavy like an I.V. bag or the shape of a droplet of blood.”\n\n[![08312023_ChampionInsightsBriarArticle_Portrait_2.png](media/c881d36f30843dc6945ebafced133472132a1b1e7c22570433b3a4bebca17b8e.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f1d828f8969a81f85a3224bf696305710f8396ff-500x637.png)\n\n\nA rendered portrait of Briar’s full-moon eyes and blood-stained hair. Aww, she doesn’t look so scary.\n\nEven the ombre in her hair is a nod to the fact that Briar probably isn’t the most tidy eater. No, when she feeds, her hair dangles down into the pool of blood surrounding her meal.\n\nBut if we’re being honest, it gives her a fresh look (just in time for fall) and it absolutely slays—literally.\n\n“Briar is about unapologetically being yourself,” Kindlejack adds. “She’s not embarrassed or afraid of her nature, but she knows she can be more. She's a character for people who want to cut loose, go all in, and have a laugh while playing a game of League.”", "excerpt": "Welcome to Noxus. The home of ruthless warlords, expansionist dreams, and quite possibly your new best friend—at least, if she had it her way.\n\nBriar  isn’t  your typical Noxian. While she might ha", "readingMinutes": 18, "images": [{"src": "media/457b52125d81e005a05893240cfff59d3a36ce28ffda2b3291ae32476717e5f3.webp", "alt": "Champion Insights: Briar"}, {"src": "media/7f7c9d9a3392cbb96312c224b2cb779b4d7aae30b7cf72fb408d6b3f7607794d.png", "alt": "08312023_ChampionInsightsBriarArticle_Frenzy_Orthographic.png"}, {"src": "media/8c3bd34a866b1f519630409ce9c7f82c185798d2f6c3287fe40c5fd3330ae16f.png", "alt": "08312023_ChampionInsightsBriarArticle_SEQ_Day1_01.0000.png"}, {"src": "media/4e1e3909a1a7ddeaad1b70781f10c284ac4818cdc13b5cf86d1dc4c5472db775.png", "alt": "08312023_ChampionInsightsBriarArticle_pillory.png"}, {"src": "media/ae2dd4ab825d691df3f7a0afc68f240dca21f9ec01ca334d2a988f2e8e048fa6.png", "alt": "08312023_ChampionInsightsBriarArticle_Vampire_AnimStudy3.png"}, {"src": "media/314db8a5dbaca5371fc2a475ee3920044c5b4a7fce97e30255c19d52c78dccb9.png", "alt": "08312023_ChampionInsightsBriarArticle_Vampire_AnimStudyf.png"}, {"src": "media/c04448e9394fd04696e2f30c915ba4dd8d70270372219a26585bd2a11aea5ad9.gif", "alt": "08312023_ChampionInsightsBriarArticle_Briar_Ult_Gif.gif"}, {"src": "media/55b3b3af39e3dcc61f929e2ede34fead587b5b7290628222d9ff78a9536f2b96.png", "alt": "08312023_ChampionInsightsBriarArticle_Gem_Image.png"}, {"src": "media/6ffc7ed1dec5be4a1f6d574271c567c71be2b27ba73ad4c38b548b20dc318d6f.png", "alt": "08312023_ChampionInsightsBriarArticle_silhou1.png"}, {"src": "media/c675b1136702f2a1b6cc9e67478abf8a67089b6c79771139b0536242889d066e.png", "alt": "08312023_ChampionInsightsBriarArticle_ID_ingame_06.png"}, {"src": "media/c881d36f30843dc6945ebafced133472132a1b1e7c22570433b3a4bebca17b8e.png", "alt": "08312023_ChampionInsightsBriarArticle_Portrait_2.png"}], "cover": "media/457b52125d81e005a05893240cfff59d3a36ce28ffda2b3291ae32476717e5f3.webp"}, {"id": "3d335c107cd174cc1b057dd2", "title": "Champion Insights: Naafiri", "summary": "There is no alpha. There is only the pack.", "category": "gaming", "categoryName": "Game Culture", "group": "stories", "groupName": "Game Stories", "site": "riotgames", "sourceName": "League of Legends / Riot Games", "sourceUrl": "https://www.leagueoflegends.com/en-us/news/dev/champion-insights-naafiri/", "publishedAt": "2023-06-22T15:00:00.000Z", "author": "Karnifexlol", "markdown": "![Champion Insights: Naafiri](media/767922421aa0e904866a6ce9b46c2132065636a33465ca522abb30719185a09a.webp)\n\nWe’ve all been there. You just got out of a solo queue stomp when you decide to go outside for a walk to get some fresh air and reset your mental. It was a hot day and your house has gotten stuffy.\n\nAs the sun sets, the warm evening gives way to a cool night and the street lights begin buzzing away. Nobody is out—odd for such a nice night.\n\nYou make it a couple blocks when you notice a figure up ahead in the distance. It’s lurking in the sprawling shadow of an oak tree that swallows up the light from the street lamps. As you approach, you start to notice that the figure has two glimmering eyes. They seem to be looking right at you.\n\nAs you creep forward, the eyes lower closer to the ground. They seem to be aligned with the ridge of a spine, connected to four legs. It’s starting to become clear that these eyes are sitting atop a muzzle.\n\nIt’s a dog! Maybe your neighbor’s golden retriever got out. It lowers its head further, a sign of submissiveness and uncertainty. Maybe it’s scared.\n\nYou inch closer still when you suddenly notice four or five other shadowy silhouettes dart quickly from your periphery into formation around the first hound.\n\nYour last clear thought hits you before panic takes over. The dog didn’t lower its head in fear. It’s getting ready to run. So are the others. And so are you.\n\nBig mistake.\n\n## Creating the Pogchamp Dogchamp\n\n[![06222023_Champion_Insights_NaafiriArticle_Naafiri_Teaser_Eyes.jpg](media/aaeb2e3ebadd143899f0d148244a5439429a34e3a5ddbe98febb879c6ce295f3.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9d8405d68a155c6cfa86069d7f0e752b49f02630-2169x1200.jpg)\n\n\nNaafiri’s teaser art. Talk about hungry eyes…\n\nBefore Naafiri came to exist in all her evil glory, she started the same way as many other champions: a design goal. In the case of our new Darkin doggo, the Champions team had a very specific gameplay hole that they needed to fill.\n\n“A while back, our champion design lead, August Browning, did an analysis of our whole roster and categorized each champ by role, class, and difficulty in order to find some opportunity areas for players,” game designer Glenn “Riot Twin Enso” Anderson reveals. “He ended up finding two major holes: a higher skill tank, which ended up being K’Sante, and a relatively simple and beginner-friendly assassin, which became Naafiri.”\n\nOn further investigation, the team also realized it had been a very long time since they released a true creature champion other than Bel’Veth who sort of straddles the line between humanoid and manta-ray-Void-monster. In fact, there are myriad monsters in League, but the team wanted to find a non-humanoid with a more recognizable and identifiable creature fantasy. And after a few ideation sessions, the team agreed that League was missing a real canine representative. Nasus and Warwick are close, but they’re more humanoid than hound.\n\nPlayers should feel powerful playing an assassin, and opponents should feel uneasy and fearful of an assassin sharing the Rift with them. Few things strike the same level of immediate fear as being chased by a less-than-cuddly stray dog.\n\n“Everybody who’s had a bad experience with a dog knows that if you run, it’s probably just gonna make things worse,” chuckles John “JohnODyin” O’Bryan, Naafiri’s principal narrative writer. “Running makes the dog more excited. They match your energy. We wanted to create a champion who sort of called back on that experience. A dog who wants things to run. When Naafiri sees things run her bestial instincts take over.”\n\nBut Naafiri isn’t just one dog chasing you. She roams with a pack—a pack that hunts together, thinks together, and survives the harsh Shuriman desert together. A pack that now shares its collective consciousness with an ancient God-Warrior Darkin.\n\n[![06222023_Champion_Insights_NaafiriArticle_Early_Pack_Concept.png](media/37608d9e5c5c3e553532ac4766871a65dcc4e1b5fe6d864ef3553cae32ddac84.png)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7caafe24b1e3ae7a0a111c35efa487a287983b57-1600x614.png)\n\n\nEarly concept art of a pack of Darkin demon dogs.\n\n“I remember chatting with some folks when somebody said something that really stuck out to me,” Riot Twin Enso adds. “It’s not one dog that’s scary. You’re not scared of one coyote. It’s the pack. It’s the fact that whenever your back is turned, another one is moving toward you. And so we started exploring stuff based on that.”\n\nSo how does a single Darkin find its spirit spread throughout a *pack* of Shuriman dune hounds?\n\nLike all other Darkin, Naafiri’s spirit is bound to a weapon. In her case, that weapon was an ancient throwing dagger, locked away and forgotten in a desert crypt. And after a crypt-robber took the dagger, Naafiri thought she found her salvation—that the unwitting visitor might touch the dagger and expose his flesh to her Darkin magic. But he knew exactly what was in his possession. He took great care not to touch the blade or its hilt so as to avoid becoming Naafiri’s new corporeal vessel.\n\n[![06222023_Champion_Insights_NaafiriArticle_Naafiri_dagger.jpg](media/4893f8c5e339200258262b6f4bb788d3fe32b029665e6a09bed63b30684744cd.jpg)](https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b408ecc6dbdc43af4ca55a0fbae654efd819d9e1-1044x1004.jpg)\n\n\nOriginal concept art for Naafiri’s dagger. Look, but don’t touch.\n\nIronically, that reluctance to wield the blade would lead to his demise anyway. As the man journeyed back from the crypt across the Shuriman dune sea, he was chased by a pack of starving dune hounds. They tore him, his horse, and all of his possessions to shreds—and the dagger found a new home.\n\nNow, the Darkin spirit within the dagger has awoken within the pack, empowered by the hivemind they share. And a nod to the blade itself can be found embedded within the shapes around Naafiri’s collar and on each of her packmates’ snouts.\n\n“When people tend to think of canines/lupines—dogs and wolves, most
